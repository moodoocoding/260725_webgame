<!DOCTYPE html>
<html lang="ko">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>
<script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>띠그래프 그려킹 모바일</title>
    <meta name="description" id="meta-desc" content="띠그래프를 정확히 그리고 시간을 획득하세요! 타임어택 수학 킹!">
    <meta name="keywords" id="meta-keywords" content="띠그래프, 수학게임, 타임어택, 킹수학">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --game-bg-color: #0b0e27; 
        }

        /* --- 기존 게임 기본 CSS (유지) --- */
        * { 
            box-sizing: border-box; 
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--game-bg-color);
            font-family: 'Jua', sans-serif;
            height: 100vh; 
            height: 100dvh; 
            display: flex; justify-content: center;
            overflow: hidden; user-select: none;
            -webkit-user-select: none; touch-action: none; 
        }

        #game-container {
            width: 100%; max-width: 500px; height: 100%;
            background: var(--game-bg-color); position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }

        .hidden { display: none !important; }
        .center { text-align: center; }
        button { 
            cursor: pointer; border: none; font-family: inherit; 
            transition: transform 0.05s; outline: none;
        }

        /* --- 1. 시작 화면 --- */
        #start-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding-top: 2.5vh; padding-bottom: 5vh; 
            background-color: var(--game-bg-color); 
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        
        #top-nav {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 0 20px; margin-bottom: 1vh; flex-shrink: 0;
            z-index: 99999; /* 상단 메뉴 레이어 최상단 */
        }

        .main-title { 
            font-size: 6.5vh; color: #fff; margin: 1vh 0; 
            text-shadow: 3px 3px 0px #00ffff, 2px 2px 0px #e74c3c; line-height: 1.2; text-align: center;
            display: flex; align-items: baseline; justify-content: center; gap: 10px; flex-wrap: wrap;
            transition: font-size 0.2s; /* 동적 폰트 사이즈 변환 애니메이션 */
        }
        .title-sub { font-size: 3.5vh; color: #FFD700; text-shadow: 2px 2px 0px #d35400; transition: font-size 0.2s; }
        
        #qrcode-area {
            margin: 1.5vh 0; padding: 10px; background: white;
            border: 3px dashed #3498db; border-radius: 15px; cursor: pointer;
        }
        .qr-invite-text {
            font-size: 1.8vh; color: #3498db; text-align: center;
            margin-top: -1vh; margin-bottom: 1.5vh; cursor: pointer; font-weight: bold;
        }

        .desc { font-size: 2.5vh; color: #2ecc71; margin: 1.5vh 0; font-weight: bold; text-align: center; padding: 0 10px; word-break: keep-all;}

        input#nickname {
            width: 85%; padding: 1.5vh; font-size: 4vh; text-align: center;
            border: 3px dashed #f1c40f; border-radius: 30px; 
            font-family: inherit; margin-bottom: 2vh; flex-shrink: 0;
            color: #fff; background-color: rgba(0,0,0,0.4);
        }
        input#nickname:focus { outline: none; border-color: #2ecc71; border-style: solid; }

        .btn-start {
            width: 85%; padding: 1.5vh; font-size: 4.5vh; flex-shrink: 0;
            background: linear-gradient(to bottom, #00c6ff, #0072ff); color: white;
            border: 3px dashed rgba(255,255,255,0.5); border-radius: 30px;
            box-shadow: 0 0.6vh #0056b3; margin-bottom: 2vh;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0.2vh #0056b3; }

        #ranking-board {
            margin-top: 2vh; margin-bottom: 2vh; width: 90%; background: rgba(0,0,0,0.5);
            border: 3px dashed #9b59b6; border-radius: 15px; color: #fff;
            padding: 1vh; flex: 1; min-height: 15vh; overflow-y: auto; 
        }
        .rank-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0.8vh 0.5vh; border-bottom: 1px dashed rgba(255,255,255,0.2); font-size: 2.2vh; 
        }

        /* --- 2. 게임 화면 (상단 UI) --- */
        #game-screen {
            flex: 1; display: flex; flex-direction: column;
            background-color: var(--game-bg-color);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            position: relative; overflow: hidden; width: 100%;
        }

        .game-header-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; width: 100%; flex-shrink: 0;
            background: rgba(0,0,0,0.3);
        }

        .icon-btn {
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            color: white; border-radius: 10px; font-size: 3vh; padding: 5px 15px;
            cursor: pointer; transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.9); }

        .status-box {
            background: rgba(255,255,255,0.95); border: 2px solid #333;
            border-radius: 10px; padding: 2px 15px; text-align: center;
            box-shadow: 0 4px 0px rgba(0,0,0,0.5); position: relative;
        }
        .status-label { font-size: 1.5vh; color: #555; margin-bottom: -5px; }
        .status-val { font-size: 3.5vh; color: #000; font-weight: bold; }
        
        #bonus-anim {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            color: #2ecc71; font-size: 3vh; font-weight: bold;
            text-shadow: 0 0 5px #000; opacity: 0; pointer-events: none;
        }
        .bonus-anim-run { animation: floatUp 1s ease-out; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -30px); }
        }

        /* --- 3. 게임 영역 --- */
        #game-area-wrapper {
            flex: 1; display: flex; flex-direction: column; width: 100%; padding: 10px;
        }

        .data-table-container {
            background: rgba(255, 255, 255, 0.95); border: 3px solid #333; border-radius: 10px;
            padding: 5px 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            width: 100%; text-align: center; margin-bottom: 10px; flex-shrink: 0;
        }
        .table-title { color: #000; font-size: 2.2vh; margin-bottom: 4px; font-weight: normal; }
        .custom-table { width: 100%; border-collapse: collapse; color: #000; font-size: 2vh; }
        .custom-table th, .custom-table td { border: 2px solid #555; padding: 3px 2px; background: #fff; text-align: center; }
        .custom-table thead th { background-color: #f0f0f0; font-weight: normal; }
        .table-header-col { background-color: #e0e0e0 !important; width: 15%; font-size: 1.8vh; }
        
        .t-strawberry { color: #d63031; } .t-watermelon { color: #009432; }
        .t-mango { color: #e1b12c; } .t-apple { color: #c0392b; }
        .t-grape { color: #8e44ad; } .t-sum { color: #000; font-weight: normal; background-color: #fffbd7 !important; }

        .player-zone {
            flex: 1; position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end; width: 100%;
        }
        
        .canvas-container { flex: 1; width: 100%; position: relative; cursor: pointer; }
        
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .btn-container {
            display: flex; gap: 15px; width: 100%; justify-content: center;
            margin-bottom: 10px; z-index: 400;
        }

        .submit-btn, .undo-btn {
            padding: 10px 0; font-size: 2.5vh; flex: 1; max-width: 180px;
            color: white; border: none; border-radius: 50px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .submit-btn {
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            box-shadow: 0 5px 0 #1e8449, 0 10px 10px rgba(0,0,0,0.3);
        }
        .submit-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #1e8449, 0 5px 5px rgba(0,0,0,0.3); }
        .undo-btn {
            background: linear-gradient(to bottom, #e67e22, #d35400);
            box-shadow: 0 5px 0 #a84300, 0 10px 10px rgba(0,0,0,0.3);
        }
        .undo-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #a84300, 0 5px 5px rgba(0,0,0,0.3); }

        .error-display {
            position: absolute; top: 10%; width: 100%; text-align: center;
            font-size: 5vh; color: #ff4757; text-shadow: 0 0 10px #000;
            opacity: 0; transition: opacity 0.5s; z-index: 500; pointer-events: none;
        }
        .instruction-text {
            position: absolute; top: 25%; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 2vh; pointer-events: none;
            z-index: 200; text-shadow: 0px 0px 5px #000;
        }

        /* --- 4. 기타 모달 및 결과 화면 --- */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 14, 39, 0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; padding-bottom: 5vh; 
        }
        .result-score { font-size: 9vh; color: #FFD700; margin: 1vh 0; font-weight: bold; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        #qr-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .qr-modal-content {
            background: white; padding: 20px; border-radius: 20px; text-align: center;
            width: 80vw; max-width: 300px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #qrcode-large { display: flex; justify-content: center; align-items: center; width: 100%; }
        #qrcode-large img, #qrcode-large canvas { 
            width: 100% !important; height: auto !important; 
            max-width: 200px !important; max-height: 200px !important; 
        }

        #countdown-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 39, 0.9); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
        }
        #countdown-text {
            font-size: 20vh; font-weight: bold; color: #FFD700; text-shadow: 0 0 20px #ff0000;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.3); border-radius: 10px; border: 4px solid #0b0e27; background-clip: content-box; }

        /* =========================================
           [신규] 상단 좌/우측 공통 내비게이션 버튼 & 독립 모달 CSS
           (게임 CSS와의 충돌 방지를 위한 완벽 분리)
           ========================================= */
        .top-nav-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: rgba(55, 65, 81, 0.5); border: 1px solid #4b5563; border-radius: 9999px;
            padding: 6px 14px; color: #f3f4f6; font-size: 14px; font-weight: 500; font-family: 'Arial', sans-serif;
            cursor: pointer; text-decoration: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.2s; z-index: 99999;
        }
        .top-nav-btn:hover { background: rgba(55, 65, 81, 1); }
        .top-nav-btn img { width: 20px; height: auto; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        
        /* FontAwesome 깨짐 방지 */
        .fa, .fas, .fa-solid, .fa-regular { font-family: "Font Awesome 6 Free", sans-serif !important; font-weight: 900; }
        
        #langModalWrapper, #langModalWrapper * { box-sizing: border-box !important; font-family: 'Arial', sans-serif; }
        
        .custom-lang-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;
            display: flex; align-items: flex-start; justify-content: center;
            background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            padding: 4rem 1rem 1rem 1rem; opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-lang-modal.active { opacity: 1; visibility: visible; }
        @media (min-width: 640px) { .custom-lang-modal { align-items: center; padding-top: 0; } }
        
        .custom-lang-content {
            background-color: #111827; border: 1px solid #374151; border-radius: 1rem;
            width: 100%; max-width: 56rem; max-height: 85vh; display: flex; flex-direction: column;
            overflow: hidden; transform: scale(0.95) translateY(-10px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .custom-lang-modal.active .custom-lang-content { transform: scale(1) translateY(0); opacity: 1; }
        
        .custom-lang-header {
            display: flex; align-items: center; justify-content: space-between; padding: 1.25rem;
            border-bottom: 1px solid #1f2937; background-color: rgba(17, 24, 39, 0.95);
            position: sticky; top: 0; z-index: 10;
        }
        .custom-lang-title { font-size: 1.25rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 0.5rem; margin:0; }
        .custom-lang-close {
            width: 2.5rem; height: 2.5rem; border-radius: 9999px; background-color: #1f2937; color: #9ca3af;
            display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; transition: background-color 0.2s, color 0.2s;
        }
        .custom-lang-close:hover { background-color: #374151; color: #fff; }
        
        .custom-lang-search-wrap { padding: 1.25rem 1.25rem 0.5rem 1.25rem; background-color: #111827; }
        .custom-lang-search-box { position: relative; }
        .custom-lang-search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .custom-lang-input {
            width: 100%; background-color: #1f2937; border: 1px solid #374151; color: #fff; font-size: 0.875rem;
            border-radius: 0.75rem; padding: 0.875rem 0.875rem 0.875rem 2.75rem; outline: none; transition: border-color 0.2s;
        }
        .custom-lang-input:focus { border-color: #eab308; box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2); }
        .custom-lang-input::placeholder { color: #6b7280; }
        
        .custom-lang-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
        .custom-lang-body::-webkit-scrollbar { width: 8px; }
        .custom-lang-body::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; border: none; }
        .custom-lang-body::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; border: none; }
        .custom-lang-body::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .custom-lang-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
        @media (min-width: 640px) { .custom-lang-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .custom-lang-grid { grid-template-columns: repeat(3, 1fr); } }
        
        .custom-lang-item {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border-radius: 0.75rem; cursor: pointer;
            background-color: rgba(31, 41, 55, 0.4); border: 1px solid #374151; transition: all 0.2s; position: relative; overflow: hidden;
        }
        .custom-lang-item:hover { background-color: #374151; border-color: #6b7280; }
        .custom-lang-item.selected { background-color: #1f2937; border-color: #eab308; box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.5); }
        
        .custom-lang-flag { width: 2rem; height: 1.5rem; border-radius: 0.25rem; overflow: hidden; border: 1px solid rgba(55, 65, 81, 0.5); flex-shrink: 0; }
        .custom-lang-flag img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .custom-lang-item:hover .custom-lang-flag img { transform: scale(1.1); }
        
        .custom-lang-info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
        .custom-lang-name { font-size: 0.875rem; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .custom-lang-item.selected .custom-lang-name { color: #facc15; }
        .custom-lang-en { font-size: 0.75rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .custom-lang-check { color: #eab308; font-size: 1.125rem; margin-left: 0.5rem; }
        
        .custom-lang-empty { display: none; flex-direction: column; items-center; justify-content: center; padding: 3rem 0; color: #6b7280; text-align: center; }
        .custom-lang-empty.show { display: flex; }
        .custom-lang-empty i { font-size: 2.25rem; margin-bottom: 0.75rem; }
        
        .custom-toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem; background-color: #1f2937; border: 1px solid #374151;
            border-radius: 0.75rem; padding: 1rem; display: flex; align-items: center; gap: 0.75rem; z-index: 99999;
            transform: translateY(150%); opacity: 0; transition: all 0.3s ease; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .custom-toast.show { transform: translateY(0); opacity: 1; }
        .custom-toast-icon { width: 2rem; height: 2rem; border-radius: 9999px; background-color: rgba(34, 197, 94, 0.2); color: #4ade80; display: flex; align-items: center; justify-content: center; }
        .custom-toast-text { font-size: 0.875rem; font-weight: 500; color: #fff; margin:0; }
        .custom-toast-sub { font-size: 0.75rem; color: #9ca3af; margin:0; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <div id="top-nav">
            <a id="kingsmath-link-btn" href="/" target="_self" class="top-nav-btn">
                킹수학.com
            </a>
            
            <button id="langTriggerBtn" class="top-nav-btn">
                <i class="fa-solid fa-globe text-gray-400"></i>
                <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR">
                <span id="currentLangName" style="display: none;">한국어</span> <i class="fa-solid fa-chevron-down text-gray-400 ml-1 text-xs" style="font-size: 10px;"></i>
            </button>
        </div>

        <div class="main-title">
            <span data-i18n="mainTitle">띠그래프</span>
            <span class="title-sub" data-i18n="subTitle">그려킹 모바일</span>
        </div>
        
        <div id="qrcode-area" onclick="toggleQR(true)"></div>
        <div class="qr-invite-text" data-i18n="qrInvite" onclick="toggleQR(true)">QR 코드로 초대하기</div>

        <div class="desc" data-i18n="desc">정확히 그리고 시간을 획득하세요!</div>
        
        <input type="text" id="nickname" maxlength="8" placeholder="닉네임 입력" onfocus="this.select()" data-i18n-ph="placeholder">
        
        <button class="btn-start" onclick="startGame()" data-i18n="startBtn">🚀 게임 시작!</button>
        
        <a href="/" target="_self" class="link-btn" style="flex-shrink: 0; color:#fff; text-decoration:none; background:rgba(52, 152, 219, 0.8); padding:10px 20px; border-radius:20px; border:2px dashed #fff;" data-i18n="otherGamesBtn">🎲 다른 게임 고르기</a>
        
        <div id="ranking-board">
            <div class="center" data-i18n="rankingLoading">랭킹을 불러오고 있어요... 🏃‍♂️</div>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div class="game-header-row" style="position: relative;">
            <button class="icon-btn" onclick="forceGoHome()">🏠</button>
            
            <div class="status-box" style="position: absolute; left: 50%; transform: translateX(-50%); width: 140px;">
                <div class="status-label" data-i18n="scoreLabel">SCORE</div>
                <div class="status-val" id="score-display">0</div>
            </div>

            <div class="icon-btn" style="margin-left: auto; display: flex; align-items: center; justify-content: center; cursor: default; position: relative; min-width: 75px;">
                ⏳ <span id="timer-display" style="margin-left: 5px; font-weight: bold; color: #fff;">60</span>
                <div id="bonus-anim">+5</div>
            </div>
        </div>

        <div id="game-area-wrapper">
            <div class="data-table-container">
                <div class="table-title" id="t-chart-title">🏫 우리 학교 학생들이 좋아하는 과일</div>
                <table class="custom-table">
                    <thead>
                        <tr>

    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        let targetLang = urlParams.get('lang');
        
        if (!targetLang) {
            targetLang = localStorage.getItem('kingsmath_lang');
        }
        
        if (!targetLang) {
            let browserLang = navigator.language.toLowerCase();
            let baseLang = browserLang.split('-')[0];
            if (i18nData[browserLang]) {
                targetLang = browserLang;
            } else if (i18nData[baseLang]) {
                targetLang = baseLang;
            } else {
                targetLang = 'en';
            }
        }

        changeLang(i18nData[targetLang] ? targetLang : 'en', false);
    }

    function changeLang(lang, updateHistory = true) {
        if (!i18nData[lang]) lang = 'en';
        currentLang = lang;
        localStorage.setItem('kingsmath_lang', lang);
        
        const t = i18nData[lang];
        document.documentElement.lang = lang;
        document.title = t.pageTitle;
        document.getElementById('meta-desc').setAttribute("content", t.metaDesc);
        document.getElementById('meta-keywords').setAttribute("content", "KingsMath, " + t.mainTitle + ", Math, Game");

        // UI 텍스트 업데이트
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(t[key]) el.innerHTML = t[key];
        });
        document.getElementById("nickname").placeholder = t.placeholder;
        
        // 폰트사이즈 동적 조절 (글자수에 따라 레이아웃 안 깨지게 보정)
        const mainTitleSpan = document.querySelector('.main-title span[data-i18n="mainTitle"]');
        if (t.mainTitle.length > 12) mainTitleSpan.style.fontSize = '3.5vh';
        else if (t.mainTitle.length > 8) mainTitleSpan.style.fontSize = '4.5vh';
        else mainTitleSpan.style.fontSize = '6.5vh';

        // 게임 내 한글/영문 폰트 구분 (게임의 기본 폰트 Jua 외에는 캔버스 등에서 안전한 폰트 사용)
        const isKorean = lang === 'ko';
        document.body.style.fontFamily = isKorean ? "'Jua', sans-serif" : "'Arial', sans-serif";
        
        // 좌측 링크 도메인 로직 (한국어만 킹수학.com, 그 외 KingsMath.com)
        document.getElementById("kingsmath-link-btn").innerText = isKorean ? "킹수학.com" : "KingsMath.com";

        // 게임 내부 항목 적용
        document.getElementById('t-chart-title').innerText = t.chartTitle;
        document.getElementById('t-th-fruit').innerText = t.thFruit;
        document.getElementById('t-th-total').innerText = t.thTotal;
        document.getElementById('btn-submit').innerText = t.submit;
        document.getElementById('btn-undo').innerText = t.undo;
        document.getElementById('error-msg').innerText = t.error;
        document.getElementById('t-instruction').innerText = t.instruction;

        for(let i=0; i<5; i++) {
            document.getElementById(`t-fruit-${i}`).innerText = t.fruits[i];
            FRUITS_COLORS[i].name = t.fruits[i];
        }

        // 상단 우측 버튼 플래그 업데이트
        const modalLangData = modalLanguages.find(m => m.code === lang);
        if(modalLangData) {
            currentFlagImg.src = `https://flagcdn.com/w40/${modalLangData.country}.png`;
            currentLangSpan.textContent = modalLangData.name;
        }

        if (updateHistory) {
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + lang;
            window.history.pushState({path: newUrl}, '', newUrl);
            updateQRCode();
        }
        
        // 캔버스 그리기 새로고침
        if(isGameRunning === false && player.drawnSlices.length === 0) resizeCanvas();

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';

        const filteredLangs = modalLanguages.filter(lang =>

                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

                btn.className = `custom-lang-item ${isSelected ? 'selected' : ''}`;

                        <span class="custom-lang-en">${lang.enName}</span>
                    </div>

    // --- 4. 오디오 시스템 ---
    let audioCtx = null;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type, duration) {
        initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    
    function playSound(type) {
        try {
            if(type === 'tick') { playTone(400, 'sine', 0.1); } 
            else if(type === 'start') { playTone(800, 'triangle', 0.3); } 
            else if(type === 'slide') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
            else if(type === 'drag') { 
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
            else if(type === 'drop') { 
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
            else if(type === 'cancel') { 
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
            else if(type === 'error') { playTone(150, 'sawtooth', 0.1); setTimeout(() => playTone(100, 'sawtooth', 0.3), 100); }
            else if(type === 'win') { setTimeout(() => playTone(523, 'triangle', 0.1), 0); setTimeout(() => playTone(659, 'triangle', 0.1), 100); setTimeout(() => playTone(784, 'triangle', 0.2), 200); }
            else if(type === 'gameover') { playTone(523, 'triangle', 0.2); setTimeout(() => playTone(493, 'triangle', 0.2), 200); setTimeout(() => playTone(440, 'triangle', 0.4), 400); }
        } catch(e) {}
    }

    function startGame() {

        if(nameInput.length < 1) { alert(txt.alertName); return; }
        const basicBadWords = ["시발", "씨발", "개새끼", "shibal", "ssibal", "fuck", "bitch", "shit"]; 
        for(let bad of basicBadWords) { if(nameInput.toLowerCase().includes(bad)) { alert(txt.alertBadWord); return; } }

        localStorage.setItem("kingsgraph_nickname", nameInput);
        myNickname = nameInput;

        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        
        resizeCanvas();
        runCountdown(initGame);
    }

    function runCountdown(callback) {
        initAudio();
        const cdScreen = document.getElementById("countdown-screen");
        const cdText = document.getElementById("countdown-text");
        cdScreen.classList.remove("hidden");
        isGameRunning = false; 

        cdText.style.fontSize = "20vh";

        let count = 3;
        cdText.innerText = count;
        playSound('tick');

        function tick() {
            count--;
            if(count > 0) {
                cdText.innerText = count;
                playSound('tick');
                countdownTimer = setTimeout(tick, 1000);
            } else {
                cdText.style.fontSize = "12vh";
                cdText.innerText = "Start!";
                playSound('start');
                countdownTimer = setTimeout(() => {
                    cdScreen.classList.add("hidden");
                    if(callback) callback();
                }, 500);
            }
        }
        countdownTimer = setTimeout(tick, 1000);
    }

    function initGame() {
        score = 0;

        isGameRunning = true;
        
        updateScoreUI();

        resetPlayer();

        if(animId) cancelAnimationFrame(animId);
        animId = requestAnimationFrame(loop);

        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isGameRunning) return;
            timer--;
            updateTimerUI();
            if(timer <= 0) endGame();
        }, 1000);
    }

        document.getElementById('t-instruction').style.display = 'block';
    }

    function generateData() {
        let nums = [10, 10, 10, 10, 10];
        let remaining = 50;
        while(remaining > 0) {
            let idx = Math.floor(Math.random() * 5);
            nums[idx] += 5;
            remaining -= 5;
        }

        gameData.targets = nums;
        gameData.total = 100;

        const row = document.getElementById('data-row');
        let html = `<td class="table-header-col">${i18nData[currentLang].thCount}</td>`;
        nums.forEach(n => html += `<td>${n}${i18nData[currentLang].unit}</td>`);
        html += `<td class="t-sum">100${i18nData[currentLang].unit}</td>`;
        row.innerHTML = html;
    }

    function checkAnswer() {
        if(!isGameRunning) return;
        
        let baseTotal = player.drawnSlices.reduce((a,b)=>a+b, 0);

        if(player.drawnSlices.length !== 5 || baseTotal !== 100) {
            triggerError();
            return;
        }

        let isWrong = false;
        for(let i=0; i<5; i++) {
            if(player.drawnSlices[i] !== gameData.targets[i]) isWrong = true;
        }

        if(!isWrong) {
            score += 10;
            timer += 5; 
            playSound('win');
            updateScoreUI();
            updateTimerUI();
            showBonusAnim();
            generateData();
            resetPlayer();
        } else {
            triggerError();
        }
    }

    function triggerError() {
        score -= 5;
        if(score < 0) score = 0;
        updateScoreUI();
        playSound('error');
        const errEl = document.getElementById('error-msg');
        errEl.style.opacity = 1;
        setTimeout(() => { errEl.style.opacity = 0; }, 1000);
    }

    function undoDraw() {
        if(!isGameRunning) return;
        if (player.drawnSlices.length > 0) {
            player.drawnSlices.pop();
            playSound('cancel'); 
        }
        if (player.drawnSlices.length === 0) {
            document.getElementById('t-instruction').style.display = 'block';
        }
    }

    function showBonusAnim() {
        const anim = document.getElementById('bonus-anim');
        anim.classList.remove('bonus-anim-run');
        void anim.offsetWidth; // trigger reflow
        anim.classList.add('bonus-anim-run');
    }

    function updateScoreUI() { document.getElementById("score-display").innerText = score; }
    
    function updateTimerUI() { 
        const tDiv = document.getElementById("timer-display");
        tDiv.innerText = timer;
        tDiv.style.color = timer <= 10 ? '#ff4757' : '#fff'; 
    }

    function endGame() {
        isGameRunning = false;
        clearInterval(timerInterval);
        cancelAnimationFrame(animId);
        playSound('gameover');
        
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        
        document.getElementById("res-nickname").innerText = myNickname;
        document.getElementById("res-score").innerText = score;
        
        submitScore(myNickname, score); 
    }

    function restartGame() {
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        runCountdown(initGame);
    }

    // --- 홈 이모지 전체화면 대응 초기화 로직 (지시사항 완벽 반영) ---
    function forceGoHome() {
        if(countdownTimer) clearTimeout(countdownTimer);
        document.getElementById("countdown-screen").classList.add("hidden");

        if (document.fullscreenElement) {
            // 새로고침 대신 화면 초기화 로직 실행 (전체 화면 유지)
            isGameRunning = false;
            clearInterval(timerInterval);
            cancelAnimationFrame(animId);
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            
            if(window.playSound) window.playSound('tick'); // 'click' 대체
            loadRanking();
        } else {
            // 전체 화면이 아니라면 그냥 새로고침
            location.reload();
        }
    }

    // --- 6. 캔버스 드로잉 및 띠그래프 입력 로직 ---
    function addCanvasListeners() {
        const cvs = document.getElementById('game-canvas');
        cvs.addEventListener('mousedown', handleInputStart);
        cvs.addEventListener('touchstart', handleInputStart, {passive: false});
        window.addEventListener('mousemove', handleInputMove);
        window.addEventListener('touchmove', handleInputMove, {passive: false});
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchend', handleInputEnd);
    }

    function getEventPos(canvas, e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY;
        } else {
            clientX = e.clientX; clientY = e.clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function getLayout(w, h) {
        const barW = w * 0.85; 
        const barX = w * 0.075; 
        const barH = Math.min(h * 0.25, 80); 
        const barY = h * 0.35; 
        return { barW, barX, barH, barY };
    }

    function handleInputStart(e) {
        if(!isGameRunning || player.drawnSlices.length >= 5) return;
        const cvs = document.getElementById('game-canvas');
        if(e.target !== cvs) return; 
        
        if (e.cancelable) e.preventDefault();
        const pos = getEventPos(cvs, e);
        
        player.isDragging = true;
        document.getElementById('t-instruction').style.display = 'none';
        updateDragVal(pos.x, cvs.width);
    }

    function handleInputMove(e) {
        if(!isGameRunning || !player.isDragging) return;
        if (e.cancelable) e.preventDefault();
        const cvs = document.getElementById('game-canvas');
        const pos = getEventPos(cvs, e); 
        updateDragVal(pos.x, cvs.width);
    }

    function handleInputEnd(e) {
        if (player.isDragging && player.draggingVal > 0) {
            player.drawnSlices.push(player.draggingVal);
            player.draggingVal = 0;
            playSound('drop'); 
        }
        player.isDragging = false;
    }

    function updateDragVal(x, canvasWidth) {
        const { barW, barX } = getLayout(canvasWidth, 0);
        
        let percent = ((x - barX) / barW) * 100;
        let base = player.drawnSlices.reduce((a, b) => a + b, 0);
        
        let dragAmount = percent - base;
        
        if (dragAmount < 0) dragAmount = 0;
        if (base + dragAmount > 100) dragAmount = 100 - base;
        
        let newVal = Math.round(dragAmount);
        
        if(player.draggingVal !== newVal && newVal > 0) {
            if (newVal % 5 === 0) playSound('drag'); 
        }
        player.draggingVal = newVal;
    }

    function loop() {
        if (!isGameRunning) return;
        draw();
        animId = requestAnimationFrame(loop);
    }

    function resizeCanvas() {
        const cvs = document.getElementById('game-canvas');
        const con = document.getElementById('canvas-wrapper');
        cvs.width = con.clientWidth;
        cvs.height = con.clientHeight;
        if (!isGameRunning) draw();
    }

    function draw() {
        const cvs = document.getElementById('game-canvas');
        const ctx = cvs.getContext('2d');
        const w = cvs.width; const h = cvs.height;
        if(w === 0 || h === 0) return; 
        
        const { barW, barX, barH, barY } = getLayout(w, h);
        ctx.clearRect(0, 0, w, h);

        // 1. 배경 막대
        ctx.fillStyle = '#444';
        ctx.fillRect(barX, barY, barW, barH);

        // 2. 확정된 구간 그리기
        let currentP = 0;
        player.drawnSlices.forEach((sliceVal, i) => {
            const fruit = FRUITS_COLORS[i];
            const segW = (sliceVal / 100) * barW;
            const startX = barX + (currentP / 100) * barW;
            
            ctx.fillStyle = fruit.color;
            ctx.fillRect(startX, barY, segW, barH);
            
            if (segW > 25) { 
                ctx.fillStyle = (fruit.color === '#f1c40f') ? '#000' : '#fff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let centerX = startX + segW/2;
                let centerY = barY + barH/2;

                let fontSize = Math.min(segW / 3, barH / 3); 
                if (fontSize < 10) fontSize = 10; 
                if (fontSize > 20) fontSize = 20; 
                
                // 캔버스 폰트는 명시적으로 Jua나 Arial 세팅
                const isKorean = currentLang === 'ko';
                ctx.font = `${fontSize}px ${isKorean ? 'Jua' : 'Arial'}, sans-serif`;

                ctx.fillText(fruit.name, centerX, centerY - fontSize * 0.6);
                ctx.fillText(sliceVal + '%', centerX, centerY + fontSize * 0.6);
            }

            currentP += sliceVal;
        });

        // 3. 드래그 중인 구간 (투명도 적용)
        if (player.isDragging && player.draggingVal > 0 && player.drawnSlices.length < 5) {
            const currentFruit = FRUITS_COLORS[player.drawnSlices.length];
            const segW = (player.draggingVal / 100) * barW;
            const startX = barX + (currentP / 100) * barW;

            ctx.fillStyle = currentFruit.color;
            ctx.globalAlpha = 0.8;
            ctx.fillRect(startX, barY, segW, barH);
            ctx.globalAlpha = 1.0;

            ctx.beginPath();
            ctx.moveTo(startX + segW, barY - 10);
            ctx.lineTo(startX + segW, barY + barH + 10);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#fff';
            const isKorean = currentLang === 'ko';
            ctx.font = `3vh ${isKorean ? 'Jua' : 'Arial'}, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(player.draggingVal + '%', startX + segW, barY - 15);
        }

        // 4. 외곽선 및 눈금선
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(barX, barY, barW, barH);

        ctx.fillStyle = '#ccc';
        let tickFont = Math.max(10, w * 0.03);
        const isKorean = currentLang === 'ko';
        ctx.font = `${tickFont}px ${isKorean ? 'Jua' : 'Arial'}, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top'; 

        for(let i=0; i<=100; i+=10) {
            const lineX = barX + (i/100) * barW;
            ctx.beginPath();
            ctx.moveTo(lineX, barY + barH);
            ctx.lineTo(lineX, barY + barH + 10);
            ctx.stroke();
            
            let label = i;
            if (i === 100) label = "100(%)";
            ctx.fillText(label, lineX, barY + barH + 15);
        }

        // 5. 현재 과일 아이콘 표시
        if (player.drawnSlices.length < 5) {
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            
            let iconSize = 22; 
            let iconX = barX + barW / 2; 
            let iconY = barY - 60; 
            
            ctx.arc(iconX, iconY, iconSize, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.font = `${iconSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(FRUITS_COLORS[player.drawnSlices.length].icon, iconX, iconY);
            ctx.restore();
        }
    }

    // --- 7. 서버 통신 (랭킹) ---
    function submitScore(name, score) {
        const txt = i18nData[currentLang];
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', score);

        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = txt.rankResult.replace('{rank}', data.rank);
                loadTop3(); 
            } else if(data.status === 'error' && data.message === 'bad_word') {
                document.getElementById("res-rank").innerText = txt.alertBadWord;
            } else {
                document.getElementById("res-rank").innerText = "Error!";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById("res-rank").innerText = "Network Error";
        });
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const txt = i18nData[currentLang];
        list.innerHTML = `<div class="center">${txt.rankingLoading}</div>`;

        fetch(API_URL + '?action=list')
        .then(response => response.json())
        .then(data => {
            if(data.length === 0) { list.innerHTML = `<div class="center" style="margin-top:20px;">${txt.rankingEmpty}</div>`; return; }
            let html = "";
            data.forEach((item, index) => {
                let rankHtml = index < 3 ? `<span style="width:15%; text-align:center; font-size:1.5em; line-height:1;">${["🥇","🥈","🥉"][index]}</span>` 
                                         : `<span style="width:15%; text-align:center; color:#FFD700; font-weight:bold;">${index+1}</span>`;
                html += `<div class="rank-item">
                    ${rankHtml}
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#2ecc71; font-weight:bold;">${item.score}</span>
                </div>`;
            });
            list.innerHTML = html;
        })
        .catch(error => { list.innerHTML = `<div class="center" style="color:red;">${txt.rankingError}</div>`; });
    }

    function loadTop3() {
        const list = document.getElementById("top3-list");
        list.innerHTML = `<div class="center" style="font-size:2vh; color:#fff;">Loading...</div>`;
        fetch(API_URL + '?action=list')
        .then(response => response.json())
        .then(data => {
            let html = "";
            for(let i=0; i < Math.min(data.length, 3); i++) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed rgba(255,255,255,0.2); font-size:2.2vh;">
                    <div style="color:#fff; display:flex; align-items:center; gap:5px;">
                        <span>${["🥇","🥈","🥉"][i]}</span>
                        <span style="max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${data[i].nickname}</span>
                    </div>
                    <span style="font-weight:bold; color:#FFD700;">${data[i].score}</span>
                </div>`;
            }
            list.innerHTML = data.length === 0 ? `<div class="center" style="font-size:2vh; color:#fff;">No Data 👑</div>` : html;
        })
        .catch(error => { list.innerHTML = `<div class="center" style="font-size:2vh; color:#aaa;">Error</div>`; });
    }
</script>
