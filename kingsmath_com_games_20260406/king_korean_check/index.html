let currentLang = 'en';
function initLanguage() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlLang = urlParams.get('lang');
    const savedLang = localStorage.getItem('kingsmath_lang');
    const browserLang = navigator.language.slice(0, 2);

    if (urlLang && languagesList.find(l => l.code === urlLang)) {
        currentLang = urlLang;
    } else if (savedLang && languagesList.find(l => l.code === savedLang)) {
        currentLang = savedLang;
    } else if (browserLang && languagesList.find(l => l.code === browserLang)) {
        currentLang = browserLang;
    } else {
        currentLang = 'en'; 
    }
    
    updateUIText(currentLang);
}

function updateUIText(langCode) {
    const txt = STRINGS[langCode] || STRINGS['en'];
    if (!txt) return;

    document.getElementById('pageTitle').innerText = txt.pageTitle;
    document.getElementById('pageDesc').setAttribute('content', txt.desc);
    document.getElementById('pageKeywords').setAttribute('content', txt.keywords);
    
    document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.getAttribute('data-lang-key');

    });

    const langObj = languagesList.find(l => l.code === langCode);
    if(langObj) {
        document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langObj.country}.png`;
        document.getElementById('currentLangName').innerText = langObj.name;
    }

    document.getElementById('ui-title').innerText = txt.ui_title;
    document.getElementById('searchInput').placeholder = txt.ui_search;
    document.getElementById('ui-empty').innerText = txt.ui_empty;

    updateSelectOptions();

}

function resizeDynamicTexts() {

        const parent = el.parentElement;
        if (parent && el.scrollWidth > parent.clientWidth) {

}

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const t = audioCtx.currentTime;
    if (type === 'start') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.linearRampToValueAtTime(880, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.5);
    } else if (type === 'count') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'correct') {
        const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, t); osc2.frequency.setValueAtTime(659.25, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.4);
        gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.3, t + 0.1); gain2.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4); osc2.start(t); osc2.stop(t + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'end') {
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
        });
    }
}

/* =========================================
   Spelling Problem Generator
   ========================================= */

// 문장 단위로 비교하여 다른 부분(단어/글자)을 정밀하게 추출하는 함수
function getSentenceDiff(c, inc) {
    if (!c || !inc || c === inc) return { prefix: c, d1: "", d2: "", suffix: "" };
    let len1 = c.length;
    let len2 = inc.length;
    let i = 0;
    while (i < len1 && i < len2 && c[i] === inc[i]) { i++; }
    let j1 = len1 - 1;
    let j2 = len2 - 1;
    while (j1 >= i && j2 >= i && c[j1] === inc[j2]) { j1--; j2--; }

    let prefix = c.substring(0, i);
    let suffix = c.substring(j1 + 1);
    let d1 = c.substring(i, j1 + 1);
    let d2 = inc.substring(i, j2 + 1);

    // 차이가 단순히 글자 추가/삭제여서 빈칸("")이 나올 경우 주변 글자 1개를 포함시켜 명확하게 함
    if (d1 === "" || d2 === "") {
        if (prefix.length > 0) {
            let lastChar = prefix.slice(-1);
            prefix = prefix.slice(0, -1);
            d1 = lastChar + d1;
            d2 = lastChar + d2;
        } else if (suffix.length > 0) {
            let firstChar = suffix.charAt(0);
            suffix = suffix.slice(1);
            d1 = d1 + firstChar;
            d2 = d2 + firstChar;
        }
    }
    
    return { prefix, d1, d2, suffix };
}

function getHighlightedText(target, correct, incorrect, styleMode) {
    let diff = getSentenceDiff(correct, incorrect);
    let isCorrect = (target === correct);
    let diffPart = isCorrect ? diff.d1 : diff.d2;
    
    if (styleMode === 'blank') {
        return `${diff.prefix}<u style="text-underline-offset: 6px;">&nbsp;&nbsp;&nbsp;&nbsp;</u>${diff.suffix}`;
    } else if (styleMode === 'yellow-underline') {
        return `${diff.prefix}<u style="color:#ffd43b; text-underline-offset: 6px; text-decoration-thickness: 3px;">${diffPart}</u>${diff.suffix}`;
    } else { 
        return `${diff.prefix}<u style="text-underline-offset: 6px; text-decoration-thickness: 3px;">${diffPart}</u>${diff.suffix}`;
    }
}

function generateSpellProblem() {
    let typePref = state.difficulty;
    let types = ['ox', 'word', 'correct', 'incorrect'];
    let qType;
    
    // 랜덤일 경우 4가지가 골고루 나오도록 셔플
    if (typePref === 'random') {
        if (!state.randomTypeBag || state.randomTypeBag.length === 0) {
            state.randomTypeBag = [...types];
            state.randomTypeBag.sort(() => Math.random() - 0.5);
        }
        qType = state.randomTypeBag.pop();
    } else {
        qType = typePref;
    }

    let availableIdx = spellData.map((_, i) => i).filter(i => !state.usedIndices.includes(i));
    if (availableIdx.length === 0) {
        state.usedIndices = [];
        availableIdx = spellData.map((_, i) => i);
    }
    
    let randIdx = availableIdx[Math.floor(Math.random() * availableIdx.length)];
    state.usedIndices.push(randIdx);
    let item = spellData[randIdx];

    let qStr = "", aVal = "", options = [], explanation = "";

    if (qType === 'ox') {
        let isTrue = Math.random() < 0.5;
        let useFirst = Math.random() < 0.5;
        let c = useFirst ? item.correct1 : item.correct2;
        let inc = useFirst ? item.incorrect1 : item.incorrect2;
        if (!c || !inc) { c = item.correct1; inc = item.incorrect1; }
        
        let sentence = isTrue ? c : inc;

        let displaySentence = getHighlightedText(sentence, c, inc, 'underline');
        qStr = `<div style="font-size: clamp(2rem, 5vw, 4rem); line-height: 1.4; word-break: keep-all; padding: 0 10px;">${displaySentence}</div>`;
        
        aVal = isTrue ? "O" : "X";
        options = [
            { label: "<span class='text-blue-500 text-5xl font-bold'>O</span>", value: "O" },
            { label: "<span class='text-red-500 text-5xl font-bold'>X</span>", value: "X" }
        ];
        
        let explanationSent = getHighlightedText(c, c, inc, 'yellow-underline');
        explanation = `<div style="font-size: clamp(2rem, 5vw, 4rem); line-height: 1.4; word-break: keep-all; padding: 0 10px; color: #69db7c;">${explanationSent}</div>`;

    } else if (qType === 'word') {
        let useFirst = Math.random() < 0.5;
        let c = useFirst ? item.correct1 : item.correct2;
        let inc = useFirst ? item.incorrect1 : item.incorrect2;
        if (!c || !inc) { c = item.correct1; inc = item.incorrect1; }

        // 문장 통째로 비교해서 빈칸 뚫기
        let blanked = getHighlightedText(c, c, inc, 'blank');
        qStr = `<div style="font-size: clamp(2rem, 5vw, 4rem); line-height: 1.4; word-break: keep-all; padding: 0 10px;">${blanked}</div>`;
        
        // 버튼에 들어갈 겹치지 않는 핵심 글자 뽑아내기
        let diffs = getSentenceDiff(c, inc);
        aVal = diffs.d1;
        
        options = [
            { label: `<span style="font-size: 2.5rem;">${diffs.d1}</span>`, value: diffs.d1 },
            { label: `<span style="font-size: 2.5rem;">${diffs.d2}</span>`, value: diffs.d2 }
        ];
        options.sort(() => Math.random() - 0.5);
        
        let explanationSent = getHighlightedText(c, c, inc, 'yellow-underline');
        explanation = `<div style="font-size: clamp(2rem, 5vw, 4rem); line-height: 1.4; word-break: keep-all; padding: 0 10px; color: #69db7c;">${explanationSent}</div>`;

    } else {
        // 문장 고르기 (3지 선다)
        let pool = spellData.map((_, i) => i);
        pool.sort(() => Math.random() - 0.5);
        let selectedIndices = [randIdx];
        
        for(let p of pool) {
            if(selectedIndices.length < 3 && !selectedIndices.includes(p)) {
                selectedIndices.push(p);
            }
        }
        while(selectedIndices.length < 3) {
            selectedIndices.push(Math.floor(Math.random() * spellData.length));
        }
        let items = selectedIndices.map(i => spellData[i]);

        let pairs = items.map(it => {
            if (it.correct2 && it.incorrect2 && Math.random() < 0.5) return { c: it.correct2, i: it.incorrect2 };
            return { c: it.correct1, i: it.incorrect1 };
        });

        let sentences = [];
        if (qType === 'correct') {
            sentences.push({ text: pairs[0].c, isAnswer: true, c: pairs[0].c, i: pairs[0].i });
            sentences.push({ text: pairs[1].i || pairs[1].c, isAnswer: false, c: pairs[1].c, i: pairs[1].i });
            sentences.push({ text: pairs[2].i || pairs[2].c, isAnswer: false, c: pairs[2].c, i: pairs[2].i });
        } else {
            sentences.push({ text: pairs[0].i, isAnswer: true, c: pairs[0].c, i: pairs[0].i });
            sentences.push({ text: pairs[1].c, isAnswer: false, c: pairs[1].c, i: pairs[1].i });
            sentences.push({ text: pairs[2].c, isAnswer: false, c: pairs[2].c, i: pairs[2].i });
        }
        sentences.sort(() => Math.random() - 0.5);

        let listHtml = `<div style="text-align: left; font-size: clamp(1.2rem, 3vw, 2.5rem); display: inline-block; word-break: keep-all; line-height: 1.6; margin-top: 15px;">`;
        sentences.forEach((s, idx) => {
            let displaySentence = getHighlightedText(s.text, s.c, s.i, 'underline');
            listHtml += `<div><span style="color:#339af0; font-weight:bold;">${idx + 1}.</span> ${displaySentence}</div>`;
            if (s.isAnswer) aVal = (idx + 1).toString();
        });
        listHtml += `</div>`;

        let qTitle = qType === 'correct' 
            ? "다음 중 <span style='color:#69db7c;'>옳은</span> 문장을 고르세요." 
            : "다음 중 <span style='color:#ff6b6b;'>틀린</span> 문장을 고르세요.";
        qStr = `<div style="font-size: clamp(1.8rem, 4vw, 3.5rem);">${qTitle}</div>${listHtml}`;

        options = [
            { label: "<span style='font-size: 1.5rem;'>1</span>", value: "1" },
            { label: "<span style='font-size: 1.5rem;'>2</span>", value: "2" },
            { label: "<span style='font-size: 1.5rem;'>3</span>", value: "3" }
        ];

        let expHtml = `<div style="text-align: left; font-size: clamp(1.2rem, 3vw, 2.5rem); display: inline-block; word-break: keep-all; line-height: 1.6; margin-top: 15px;">`;
        sentences.forEach((s, idx) => {
            let displayString;
            if (s.text !== s.c) { 
                displayString = getHighlightedText(s.c, s.c, s.i, 'yellow-underline');
            } else { 
                displayString = getHighlightedText(s.text, s.c, s.i, 'underline');
            }
            expHtml += `<div><span style="color:#339af0; font-weight:bold;">${idx + 1}.</span> ${displayString}</div>`;
        });
        expHtml += `</div>`;
        
        explanation = `<div style="font-size: clamp(1.8rem, 4vw, 3.5rem);">${qTitle}</div>${expHtml}`;
    }
    
    return { q: qStr, aVal: aVal, options: options, type: qType, explanation: explanation };
}

/* =========================================
   Game Lifecycle
   ========================================= */
function initGame() {
    initAudio();
    const pCount = parseInt(document.getElementById('playerCount').value);
    state.difficulty = document.getElementById('difficulty').value;
    state.mode = document.getElementById('gameMode').value;
    state.currentQ = 0;
    state.players = [];
    state.usedIndices = [];
    state.randomTypeBag = [];

    const arena = document.getElementById('arena');
    arena.innerHTML = '';
    
    for(let i=0; i<pCount; i++) {
        let teamInfo = TEAM_DATA[i];
        let localizedName = STRINGS['ko'][teamInfo.key]; 
        state.players.push({ id: teamInfo.id, icon: teamInfo.icon, color: teamInfo.color, name: localizedName, score: 0, survived: 0, alive: true, answered: false, selected: null, isGoldenBellWinner: false, rank: 0 });
        
        const col = document.createElement('div');
        col.className = `player-col ${state.players[i].color}`;
        col.id = `p-${i}`;
        col.innerHTML = `
            <div class="p-header">
                <span class="p-emoji">${state.players[i].icon}</span>
                <span class="p-name dynamic-font-target">${state.players[i].name}</span>
                <div class="p-info" id="p-info-${i}"></div>
            </div>
            <div class="mini-question" id="p-q-${i}">...</div>
            <div class="choice-grid" id="p-choices-${i}"></div>
            <div class="feedback-overlay" id="p-fb-${i}"></div>
            <div class="final-status" id="p-final-${i}"></div>
        `;
        arena.appendChild(col);
    }

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('resultPopup').style.display = 'none';
    document.getElementById('langTriggerContainer').style.display = 'none';

    playSound('start');
    nextTurn();
}

async function nextTurn() {
    const aliveCount = state.players.filter(p=>p.alive).length;

    if (state.mode === 'survival' && aliveCount <= 1 && state.players.length > 1) { endGame(); return; }
    if (state.mode === 'survival' && aliveCount === 0) { endGame(); return; }
    if (state.mode === 'challenge' && state.currentQ >= 10) { endGame(); return; }

    if (state.mode === 'survival' && state.currentQ >= 20 && aliveCount > 0) {
        triggerGoldenBellWin();
        return;
    }

    state.currentQ++;
    state.phase = 'counting';
    state.players.forEach((p, idx) => {
        if(p.alive) {
            p.answered = false; p.selected = null;
            const fb = document.getElementById(`p-fb-${idx}`);
            fb.className = 'feedback-overlay'; fb.innerHTML = '';
        }
    });

    state.problem = generateSpellProblem();
    
    const maxQText = state.mode==='challenge' ? '10' : '20';
    const txt = STRINGS[currentLang] || STRINGS['en'];
    
    document.getElementById('qNumber').innerText = `${txt.q_num} ${state.currentQ} / ${maxQText}`;
    document.getElementById('bigQuestion').innerText = txt.ready;
    
    await runCountdown();

    state.phase = 'playing';
    document.getElementById('bigQuestion').innerHTML = state.problem.q;

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const grid = document.getElementById(`p-choices-${idx}`);
        grid.innerHTML = '';
        
        // 옳은/틀린 문장 찾기일 경우 1줄로 3개 띄우는 클래스 적용
        if (state.problem.type === 'correct' || state.problem.type === 'incorrect') {
            grid.classList.add('grid-3');
        } else {
            grid.classList.remove('grid-3');
        }
        
        let playerOptions = [...state.problem.options];

        playerOptions.forEach(optObj => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span style="font-family: 'Noto Sans KR', sans-serif;">${optObj.label}</span>`;
            btn.dataset.val = optObj.value;
            btn.onpointerdown = (e) => { e.preventDefault(); handleAnswer(idx, optObj.value, btn); };
            grid.appendChild(btn);
        });
    });
    startTimer();
}

async function runCountdown() {
    const layer = document.getElementById('countdownLayer');
    const txt = document.getElementById('countdownText');
    layer.style.display = 'flex';
    for(let i=3; i>0; i--) {
        txt.innerText = i; 
        txt.classList.remove('count-animate');
        void txt.offsetWidth; 
        txt.classList.add('count-animate');
        playSound('count'); 
        await new Promise(r => setTimeout(r, 1000));
    }
    layer.style.display = 'none';
}

function startTimer() {
    state.timer = 30;
    const tBox = document.getElementById('mainTimer');
    tBox.innerText = 30; tBox.classList.remove('timer-urgent');
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timer--; tBox.innerText = state.timer;
        if(state.timer <= 5) { tBox.classList.add('timer-urgent'); playSound('count'); }
        if(state.timer <= 0) finishRound();
    }, 1000);
}

function handleAnswer(pIdx, val, btnElem) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive) return;

    playSound('click');
    p.answered = true; p.selected = val;
    
    const allBtns = document.getElementById(`p-choices-${pIdx}`).children;
    for(let b of allBtns) b.style.opacity = '0.5';
    btnElem.style.opacity = '1'; btnElem.classList.add('selected');

    const fb = document.getElementById(`p-fb-${pIdx}`);
    const txt = STRINGS[currentLang] || STRINGS['en'];
    fb.innerHTML = `
        <div style="font-size:3rem; margin-bottom:10px;">🔒</div>
        <div class="submitted-text">${txt.submitted}</div>
    `;
    fb.classList.add('secret'); 
    
    const living = state.players.filter(pl => pl.alive);
    if(living.every(pl => pl.answered)) finishRound();
}

function finishRound() {
    clearInterval(state.timerInterval);
    state.phase = 'result';
    const correctAns = state.problem.aVal;
    let someoneWrong = false;

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const fb = document.getElementById(`p-fb-${idx}`);
        const choices = document.getElementById(`p-choices-${idx}`).children;

        fb.classList.remove('secret'); fb.innerHTML = '';
        
        for(let btn of choices) {
            let bVal = btn.dataset.val;
            if(bVal === correctAns) btn.classList.add('correct');
            else if(p.selected === bVal) btn.classList.add('wrong');
        }

        if(p.selected === correctAns) {
            fb.innerHTML = '<span style="color:#69db7c">⭕</span>'; fb.classList.add('show-result');
            p.survived++;
            if(state.mode === 'challenge') p.score += 10;
        } else {
            someoneWrong = true;
            fb.innerHTML = '<span style="color:#ff6b6b">❌</span>'; fb.classList.add('show-result');
            if(state.mode === 'survival') {
                p.alive = false;
                setTimeout(() => {
                    document.getElementById(`p-${idx}`).classList.add('eliminated');
                }, 1500);
            }
        }
    });
    if(!someoneWrong) playSound('correct'); else playSound('wrong');

    document.getElementById('bigQuestion').innerHTML = state.problem.explanation;
    setTimeout(() => nextTurn(), 5000); 
}

function assignRanks() {
    let ranked = [...state.players];
    if(state.mode === 'challenge') {
        ranked.sort((a,b) => b.score - a.score);
    } else {
        ranked.sort((a,b) => {
            if (a.alive && !b.alive) return -1;
            if (!a.alive && b.alive) return 1;
            return b.survived - a.survived;
        });
    }
    
    let currentRank = 1;
    ranked.forEach((p, i) => {
        if (i > 0) {
            const prev = ranked[i-1];
            let isTie = false;
            if (state.mode === 'challenge') {
                if (p.score === prev.score) isTie = true;
            } else {
                if (p.alive && prev.alive) isTie = true;
                else if (!p.alive && !prev.alive && p.survived === prev.survived) isTie = true;
            }
            if (!isTie) currentRank = i + 1;
        } else {
            currentRank = 1;
        }
        const originalPlayer = state.players.find(pl => pl.id === p.id);
        originalPlayer.rank = currentRank;
    });
}

function getRankEmojiHtml(rank) {
    let rankEmoji = '';
    if (rank === 1) rankEmoji = '🥇';
    else if (rank === 2) rankEmoji = '🥈';
    else if (rank === 3) rankEmoji = '🥉';
    else if (rank === 4) rankEmoji = '<span style="font-size: 70%;">4️⃣</span>';
    else if (rank === 5) rankEmoji = '<span style="font-size: 70%;">5️⃣</span>';
    else if (rank === 6) rankEmoji = '<span style="font-size: 70%;">6️⃣</span>';
    return `<div style="font-size: 3rem; margin-bottom: 5px;">${rankEmoji}</div>`;
}

function triggerGoldenBellWin() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');

    state.players.forEach(p => {
        if(p.alive) p.isGoldenBellWinner = true;
    });
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    const list = document.getElementById('finalResultList');
    const txt = STRINGS[currentLang] || STRINGS['en'];
    
    document.getElementById('resultTitle').innerHTML = "🎉 골든벨 달성! 🎉<br><span style='font-size: 2rem; color: #ffd43b;'>생존자 전원 승리!</span>";
    popup.style.display = 'flex'; list.innerHTML = '';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (p.isGoldenBellWinner) {
            finalDiv.innerHTML = `${rankHtml}<h3>영광의 우승</h3><p>🔔 골든벨 🔔</p>`;
            finalDiv.style.border = "4px solid #ffd43b";
            finalDiv.style.background = "rgba(255, 212, 59, 0.2)";
        } else {
            finalDiv.innerHTML = `${rankHtml}<h3>${txt.record}</h3><p>${p.survived} ${txt.survived_count}</p>`;
        }
    });

    renderResultList(true);
}

function endGame() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    const txt = STRINGS[currentLang] || STRINGS['en'];
    document.getElementById('resultTitle').innerText = txt.result_title;
    popup.style.display = 'flex';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (state.mode === 'challenge') { 
            finalDiv.innerHTML = `${rankHtml}<h3>${txt.final_score}</h3><p>${p.score} ${txt.score_pt}</p>`; 
        } else { 
            finalDiv.innerHTML = p.alive ? `${rankHtml}<h3>${txt.record}</h3><p>${txt.winner}</p>` : `${rankHtml}<h3>${txt.record}</h3><p>${p.survived} ${txt.survived_count}</p>`; 
            if(p.alive) finalDiv.style.border = "4px solid #ffd43b"; 
        }
    });

    renderResultList(false);
}

function renderResultList(isGoldenBell) {
    const list = document.getElementById('finalResultList');
    list.innerHTML = '';
    const txt = STRINGS[currentLang] || STRINGS['en'];

    let ranked = [...state.players].sort((a,b) => a.rank - b.rank);

    ranked.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = `result-item ${p.rank === 1 ? 'rank-1' : ''}`;
        
        let status;
        if (isGoldenBell && p.isGoldenBellWinner) status = "🔔 골든벨 우승!";
        else if (state.mode === 'challenge') status = `${p.score} ${txt.score_pt}`;
        else status = p.alive ? txt.winner : `${p.survived} ${txt.survived_count}`;

        li.innerHTML = `<span>${p.rank}${txt.rank} ${p.icon} ${p.name}</span><span>${status}</span>`;
        list.appendChild(li);
    });
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => { console.log(err.message); });
    } else { document.exitFullscreen(); }
});

document.getElementById('startBtn').addEventListener('click', initGame);
document.getElementById('restartBtn').addEventListener('click', () => { 
    document.getElementById('langTriggerContainer').style.display = 'block';
    document.getElementById('overlay').style.display = 'flex'; 
    document.getElementById('resultPopup').style.display = 'none'; 
});

document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('dragstart', event => event.preventDefault());

document.getElementById('btn-home').addEventListener('click', () => {
    if (document.fullscreenElement) {
        clearInterval(state.timerInterval);
        state.phase = 'setup';
        
        document.getElementById('langTriggerContainer').style.display = 'block';
        
        document.getElementById('resultPopup').style.display = 'none';
        document.getElementById('countdownLayer').style.display = 'none';
        document.getElementById('arena').innerHTML = '';
        document.getElementById('mainTimer').innerText = '30';
        document.getElementById('mainTimer').classList.remove('timer-urgent');
        document.getElementById('bigQuestion').innerText = (STRINGS[currentLang] || STRINGS['en']).ready;
        document.getElementById('overlay').style.display = 'flex';
        
        if(window.playSound) window.playSound('click');
    } else {
        location.reload();
    }
});

const triggerBtn = document.getElementById('langTriggerBtn');
const modal = document.getElementById('langModal');
const closeBtn = document.getElementById('closeModalBtn');
const searchInput = document.getElementById('searchInput');
const grid = document.getElementById('languageGrid');
const noResult = document.getElementById('noResult');
const toast = document.getElementById('toastNotification');
const toastLangName = document.getElementById('toastLangName');
let toastTimeout;

function renderLanguages(filterText = '') {
    grid.innerHTML = '';
    const lowerFilter = filterText.toLowerCase();
    
    const filteredLangs = languagesList.filter(lang => 
        lang.name.toLowerCase().includes(lowerFilter) || 
        lang.enName.toLowerCase().includes(lowerFilter) ||
        lang.code.toLowerCase().includes(lowerFilter)
    );

    if (filteredLangs.length === 0) {
        grid.classList.add('hidden');
        noResult.classList.remove('hidden');
        noResult.classList.add('flex');
    } else {
        grid.classList.remove('hidden');
        noResult.classList.add('hidden');
        noResult.classList.remove('flex');

        filteredLangs.forEach(lang => {
            const isSelected = lang.code === currentLang;
            
            const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden lang-ui-text";
            const stateClasses = isSelected 
                ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

            const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

            const btn = document.createElement('div');
            btn.className = `${baseClasses} ${stateClasses}`;

            btn.innerHTML = `
                <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                    <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                </div>
                <div class="flex-1 min-w-0 flex flex-col items-start">
                    <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                    <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                </div>
                ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
            `;

            btn.addEventListener('click', () => selectLanguage(lang));
            grid.appendChild(btn);
        });
    }
}

function selectLanguage(lang) {
    currentLang = lang.code;
    
    localStorage.setItem('kingsmath_lang', currentLang);
    const url = new URL(window.location);
    url.searchParams.set('lang', currentLang);
    window.history.pushState({}, '', url);

    updateUIText(currentLang);
    closeModal();
    
    document.getElementById('ui-toast').textContent = (STRINGS[currentLang] || STRINGS['en']).ui_toast;
    toastLangName.textContent = lang.name;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    
    renderLanguages(searchInput.value);
}

function openModal() {
    modal.classList.add('active');
    setTimeout(() => searchInput.focus(), 100);
}

function closeModal() {
    modal.classList.remove('active');
}

triggerBtn.addEventListener('click', openModal);
closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });

</script>
