    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        const savedLang = localStorage.getItem('kingsmath_lang');
        const browserLang = navigator.language.split('-')[0];

        if (langParam && translations[langParam]) curLang = langParam;
        else if (savedLang && translations[savedLang]) curLang = savedLang;
        else if (translations[browserLang]) curLang = browserLang;
        else curLang = 'en';

        setLanguage(curLang);
    }

    function setLanguage(lang) {
        curLang = lang;
        localStorage.setItem('kingsmath_lang', lang);
        const t = translations[lang];

        // SEO 및 텍스트 업데이트
        document.title = t.title;
        document.querySelector('meta[name="description"]').setAttribute('content', t.seoDesc);
        
        document.getElementById('txt-logo').innerText = t.logo;
        document.getElementById('txt-desc').innerHTML = t.desc;
        document.getElementById('btn-start').innerText = t.start;
        document.getElementById('nickname').placeholder = t.nickPlaceholder;
        document.getElementById('btn-clear').innerText = t.clear;
        document.getElementById('btn-enter').innerText = t.enter;
        document.getElementById('link-more').innerText = t.more;
        document.getElementById('txt-hall').innerText = t.hall;
        document.getElementById('txt-qr-close').innerText = t.qrClose;
        document.getElementById('current-flag').innerText = flagEmojis[lang] + " " + lang.toUpperCase();
        
        // 도메인 링크 업데이트
        const dLink = document.getElementById('domain-link');
        dLink.innerText = t.domainText;
        dLink.href = t.domainUrl;

        // 키패드 폰트 사이즈 조정 (긴 단어 대응)
        if (t.Russian_clear_size) document.getElementById('btn-clear').style.fontSize = t.Russian_clear_size;
        else document.getElementById('btn-clear').style.fontSize = "1.1rem";

        // 입력창 플레이스홀더 업데이트
        const inputVal = document.getElementById('input-value');
        if (inputVal.classList.contains('placeholder')) inputVal.innerText = t.placeholder;

        // URL 파라미터 업데이트 (새로고침 없이)
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + lang;
        window.history.pushState({ path: newUrl }, '', newUrl);

        document.getElementById('lang-menu').classList.remove('show');
    }

    function toggleLang() { document.getElementById('lang-menu').classList.toggle('show'); }

    /* --- 게임 로직 (기존 유지 및 일부 텍스트 변수화) --- */
    let scene, camera, renderer, group, isGameRunning = false, isProcessing = false;
    let score = 0, timeLeft = 60, timerInterval, currentAnswer = 0, currentInput = "", isBonusRound = false, audioCtx = null, nickname = "";

    const geometry = new THREE.BoxGeometry(0.96, 0.96, 0.96);
    const matNormal = new THREE.MeshLambertMaterial({ color: 0xffca28 });
    const matBonus = new THREE.MeshLambertMaterial({ color: 0xff1744 });
    const edgeGeo = new THREE.EdgesGeometry(geometry);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x5d4037 });

    window.onload = function() {
        initLanguage();
        init3D();
        loadStartRanking();
        animate();
        
        // QR 생성
        const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(window.location.href);
        document.getElementById('qr-img-small').src = qrUrl;
        document.getElementById('qr-img-large').src = qrUrl;
    };

    function init3D() {
        const container = document.getElementById('canvas-area');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(5, 6, 8); camera.lookAt(0, 0, 0);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7); scene.add(dirLight);
        group = new THREE.Group(); scene.add(group);

        let isDragging = false, prevPos = { x: 0, y: 0 };
        container.addEventListener('pointerdown', e => { if(isProcessing) return; isDragging = true; prevPos = { x: e.clientX, y: e.clientY }; container.setPointerCapture(e.pointerId); });
        container.addEventListener('pointermove', e => {
            if(!isDragging) return;
            const dx = e.clientX - prevPos.x; const dy = e.clientY - prevPos.y;
            group.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), dx * 0.01);
            group.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), dy * 0.01);
            prevPos = { x: e.clientX, y: e.clientY };
        });
        container.addEventListener('pointerup', () => isDragging = false);
        generateProblem(false);
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); if(!isGameRunning) group.rotation.y += 0.005; }

    function readyGame() {
        const nickInput = document.getElementById('nickname');
        if(!nickInput.value.trim()) { alert(translations[curLang].alertNick); nickInput.focus(); return; }
        nickname = nickInput.value.trim();
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('start-screen').style.display = 'none';
        const ov = document.getElementById('countdown-overlay');
        ov.style.display = 'flex';
        let c = 3; ov.innerText = c;
        const iv = setInterval(() => {
            c--;
            if(c > 0) ov.innerText = c;
            else { clearInterval(iv); ov.innerText = "GO!"; setTimeout(() => { ov.style.display = 'none'; startGame(); }, 600); }
        }, 1000);
    }

    function startGame() {
        isGameRunning = true; score = 0; timeLeft = 60;
        document.getElementById('ui-timer').innerText = timeLeft;
        document.getElementById('ui-score').innerText = score;
        generateProblem(true);
        timerInterval = setInterval(() => {
            if(!isProcessing) {
                timeLeft--; document.getElementById('ui-timer').innerText = timeLeft;
                if(timeLeft <= 0) endGame();
            }
        }, 1000);
    }

    function generateProblem(randomize) {
        while(group.children.length > 0) group.remove(group.children[0]);
        group.rotation.set(0,0,0);
        inputClear();
        isBonusRound = Math.random() < 0.2;
        document.getElementById('bonus-badge').style.display = isBonusRound ? 'block' : 'none';
        
        let map = Array(3).fill().map(()=>Array(3).fill().map(()=>Array(3).fill(0)));
        let target = Math.floor(Math.random() * (isBonusRound ? 10 : 8)) + (isBonusRound ? 12 : 5);
        let count = 0;
        while(count < target) {
            let x = Math.floor(Math.random()*3), y = Math.floor(Math.random()*3), z = Math.floor(Math.random()*3);
            if(map[x][y][z] === 0 && (y === 0 || map[x][y-1][z] === 1)) { map[x][y][z] = 1; count++; }
        }
        currentAnswer = count;
        const mat = isBonusRound ? matBonus : matNormal;
        for(let x=0; x<3; x++) for(let y=0; y<3; y++) for(let z=0; z<3; z++) {
            if(map[x][y][z]) {
                const m = new THREE.Mesh(geometry, mat);
                m.position.set(x-1, y-1, z-1);
                m.add(new THREE.LineSegments(edgeGeo, edgeMat));
                group.add(m);
            }
        }
        if(randomize) { group.rotation.y = Math.random() * 0.5; group.rotation.x = 0.2; }
    }

    function inputNum(n) {
        if(!isGameRunning || isProcessing) return;
        const disp = document.getElementById('input-value');
        if(currentInput.length >= 2) return;
        if(disp.classList.contains('placeholder')) { disp.classList.remove('placeholder'); currentInput = ""; }
        currentInput += n; disp.innerText = currentInput;
    }

    function inputClear() {
        currentInput = "";
        const disp = document.getElementById('input-value');
        disp.classList.add('placeholder'); disp.innerText = translations[curLang].placeholder;
    }

    function inputEnter() {
        if(!isGameRunning || isProcessing || currentInput === "") return;
        isProcessing = true;
        const val = parseInt(currentInput);
        const fb = document.getElementById('feedback');
        
        if(val === currentAnswer) {
            let earned = currentAnswer * 10 * (isBonusRound ? 2 : 1);
            score += earned; document.getElementById('ui-score').innerText = score;
            fb.innerText = `+${earned}`; fb.style.color = "#00e676";
            animateTimerAdd(5);
        } else {
            fb.innerText = "❌"; fb.style.color = "#ff1744";
        }
        fb.style.opacity = 1; fb.style.animation = "popFade 0.6s forwards";
        setTimeout(() => { fb.style.opacity = 0; isProcessing = false; generateProblem(true); }, 800);
    }

    function animateTimerAdd(sec) {
        timeLeft += sec;
        const eff = document.getElementById('time-bonus-effect');
        eff.style.animation = 'floatTimeUp 1s forwards';
        setTimeout(() => eff.style.animation = 'none', 1000);
    }

    function endGame() {
        isGameRunning = false; clearInterval(timerInterval);
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('result-score-display').innerText = `🧱 ${score}`;
        submitRanking(nickname, score);
    }

    function goHome() { location.reload(); }
    function restartGame() { document.getElementById('result-screen').style.display = 'none'; clearInterval(timerInterval); readyGame(); }
    function openQrModal() { document.getElementById('qr-modal').style.display = 'flex'; }
    function closeQrModal() { document.getElementById('qr-modal').style.display = 'none'; }

    function loadStartRanking() {
        const list = document.getElementById('start-rank-list');
        fetch('ranking.php?action=list').then(r => r.json()).then(data => {
            list.innerHTML = "";
            data.slice(0, 100).forEach((item, i) => {
                const row = document.createElement('div'); row.className = 'rank-item';
                row.innerHTML = `<span>${i+1}. ${item.nickname}</span><span style="color:#FFD93D">${item.score}</span>`;
                list.appendChild(row);
            });
        }).catch(() => { list.innerHTML = "No Records"; });
    }

    function submitRanking(nick, sc) {
        const txt = document.getElementById('my-rank-txt');
        txt.innerText = translations[curLang].registering;
        const fd = new FormData(); fd.append('nickname', nick); fd.append('score', sc);
        fetch('ranking.php?action=submit', { method: 'POST', body: fd })
        .then(r => r.json()).then(data => {
            if(data.status === 'success') {
                txt.innerText = `${translations[curLang].myRank} ${data.rank}`;
                loadResultRanking();
            }
        });
    }

    function loadResultRanking() {
        fetch('ranking.php?action=list').then(r => r.json()).then(data => {
            const list = document.getElementById('top-rank-list');
            list.innerHTML = "";
            data.slice(0, 3).forEach((item, i) => {
                const medals = ["🥇", "🥈", "🥉"];
                const row = document.createElement('div'); row.className = 'rank-item';
                row.innerHTML = `<span>${medals[i]} ${item.nickname}</span><span>${item.score}</span>`;
                list.appendChild(row);
            });
        });
    }

    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes popFade { 0% { opacity:0; transform:translate(-50%,-50%) scale(0.5); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.2); } 100% { opacity:0; transform:translate(-50%,-50%) scale(1); } }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
