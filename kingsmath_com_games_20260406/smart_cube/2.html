};
    let curLang = 'ko';

    function toggleLang() {
        document.getElementById('lang-menu').classList.toggle('show');
    }

    function setLanguage(lang) {
        curLang = lang;
        const t = translations[lang];
        document.querySelector('.game-logo').innerText = t.title;
        document.getElementById('txt-desc').innerHTML = t.desc;
        document.getElementById('btn-start').innerText = t.start;
        document.getElementById('btn-clear').innerText = t.clear;
        document.getElementById('btn-enter').innerText = t.enter;
        document.getElementById('link-more').innerText = t.more;
        document.getElementById('lang-menu').classList.remove('show');

  // 닉네임 입력창 힌트 텍스트 번역 추가
    const nickInput = document.getElementById('nickname');
    if(lang === 'ko') nickInput.placeholder = "닉네임 입력 (최대 8자)";
    else nickInput.placeholder = "Enter Nickname";

    const inputVal = document.getElementById('input-value');
    if(inputVal.classList.contains('placeholder')) inputVal.innerText = t.placeholder;
    }

    /* --- 게임 변수 --- */
    let scene, camera, renderer, group;
    let isGameRunning = false;
    let isProcessing = false;
    let score = 0;
    let timeLeft = 60;
    let timerInterval;
    let currentAnswer = 0;
    let currentInput = "";
    let isBonusRound = false; 
    let audioCtx = null;
    let nickname = "";

    const geometry = new THREE.BoxGeometry(0.96, 0.96, 0.96);
    const matNormal = new THREE.MeshLambertMaterial({ color: 0xffca28 }); 
    const matBonus = new THREE.MeshLambertMaterial({ color: 0xff1744 }); 
    const edgeGeo = new THREE.EdgesGeometry(geometry);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x5d4037, linewidth: 2 });
    const edgeMatBonus = new THREE.LineBasicMaterial({ color: 0x880e4f, linewidth: 2 });

    window.onload = function() {
        setLanguage('ko');
        init3D();
        loadStartRanking(); // 시작 화면 랭킹 로드
        animate();
    };

    function init3D() {
        const container = document.getElementById('canvas-area');
        scene = new THREE.Scene();
        scene.background = null; 

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(5, 6, 8); camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7); scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xffaa00, 0.3);
        fillLight.position.set(-5, 0, -5); scene.add(fillLight);

        group = new THREE.Group(); scene.add(group);

        let isDragging = false;
        let prevPos = { x: 0, y: 0 };
        const handleStart = (x, y) => {
            if(isProcessing) return;
            isDragging = true; prevPos = { x, y };
        };
        const handleMove = (x, y) => {
            if(!isDragging) return;
            const deltaX = x - prevPos.x;
            const deltaY = y - prevPos.y;
            group.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), deltaX * 0.015);
            group.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), deltaY * 0.015);
            prevPos = { x, y };
        };
        const handleEnd = () => { isDragging = false; };

        container.addEventListener('pointerdown', e => { handleStart(e.clientX, e.clientY); container.setPointerCapture(e.pointerId); });
        container.addEventListener('pointermove', e => { handleMove(e.clientX, e.clientY); });
        container.addEventListener('pointerup', e => { handleEnd(); container.releasePointerCapture(e.pointerId); });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        generateProblem(false);
        const autoRotate = () => {
            if(!isGameRunning && document.getElementById('start-screen').style.display !== 'none') {
                group.rotation.y += 0.005; group.rotation.x = Math.sin(Date.now()*0.001) * 0.1;
            }
            requestAnimationFrame(autoRotate);
        };
        autoRotate();
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }

    function playSound(type) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;
        
        if (type === 'tap') {
            osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'correct') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1760, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'bonus') { 
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'tick') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'countdown') {
            osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'go') {
            osc.type = 'square'; osc.frequency.setValueAtTime(880, now);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
        osc.connect(gain); gain.connect(audioCtx.destination);
    }

    function goHome() { location.reload(); }
    function restartGame() {
        document.getElementById('result-screen').style.display = 'none';
        isGameRunning = false; isProcessing = false;
        clearInterval(timerInterval);
        readyGame();
    }

    function readyGame() {
 const nickInput = document.getElementById('nickname');
    if(!nickInput.value.trim()) { 
        // 언어에 맞는 경고 메시지 출력
        alert(translations[curLang].nickAlert); 
        nickInput.focus(); 
        return;
        nickname = nickInput.value.trim();

        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        document.getElementById('start-screen').style.display = 'none';
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'flex';
        
        let count = 3;
        const text = document.getElementById('countdown-text');
        text.innerText = count;
        playSound('countdown');

        const interval = setInterval(() => {
            count--;
            if(count > 0) {
                text.innerText = count;
                text.style.animation = 'none'; text.offsetHeight; text.style.animation = 'zoomPop 0.8s infinite';
                playSound('countdown');
            } else {
                clearInterval(interval);
                text.innerText = "GO!";
                playSound('go');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    startGame();
                }, 600);
            }
        }, 1000);
    }

    function startGame() {
        isGameRunning = true; isProcessing = false;
        score = 0; timeLeft = 60;
        document.getElementById('ui-timer').innerText = timeLeft;
        document.getElementById('ui-score').innerText = score;
        inputClear();
        group.rotation.set(0, 0, 0); 
        generateProblem(true);

        timerInterval = setInterval(() => {
            if(!isProcessing) {
                timeLeft--;
                document.getElementById('ui-timer').innerText = timeLeft;
                if(timeLeft <= 5 && timeLeft > 0) {
                    document.getElementById('ui-timer').style.transform = "scale(1.2)";
                    setTimeout(()=>document.getElementById('ui-timer').style.transform = "scale(1)", 200);
                    playSound('countdown');
                }
                if(timeLeft <= 0) endGame();
            }
        }, 1000);
    }

    function generateProblem(randomize = true) {
        while(group.children.length > 0) group.remove(group.children[0]);
        group.rotation.set(0,0,0);
        inputClear(); 

        isBonusRound = Math.random() < 0.2;
        const bonusBadge = document.getElementById('bonus-badge');
        if (isBonusRound) { bonusBadge.style.display = 'block'; playSound('bonus'); } 
        else { bonusBadge.style.display = 'none'; }

        let map = Array(3).fill().map(()=>Array(3).fill().map(()=>Array(3).fill(0)));
        map[1][0][1] = 1; let count = 1;
        
        let minT = isBonusRound ? 15 : 5;
        let maxT = isBonusRound ? 20 : 14; 
        let target = Math.floor(Math.random() * (maxT - minT + 1)) + minT;
        
        let attempts = 0;
        while(count < target && attempts < 2000) {
            attempts++;
            let x = Math.floor(Math.random()*3); let y = Math.floor(Math.random()*3); let z = Math.floor(Math.random()*3);
            if(map[x][y][z] === 0) {
                if(y === 0 || map[x][y-1][z] === 1) {
                    map[x][y][z] = 1; count++;
                }
            }
        }
        currentAnswer = count;
        const useMat = isBonusRound ? matBonus : matNormal;
        const useEdge = isBonusRound ? edgeMatBonus : edgeMat;

        for(let x=0; x<3; x++) {
            for(let y=0; y<3; y++) {
                for(let z=0; z<3; z++) {
                    if(map[x][y][z] === 1) {
                        const mesh = new THREE.Mesh(geometry, useMat);
                        mesh.position.set(x - 1, y - 1, z - 1);
                        mesh.add(new THREE.LineSegments(edgeGeo, useEdge));
                        group.add(mesh);
                    }
                }
            }
        }
        if(randomize) { group.rotation.y = Math.random() * 0.5 - 0.25; group.rotation.x = 0.2; }
    }

    function inputNum(n) {
        if(!isGameRunning || isProcessing) return;
        playSound('tap');
        const display = document.getElementById('input-value');
        if(currentInput.length >= 2) return;
        if(display.classList.contains('placeholder')) { display.classList.remove('placeholder'); currentInput = ""; }
        currentInput += n.toString();
        display.innerText = currentInput;
    }

    function inputClear() {
        if(!isGameRunning && !isProcessing && timeLeft <= 0) return;
        currentInput = "";
        const display = document.getElementById('input-value');
        display.classList.add('placeholder');
        display.innerText = translations[curLang].placeholder;
    }

    function inputEnter() {
        if(!isGameRunning || isProcessing || currentInput === "") return;
        const val = parseInt(currentInput);
        const fb = document.getElementById('feedback');
        isProcessing = true;
        fb.style.animation = 'none'; fb.offsetHeight; 

        inputClear();

        visualizeCount(() => {
            if(val === currentAnswer) {
                let earned = currentAnswer * 10;
                if (isBonusRound) earned *= 2;
                score += earned;
                document.getElementById('ui-score').innerText = score;

                fb.innerText = `+${earned}`;
                fb.style.color = "#00e676"; fb.style.fontSize = "5rem";
                fb.style.opacity = 1; fb.style.animation = "popFade 0.6s forwards";
                playSound('correct');

                // 시간 추가 로직 (+5초, 애니메이션)
                animateTimerAdd(5);

            } else {
                fb.innerText = "❌";
                fb.style.color = "#ff1744"; fb.style.fontSize = "8rem";
                fb.style.opacity = 1; fb.style.animation = "popFade 0.6s forwards";
                playSound('wrong');
            }
            
            setTimeout(() => {
                isProcessing = false;
                generateProblem(true);
            }, 800);
        });
    }

    // 타이머 숫자 올라가는 애니메이션
    function animateTimerAdd(seconds) {
        const timerEl = document.getElementById('ui-timer');
        const effectEl = document.getElementById('time-bonus-effect');
        
        // +5s 효과 (아래에서 위로)
        effectEl.style.animation = 'none';
        effectEl.offsetHeight;
        effectEl.style.animation = 'floatTimeUp 1s forwards';

        // 실제 시간 추가
        const targetTime = timeLeft + seconds;
        timeLeft = targetTime;

        // 숫자 두두두두 올라가는 효과
        let currentDisplay = parseInt(timerEl.innerText);
        const step = 1; 
        const intervalTime = 50; // 빠름
        
        const timerAnim = setInterval(() => {
            if(currentDisplay < targetTime) {
                currentDisplay += step;
                timerEl.innerText = currentDisplay;
                playSound('tick'); // 틱 소리 추가
            } else {
                timerEl.innerText = targetTime; // 최종 보정
                clearInterval(timerAnim);
            }
        }, intervalTime);
    }

    function visualizeCount(onComplete) {
        const fb = document.getElementById('feedback');
fb.innerText = "";
        fb.style.animation = 'none'; fb.style.fontSize = "8rem"; fb.style.color = "#FFD93D"; fb.style.opacity = 1;
        const meshes = group.children.filter(c => c.type === 'Mesh');
        let count = 0; let total = meshes.length;
        
        const interval = setInterval(() => {
            if (count < total) {
                const mesh = meshes[meshes.length - 1 - count];
                mesh.visible = false; 
                count++;
                fb.innerText = count;
                playSound('tick');
            } else {
                clearInterval(interval);
                setTimeout(() => { if(onComplete) onComplete(); }, 300);
            }
        }, 50); 
    }

    function endGame() {
        isGameRunning = false; clearInterval(timerInterval);
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('result-score-display').innerText = `🧱 ${score}`;
        document.getElementById('bonus-badge').style.display = 'none';
        if(score > 300) playSound('correct'); else playSound('wrong');
        submitRanking(nickname, score);
    }

    /* --- 랭킹 시스템 --- */
    function loadStartRanking() {
        const listDiv = document.getElementById('start-rank-list');
        fetch('ranking.php?action=list')
        .then(res => res.json())
        .then(data => {
            listDiv.innerHTML = "";
            const top100 = data.slice(0, 100);
            if(top100.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center;color:#888;padding:10px;">기록이 없습니다.</div>';
                return;
            }
            top100.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'rank-item';
                // 메달 표시
                let rankStr = `${idx + 1}위`;
                if(idx===0) rankStr="🥇"; else if(idx===1) rankStr="🥈"; else if(idx===2) rankStr="🥉";
                
                row.innerHTML = `
                    <span style="flex:1">${rankStr} ${item.nickname}</span>
                    <span style="font-weight:bold; color:#FFD93D;">${item.score}</span>
                `;
                listDiv.appendChild(row);
            });
        })
        .catch(err => {
            listDiv.innerHTML = '<div style="text-align:center;color:#red;">로드 실패</div>';
        });
    }

    function submitRanking(nick, sc) {
        const myRankTxt = document.getElementById('my-rank-txt');
        myRankTxt.innerText = translations[curLang].registering;
        
        const fd = new FormData();
        fd.append('nickname', nick);
        fd.append('score', sc);

        fetch('ranking.php?action=submit', { method: 'POST', body: fd })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                myRankTxt.innerText = `${translations[curLang].myRank} ${data.rank}등`;
                loadResultRanking(); // 결과 화면용 (Top 3)
            } else { myRankTxt.innerText = "랭킹 등록 실패"; }
        })
        .catch(err => { console.error(err); myRankTxt.innerText = "오류 발생"; });
    }

    function loadResultRanking() {
        fetch('ranking.php?action=list')
        .then(res => res.json())
        .then(data => {
            const listDiv = document.getElementById('top-rank-lisconst translationst');
            listDiv.innerHTML = "";
            const top3 = data.slice(0, 3);
            const medals = ["🥇", "🥈", "🥉"];
            top3.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'rank-item';
                row.innerHTML = `<span>${medals[idx]} ${item.nickname}</span><span>${item.score}</span>`;
                listDiv.appendChild(row);
            });
        });
    }

    // CSS Animation
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes popFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes zoomPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    `;
    document.head.appendChild(style);
</script>
