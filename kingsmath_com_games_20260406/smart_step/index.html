<!DOCTYPE html>
<html lang="ko">
<head>
   
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5YW0T2C109');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="meta-title">무한 비교킹 모바일</title>
    <meta id="meta-desc" name="description" content="더 큰 수를 찾아라! 무한히 이어지는 수학 계단 오르기.">
    <meta id="meta-keywords" name="keywords" content="수학, 비교, 게임, 킹수학, 초등수학">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap');

        :root {
            --bg-start: #FFD54F;
            --bg-game: #E3F2FD;
            --bg-body: #1a1a1a;
            
            --primary-color: #2196F3;
            --accent-color: #FF5252;
            --timer-color: #00E676;
            
            --text-main: #37474F;
            --btn-left-color: #FF5252;
            --btn-right-color: #448AFF;
            
            --stair-color: #FFCA28;
            --stair-border: #F57F17;
        }

        * { touch-action: manipulation; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-body);
            font-family: 'Jua', sans-serif;
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            justify-content: center;
            overflow: hidden;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
            touch-action: none; 
        }

        /* 한국어 외 다국어 적용 시 일반 폰트로 덮어쓰기 위한 클래스 */
        body.lang-global {
            font-family: 'Noto Sans', sans-serif;
        }

        #game-container {
            width: 100%;
            max-width: 500px; 
            height: 100%;
            background: var(--bg-start);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .hidden { display: none !important; }
        .center { text-align: center; }
        button { cursor: pointer; border: none; font-family: inherit; transition: transform 0.05s; }

        /* --- 시작 화면 UI --- */
        #start-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            padding-top: 4vh; padding-bottom: 5vh; 
            background: var(--bg-start);
            background-image: radial-gradient(#FFECB3 20%, transparent 20%);
            background-size: 20px 20px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        
        #top-nav {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            padding: 0 15px; margin-bottom: 2vh; flex-shrink: 0; box-sizing: border-box;
            position: relative; z-index: 50;
        }
        
        /* 13. 모달 버튼과 균형을 맞춘 왼쪽 링크 버튼 디자인 */
        #kingsmath-link-btn {
            font-size: 2vh; color: #333; text-decoration: none; font-weight: bold;
            background: rgba(255, 255, 255, 0.95); padding: 6px 16px; border: 2px solid #333;
            border-radius: 20px; box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            font-family: 'Noto Sans', sans-serif; height: 40px; display: flex; align-items: center; box-sizing: border-box;
        }

        .main-title { 
            font-size: 7.5vh; color: #D32F2F; margin: 1vh 0; 
            text-shadow: 4px 4px 0px #fff; line-height: 1.1; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: rotate(-2deg); word-break: keep-all; padding: 0 10px;
        }
        .title-sub {
            font-size: 3.5vh; color: #1976D2; 
            background: #fff; padding: 2px 15px; border-radius: 20px;
            border: 3px solid #1976D2; margin-top: 5px;
            text-shadow: none; transform: rotate(2deg);
        }
        
        #qrcode-area {
            margin: 1.5vh 0; padding: 8px; background: white;
            border: 4px solid #333; border-radius: 15px; cursor: pointer;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }
        .qr-invite-text {
            font-size: 2vh; color: #555; text-align: center;
            margin-top: -1vh; margin-bottom: 2vh; cursor: pointer; font-weight: bold;
        }
        .desc { font-size: 2.5vh; color: #333; margin: 1vh 0; font-weight: bold; text-align: center; padding: 0 10px; word-break: keep-all;}

        input#nickname {
            width: 85%; padding: 1.5vh; font-size: 3.5vh; text-align: center;
            border: 4px solid #333; border-radius: 15px; 
            font-family: inherit; margin-bottom: 2vh;
            color: #333; background-color: #fff;
            box-shadow: inset 4px 4px 0px #eee;
            box-sizing: border-box;
        }
        input#nickname:focus { outline: none; border-color: var(--primary-color); }

        .btn-start {
            width: 85%; padding: 1.5vh; font-size: 4.5vh; 
            background-color: var(--primary-color); color: white;
            border: 4px solid #0D47A1; border-radius: 20px;
            box-shadow: 0 8px 0 #0D47A1; margin-bottom: 2vh;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            line-height: 1.2; word-break: keep-all; box-sizing: border-box;
        }
        .btn-start:active { transform: translateY(6px); box-shadow: 0 2px 0 #0D47A1; }

        .link-btn-custom {
            color:#333; text-decoration:none; background:#fff; padding:10px 20px; border-radius:20px; 
            border:3px solid #333; font-weight:bold; box-shadow:3px 3px 0 #bbb; font-size: 2.5vh; text-align: center;
        }

        #ranking-board {
            margin-top: 2vh; width: 90%; background: #fff;
            border: 4px solid #333; border-radius: 15px; box-sizing: border-box;
            padding: 1vh; height: 30vh; overflow-y: auto; flex-shrink: 0; 
            box-shadow: 6px 6px 0 rgba(0,0,0,0.1);
        }
        .rank-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1vh 0.5vh; border-bottom: 2px dashed #eee; font-size: 2.2vh; 
        }

        /* --- 게임 화면 --- */
        #game-screen {
            flex: 1; display: flex; flex-direction: column;
            background-color: var(--bg-game);
            position: relative; overflow: hidden; width: 100%;
            touch-action: none;
        }

        .game-header-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; width: 100%; flex-shrink: 0; z-index: 50; box-sizing: border-box;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            border-bottom: 2px solid rgba(255,255,255,0.5);
        }
        .icon-btn {
            background: #fff; border: 3px solid #333; border-radius: 15px; 
            font-size: 2.5vh; width: 5.5vh; height: 5.5vh; padding: 0; box-sizing: border-box;
            cursor: pointer; box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            display: flex; justify-content: center; align-items: center;
        }
        .icon-btn:active { transform: scale(0.9); box-shadow: 1px 1px 0 rgba(0,0,0,0.2); }

        .score-container-mini {
            display: flex; flex-direction: column; align-items: center;
            background-color: #333; border: 3px solid #fff; box-sizing: border-box;
            border-radius: 15px; padding: 2px 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            min-width: 120px;
        }
        .score-label-text {
            font-size: 1.2vh; color: #FFD54F; font-weight: bold; margin-bottom: -2px;
        }
        .score-value-text {
            font-size: 3.5vh; font-weight: 900; color: #fff; line-height: 1;
        }
        .stage-badge {
            font-size: 1.5vh; color: #333; background: #FFD54F; padding: 0px 8px;
            border-radius: 8px; margin-top: 2px; display: inline-block; font-weight: bold;
            border: 1px solid #fff;
        }

        /* 계단 및 캐릭터 영역 */
        #visual-area {
            flex: 1; position: relative; width: 100%;
            overflow: hidden;
            border-bottom: 4px solid #333;
            background: linear-gradient(180deg, #90CAF9 0%, #E3F2FD 100%);
        }

        #stairs-wrap {
            position: absolute; width: 100%; height: 100%;
            bottom: 0; left: 0;
            transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        #stairs-container {
            position: absolute; bottom: 10vh; left: 0; width: 100%;
            display: flex; flex-direction: column-reverse;
            align-items: center;
        }

        .stair-row {
            width: 100%; height: 70px;
            display: flex; justify-content: center;
            position: relative;
        }
        .stair-block {
            width: 200px; height: 70px;
            background-color: var(--stair-color); 
            border: 4px solid var(--stair-border);
            border-radius: 10px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            position: relative;
        }
        .stair-block::after {
            content:''; position: absolute; top: 5px; left: 5px; 
            width: 95%; height: 5px; background: rgba(255,255,255,0.4); border-radius: 5px;
        }

        #runner {
            position: absolute;
            bottom: calc(10vh + 75px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 80px;
            z-index: 20;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }
        
        .runner-flip { transform: translateX(-50%) scaleX(-1) !important; }

        .runner-jump { animation: jump 0.15s forwards; }
        @keyframes jump {
            0% { margin-bottom: 0; transform: translateX(-50%) scale(1); }
            50% { margin-bottom: 20px; transform: translateX(-50%) scale(1.1); }
            100% { margin-bottom: 0; transform: translateX(-50%) scale(1); }
        }

        /* 타이머 바 */
        #timer-area {
            width: 100%; height: 25px; background: #333;
            position: relative; border-top: 2px solid #000; box-sizing: border-box;
        }
        #timer-bar {
            width: 100%; height: 100%; 
            background: var(--timer-color);
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
            transition: width 0.1s linear;
        }

        /* 선택 버튼 영역 */
        #input-area {
            height: 32vh; width: 100%;
            display: flex; box-sizing: border-box;
        }
        .choice-btn {
            flex: 1; height: 100%; box-sizing: border-box;
            font-size: 6vh; font-weight: 900; color: #fff;
            display: flex; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            transition: background 0.1s;
            padding: 5px; word-break: break-all;
            line-height: 1.1;
        }
        
        #btn-left { 
            background-color: var(--btn-left-color); 
            box-shadow: inset -2px 0 0 rgba(0,0,0,0.1); 
        }
        #btn-right { background-color: var(--btn-right-color); }
        .choice-btn:active { filter: brightness(0.85); transform: scale(0.98); }

        .btn-label {
            position: absolute; top: 10px; left: 10px; font-size: 2vh; 
            background: rgba(0,0,0,0.3); padding: 3px 12px; border-radius: 15px;
            font-weight: bold;
        }
        .small-text { font-size: 4vh !important; }

        /* 결과 화면 */
        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 213, 79, 0.98); box-sizing: border-box;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; padding-bottom: 5vh; 
        }
        .result-score { 
            font-size: 8vh; color: #D32F2F; margin: 1vh 0; 
            font-weight: 900; text-shadow: 4px 4px 0 #fff; text-align: center;
        }
        
        #qr-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        #qrcode-large {
            background: white; padding: 20px; border-radius: 20px; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center;
            max-width: 100%; max-height: 100%;
        }
        #qrcode-large img { width: 55vmin !important; height: 55vmin !important; max-width: 280px !important; max-height: 280px !important; min-width: 150px; min-height: 150px; object-fit: contain; display: block; }

        #countdown-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,1); box-sizing: border-box;
            z-index: 200; display: flex; justify-content: center; align-items: center;
        }
        #countdown-text {
            font-size: 20vh; font-weight: 900; color: #fff;
            text-shadow: 0 0 20px var(--primary-color);
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }


        /* ========================================================================= */
        /* 11. 게임과 격리된 완전한 독립 모달 CSS (Z-index 99999 보장) */
        /* ========================================================================= */
        
        #lang-ui-container {
            display: flex; align-items: center;
        }
        
        #langTriggerBtn {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.95); border: 2px solid #333; border-radius: 20px;
            padding: 6px 12px; cursor: pointer; font-size: 2vh; font-weight: bold; color: #333;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2); transition: all 0.2s;
            font-family: 'Noto Sans', sans-serif; height: 40px; box-sizing: border-box;
        }
        #langTriggerBtn:active { transform: scale(0.95); }

        #langModal, #langModal * { box-sizing: border-box !important; }
        
        /* 14. Font Awesome 아이콘 깨짐 완벽 방지 (강제 적용 예외 처리) */
        #langModal i.fa-solid, #langModal i.fa-regular {
            font-family: "Font Awesome 6 Free" !important; font-weight: 900;
        }
        
        #langModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;
            display: flex; align-items: flex-start; justify-content: center;
            background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 15px 15px 15px;
            font-family: 'Noto Sans', sans-serif;
        }
        #langModal.active { opacity: 1; visibility: visible; }
        
        .modal-inner {
            background-color: #111827; border: 1px solid #374151; border-radius: 16px;
            width: 100%; max-width: 800px; max-height: 85vh; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        #langModal.active .modal-inner { transform: scale(1) translateY(0); opacity: 1; }

        .modal-head {
            display: flex; align-items: center; justify-content: space-between; padding: 20px;
            border-bottom: 1px solid #1f2937; background-color: rgba(17, 24, 39, 0.95);
        }
        .modal-head h2 { margin: 0; font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .close-btn {
            width: 36px; height: 36px; border-radius: 50%; background-color: #1f2937; color: #9ca3af;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
            border: none;
        }
        .close-btn:hover { background-color: #374151; color: #fff; }

        .modal-search { padding: 20px; background-color: #111827; position: relative; }
        .modal-search input {
            width: 100%; background-color: #1f2937; border: 1px solid #374151; color: #fff; font-size: 14px;
            border-radius: 12px; padding: 14px 14px 14px 44px; outline: none; transition: 0.2s;
        }
        .modal-search input:focus { border-color: #eab308; box-shadow: 0 0 0 2px rgba(234,179,8,0.2); }
        .modal-search i { position: absolute; left: 36px; top: 50%; transform: translateY(-50%); color: #9ca3af; }

        .modal-body { padding: 0 20px 20px 20px; overflow-y: auto; flex: 1; }
        
        /* 커스텀 스크롤바 */
        .modal-body::-webkit-scrollbar { width: 8px; }
        .modal-body::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .modal-body::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .modal-body::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        
        .lang-card {
            display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer;
            background-color: rgba(31, 41, 55, 0.4); border: 1px solid #374151; transition: all 0.2s; position: relative;
        }
        .lang-card:hover { background-color: #374151; border-color: #6b7280; }
        .lang-card.selected { background-color: #1f2937; border-color: #eab308; box-shadow: 0 0 0 1px rgba(234,179,8,0.5); }
        
        .lang-card img { width: 32px; height: 24px; border-radius: 4px; object-fit: cover; box-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: 0.3s; }
        .lang-card:hover img { transform: scale(1.1); }
        .lang-text { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
        .lang-name { font-size: 14px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: left; }
        .lang-card.selected .lang-name { color: #facc15; }
        .lang-en-name { font-size: 12px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: left;}
        
        .no-result { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; color: #6b7280; }
        .no-result i { font-size: 36px; margin-bottom: 12px; }

        .ui-toast {
            position: fixed; bottom: 24px; right: 24px; background-color: #1f2937; border: 1px solid #374151;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); border-radius: 12px; padding: 16px;
            display: flex; align-items: center; gap: 12px; z-index: 99999;
            transform: translateY(150%); opacity: 0; transition: all 0.3s ease;
            font-family: 'Noto Sans', sans-serif;
        }
        .ui-toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon { width: 32px; height: 32px; border-radius: 50%; background-color: rgba(34, 197, 94, 0.2); color: #4ade80; display: flex; align-items: center; justify-content: center; }
        .toast-texts p { margin: 0; line-height: 1.4; text-align: left; }
        .toast-msg { font-size: 14px; font-weight: 500; color: #fff; }
        .toast-lang { font-size: 12px; color: #9ca3af; }

    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <div id="top-nav">
            <a id="kingsmath-link-btn" href="/" target="_self">킹수학.com</a>
            
            <div id="lang-ui-container">
                <button id="langTriggerBtn">
                    <i class="fa-solid fa-globe" style="color: #666; margin-right:2px;"></i>
                    <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR" style="width:20px; height:auto; border-radius:2px;">
                    <span id="currentLangName" style="margin-left:2px; font-size: 16px;">KR</span>
                </button>
            </div>
        </div>

        <div class="main-title">
            <span data-i18n="mainTitle">무한 비교킹</span>
            <span class="title-sub" data-i18n="subTitle">모바일</span>
        </div>
        
        <div id="qrcode-area" onclick="toggleQR(true)"></div>
        <div class="qr-invite-text" data-i18n="qrInvite" onclick="toggleQR(true)">QR 코드로 초대하기</div>

        <div class="desc" data-i18n="desc">더 큰 숫자를 빠르게 누르세요!</div>
        
        <input type="text" id="nickname" maxlength="8" placeholder="닉네임 입력" onfocus="this.select()" data-i18n-ph="placeholder">
        
        <button class="btn-start" onclick="startGame()" data-i18n="startBtn">🚀 계단 오르기!</button>
        
        <a href="/" target="_self" class="link-btn-custom" data-i18n="otherGamesBtn">🎲 다른 게임 고르기</a>
        
        <div id="ranking-board">
            <div class="center" data-i18n="rankingLoading">랭킹을 불러오고 있어요... 🏃‍♂️</div>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div class="game-header-row">
            <button class="icon-btn" id="btn-home">🏠</button>
            
            <div class="score-container-mini">
                <div class="score-label-text" data-i18n="scoreLabel">STEP</div>
                <div class="score-value-text" id="score">0</div>
                <div class="stage-badge" id="stage-display">STAGE 1</div>
            </div>

            <button class="icon-btn" onclick="forceRestart()">🔄</button>
        </div>
        
        <div id="visual-area">
            <div id="runner">🏃‍♂️</div>
            <div id="stairs-wrap"> 
                <div id="stairs-container">
                    </div>
            </div>
            
            <div id="countdown-screen" class="hidden">
                <div id="countdown-text">3</div>
            </div>
        </div>

        <div id="timer-area">
            <div id="timer-bar"></div>
        </div>

        <div id="input-area">
            <button id="btn-left" class="choice-btn" ontouchstart="checkAnswer('left', event)" onmousedown="checkAnswer('left', event)">
                <span class="btn-label" data-i18n="leftLabel">LEFT</span>

    // 난이도 조절 함수
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function randOp() { return Math.random() < 0.5 ? '+' : '-'; }
    
    function make1Digit() { const n = randInt(1, 9); return { val: n, exp: n }; }
    function make2Digit() { const n = randInt(10, 99); return { val: n, exp: n }; }
    function makeCalc1Digit() { 
        let n1 = randInt(1, 9), n2 = randInt(1, 9);
        const op = randOp();
        if(op === '-') { 
             if (n1 < n2) { let temp = n1; n1 = n2; n2 = temp; }
             return { val: n1 - n2, exp: `${n1} - ${n2}` };
        }
        return { val: n1 + n2, exp: `${n1} + ${n2}` };
    }
    function makeCalc2Digit() { 
        const op = randOp();
        let n1 = randInt(10, 50), n2 = randInt(1, 30);
        if(op === '-') { 
            if(n1 < n2) { let temp = n1; n1 = n2; n2 = temp; }
            return { val: n1 - n2, exp: `${n1} - ${n2}` };
        } else {
            return { val: n1 + n2, exp: `${n1} + ${n2}` };
        }
    }
    function makeGuGu() {
        const n1 = randInt(2, 9), n2 = randInt(2, 9);
        return { val: n1 * n2, exp: `${n1} x ${n2}`, nums: [n1, n2] };
    }

    function generateProblem() {
        let lObj, rObj;
        let diffLimit = 10;
        if(currentStage <= 3) diffLimit = 5;

        let simStage = currentStage;
        if (currentStage >= 9) simStage = randInt(3, 8);

        let safeGuard = 0;
        
        do {
            safeGuard++;
            if(safeGuard > 100) break; 

            switch(simStage) {
                case 1: lObj = make1Digit(); rObj = make1Digit(); break;
                case 2: lObj = makeCalc1Digit(); rObj = make1Digit(); break;
                case 3: lObj = make2Digit(); rObj = make2Digit(); break;
                case 4: 
                    lObj = make2Digit(); 
                    rObj = makeCalc2Digit();
                    if (Math.random() < 0.5) { let temp = lObj; lObj = rObj; rObj = temp; }
                    break;
                case 5: lObj = makeCalc2Digit(); rObj = makeCalc2Digit(); break;
                case 6: 
                    lObj = makeGuGu(); 
                    rObj = { val: randInt(4, 81), exp: 0 }; 
                    rObj.exp = rObj.val;
                    break;
                case 7: lObj = makeCalc2Digit(); rObj = makeCalc2Digit(); break;
                case 8: 
                    lObj = makeGuGu(); rObj = makeGuGu();
                    const set = new Set([...lObj.nums, ...rObj.nums]);
                    if(set.size < 4) continue; 
                    break;
            }

            if (lObj.val === rObj.val) continue; 
            const diff = Math.abs(lObj.val - rObj.val);
            if (diff > diffLimit || diff === 0) continue;
            break;

        } while(true);

        return { leftExp: lObj.exp, rightExp: rObj.exp, answer: lObj.val > rObj.val ? 'left' : 'right' };
    }

    function nextProblem() {
        questionCount++;
        
        if(questionCount > 10) {
            currentStage++;
            questionCount = 1;
            
            let stageText = "STAGE " + currentStage;
            if(currentStage >= 9) stageText = "INFINITE " + (currentStage - 8); 
            
            document.getElementById("stage-display").innerText = stageText;
            playSound('levelup');
        }

        if (currentStage < 9) maxTime = 3000;
        else {
            maxTime = maxTime * 0.95;
            if(maxTime < 500) maxTime = 500;
        }

        timeLeft = maxTime;
        const problem = generateProblem();
        currentProblem = problem;
        
        const txtLeft = document.getElementById("txt-left");
        const txtRight = document.getElementById("txt-right");
        
        txtLeft.innerText = problem.leftExp;
        txtRight.innerText = problem.rightExp;
        
        if(String(problem.leftExp).length > 6) txtLeft.parentElement.classList.add("small-text");
        else txtLeft.parentElement.classList.remove("small-text");
        
        if(String(problem.rightExp).length > 6) txtRight.parentElement.classList.add("small-text");
        else txtRight.parentElement.classList.remove("small-text");
    }

    function checkAnswer(side, event) {
        if(event) { event.preventDefault(); event.stopPropagation(); }
        if(!isGameRunning) return;

        if(side === currentProblem.answer) {
            score++;
            document.getElementById("score").innerText = score;
            playSound('jump');
            animateClimb();
            nextProblem();
        } else {
            gameOver();
        }
    }

    function animateClimb() {
        const runner = document.getElementById("runner");
        isRunnerFlipped = !isRunnerFlipped; 
        
        if(isRunnerFlipped) runner.classList.add("runner-flip");
        else runner.classList.remove("runner-flip");

        runner.classList.remove("runner-jump");
        void runner.offsetWidth; 
        runner.classList.add("runner-jump");

        addStair(); 
        totalClimbed++;
        
        const wrap = document.getElementById("stairs-wrap");
        wrap.style.transform = `translateY(${totalClimbed * stairHeight}px)`;
    }

    function gameLoop(timestamp) {
        if(!isGameRunning) return;

        let dt = timestamp - lastTime;
        lastTime = timestamp;

        timeLeft -= dt;
        
        const barPercent = (timeLeft / maxTime) * 100;
        const timerBar = document.getElementById("timer-bar");
        timerBar.style.width = barPercent + "%";

        if(barPercent < 30) timerBar.style.background = "#FF1744";
        else timerBar.style.background = "var(--timer-color)";

        if(timeLeft <= 0) {
            gameOver();
            return;
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isGameRunning = false;
        cancelAnimationFrame(animationFrameId);
        playSound('gameover');
        
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("res-nickname").innerText = myNickname;
        document.getElementById("res-score").innerText = score;
        
        submitScore(myNickname, score);
    }

    let audioCtx = null;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type, duration) {
        initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    
    function playSound(type) {
        try {
            if(type === 'jump') { playTone(600, 'square', 0.1); setTimeout(() => playTone(800, 'square', 0.1), 50); } 
            else if(type === 'gameover') { playTone(200, 'sawtooth', 0.5); } 
            else if(type === 'tick') { playTone(800, 'sine', 0.05); } 
            else if(type === 'start') { playTone(1200, 'square', 0.2); }
            else if(type === 'levelup') { playTone(1000, 'sine', 0.1); playTone(1500, 'sine', 0.3); }
        } catch(e) {}
    }

    function submitScore(name, score) {
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', score);
        
        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = i18nData[currentLang].rankResult.replace('{rank}', data.rank);
            }
            loadTop3(name, score);
        })
        .catch(e => {
            console.error(e);
            loadTop3(name, score, true);
        });
    }

    function loadRanking() {
        fetch(API_URL + '?action=list').then(res => res.json()).then(data => {
            const list = document.getElementById("ranking-board");
            if(data.length === 0) { list.innerHTML = `<div class="center" style="margin-top:20px;">${i18nData[currentLang].rankingEmpty}</div>`; return; }
            let html = "";
            data.forEach((item, index) => {
                let rankStr = index < 3 ? (index===0?"🥇":index===1?"🥈":"🥉") : (index+1);
                html += `<div class="rank-item"><span style="width:15%; text-align:center;">${rankStr}</span><span style="width:50%;">${item.nickname}</span><span style="width:35%; text-align:right;">${item.score}</span></div>`;
            });
            list.innerHTML = html;
        }).catch(e => {});
    }

    function loadTop3(currentName, currentScore, forceLocal = false) {
        fetch(API_URL + '?action=list').then(res => res.json()).then(data => {
            renderTop3List(data, currentName, currentScore);
        }).catch(e => {
             renderTop3List([], currentName, currentScore);
        });
    }

    function renderTop3List(data, currentName, currentScore) {
        if(currentName && currentScore !== undefined) {
             data.push({ nickname: currentName, score: parseInt(currentScore) });
        }
        
        data.sort((a, b) => b.score - a.score);
        
        const top3 = data.slice(0, 3);
        
        const list = document.getElementById("top3-list");
        let html = "";
        
        if(top3.length === 0) {
             html = `<div style="text-align:center; padding:10px;">기록이 없어요. 1등 도전!</div>`;
        } else {
            top3.forEach((item, index) => {
                let medal = index===0?"🥇":index===1?"🥈":"🥉";
                let style = "";
                if(item.nickname === currentName && item.score == currentScore) {
                    style = "background:#FFF9C4; border-radius:5px;"; 
                }
                
                html += `<div style="display:flex; justify-content:space-between; padding:8px 5px; border-bottom:1px dashed #ddd; ${style}">
                            <span>${medal} ${item.nickname}</span>
                            <span style="font-weight:bold; color:#D32F2F;">${item.score}</span>
                         </div>`;
            });
        }
        list.innerHTML = html;
    }

    function restartGame() {
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        runCountdown(initGame);
    }
    
    function forceRestart() {
        isGameRunning = false; cancelAnimationFrame(animationFrameId);
        document.getElementById("countdown-screen").classList.add("hidden");
        runCountdown(initGame);
    }
    
</script>
</body>
</html>
