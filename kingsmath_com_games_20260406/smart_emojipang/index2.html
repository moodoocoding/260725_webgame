    const STORAGE_KEY = 'kingsmath_lang';

    // --- 언어 감지 및 초기화 (요구사항 2, 3) ---
    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        const savedLang = localStorage.getItem(STORAGE_KEY);
        const browserLang = (navigator.language || navigator.userLanguage).split('-')[0].toLowerCase();

        if (urlLang && i18nData[urlLang]) {
            currentLang = urlLang;
        } else if (savedLang && i18nData[savedLang]) {
            currentLang = savedLang;
        } else if (i18nData[browserLang]) {
            currentLang = browserLang;
        } else {
            currentLang = 'en';
        }
        applyLanguage(currentLang, false);
    }

    // --- 언어 적용 및 동적 UI 업데이트 ---
    function applyLanguage(lang, showNotification = true) {
        currentLang = lang;
        const data = i18nData[lang];
        if (!data) return;

        // 1. DOM 텍스트 갱신
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (data[key]) el.innerHTML = data[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (data[key]) el.placeholder = data[key];
        });

        // 2. SEO 태그 업데이트
        document.getElementById('seo-title').innerText = `${data.title} ${data.mobile} - ${data.kingsmath}`;
        document.getElementById('seo-desc').content = data.seoDesc;
        document.getElementById('seo-keys').content = data.seoKeys;

        // 3. 폰트 동적 제어 (한국어는 기본, 나머지는 sans-serif)
        if (lang === 'ko') {
            document.body.style.fontFamily = "'Jua', sans-serif";
        } else {
            document.body.style.fontFamily = "'Nunito', sans-serif";
        }

        // 4. URL 업데이트 & 로컬 스토리지
        localStorage.setItem(STORAGE_KEY, lang);
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('lang', lang);
        window.history.pushState({}, '', newUrl);

        // 5. 버튼 폰트 동적 사이즈 조절 (글자 오버플로우 방지)
        adjustFontSize();

        // 6. 상태 갱신 (모달버튼)
        const langObj = languages.find(l => l.code === lang);
        if (langObj) {
            document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langObj.country}.png`;
            document.getElementById('currentFlag').alt = langObj.country;
        }

        // 초기 로딩용 텍스트 강제 업데이트
        const mainList = document.getElementById('main-ranking-list');
        if (mainList && mainList.innerHTML.includes('로딩중') || mainList.innerHTML.includes('Loading')) {
            mainList.innerHTML = `<div class="ranking-item" style="justify-content: center; color:#999;">${data.loading}</div>`;
        }

        if (showNotification && langObj) {
            showToast(langObj.name, lang);
        }
    }

    function adjustFontSize() {
        // 주요 버튼/텍스트에 대해 길이가 길어지면 폰트를 줄임
        const elementsToAdjust = document.querySelectorAll('button.btn-main, .link-btn, h1');
        elementsToAdjust.forEach(el => {
            el.style.fontSize = ''; // 초기화
            let maxFont = el.tagName === 'H1' ? 48 : (el.tagName === 'BUTTON' ? 25 : 17); // 기준 px
            el.style.fontSize = maxFont + 'px';
            while (el.scrollWidth > el.clientWidth && maxFont > 12) {
                maxFont--;
                el.style.fontSize = maxFont + 'px';
            }
        });
    }

    // --- 언어 선택기 모달 관련 (요구사항 5, 8, 9, 10, 11) ---
    const triggerBtn = document.getElementById('langTriggerBtn');
    const modal = document.getElementById('langModal');
    const closeBtn = document.getElementById('closeModalBtn');
    const searchInput = document.getElementById('searchInput');
    const grid = document.getElementById('languageGrid');
    const noResult = document.getElementById('noResult');
    const toast = document.getElementById('toastNotification');
    let toastTimeout;

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses} m-0 box-border`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50 m-0">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start m-0">
                        <span class="text-sm font-medium text-white truncate w-full m-0 ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full m-0">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2 m-0"></i>' : ''}
                `;
                btn.addEventListener('click', () => {
                    applyLanguage(lang.code);
                    closeModal(); // 모달 닫기
                    renderLanguages(searchInput.value); // 렌더링 갱신
                });
                grid.appendChild(btn);
            });
        }
    }

    function openModal() {
        modal.classList.add('active');
        renderLanguages(); // 항상 열때 최신상태 렌더
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    function showToast(langName, langCode) {
        document.getElementById('ui-toast').textContent = i18nData[langCode].toast;
        document.getElementById('toastLangName').textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    triggerBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    searchInput.addEventListener('input', (e) => renderLanguages(e.target.value));
    
    // --- 기존 게임 변수 및 로직 절대 수정 금지 ---
    const allEmojis = ["😀","😂","😍","😎","😡","🥶","😱","👽","👻","💩","🐵","🐶","🐺","🐱","🦁","🐯","🦒","🦊","🦝","🐮","🐷","🐗","🐭","🐹","🐰","🐻","🐨","🐼","🐸","🦓","🐴","🦄","🐔","🐲","🦖","🐳","🐬","🐟","🐙","🐌","🦋","🐛","🐜","🐝","🐞","🦂","🕸","🐢","🐍","🦎","🦖","🦕","🐙","🦑","🦐","🦞","🦀","🐡","🐠","🐟","🐬","🐳","🐋","🦈","🐊","🐅","🐆","🦓","🦍","🦧","🐘","🦛","🦏","🐪","🐫","🦒","🦘","🐃","🐂","🐄","🐎","🐖","🐏","🐑","🦙","🐐","🦌","🐕","🐩","🦮","🐕‍","🐈","🐓","🦃","🦚","🦜","🦢","🦩","🕊","🐇","🦝","🦨","🦡","🦦","🦥","🐁","🐀","🐿","🦔"];
    
    let timer, countdownTimer, timeLeft = 60, score = 0, combo = 0;
    let nickname = "";
    let currentBoardEmojis = [];
    let selectedIndices = [];
    let isAnimating = false;

    // Web Audio API 사운드 제너레이터
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'pop') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'error') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'beep') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'start') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'end') {
            const notes = [
                { freq: 392.00, time: 0, dur: 0.15 }, { freq: 523.25, time: 0.15, dur: 0.15 }, 
                { freq: 659.25, time: 0.3, dur: 0.15 }, { freq: 523.25, time: 0.5, dur: 0.15 }, 
                { freq: 659.25, time: 0.65, dur: 0.15 }, { freq: 783.99, time: 0.8, dur: 0.4 }  
            ];
            notes.forEach(note => {
                const oscEnd = audioCtx.createOscillator();
                const gainNodeEnd = audioCtx.createGain();
                oscEnd.connect(gainNodeEnd); gainNodeEnd.connect(audioCtx.destination);
                oscEnd.type = 'triangle'; 
                oscEnd.frequency.value = note.freq;
                gainNodeEnd.gain.setValueAtTime(0, audioCtx.currentTime + note.time);
                gainNodeEnd.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + note.time + 0.02);
                gainNodeEnd.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + note.time + note.dur);
                oscEnd.start(audioCtx.currentTime + note.time); oscEnd.stop(audioCtx.currentTime + note.time + note.dur);
            });
        }
    }

    window.onload = () => {
        initLanguage(); // 다국어 초기화 먼저 실행
        renderLanguages(); // 모달 렌더 에러 방지용 명시적 호출
        
        const currentUrl = encodeURIComponent(window.location.href);
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${currentUrl}`;
        document.getElementById('qr-image').src = qrUrl;
        document.getElementById('qr-modal-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${currentUrl}`;
        loadRanking('main-ranking-list', 100);
    };

    function toggleQrModal(show) {
        document.getElementById('qr-modal').classList.toggle('active', show);
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goHome() {
        clearInterval(timer);
        clearTimeout(countdownTimer);
        document.getElementById('countdown-overlay').classList.remove('active');
        switchScreen('start-screen');
        loadRanking('main-ranking-list', 100);
    }

    function startGame() {
        const nameInput = document.getElementById('nickname-input').value.trim();
        if (!nameInput) { alert(i18nData[currentLang].placeholder + "!"); return; }
        nickname = nameInput;
        document.getElementById('player-name-display').innerText = `PLAYER: ${nickname}`;
        restartGame();
    }

    function restartGame() {
        clearInterval(timer);
        clearTimeout(countdownTimer);
        timeLeft = 60; score = 0; combo = 0; selectedIndices = []; 
        isAnimating = true; 
        updateUI();
        generateInitialBoard();
        switchScreen('game-screen');
        document.getElementById('timer-display').classList.remove('time-alert');
        startCountdown();
    }

    function startCountdown() {
        const overlay = document.getElementById('countdown-overlay');
        overlay.classList.add('active');
        overlay.style.fontSize = ''; 
        let count = 3;

        function tick() {
            if (count > 0) {
                overlay.innerText = count; playSound('beep'); count--;
                countdownTimer = setTimeout(tick, 1000);
            } else if (count === 0) {
                overlay.innerText = "START!"; overlay.style.fontSize = "4.5rem";
                playSound('start'); count--;
                countdownTimer = setTimeout(tick, 1000);
            } else {
                overlay.classList.remove('active');
                isAnimating = false; startTimer();
            }
        }
        tick();
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft--; updateUI();
            if (timeLeft <= 10) document.getElementById('timer-display').classList.add('time-alert');
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function updateUI() {
        document.getElementById('timer-display').innerText = `TIME: ${timeLeft}`;
        document.getElementById('score-display').innerText = `SCORE: ${score}`;
    }

    function generateInitialBoard() {
        let uniqueEmojis = [...new Set(allEmojis)]; 
        let shuffledPool = uniqueEmojis.sort(() => 0.5 - Math.random());
        let boardSet = shuffledPool.slice(0, 23); 
        let targetEmoji1 = boardSet[21]; let targetEmoji2 = boardSet[22]; 
        
        currentBoardEmojis = boardSet.slice(0, 21); 
        currentBoardEmojis.push(targetEmoji1, targetEmoji1, targetEmoji2, targetEmoji2); 
        currentBoardEmojis.sort(() => 0.5 - Math.random()); 
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('emoji-board');
        board.innerHTML = ''; 
        currentBoardEmojis.forEach((emoji, index) => {
            const cell = document.createElement('div');
            cell.className = 'emoji-cell';
            cell.innerText = emoji;
            cell.onclick = () => handleCellClick(index, cell);
            board.appendChild(cell);
        });
    }

    function handleCellClick(index, cellElem) {
        if (isAnimating) return;
        if (selectedIndices.includes(index)) {
            selectedIndices = selectedIndices.filter(i => i !== index);
            cellElem.classList.remove('selected'); return;
        }
        selectedIndices.push(index);
        cellElem.classList.add('selected');
        if (selectedIndices.length === 2) checkMatch();
    }

    function checkMatch() {
        isAnimating = true;
        const [idx1, idx2] = selectedIndices;
        const cells = document.querySelectorAll('.emoji-cell');
        const isMatch = currentBoardEmojis[idx1] === currentBoardEmojis[idx2];

        if (isMatch) {
            playSound('pop'); combo++; score += (100 + (combo * 20)); updateUI();
            showComboText(`${combo} COMBO`);

            setTimeout(() => {
                let remainingIndices = [];
                for(let i = 0; i < 25; i++) { if(i !== idx1 && i !== idx2) remainingIndices.push(i); }
                let counts = {};
                for(let i of remainingIndices) {
                    let e = currentBoardEmojis[i]; counts[e] = (counts[e] || 0) + 1;
                }
                let singletonIndices = remainingIndices.filter(i => counts[currentBoardEmojis[i]] === 1);
                let randomPartnerIndex = singletonIndices[Math.floor(Math.random() * singletonIndices.length)];
                let newTargetEmoji = currentBoardEmojis[randomPartnerIndex];
                let uniquePool = [...new Set(allEmojis)];
                let newUniqueEmoji;
                while(true) {
                    newUniqueEmoji = uniquePool[Math.floor(Math.random() * uniquePool.length)];
                    if(!currentBoardEmojis.includes(newUniqueEmoji)) break;
                }

                if (Math.random() < 0.5) {
                    currentBoardEmojis[idx1] = newTargetEmoji; currentBoardEmojis[idx2] = newUniqueEmoji;
                } else {
                    currentBoardEmojis[idx1] = newUniqueEmoji; currentBoardEmojis[idx2] = newTargetEmoji;
                }

                renderBoard(); selectedIndices = []; isAnimating = false;
            }, 300);
        } else {
            playSound('error'); combo = 0;
            document.getElementById('emoji-board').classList.add('shake');
            cells[idx1].classList.add('shake'); cells[idx2].classList.add('shake');

            setTimeout(() => {
                document.getElementById('emoji-board').classList.remove('shake');
                cells[idx1].classList.remove('shake', 'selected');
                cells[idx2].classList.remove('shake', 'selected');
                selectedIndices = []; isAnimating = false;
            }, 400);
        }
    }

    function showComboText(text) {
        const popup = document.getElementById('fixed-combo-text');
        popup.innerText = text; popup.classList.remove('combo-anim');
        void popup.offsetWidth; popup.classList.add('combo-anim');
    }

    function endGame() {
        clearInterval(timer); playSound('end'); 
        document.getElementById('final-score').innerText = score;
        switchScreen('result-screen');
        submitScoreAndLoadTop3Server();
    }

    async function loadRanking(elementId, limit) {
        const container = document.getElementById(elementId);
        container.innerHTML = `<div class="ranking-item" style="justify-content: center; color:#999;">${i18nData[currentLang].loading}</div>`;
        
        try {
            const response = await fetch(`ranking.php?limit=${limit}`);
            if (!response.ok) throw new Error('서버 로드 실패');
            const data = await response.json();
            
            container.innerHTML = '';
            if(data.length === 0) {
                container.innerHTML = `<div class="ranking-item" style="justify-content: center; color:#999;">${i18nData[currentLang].noRecord}</div>`;
                return;
            }
            data.forEach((row, index) => {
                const div = document.createElement('div');
                div.className = 'ranking-item';
                div.innerHTML = `<span><b>${index + 1}위</b></span> <span>${row.nickname}</span> <span><b>${row.score}점</b></span>`;
                container.appendChild(div);
            });
        } catch (error) {
            console.error('랭킹 로드 오류:', error);
            container.innerHTML = '<div class="ranking-item" style="justify-content: center; color:red;">랭킹 정보를 불러올 수 없습니다.</div>';
        }
    }

    async function submitScoreAndLoadTop3Server() {
        const resultList = document.getElementById('result-ranking-list');
        resultList.innerHTML = `<div class="ranking-item" style="justify-content: center; color:#999;">${i18nData[currentLang].saving}</div>`;
        
        const formData = new FormData();
        formData.append('action', 'save'); formData.append('nickname', nickname); formData.append('score', score);

        try {
            const response = await fetch('ranking.php', { method: 'POST', body: formData });
            if (!response.ok) throw new Error('서버 저장 실패');
            loadRanking('result-ranking-list', 3);
        } catch (error) {
            console.error('점수 저장 오류:', error);
            resultList.innerHTML = `<div class="ranking-item" style="justify-content: center; color:red;">${i18nData[currentLang].saveFail}</div>`;
        }
    }
</script>
</body>
</html>
