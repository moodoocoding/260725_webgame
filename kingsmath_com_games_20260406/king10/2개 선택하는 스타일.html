<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>킹방울 10 만들기</title>
    <style>
        /* 폰트: HS산토끼 */
        @font-face {
            font-family: 'HsSantoki';
            src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/HS-Regular.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --p1-main: #ff9f43; 
            --p1-glow: rgba(255, 159, 67, 0.6);
            --p2-main: #54a0ff;
            --p2-glow: rgba(84, 160, 255, 0.6);
            --bg-color: #1e1e2e;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'HsSantoki', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            color: white;
            font-weight: normal;
        }

        body { display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; }

        /* --- 배경 (전역) --- */
        .background-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #222f3e 0%, #1e1e2e 100%);
            z-index: -10;
            overflow: hidden;
        }

        .bg-bubble {
            position: absolute; bottom: -50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.1);
            animation: rise var(--duration) infinite linear;
            left: var(--left); width: var(--size); height: var(--size);
            animation-delay: var(--delay); pointer-events: none;
        }
        @keyframes rise {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.5; } 50% { opacity: 0.8; } 80% { opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* --- 인트로 --- */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; transition: opacity 0.5s;
        }

        .promo-link {
            font-size: 1.5rem; color: #ccc; margin-bottom: 10px; opacity: 0.9;
            transition: transform 0.2s, color 0.2s; cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .promo-link span { color: #feca57; text-decoration: underline; }
        .promo-link:hover { transform: scale(1.05); color: #fff; }

        .game-title {
            font-size: 5rem; margin-bottom: 20px;
            background: linear-gradient(to right, #ff9f43, #54a0ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
            animation: float 3s ease-in-out infinite; font-weight: normal;
            white-space: nowrap;
        }

        .tutorial-box {
            background: rgba(255, 255, 255, 0.1); padding: 30px 50px;
            border-radius: 20px; border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 30px; backdrop-filter: blur(10px);
            max-width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tutorial-text { font-size: 1.8rem; line-height: 1.6; color: #eee; font-weight: normal; }
        .highlight { color: #feca57; font-size: 2rem; font-weight: normal; }
        .warning { color: #ff6b6b; font-weight: normal; }
        b { font-weight: normal; }

        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }

        .btn {
            padding: 15px 40px; font-size: 1.8rem; font-family: 'HsSantoki';
            border: none; border-radius: 50px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; color: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            font-weight: normal;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: linear-gradient(45deg, #1dd1a1, #10ac84); }

        .other-game-link {
            font-size: 1.2rem; color: #aaa; margin-top: 10px;
            text-decoration: none; cursor: pointer; transition: color 0.2s;
        }
        .other-game-link:hover { color: #fff; text-decoration: underline; }

        /* --- 게임 UI --- */
        #game-screen { display: none; flex: 1; flex-direction: column; width: 100%; height: 100%; }

        .top-hud {
            flex: 0 0 90px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: rgba(30, 30, 40, 0.8);
            border-bottom: 3px solid rgba(255,255,255,0.1); z-index: 100;
        }

        .team-score { 
            font-size: 1.5rem; display: flex; flex-direction: row; 
            align-items: center; min-width: 180px; gap: 15px; font-weight: normal;
        }
        .p1-score-box { justify-content: flex-start; }
        .p2-score-box { flex-direction: row-reverse; justify-content: flex-start; }

        .team-name { font-size: 1.6rem; opacity: 1.0; white-space: nowrap; font-weight: normal; }
        .score-num { font-size: 2.2rem; min-width: 60px; text-align: center; font-weight: normal; }
        
        .p1-color { color: var(--p1-main); text-shadow: 0 0 10px rgba(255, 159, 67, 0.3); }
        .p2-color { color: var(--p2-main); text-shadow: 0 0 10px rgba(84, 160, 255, 0.3); }

        .timer-box { flex: 1; text-align: center; max-width: 300px; margin: 0 20px; }
        .timer-num { font-size: 2.2rem; color: #feca57; margin-bottom: 5px; font-weight: normal; }
        .progress-track { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; border: 1px solid #555; }
        .progress-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #1dd1a1, #feca57, #ff6b6b); transition: width 0.2s linear; }

        .play-area { flex: 1; display: flex; position: relative; flex-direction: row; }

        /* 하단 정렬을 위한 설정 */
        .player-zone {
            flex: 1; position: relative; display: flex; justify-content: center; align-items: flex-end;
            border-right: 2px dashed rgba(255,255,255,0.1); overflow: hidden;
            padding-bottom: 5vh;
        }
        .player-zone:last-child { border-right: none; }

        .game-board {
            width: 74%; aspect-ratio: 1/1; max-width: 64vh; max-height: 90%;
            background: rgba(20, 20, 30, 0.6); border-radius: 24px;
            position: relative; z-index: 10;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            border: 5px solid rgba(255,255,255,0.1); transition: border-color 0.3s;
        }

        #board-p1 { border-color: var(--p1-main); box-shadow: 0 0 30px var(--p1-glow); }
        #board-p2 { border-color: var(--p2-main); box-shadow: 0 0 30px var(--p2-glow); }

        .shake-anim { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #ff4757 !important; }

        /* 고정 규칙 텍스트 */
        .target-hint {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 46, 0.95); padding: 8px 30px; border-radius: 50px;
            font-size: 1.6rem; white-space: nowrap; border: 3px solid #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            z-index: 50; color: #feca57; text-shadow: 0 0 10px rgba(254, 202, 87, 0.5);
        }
        .target-hint::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 10px solid #fff;
        }

        .bubble {
            position: absolute; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; font-weight: normal; color: #000;
            cursor: pointer;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.6), inset 2px 2px 8px rgba(255, 255, 255, 0.7), 0 5px 15px rgba(0, 0, 0, 0.3);
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.2) 20%, var(--bubble-bg) 100%);
            backdrop-filter: blur(3px);
            border: 2px solid rgba(255,255,255,0.5);
            transform: scale(1); transition: transform 0.1s;
            animation: floatBubble 3s ease-in-out infinite alternate;
            white-space: nowrap;
            text-shadow: 0 0 3px #ffffff, 0 0 7px #ffffff, 0 0 15px #ffffff;
        }
        .bubble:active { transform: scale(0.9); filter: brightness(0.9); }
        
        /* 선택된 버블 스타일 (강조) */
        .bubble.selected {
            transform: scale(1.15);
            border: 4px solid #fff000;
            box-shadow: 0 0 20px #fff000, inset 0 0 10px #fff;
            z-index: 9999 !important;
        }

        .float-btn {
            position: fixed; bottom: 20px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; cursor: pointer; z-index: 5000;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px; backdrop-filter: blur(5px); transition: all 0.2s;
        }
        .float-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.1); }
        .float-btn:active { transform: scale(0.95); }
        #home-btn { left: 20px; }
        #fullscreen-btn { right: 20px; }

        .popping { animation: popAnim 0.3s forwards ease-out; pointer-events: none; }
        .respawning { animation: spawnAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

        #result-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(15px);
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes floatBubble { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        @keyframes popAnim { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
        @keyframes spawnAnim { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

        @media (max-aspect-ratio: 1/1) {
            .play-area { flex-direction: column; }
            .player-zone { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.1); }
            .game-board { width: auto; height: 85%; margin-top: 0; margin-left: 20px; }
            .target-hint { top: 10px; left: 10px; transform: none; font-size: 1.2rem; padding: 5px 15px; }
            .target-hint::after { display: none; }
        }

        @media (max-width: 600px) and (orientation: portrait) {
            .game-board { width: 90%; height: auto; margin-top: 25px; }
            .target-hint { top: -45px; left: 50%; transform: translateX(-50%); }
            .top-hud { padding: 0 10px; }
            .team-score { min-width: auto; font-size: 1.2rem; }
            .score-num { font-size: 1.8rem; min-width: 40px; }
            .team-name { display: none; }
        }
    </style>
</head>
<body>

    <!-- 전역 배경 애니메이션 -->
    <div class="background-container" id="bg-bubbles"></div>

    <div id="intro-screen">
        <a href="http://킹수학.com" target="_blank" class="promo-link">
            게임으로 수학의 킹이 되어라 <span>킹수학.com</span>
        </a>
        <h1 class="game-title">🫧 킹방울 10 만들기 🫧</h1>
        <div class="tutorial-box">
            <p class="tutorial-text">
                <b style="color:var(--p1-main)">🐶강아지팀</b> vs <b style="color:var(--p2-main)">🐱고양이팀</b><br><br>
                숫자 방울 2개를 연결해서<br>
                <span class="highlight">합이 10</span>이 되게 만드세요!<br>
                (예: 2와 8, 5와 5)<br>
                <br>
                <span class="warning">틀리면 감점됩니다! 또잉~</span>
            </p>
        </div>
        <div class="btn-group">
            <button class="btn btn-start" onclick="game.init()">게임 시작</button>
        </div>
        <a href="http://킹수학.com" target="_blank" class="other-game-link">🎮 다른 게임 고르기</a>
    </div>

    <div id="game-screen">
        <div class="top-hud">
            <div class="team-score p1-color p1-score-box">
                <span class="team-name">🐶 강아지팀</span>
                <span class="score-num" id="score-p1">0</span>
            </div>
            <div class="timer-box">
                <div class="timer-num" id="timer-display">60</div>
                <div class="progress-track"><div class="progress-bar" id="timer-bar"></div></div>
            </div>
            <div class="team-score p2-color p2-score-box">
                <span class="team-name">🐱 고양이팀</span>
                <span class="score-num" id="score-p2">0</span>
            </div>
        </div>

        <div class="play-area">
            <div class="player-zone" id="zone-p1">
                <div class="game-board" id="board-p1">
                    <!-- 보드 -->
                </div>
            </div>
            <div class="player-zone" id="zone-p2">
                <div class="game-board" id="board-p2">
                    <!-- 보드 -->
                </div>
            </div>
        </div>

        <div id="home-btn" class="float-btn" onclick="location.reload()" title="처음으로">🏠</div>
        <div id="fullscreen-btn" class="float-btn" onclick="toggleFullScreen()" title="전체화면">⛶</div>
    </div>

    <canvas id="fx-canvas"></canvas>

    <div id="result-modal">
        <h1 class="game-title" style="font-size: 4rem;">GAME OVER</h1>
        <h2 id="winner-text" style="color:#fff; font-size:3rem; margin: 20px 0;">무승부!</h2>
        <div style="font-size: 2.5rem; color: #fff; margin-bottom: 40px;">
            <span style="color:var(--p1-main)">🐶 <span id="final-p1">0</span></span>
            &nbsp;&nbsp;vs&nbsp;&nbsp;
            <span style="color:var(--p2-main)">🐱 <span id="final-p2">0</span></span>
        </div>
        <button class="btn btn-start" onclick="location.reload()">다시 하기</button>
        <a href="http://킹수학.com" target="_blank" class="other-game-link" style="margin-top:20px;">🎮 다른 게임 고르기</a>
    </div>

<script>
    // 전자칠판 최적화
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    let lastTouch = 0;
    document.addEventListener('touchend', event => {
        const now = window.performance.now();
        if (now - lastTouch <= 300) event.preventDefault();
        lastTouch = now;
    }, false);

    // 배경 비누방울
    function initBgBubbles() {
        const container = document.getElementById('bg-bubbles');
        const bubbleCount = 20;
        for (let i = 0; i < bubbleCount; i++) {
            const b = document.createElement('div');
            b.classList.add('bg-bubble');
            const size = Math.random() * 60 + 20; 
            b.style.setProperty('--size', `${size}px`);
            b.style.setProperty('--left', `${Math.random() * 100}%`);
            b.style.setProperty('--duration', `${Math.random() * 10 + 10}s`);
            b.style.setProperty('--delay', `${Math.random() * 10}s`);
            container.appendChild(b);
        }
    }
    initBgBubbles();

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    const AudioSys = {
        ctx: null,
        init: function() {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        },
        play: function(type) {
            if (!this.ctx) this.init();
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime;
            
            if (type === 'start') {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, i) => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = 'triangle'; o.frequency.value = freq;
                    g.gain.setValueAtTime(0.1, now + i * 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
                    o.connect(g); g.connect(this.ctx.destination);
                    o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.3);
                });
                return;
            } else if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800 + Math.random() * 200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'error') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'select') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'win') {
                const melody = [{f: 523.25, t: 0}, {f: 523.25, t: 0.1}, {f: 523.25, t: 0.2}, {f: 659.25, t: 0.4}, {f: 783.99, t: 0.6}, {f: 1046.50, t: 0.8}];
                melody.forEach(n => {
                    const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = 'square'; o.frequency.value = n.f;
                    g.gain.setValueAtTime(0.1, now + n.t); g.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.4);
                    o.connect(g); g.connect(this.ctx.destination); o.start(now + n.t); o.stop(now + n.t + 0.4);
                });
                return;
            }
            osc.connect(gain); gain.connect(this.ctx.destination);
        }
    };

    const FX = {
        canvas: document.getElementById('fx-canvas'), ctx: null, particles: [],
        init: function() {
            this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); this.loop();
        },
        resize: function() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
        spawn: function(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 6 + 2;
                this.particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color: color, size: Math.random() * 8 + 3 });
            }
        },
        loop: function() {
            const ctx = this.ctx; ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            for (let i = this.particles.length - 1; i >= 0; i--) {
                let p = this.particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.04; p.size *= 0.92;
                if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
            }
            requestAnimationFrame(() => this.loop());
        }
    };

    const game = {
        state: {
            p1: { bubbles: [], selected: null },
            p2: { bubbles: [], selected: null },
            isPlaying: false, timeLeft: 60, timerId: null
        },
        colors: ['#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea', '#fdfd96', '#fab1a0', '#81ecec'],

        init: function() {
            AudioSys.init(); FX.init(); AudioSys.play('start');
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                this.setupPlayer('p1');
                this.setupPlayer('p2');
            }, 500);
            
            this.state.isPlaying = true; this.state.timeLeft = 60; this.updateTimer();
            if(this.state.timerId) clearInterval(this.state.timerId);
            this.state.timerId = setInterval(() => {
                this.state.timeLeft--; this.updateTimer();
                if (this.state.timeLeft <= 0) this.endGame();
            }, 1000);

            document.getElementById('board-p1').onpointerdown = (e) => this.handleBoardTouch(e, 'p1');
            document.getElementById('board-p2').onpointerdown = (e) => this.handleBoardTouch(e, 'p2');
        },

        setupPlayer: function(pid) {
            const board = document.getElementById(`board-${pid}`);
            // 규칙 표시 (고정)
            board.innerHTML = `<div class="target-hint">합이 10이 되는 짝꿍 찾기</div>`;
            this.state[pid].bubbles = [];
            this.state[pid].selected = null;

            const rect = board.getBoundingClientRect();
            const bubbleSize = rect.width / 6; // 방울 크기 좀 더 키움

            let positions = [];
            // 초기 20개 생성 (1~9 랜덤)
            for (let i = 0; i < 20; i++) {
                let num = Math.floor(Math.random() * 9) + 1; 
                let pos = this.getSafePosition(positions, rect.width, rect.height, bubbleSize);
                positions.push(pos);
                this.createBubbleElement(pid, num, pos.x, pos.y, bubbleSize, 1000 + i);
            }
        },

        getSafePosition: function(existing, w, h, size) {
            let x, y, overlap; let tries = 0;
            const padding = 4;
            const topMargin = 10; 
            do {
                overlap = false;
                x = Math.random() * (w - size - padding * 2) + padding;
                y = Math.random() * (h - size - padding * 2 - topMargin) + topMargin;
                for (let p of existing) {
                    const dist = Math.sqrt((x - p.x)**2 + (y - p.y)**2);
                    if (dist < size) { overlap = true; break; }
                }
                tries++;
            } while (overlap && tries < 1000);
            return {x, y};
        },

        createBubbleElement: function(pid, num, x, y, size, zIndex) {
            const board = document.getElementById(`board-${pid}`);
            const el = document.createElement('div');
            el.className = 'bubble';
            el.textContent = num;
            el.dataset.val = num;
            const color = this.colors[Math.floor(Math.random() * this.colors.length)];
            el.style.setProperty('--bubble-bg', color);
            el.style.width = size + 'px'; el.style.height = size + 'px';
            el.style.left = x + 'px'; el.style.top = y + 'px';
            el.style.fontSize = (size * 0.6) + 'px';
            el.style.zIndex = zIndex;
            board.appendChild(el);
            this.state[pid].bubbles.push({ num, el, x, y, size, color });
        },

        handleBoardTouch: function(e, pid) {
            if (!this.state.isPlaying) return;
            
            // 방울 터치 로직
            if (e.target.classList.contains('bubble')) {
                const clickedBubbleEl = e.target;
                const val = parseInt(clickedBubbleEl.dataset.val);
                const pState = this.state[pid];

                // 이미 선택된 방울을 다시 누르면 취소
                if (pState.selected && pState.selected.el === clickedBubbleEl) {
                    this.deselectBubble(pid);
                    return;
                }

                if (!pState.selected) {
                    // 1. 첫 번째 방울 선택
                    this.selectBubble(pid, clickedBubbleEl, val);
                } else {
                    // 2. 두 번째 방울 선택 (매칭 시도)
                    this.checkMatch(pid, pState.selected, { el: clickedBubbleEl, val: val });
                }
            } 
            // 빈 공간 터치 시 오답 처리
            else if (!e.target.classList.contains('target-hint') && e.target.tagName !== 'B') {
                this.handlePenalty(pid);
                this.deselectBubble(pid);
            }
        },

        selectBubble: function(pid, el, val) {
            AudioSys.play('select');
            this.state[pid].selected = { el: el, val: val };
            el.classList.add('selected');
        },

        deselectBubble: function(pid) {
            if (this.state[pid].selected) {
                this.state[pid].selected.el.classList.remove('selected');
                this.state[pid].selected = null;
            }
        },

        checkMatch: function(pid, first, second) {
            if (first.val + second.val === 10) {
                // 정답!
                this.handleCorrect(pid, first.el, second.el);
            } else {
                // 오답!
                this.handlePenalty(pid);
                // 둘 다 잠깐 흔들리게 하거나 강조 해제
                this.deselectBubble(pid);
            }
        },

        handleCorrect: function(pid, el1, el2) {
            AudioSys.play('pop');
            
            // 파티클
            const color1 = getComputedStyle(el1).getPropertyValue('--bubble-bg');
            const rect1 = el1.getBoundingClientRect();
            FX.spawn(rect1.left + rect1.width/2, rect1.top + rect1.height/2, color1);

            const color2 = getComputedStyle(el2).getPropertyValue('--bubble-bg');
            const rect2 = el2.getBoundingClientRect();
            FX.spawn(rect2.left + rect2.width/2, rect2.top + rect2.height/2, color2);

            // 터짐 애니메이션
            el1.classList.add('popping');
            el2.classList.add('popping');
            
            setTimeout(() => { el1.remove(); el2.remove(); }, 300);

            // 데이터 제거
            const pState = this.state[pid];
            pState.bubbles = pState.bubbles.filter(b => b.el !== el1 && b.el !== el2);
            pState.selected = null;

            // 점수 증가
            const scoreEl = document.getElementById(`score-${pid}`);
            scoreEl.innerText = parseInt(scoreEl.innerText) + 200;

            // 리필 (2개 재생성)
            setTimeout(() => {
                const board = document.getElementById(`board-${pid}`);
                const rect = board.getBoundingClientRect();
                const existingPos = pState.bubbles.map(b => ({x: b.x, y: b.y}));
                const size = rect.width / 6;

                for(let i=0; i<2; i++) {
                    const num = Math.floor(Math.random() * 9) + 1;
                    const newPos = this.getSafePosition(existingPos, rect.width, rect.height, size);
                    existingPos.push(newPos); // 위치 업데이트
                    this.createBubbleElement(pid, num, newPos.x, newPos.y, size, 2000+i);
                    // 등장 애니메이션
                    const newBubble = pState.bubbles[pState.bubbles.length-1].el;
                    newBubble.classList.add('respawning');
                }
            }, 300);
        },

        handlePenalty: function(pid) {
            AudioSys.play('error');
            const board = document.getElementById(`board-${pid}`);
            board.classList.remove('shake-anim'); void board.offsetWidth; board.classList.add('shake-anim');
            
            // 점수 감점
            const scoreEl = document.getElementById(`score-${pid}`);
            scoreEl.innerText = Math.max(0, parseInt(scoreEl.innerText) - 50);
        },

        updateTimer: function() {
            document.getElementById('timer-display').innerText = this.state.timeLeft;
            document.getElementById('timer-bar').style.width = (this.state.timeLeft / 60) * 100 + '%';
        },
        endGame: function() {
            this.state.isPlaying = false; 
            clearInterval(this.state.timerId); 
            AudioSys.play('win');
            const s1 = parseInt(document.getElementById('score-p1').innerText);
            const s2 = parseInt(document.getElementById('score-p2').innerText);
            document.getElementById('result-modal').style.display = 'flex';
            document.getElementById('final-p1').innerText = s1; document.getElementById('final-p2').innerText = s2;
            const wTxt = document.getElementById('winner-text');
            if (s1 > s2) wTxt.innerHTML = "<span style='color:var(--p1-main)'>🐶 강아지팀 승리!</span>";
            else if (s2 > s1) wTxt.innerHTML = "<span style='color:var(--p2-main)'>🐱 고양이팀 승리!</span>";
            else wTxt.innerText = "무승부!";
        }
    };
</script>
</body>
</html>
