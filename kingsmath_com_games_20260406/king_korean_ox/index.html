<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

body { font-family: 'Noto Sans KR', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }

i[class^="fa-"], i[class*=" fa-"] {
    font-family: "Font Awesome 6 Free" !important;
    font-weight: 900 !important;
}

:root {
    --bg: #1a1a1a;
    --panel-bg: #2d2d2d;
    --dark: #f0f0f0;
    --text-muted: #aaaaaa;
    --border-color: #444444;

    --dog-color: #332b00;
    --cat-color: #1e1b2e;
    --rabbit-color: #2e151a;
    --hamster-color: #2e1e0f;
    --panda-color: #0f2e26;
    --monkey-color: #221826;

    --correct: #69db7c;
    --wrong: #ff6b6b;
    --theme: #4facfe; 
    --theme-dark: #00f2fe;
}

body {
    margin: 0; background: var(--bg); color: var(--dark); overflow: hidden;
    user-select: none; -webkit-user-select: none; 
    touch-action: none; 
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
}

.custom-scrollbar::-webkit-scrollbar { width: 8px; }
.custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }

/* --- Game UI Components --- */
#overlay {
    position: fixed; inset: 0; background: var(--bg); opacity: 0.98;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; backdrop-filter: blur(15px);
    text-align: center; overflow-y: auto; padding-bottom: 50px;
}

.title-area { margin: 30px 0 20px 0; }
#msgTitle { font-size: 3.5rem; color: var(--theme); margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: 900; line-height: 1.2; padding: 0 10px; }
.subtitle { color: var(--text-muted); font-size: 1.2rem; margin-top: 10px; font-weight: 500; }

#setupArea { width: 500px; max-width: 95vw; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.setup-group { text-align: left; }
.setup-label { font-size: 1.3rem; color: var(--dark); margin-bottom: 8px; display: block; font-weight: 700; }

.custom-select {
    width: 100%; font-family: inherit; font-size: 1.2rem; padding: 15px;
    border-radius: 15px; border: 2px solid var(--border-color);
    background: var(--panel-bg); color: var(--dark); outline: none;
    cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-weight: 500;
}

.btn-large {
    font-size: 1.8rem; padding: 15px 0; border-radius: 50px; border: none;
    background: var(--theme); color: #111; cursor: pointer;
    box-shadow: 0 6px 0 #007bb5; transition: 0.1s; font-family: inherit;
    width: 100%; margin-top: 20px; font-weight: 700;
}
.btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 #007bb5; }

.side-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    font-size: 2.1rem; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; color: #fff;
    transition: 0.2s; -webkit-tap-highlight-color: transparent;
}
.side-btn:active { transform: translateY(-50%) scale(0.9); background: rgba(0,0,0,0.8); }
.left-btn { left: 20px; } 
.right-btn { right: 20px; } 

@media (max-width: 768px) {
    .side-btn { width: 45px; height: 45px; font-size: 1.5rem; }
    .left-btn { left: 10px; }
    .right-btn { right: 10px; }
}

/* --- Game Screen Structure --- */
#topZone { position: relative; display: flex; flex-direction: column; z-index: 10; }
#header { height: 100px; background: var(--panel-bg); display: flex; align-items: center; justify-content: center; padding: 0 20px; border-bottom: 2px solid var(--border-color); position: relative; }
.header-title { font-size: 2rem; color: var(--theme); display: flex; align-items: center; gap: 10px; position: absolute; left: 90px; font-weight: 700; }
.timer-box { font-size: 4rem; color: #ff6b6b; background: rgba(0,0,0,0.3); padding: 5px 30px; border-radius: 20px; min-width: 120px; text-align: center; font-weight: 700; }
.timer-urgent { color: #fff; background: #ff6b6b; animation: pulse 0.5s infinite; }

#mainQuestionBoard { background: var(--panel-bg); padding: 20px 10px; text-align: center; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; flex-grow: 1; position: relative; }
#qNumber { font-size: 1.3rem; color: var(--theme); margin-bottom: 15px; background: rgba(79, 172, 254, 0.2); padding: 5px 20px; border-radius: 20px; font-weight: 700; }

#bigQuestion { font-size: clamp(1.8rem, 4vw, 4.5rem); color: var(--dark); line-height: 1.5; font-weight: 700; word-break: keep-all; max-width: 90%; }
.highlight-answer { color: var(--theme); font-weight: 900; text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 4px; }
.highlight-ox { color: #f59f00; font-weight: 900; text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 4px; }

#revealExplanation { display: none; font-size: clamp(1.1rem, 2vw, 1.5rem); color: var(--text-muted); margin-top: 15px; animation: popIn 0.5s; word-break: keep-all; max-width: 80%; background: rgba(0,0,0,0.2); padding: 15px 25px; border-radius: 15px; }

/* Result Popup */
#resultPopup { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(20, 20, 20, 0.98); backdrop-filter: blur(10px); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
#resultTitle { font-size: 3rem; margin: 0 0 20px 0; color: var(--theme); text-align: center; white-space: pre-line; font-weight: 900; }
.result-list { list-style: none; padding: 0; margin: 0; width: 80%; max-width: 600px; max-height: 60%; overflow-y: auto; }
.result-item { display: flex; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.05); margin-bottom: 8px; border-radius: 12px; font-size: 1.5rem; border: 1px solid var(--border-color); font-weight: 500; }
.rank-1 { background: var(--theme); color: #000; font-weight: 700; border: none; }

/* Player Arena */
#arena { display: flex; flex: 1; width: 100vw; overflow: hidden; background: var(--bg); }
.player-col { flex: 1; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 10px 5px; position: relative; transition: opacity 0.3s; }

.char-btn { padding: 0 15px; height: 45px; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 8px; color: var(--dark); font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,0.3); cursor: pointer; transition: 0.1s; white-space: nowrap; }

.slot-box.filled { border-bottom-color: var(--theme); background: rgba(79, 172, 254, 0.1); border-radius: 6px 6px 0 0; }
.slot-box.active-cursor { border-bottom-color: #fff; animation: blinkCursor 1s infinite; }

@keyframes blinkCursor {
    0%, 100% { border-bottom-color: #fff; background: rgba(255,255,255,0.1); }
    50% { border-bottom-color: var(--border-color); background: transparent; }
}

/* Feedback Overlay */
.feedback-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; flex-direction: column; font-size: 5rem; z-index: 20; }
.feedback-overlay.secret { background: #000000 !important; opacity: 1; display: flex; color: white; transition: none; animation: none; }
.feedback-overlay.show-result { display: flex; animation: none; }
.submitted-text { font-size: 1.5rem; margin-top: 15px; color: var(--theme); text-align: center; font-weight: 700; }
.score-earned { font-size: 1.8rem; color: #69db7c; margin-top: 10px; font-weight: 900; animation: popIn 0.3s; }

/* Final Status Pop */
.final-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; box-sizing: border-box; background: rgba(0,0,0,0.9); padding: 15px 10px; border-radius: 15px; text-align: center; z-index: 50; border: 2px solid var(--theme); display: none; animation: popIn 0.5s; word-break: keep-all; }
.final-status h3 { margin: 0; font-size: 1.2rem; color: #fff; font-weight: 700; }
.final-status p { margin: 5px 0 0 0; font-size: 1.8rem; color: var(--theme); font-weight: 900; }

/* Countdown */
#countdownLayer { position: fixed; inset: 0; background: #000000; z-index: 2000; display: none; align-items: center; justify-content: center; }
#countdownText { font-size: 25rem; color: var(--theme); text-shadow: 0 0 50px rgba(79, 172, 254, 0.5); opacity: 0; font-weight: 900; }
@keyframes countPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.0); opacity: 0; } }
.count-animate { animation: countPop 0.8s ease-in-out forwards; }
@keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

@media (min-width: 1600px) {
    #header { height: 140px; } .header-title { font-size: 3rem; left: 110px; } .timer-box { font-size: 6rem; padding: 10px 50px; } #mainQuestionBoard { min-height: 350px; }
    .char-btn { height: 50px; font-size: 1.5rem; padding: 0 20px; }
    .char-btn.ox-btn { font-size: 2.2rem; width: 80px; }
    .slot-box { height: 50px; font-size: 1.5rem; min-width: 100px; }
}
@media (max-width: 768px) {
    #bigQuestion { font-size: 1.4rem; } .header-title span:last-child { display: none; } .p-name { display: none; }
    .char-btn { height: 40px; font-size: 1.1rem; padding: 0 10px; }
    .char-btn.ox-btn { font-size: 1.5rem; width: 50px; }
    .slot-box { height: 40px; font-size: 1.1rem; padding: 0 10px; min-width: 60px; }
    .scramble-grid { gap: 5px; }
}

.bg-dog { background: var(--dog-color); } .bg-cat { background: var(--cat-color); } .bg-rabbit { background: var(--rabbit-color); } .bg-hamster { background: var(--hamster-color); } .bg-panda { background: var(--panda-color); } .bg-monkey { background: var(--monkey-color); }
</style>

<script>
/* =========================================
   전역 변수 (오류 수정용)
   ========================================= */
let roundTimeout = null;
let isAborted = false;

/* =========================================
   Data Fetching (테스트용 더미 데이터 포함)
   ========================================= */
let quizData = [];

async function loadData() {
    // 단일 파일 환경에서 data.json이 없을 때를 위한 기본 더미 데이터
    const fallbackData = [
        { "id": 1, "template": "그 일은 {word} 된 거지?", "correct": "어떻게", "incorrect": "어떡해", "explanation": "'어떻게'는 '어떠하다'가 줄어든 부사이며, '어떡해'는 '어떻게 해'가 줄어든 말입니다." },
        { "id": 2, "template": "지금 {word} 정말 당황스러워.", "correct": "어떡해", "incorrect": "어떻게", "explanation": "문장 끝에서 '어찌해'라는 뜻으로 쓰일 때는 '어떡해'가 맞습니다." },
        { "id": 3, "template": "오늘은 {word} 기분이 좋아.", "correct": "왠지", "incorrect": "웬지", "explanation": "'왜 그런지'의 줄임말은 '왠지'가 유일합니다." },
        { "id": 4, "template": "이게 {word} 일이야?", "correct": "웬", "incorrect": "왠", "explanation": "'어찌 된'이라는 뜻의 관형사는 '웬'을 씁니다." },
        { "id": 5, "template": "너 {word} 올 거야?", "correct": "며칠", "incorrect": "몇 일", "explanation": "우리말에 '몇 일'이라는 표기는 없으며, 항상 '며칠'로 적습니다." },
        { "id": 6, "template": "감기가 깨끗이 {word}.", "correct": "나았다", "incorrect": "낳았다", "explanation": "병이 고쳐지는 것은 '낫다(나았다)', 아이를 출산하는 것은 '낳다'입니다." },
        { "id": 7, "template": "나는 이제 {word} 상관없어.", "correct": "하든 말든", "incorrect": "하던 말던", "explanation": "선택을 나타낼 때는 '-든지(-든)', 과거의 일을 회상할 때는 '-던지'를 씁니다." },
        { "id": 8, "template": "어제는 얼마나 {word}.", "correct": "춥던지", "incorrect": "춥든지", "explanation": "과거를 회상하며 그 정도가 심함을 나타낼 때는 '-던지'를 씁니다." },
        { "id": 9, "template": "숙제를 {word} 못 했어.", "correct": "다", "incorrect": "따", "explanation": "전부를 뜻할 때는 '다'를 씁니다." },
        { "id": 10, "template": "밥을 {word} 먹어.", "correct": "안", "incorrect": "않", "explanation": "'아니'의 줄임말은 부사 '안'입니다." }
    ];

    try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('Network response was not ok');
        quizData = await response.json();
    } catch (error) {
        console.warn('data.json을 찾을 수 없어 기본 내장 데이터를 사용합니다.', error);
        quizData = fallbackData;
    } finally {
        const startBtn = document.getElementById('startBtn');
        startBtn.innerText = "게임 시작하기";
        startBtn.disabled = false;
    }
}

window.addEventListener('DOMContentLoaded', loadData);

/* =========================================
   Game Configuration
   ========================================= */
const TEAM_DATA = [
    { id: 'dog', icon: '🐶', color: 'bg-dog', name: '강아지' },
    { id: 'cat', icon: '🐱', color: 'bg-cat', name: '고양이' },
    { id: 'rabbit', icon: '🐰', color: 'bg-rabbit', name: '토끼' },
    { id: 'hamster', icon: '🐹', color: 'bg-hamster', name: '햄스터' },
    { id: 'panda', icon: '🐼', color: 'bg-panda', name: '판다' },
    { id: 'monkey', icon: '🐵', color: 'bg-monkey', name: '원숭이' }
];

const state = {
    players: [], mode: 'challenge', qTypeSetting: 'mixed',
    currentQ: 0, maxQ: 10, timer: 30, timerInterval: null,
    phase: 'setup', problem: null, availableQuestions: [],
    submitCounter: 0, currentRoundType: 'blank', expectedAnswer: ''
};

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const t = audioCtx.currentTime;
    if (type === 'start') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.linearRampToValueAtTime(880, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.5);
    } else if (type === 'count') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'correct') {
        const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, t); osc2.frequency.setValueAtTime(659.25, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.4);
        gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.3, t + 0.1); gain2.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4); osc2.start(t); osc2.stop(t + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'end') {
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
        });
    }
}

/* =========================================
   Game Logic
   ========================================= */
function buildPool() {
    state.availableQuestions = [...quizData]; 
}

function generateProblem() {
    if (state.availableQuestions.length === 0) buildPool();
    let randIdx = Math.floor(Math.random() * state.availableQuestions.length);
    let target = state.availableQuestions.splice(randIdx, 1)[0];
    return target;
}

function initGame() {
    isAborted = false; 
    if(quizData.length === 0) return; 
    initAudio();
    
    const pCount = parseInt(document.getElementById('playerCount').value);
    state.mode = document.getElementById('gameMode').value;
    state.qTypeSetting = document.getElementById('questionType').value;
    
    state.maxQ = state.mode === 'challenge' ? 10 : 30;
    state.currentQ = 0;
    state.players = [];

    buildPool();

    const arena = document.getElementById('arena');
    arena.innerHTML = '';

    for(let i=0; i<pCount; i++) {
        let teamInfo = TEAM_DATA[i];
        state.players.push({ 
            id: teamInfo.id, icon: teamInfo.icon, color: teamInfo.color, name: teamInfo.name, 
            score: 0, survived: 0, alive: true, answered: false, 
            inputChars: [], isGoldenBellWinner: false, rank: 0, submitRank: 0 
        });
        
        const col = document.createElement('div');
        col.className = `player-col ${teamInfo.color}`;
        col.id = `p-${i}`;
        // 주의: 선택지와 슬롯의 위아래 배치를 바꿈 (슬롯을 먼저, 선택지를 나중에 렌더링)
        col.innerHTML = `
            <div class="p-header">
                <span class="p-emoji">${teamInfo.icon}</span>
                <span class="p-name">${teamInfo.name}</span>
            </div>
            <div class="slot-container" id="p-slots-${i}">
                <div class="slot-box" data-idx="0"></div>
            </div>
            <div class="scramble-grid" id="p-scrambled-${i}"></div>
            <div class="feedback-overlay" id="p-fb-${i}"></div>
            <div class="final-status" id="p-final-${i}"></div>
        `;
        arena.appendChild(col);
    }

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('resultPopup').style.display = 'none';

    playSound('start');
    nextTurn();
}

async function nextTurn() {
    const aliveCount = state.players.filter(p=>p.alive).length;

    if (state.mode === 'survival' && aliveCount <= 1 && state.players.length > 1) { endGame(); return; }
    if (state.mode === 'survival' && aliveCount === 0) { endGame(); return; }
    
    if (state.currentQ >= state.maxQ && state.mode === 'challenge') { endGame(); return; }
    if (state.currentQ >= state.maxQ && state.mode === 'survival') { triggerGoldenBellWin(); return; }

    state.currentQ++;
    state.phase = 'counting';
    state.problem = generateProblem();
    state.submitCounter = 0; // 선착순 제출 카운터 초기화
    
    // 문제 유형 설정 (혼합일 경우 랜덤 지정)
    if (state.qTypeSetting === 'mixed') {
        state.currentRoundType = Math.random() < 0.5 ? 'blank' : 'ox';
    } else {
        state.currentRoundType = state.qTypeSetting;
    }

    // 해설 텍스트 가리기
    const explEl = document.getElementById('revealExplanation');
    explEl.style.display = 'none';
    explEl.innerText = '';

    // 정답 및 화면 텍스트 생성
    let bigQuestionHtml = '';
    let playerOptions = [];

    if (state.currentRoundType === 'blank') {
        state.expectedAnswer = state.problem.correct;
        bigQuestionHtml = state.problem.template.replace('{word}', '____');
        playerOptions = [state.problem.correct, state.problem.incorrect];
        playerOptions.sort(() => Math.random() - 0.5); // 보기 섞기
    } else {
        // OX 퀴즈 모드
        let isOxTrue = Math.random() < 0.5;
        let displayedWord = isOxTrue ? state.problem.correct : state.problem.incorrect;
        state.expectedAnswer = isOxTrue ? 'O' : 'X';
        
        let highlightHtml = `<span class="highlight-ox">${displayedWord}</span>`;
        bigQuestionHtml = state.problem.template.replace('{word}', highlightHtml);
        playerOptions = ['O', 'X'];
    }

    state.players.forEach((p, idx) => {
        if(p.alive) {
            p.answered = false; 
            p.inputChars = [];
            p.submitRank = 0;
            const fb = document.getElementById(`p-fb-${idx}`);
            fb.className = 'feedback-overlay'; fb.innerHTML = '';
            
            const scrambledGrid = document.getElementById(`p-scrambled-${idx}`);
            scrambledGrid.innerHTML = '';
            
            playerOptions.forEach((optStr) => {
                const btn = document.createElement('div');
                btn.className = 'char-btn';
                if(state.currentRoundType === 'ox') btn.classList.add('ox-btn');
                btn.innerText = optStr;
                btn.dataset.word = optStr;
                btn.onpointerdown = (e) => { e.preventDefault(); handleCharSelect(idx, btn); };
                scrambledGrid.appendChild(btn);
            });

            const slot = document.getElementById(`p-slots-${idx}`).children[0];
            slot.innerText = '';
            slot.className = 'slot-box active-cursor';
            slot.style.fontSize = '';
            slot.style.color = '';
            slot.style.borderColor = '';
        }
    });

    document.getElementById('qNumber').innerText = `문제 ${state.currentQ} / ${state.maxQ}`;
    document.getElementById('bigQuestion').innerHTML = bigQuestionHtml;
    
    await runCountdown();
    if (isAborted) return; 

    state.phase = 'playing';
    startTimer();
}

async function runCountdown() {
    const layer = document.getElementById('countdownLayer');
    const txt = document.getElementById('countdownText');
    layer.style.display = 'flex';
    for(let i=3; i>0; i--) {
        if (isAborted) break; 
        txt.innerText = i; 
        txt.classList.remove('count-animate');
        void txt.offsetWidth; 
        txt.classList.add('count-animate');
        playSound('count'); 
        await new Promise(r => setTimeout(r, 1000));
    }
    layer.style.display = 'none';
}

function startTimer() {
    state.timer = 30;
    const tBox = document.getElementById('mainTimer');
    tBox.innerText = 30; tBox.classList.remove('timer-urgent');
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timer--; tBox.innerText = state.timer;
        if(state.timer <= 5) { tBox.classList.add('timer-urgent'); playSound('count'); }
        if(state.timer <= 0) finishRound();
    }, 1000);
}

function handleCharSelect(pIdx, btnElem) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive || btnElem.classList.contains('used')) return;

    playSound('click');
    
    // 선착순 순위 기록
    state.submitCounter++;
    p.submitRank = state.submitCounter;

    p.inputChars = [{ char: btnElem.dataset.word }];
    btnElem.classList.add('used');

    updateSlotsUI(pIdx);
    submitAnswer(pIdx);
}

function updateSlotsUI(pIdx) {
    const p = state.players[pIdx];
    const slot = document.getElementById(`p-slots-${pIdx}`).children[0];
    
    slot.className = 'slot-box';
    if(p.inputChars.length > 0) {
        slot.innerText = p.inputChars[0].char;
        slot.classList.add('filled');
    } else {
        slot.innerText = '';
        slot.classList.add('active-cursor');
    }
}

function submitAnswer(pIdx) {
    const p = state.players[pIdx];
    p.answered = true;
    
    const fb = document.getElementById(`p-fb-${pIdx}`);
    fb.innerHTML = `
        <div style="font-size:3rem; margin-bottom:10px;">🔒</div>
        <div class="submitted-text">선택 완료</div>
    `;
    fb.classList.add('secret'); 
    
    const living = state.players.filter(pl => pl.alive);
    if(living.every(pl => pl.answered)) finishRound();
}

function finishRound() {
    clearInterval(state.timerInterval);
    state.phase = 'result';
    
    let someoneWrong = false;
    
    // 문제 영역에 무조건 올바른 정답 문장으로 교체해서 보여줌
    const bigQEl = document.getElementById('bigQuestion');
    const explEl = document.getElementById('revealExplanation');
    
    const highlightAnswerHtml = `<span class="highlight-answer">${state.problem.correct}</span>`;
    bigQEl.innerHTML = state.problem.template.replace('{word}', highlightAnswerHtml);
    
    explEl.innerText = state.problem.explanation;
    explEl.style.display = 'block';

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const fb = document.getElementById(`p-fb-${idx}`);
        
        fb.classList.remove('secret'); fb.innerHTML = '';
        
        let playerAnswer = p.inputChars.length > 0 ? p.inputChars[0].char : '';

        if(playerAnswer === state.expectedAnswer) {
            fb.innerHTML = '<span style="color:#69db7c">⭕</span>'; 
            
            // 챌린지 모드: 선착순 점수 적용 (1등:50, 2등:40, 3등:30, 4등:20, 5등~:10점)
            if(state.mode === 'challenge') {
                let points = Math.max(10, 60 - (p.submitRank * 10));
                p.score += points;
                fb.innerHTML += `<div class="score-earned">+${points}점</div>`;
            }

            fb.classList.add('show-result');
            p.survived++;
        } else {
            someoneWrong = true;
            // 오답이거나 시간 초과인 경우 기대하는 정답을 강제로 슬롯에 보여줌
            const slot = document.getElementById(`p-slots-${idx}`).children[0];
            slot.innerText = state.expectedAnswer;
            slot.style.color = "#ff6b6b";
            slot.style.borderColor = "#ff6b6b";
            
            fb.innerHTML = '<span style="color:#ff6b6b; margin-bottom: 20px;">❌</span>'; fb.classList.add('show-result');
            if(state.mode === 'survival') {
                p.alive = false;
                setTimeout(() => {
                    document.getElementById(`p-${idx}`).classList.add('eliminated');
                }, 2500);
            }
        }
    });

    if(!someoneWrong) playSound('correct'); else playSound('wrong');
    
    roundTimeout = setTimeout(() => {
        if (!isAborted) nextTurn();
    }, 4500); 
}

function assignRanks() {
    let ranked = [...state.players];
    if(state.mode === 'challenge') {
        ranked.sort((a,b) => b.score - a.score);
    } else {
        ranked.sort((a,b) => {
            if (a.alive && !b.alive) return -1;
            if (!a.alive && b.alive) return 1;
            return b.survived - a.survived;
        });
    }
    
    let currentRank = 1;
    ranked.forEach((p, i) => {
        if (i > 0) {
            const prev = ranked[i-1];
            let isTie = false;
            if (state.mode === 'challenge') {
                if (p.score === prev.score) isTie = true;
            } else {
                if (p.alive && prev.alive) isTie = true;
                else if (!p.alive && !prev.alive && p.survived === prev.survived) isTie = true;
            }
            if (!isTie) currentRank = i + 1;
        } else {
            currentRank = 1;
        }
        const originalPlayer = state.players.find(pl => pl.id === p.id);
        originalPlayer.rank = currentRank;
    });
}

function getRankEmojiHtml(rank) {
    let rankEmoji = '';
    if (rank === 1) rankEmoji = '🥇';
    else if (rank === 2) rankEmoji = '🥈';
    else if (rank === 3) rankEmoji = '🥉';
    else if (rank === 4) rankEmoji = '<span style="font-size: 70%;">4️⃣</span>';
    else if (rank === 5) rankEmoji = '<span style="font-size: 70%;">5️⃣</span>';
    else if (rank === 6) rankEmoji = '<span style="font-size: 70%;">6️⃣</span>';
    return `<div style="font-size: 3rem; margin-bottom: 5px;">${rankEmoji}</div>`;
}

function triggerGoldenBellWin() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');

    state.players.forEach(p => {
        if(p.alive) p.isGoldenBellWinner = true;
    });
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    const list = document.getElementById('finalResultList');
    
    document.getElementById('resultTitle').innerHTML = "🎉 골든벨 달성! 🎉<br><span style='font-size: 2rem; color: var(--theme);'>위대한 맞춤법 킹 탄생!</span>";
    popup.style.display = 'flex'; list.innerHTML = '';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (p.isGoldenBellWinner) {
            finalDiv.innerHTML = `${rankHtml}<h3>영광의 우승</h3><p>🔔 골든벨 🔔</p>`;
            finalDiv.style.border = "4px solid var(--theme)";
            finalDiv.style.background = "rgba(79, 172, 254, 0.2)";
        } else {
            finalDiv.innerHTML = `${rankHtml}<h3>기록</h3><p>${p.survived} 문제 통과</p>`;
        }
    });

    renderResultList(true);
}

function endGame() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    document.getElementById('resultTitle').innerText = "결과 발표";
    popup.style.display = 'flex';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (state.mode === 'challenge') { 
            finalDiv.innerHTML = `${rankHtml}<h3>최종 점수</h3><p>${p.score} 점</p>`; 
        } else { 
            finalDiv.innerHTML = p.alive ? `${rankHtml}<h3>기록</h3><p>최후의 생존자!</p>` : `${rankHtml}<h3>기록</h3><p>${p.survived} 문제 통과</p>`; 
            if(p.alive) finalDiv.style.border = "4px solid var(--theme)"; 
        }
    });

    renderResultList(false);
}

function renderResultList(isGoldenBell) {
    const list = document.getElementById('finalResultList');
    list.innerHTML = '';

    let ranked = [...state.players].sort((a,b) => a.rank - b.rank);

    ranked.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = `result-item ${p.rank === 1 ? 'rank-1' : ''}`;
        
        let status;
        if (isGoldenBell && p.isGoldenBellWinner) status = "🔔 골든벨 우승!";
        else if (state.mode === 'challenge') status = `${p.score} 점`;
        else status = p.alive ? "최후의 생존자!" : `${p.survived} 문제 통과`;

        li.innerHTML = `<span>${p.rank}위 ${p.icon} ${p.name}</span><span>${status}</span>`;
        list.appendChild(li);
    });
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => { console.log(err.message); });
    } else { document.exitFullscreen(); }
});

document.getElementById('startBtn').addEventListener('click', initGame);

document.getElementById('restartBtn').addEventListener('click', () => { 
    document.getElementById('overlay').style.display = 'flex'; 
    document.getElementById('resultPopup').style.display = 'none'; 
});

document.getElementById('btn-home').addEventListener('click', () => {
    isAborted = true; 
    clearInterval(state.timerInterval);
    if (roundTimeout) clearTimeout(roundTimeout); 

    if (document.fullscreenElement) {
        state.phase = 'setup';
        document.getElementById('resultPopup').style.display = 'none';
        document.getElementById('countdownLayer').style.display = 'none';
        document.getElementById('arena').innerHTML = '';
        document.getElementById('mainTimer').innerText = '30';
        document.getElementById('mainTimer').classList.remove('timer-urgent');
        document.getElementById('bigQuestion').innerText = '준비...';
        document.getElementById('revealExplanation').style.display = 'none';
        document.getElementById('overlay').style.display = 'flex';
        if(window.playSound) window.playSound('click');
    } else {
        location.reload();
    }
});

document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('dragstart', event => event.preventDefault());
