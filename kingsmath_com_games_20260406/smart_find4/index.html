    function playTone(freq, type, dur, slide=false, drop=false) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if(slide) osc.frequency.linearRampToValueAtTime(freq + 200, audioCtx.currentTime + dur);
        if(drop) osc.frequency.linearRampToValueAtTime(freq - 100, audioCtx.currentTime + dur);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    }

    // --- Modal & i18n Logic ---
    const triggerBtn = document.getElementById('langTriggerBtn');
    const modal = document.getElementById('langModal');
    const closeBtn = document.getElementById('closeModalBtn');
    const searchInput = document.getElementById('searchInput');
    const gridEl = document.getElementById('languageGrid');
    const noResult = document.getElementById('noResult');
    const currentFlagImg = document.getElementById('currentFlag');
    
    const toast = document.getElementById('toastNotification');
    const toastLangName = document.getElementById('toastLangName');
    let toastTimeout;

    function getInitialLang() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        if(langParam && i18n[langParam]) return langParam;
        const savedLang = localStorage.getItem('kingsmath_lang');
        if(savedLang && i18n[savedLang]) return savedLang;
        const browserLang = navigator.language.slice(0, 2);
        if(i18n[browserLang]) return browserLang;
        return 'en';
    }

    function renderLanguages(filterText = '') {
        gridEl.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            gridEl.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            gridEl.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;
                btn.addEventListener('click', () => changeLang(lang.code, lang));
                gridEl.appendChild(btn);
            });
        }
    }

    function openModal() {
        modal.classList.add('active');
        renderLanguages(searchInput.value);
        document.body.style.overflow = 'hidden';
        setTimeout(() => searchInput.focus(), 100);
    }
    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, langCode) {
        const toastMsg = i18n[langCode].toast || "Language changed.";
        document.getElementById('ui-toast').textContent = toastMsg;
        toastLangName.textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

function changeLang(langCode, langObj = null, isInitialLoad = false) {
        if(!i18n[langCode]) return;
        currentLang = langCode;
        const t = i18n[langCode];
        if (!langObj) langObj = languagesList.find(l => l.code === langCode);

        document.querySelectorAll('[data-i18n]').forEach(el => { 
            const key = el.getAttribute('data-i18n');
            let str = t[key];
            if(str) el.innerHTML = str;
        });
        
        document.getElementById("nickname").placeholder = t.placeholder;
        document.getElementById("nickname").setAttribute('data-i18n-ph', 'placeholder');
        currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;

        const linkBtn = document.getElementById("kingsmath-link-btn");
        if(langCode === 'ko') linkBtn.innerText = "킹수학.com";
        else linkBtn.innerText = "KingsMath.com";

        const mainTitle = document.getElementById('main-title-el');
        if(['ru', 'es', 'fr', 'pt-br', 'de', 'it', 'id', 'vi'].includes(langCode)) {
            mainTitle.style.fontSize = "4.5vh";
        } else if(['th'].includes(langCode)) {
            mainTitle.style.fontSize = "5.5vh";
        } else {
            mainTitle.style.fontSize = "6vh"; 
        }

        document.title = t.metaTitle;
        document.getElementById("meta-desc").setAttribute("content", t.metaDesc);

        if(isPlaying || currentStage > 1) updateStageUI(); // 게임 중이면 텍스트 갱신

        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + langCode;
        window.history.pushState({path:newUrl}, '', newUrl);
        localStorage.setItem("kingsmath_lang", langCode);

        initQR(); 
        loadRanking(); 

        closeModal();
        // 초기 로딩(새로고침 등)이 아닐 때만 토스트 알림 표시
        if (langObj && !isInitialLoad) showToast(langObj.name, langCode); 
    }
    triggerBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });


    // --- QR Code ---
    function initQR() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; 
        try {
            new QRCode(qrContainer, {
                text: window.location.href, width: 128, height: 128, colorDark : "#1a1a2e", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
        } catch(e) { console.error(e); }
    }

    function showBigQR() {
        const modal = document.getElementById("qr-modal");
        const modalContent = document.getElementById("qr-modal-content");
        modalContent.innerHTML = "";
        const qrCanvas = document.querySelector("#qrcode canvas");
        const qrImg = document.querySelector("#qrcode img");
        let src = "";
        if (qrCanvas) src = qrCanvas.toDataURL("image/png");
        else if (qrImg) src = qrImg.src;

        if (src) {
            const newImg = new Image();
            newImg.src = src;
            modalContent.appendChild(newImg);
            modal.style.display = "flex";
        }
    }


    // --- Game Logic ---
    function buildGrid() {
        const gridContainer = document.getElementById('grid-container');
        gridContainer.innerHTML = '';
        cells = [];
        
        for(let r=0; r<GRID_SIZE; r++) {
            let rowArr = [];
            for(let c=0; c<GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                // 12x12이므로 4칸마다 굵은 선 (위 CSS에서 이미 :nth-child로 처리됨)
                gridContainer.appendChild(cell);
                rowArr.push(cell);
            }
            cells.push(rowArr);
        }

        // 터치 이벤트 바인딩
        gridContainer.addEventListener('pointerdown', onPointerDown);
        gridContainer.addEventListener('pointermove', onPointerMove);
        gridContainer.addEventListener('pointerup', onPointerUp);
        gridContainer.addEventListener('pointercancel', onPointerUp);
        gridContainer.addEventListener('pointerleave', onPointerUp);
    }

    function getCellPos(e) {
        const grid = document.getElementById('grid-container');
        const rect = grid.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if(x < 0 || y < 0 || x >= rect.width || y >= rect.height) return null;
        const c = Math.floor(x / (rect.width / GRID_SIZE));
        const r = Math.floor(y / (rect.height / GRID_SIZE));
        return { r: Math.min(GRID_SIZE-1, Math.max(0, r)), c: Math.min(GRID_SIZE-1, Math.max(0, c)) };
    }

    function onPointerDown(e) {
        if(!isPlaying || isPenalty) return;
        const pos = getCellPos(e);
        if(!pos) return;

        if(e.cancelable) e.preventDefault();
        const grid = document.getElementById('grid-container');
        activePointerId = e.pointerId;
        grid.setPointerCapture(e.pointerId);

        isDrawing = true;
        startR = pos.r; startC = pos.c;
        endR = pos.r; endC = pos.c;
        drawSelection();
    }

    function onPointerMove(e) {
        if(!isDrawing || e.pointerId !== activePointerId) return;
        if(e.cancelable) e.preventDefault();
        const pos = getCellPos(e);
        if(!pos) return;
        endR = pos.r; endC = pos.c;
        drawSelection();
    }

    function onPointerUp(e) {
        if(!isDrawing || e.pointerId !== activePointerId) return;
        if(e.cancelable) e.preventDefault();
        isDrawing = false;
        document.getElementById('grid-container').releasePointerCapture(e.pointerId);
        checkAnswer();
    }

    function drawSelection() {
        clearSelection(false); 
        const minR = Math.min(startR, endR);
        const maxR = Math.max(startR, endR);
        const minC = Math.min(startC, endC);
        const maxC = Math.max(startC, endC);

        for(let r=minR; r<=maxR; r++) {
            for(let c=minC; c<=maxC; c++) {
                cells[r][c].classList.add('selected');
            }
        }
    }

    function clearSelection(resetCoords = true) {
        for(let r=0; r<GRID_SIZE; r++) {
            for(let c=0; c<GRID_SIZE; c++) {
                cells[r][c].classList.remove('selected', 'correct');
            }
        }
        if(resetCoords) {
            startR = -1; startC = -1; endR = -1; endC = -1;
        }
    }

    function checkAnswer() {
        const drawnW = Math.abs(endC - startC) + 1;
        const drawnH = Math.abs(endR - startR) + 1;
        const area = drawnW * drawnH;
        const peri = (drawnW + drawnH) * 2;

        if(area === targetArea && peri === targetPeri) {
            // 정답
            sounds.success();
            
            // 정답 셀 초록색 반짝
            const minR = Math.min(startR, endR);
            const maxR = Math.max(startR, endR);
            const minC = Math.min(startC, endC);
            const maxC = Math.max(startC, endC);
            for(let r=minR; r<=maxR; r++) {
                for(let c=minC; c<=maxC; c++) {
                    cells[r][c].classList.add('correct');
                }
            }

            setTimeout(() => {
                clearSelection(true);
                currentStage++;
                if (currentStage > TOTAL_STAGES) {
                    endGame();
                } else {
                    generateProblem();
                }
            }, 300);

        } else {
            // 오답 페널티
            applyPenalty();
            clearSelection(true);
        }
    }

    function applyPenalty() {
        isPenalty = true;
        document.getElementById('play-board').classList.add('shake');
        setTimeout(() => document.getElementById('play-board').classList.remove('shake'), 400);
        sounds.fail();

        let pTimeLeft = PENALTY_TIME;
        const overlay = document.getElementById('status-overlay');
        overlay.innerHTML = `
            <span style="font-size:5vh">🚨</span>
            <span>${i18n[currentLang].msgFail}</span>
            <span><span class="p-time">${pTimeLeft}</span>${i18n[currentLang].msgWait}</span>
        `;
        overlay.style.display = 'flex';

        const ptimeEl = overlay.querySelector('.p-time');
        const iv = setInterval(() => {
            if(!isPlaying) { clearInterval(iv); return; }
            pTimeLeft--;
            ptimeEl.innerText = pTimeLeft;
            if(pTimeLeft <= 0) {
                clearInterval(iv);
                isPenalty = false;
                overlay.style.display = 'none';
            }
        }, 1000);
    }


    // --- Core UI Flow ---
    function checkNameAndStart() {
        const input = document.getElementById('nickname');
        const val = input.value.trim();
        const t = i18n[currentLang];

        if(val.length < 1) { alert(t.alertName); return; }
        const badWords = ["시발", "씨발", "개새끼", "fuck", "shit"];
        if(badWords.some(w => val.includes(w))) { alert(t.alertBad); return; }

        myNickname = val;
        localStorage.setItem("kingsmaze_name", val);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        
        buildGrid();
        startCountdown();
    }

    function startCountdown() {
        const screen = document.getElementById('countdown-screen');
        const text = document.getElementById('countdown-text');
        screen.classList.remove('hidden');
        
        let cnt = 3;
        text.innerText = cnt;
        sounds.beep();
        
        const intv = setInterval(() => {
            cnt--;
            if(cnt > 0) {
                text.innerText = cnt;
                text.style.animation = 'none';
                text.offsetHeight; 
                text.style.animation = 'pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                sounds.beep();
            } else {
                clearInterval(intv);
                text.innerText = "GO!";
                sounds.go();
                setTimeout(() => {
                    screen.classList.add('hidden');
                    startGame();
                }, 500);
            }
        }, 1000);
    }

    function startGame() {
        currentStage = 1;
        isPlaying = true;
        isPenalty = false;
        document.getElementById('status-overlay').style.display = 'none';
        
        generateProblem();
        
        startTime = Date.now();
        if(timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            const elapsed = Date.now() - startTime;
            const sec = (elapsed / 1000).toFixed(2);
            document.getElementById('timer-val').innerText = sec + "s";
        }, 10); // 10ms update for smooth stopwatch
    }

    function updateStageUI() {
        const t = i18n[currentLang];
        document.getElementById('stage-badge').innerText = t.stage.replace('{n}', Math.min(currentStage, TOTAL_STAGES));
    }

    function generateProblem() {
        updateStageUI();
        
        // 가로 세로 2~10 사이 랜덤 생성
        targetW = Math.floor(Math.random() * 9) + 2; 
        targetH = Math.floor(Math.random() * 9) + 2;
        targetArea = targetW * targetH;
        targetPeri = (targetW + targetH) * 2;

        document.getElementById('ui-area').innerText = targetArea;
        document.getElementById('ui-peri').innerText = targetPeri;
        
        clearSelection(true);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        
        // 최종 시간 계산
        finalTimeMs = Date.now() - startTime;
        const finalSec = (finalTimeMs / 1000).toFixed(2);
        document.getElementById('timer-val').innerText = finalSec + "s";
        
        sounds.success();
        showResult();
    }

    function restartGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        startCountdown();
    }

    function goHome() {
        if (document.fullscreenElement) {
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('langTriggerContainer').style.display = 'block'; 
            if(window.playSound) sounds.click();
            loadRanking();
        } else {
            location.reload();
        }
    }

    function showResult() {
        document.getElementById('game-screen').classList.add('hidden');
        const resScreen = document.getElementById('result-screen');
        resScreen.classList.remove('hidden');
        
        const finalSec = (finalTimeMs / 1000).toFixed(2);

        document.getElementById('res-nickname').innerText = myNickname;
        document.getElementById('res-score').innerText = finalSec + "s";
        document.getElementById('result-ranking-board').innerHTML = "";
        
        shootFireworks(); 
        
        submitScoreAPI(myNickname, finalTimeMs); // ms 단위로 서버 전송
    }

    // --- Ranking System API ---
    function submitScoreAPI(name, timeMs) {
        const t = i18n[currentLang];
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', timeMs);

        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = t.rankResult.replace('{rank}', data.rank);
                loadResultRanking();
            } else {
                document.getElementById("res-rank").innerText = "Ranking Error";
            }
        })
        .catch(e => console.error(e));
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center">${t.rankingLoading}</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="margin-top:20px;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1);
                let style = (idx < 3) ? "font-size:1.5em;" : "color:var(--primary-color); font-weight:bold;";
                let secStr = (item.score / 1000).toFixed(2) + "s";
                
                html += `<div class="rank-item">
                    <span style="width:15%; text-align:center; ${style}">${rankDisplay}</span>
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#ccc; font-weight:bold;">${secStr}</span>
                </div>`;
            });
            list.innerHTML = html;
        })
        .catch(e => {
            list.innerHTML = `<div class="center" style="color:#ff5252;">${t.rankingError}</div>`;
        });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#888;">TOP 3 Loading...</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="font-size:1.8vh;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i];
                let rankIcon = ["🥇","🥈","🥉"][i];
                let secStr = (item.score / 1000).toFixed(2) + "s";

                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;">
                    <span style="width:15%; text-align:center;">${rankIcon}</span>
                    <span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; font-weight:bold; color:#00cec9;">${secStr}</span>
                </div>`;
            }
            list.innerHTML = html;
        })
        .catch(e => { list.style.display = 'none'; });
    }

// --- Init ---
    window.onload = function() {
        const savedName = localStorage.getItem("kingsmaze_name"); 
        if(savedName) document.getElementById("nickname").value = savedName;
        
        const initLang = getInitialLang();
        // 세 번째 파라미터에 true를 전달하여 초기 로딩 시 팝업을 막습니다.
        changeLang(initLang, null, true);
        renderLanguages(); 
    };

</script>
</body>
</html>
