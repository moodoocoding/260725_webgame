    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans:wght@400;700&display=swap');

        /* 게임 공통 폰트 설정: 한국어는 Jua, 그 외는 Noto Sans/기본 고딕 */
        :root {
            --game-font: 'Jua', sans-serif;
            --ui-font: sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: var(--game-font);
            touch-action: pan-y;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 100vh;
            background-color: #050505;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        #gameCanvas { 
            display: block; 
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud-text {
            font-family: var(--game-font);
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .card-container {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
            z-index: 50;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(30, 30, 50, 0.95);
            border: 2px solid #666;
            border-radius: 12px;
            width: 100%;
            height: auto;
            min-height: 80px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            padding: 12px 16px;
            text-align: left;
        }
        
        .card:hover, .card:active {
            border-color: #ffd700;
            background-color: rgba(60, 60, 100, 1);
            transform: scale(0.98);
        }

        .card-content { flex: 1; }
        .card-title { font-size: 18px; font-weight: bold; color: #ffcc00; margin-bottom: 2px; }
        .card-desc { font-size: 13px; color: #ccc; line-height: 1.2; word-break: keep-all; }
        .card-math { font-size: 24px; font-weight: bold; color: #00ffff; margin-left: 15px; min-width: 60px; text-align: right; }

        #start-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
            text-align: center;
            padding-top: 60px;
            overflow-y: auto !important; 
            -webkit-overflow-scrolling: touch;
            padding-bottom: 50px;
        }
        
        #game-over-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
            text-align: center;
        }

        button, input, select, a { pointer-events: auto; font-family: var(--game-font); }
        .hidden { display: none !important; }

        #ranking-list::-webkit-scrollbar { width: 4px; }
        #ranking-list::-webkit-scrollbar-track { background: #222; }
        #ranking-list::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        #qrcode {
            background: white;
            padding: 5px;
            border-radius: 5px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        /* [추가] 폰트 크기 동적 스케일링을 위한 트랜지션 */
        .dynamic-text {
            transition: font-size 0.2s ease-in-out;
            white-space: nowrap;
        }

        /* ---------------------------------------------------- */
        /* 언어 선택 모달 전용 CSS (충돌 방지 및 Z-Index 99999 보장) */
        /* ---------------------------------------------------- */
        #langModal, #langModal *, #toastNotification, #toastNotification * {
            box-sizing: border-box !important;
            font-family: var(--ui-font); /* 모달은 무난한 폰트 사용 */
        }
        /* 폰트어썸 예외처리: 이모지 폰트 깨짐 방지 */
        #langModal i, #langTriggerBtn i, #toastNotification i {
            font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
        }

        .lang-modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .lang-modal-content {
            transform: scale(0.95) translateY(-10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-modal-overlay.active .lang-modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .lang-custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .lang-custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .lang-custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .lang-custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .lang-toast {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .lang-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* 홈버튼 디자인 */
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(30, 30, 50, 0.85);
            border: 2px solid #666;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 99999 !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.2s;
        }
        .floating-btn:hover, .floating-btn:active {
            background: rgba(60, 60, 100, 1);
            transform: scale(0.95);
            border-color: #ffd700;
        }
    </style>
</head>
<body>

<div id="app-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="absolute top-0 left-0 w-full h-6 bg-gray-900 border-b border-gray-600 z-20">
            <div id="xpBar" class="h-full bg-gradient-to-r from-blue-600 to-purple-600 w-0 transition-all duration-200"></div>
            <div class="absolute top-0 left-0 w-full h-full flex items-center justify-center text-sm font-bold text-white z-30" style="line-height: 24px;">
                LEVEL <span id="levelVal" class="ml-1 text-yellow-300">1</span>
            </div>
        </div>

        <div class="absolute top-8 left-3 flex flex-col gap-1 items-start select-none pointer-events-none z-20">

    </div>

    <div id="start-screen" class="px-4">

                킹수학.com
            </a>
            
            <button id="langTriggerBtn" class="flex items-center gap-1.5 bg-gray-800/80 hover:bg-gray-700 border border-yellow-400/50 rounded-lg px-2.5 py-1 transition-all duration-200 text-xs font-bold shadow-lg text-yellow-400">
                <i class="fa-solid fa-globe text-yellow-500/80"></i>
                <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR" class="w-4 h-auto rounded-[2px] shadow-sm ml-0.5">
                <span id="currentLangName" class="hidden sm:inline-block">한국어</span>
                <i class="fa-solid fa-chevron-down text-yellow-500/80 text-[10px]"></i>
            </button>
        </div>

        <div class="flex flex-col items-center mb-4 shrink-0 mt-8">
            <h1 class="text-4xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500 font-black mb-1 hud-text drop-shadow-lg dynamic-text w-full max-w-[320px]" style="-webkit-text-stroke: 1px white;" data-i18n="gameTitle">
                킹수학 디펜스 모바일
            </h1>
            <p class="text-gray-300 text-sm font-bold mb-2 break-keep dynamic-text w-full px-2" data-i18n="subtitle">
                규칙을 찾아 최고 점수를 기록하세요
            </p>
            <div id="qrcode" class="transform scale-75 origin-center"></div>
        </div>

        <div class="flex flex-col gap-2 w-full max-w-xs mb-4 shrink-0">
            <input type="text" id="startNickname" placeholder="닉네임" maxlength="8"
                   class="w-full px-3 py-2 rounded-lg text-black text-lg font-bold text-center outline-none border-2 border-gray-400 focus:border-yellow-400 bg-gray-100 placeholder-gray-500 shadow-md">
            
            <button id="startBtn" class="w-full px-6 py-3 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded-lg text-xl shadow-lg border-2 border-yellow-300 transition-transform active:scale-95 dynamic-text">
                <span data-i18n="startBtn">게임 시작!</span>
            </button>
            
            <a href="/" target="_self" class="w-full text-center py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg text-base shadow-md border border-gray-500 transition-colors mt-1 no-underline dynamic-text">
                <span data-i18n="otherGame">🎮 다른 게임 고르기</span>
            </a>
        </div>

        <div class="w-full flex flex-col flex-none min-h-[200px] bg-gray-800/80 rounded-t-lg border-x-2 border-t-2 border-gray-600 overflow-hidden shadow-2xl mb-8">
            <div class="bg-gray-900 text-yellow-400 font-bold p-2 text-sm border-b border-gray-600 flex justify-between items-center px-4">
                <span>🏆 <span data-i18n="rankingTitle">명예의 전당</span></span>
                <span class="text-xs text-gray-400" data-i18n="recent24">최근 24H</span>
            </div>
            <div id="ranking-list" class="flex-1 p-1 space-y-1">
                <div class="text-center text-gray-500 mt-5 text-sm dynamic-text" data-i18n="loading">로딩 중...</div>
            </div>
        </div>
    </div>

    <div id="levelup-screen" class="hidden absolute top-0 left-0 w-full h-full bg-black/85 z-[90] flex flex-col items-center justify-center p-4">
        <h2 class="text-4xl text-yellow-400 mb-6 font-bold hud-text animate-pulse dynamic-text" data-i18n="levelUp">LEVEL UP!</h2>
        <div class="text-lg text-white mb-2 font-bold dynamic-text" data-i18n="selectAbility">능력을 선택하세요</div>
        <div id="cards-container" class="card-container" style="display: flex;"></div>
    </div>

    <div id="game-over-screen" class="hidden px-4">
        <h2 class="text-6xl text-gray-400 font-bold mb-4 hud-text dynamic-text" data-i18n="defeat">패배...</h2>
        <p class="text-2xl text-white mb-2 font-bold dynamic-text"><span data-i18n="finalScore">최종 점수</span></p>
        <p class="text-4xl text-yellow-400 font-black mb-6" id="finalScore">0</p>
        
        <div id="auto-save-msg" class="text-lg font-bold mb-8 h-6 flex items-center justify-center">
            <span class="text-gray-400 dynamic-text" data-i18n="saving">저장 중...</span>
        </div>

        <button id="restartBtn" class="hidden px-8 py-4 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded-xl text-2xl shadow-lg border-2 border-gray-400 active:scale-95 dynamic-text">
            <span data-i18n="retry">다시 도전</span>
        </button>
    </div>
</div>

<div id="btn-home" class="floating-btn" style="font-family:'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;">🏠</div>

<div id="langModal" class="lang-modal-overlay fixed inset-0 z-[99999] flex items-start sm:items-center justify-center bg-black/60 backdrop-blur-sm pt-16 sm:pt-0 px-4">
    <div class="lang-modal-content bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden">

                    <span>Language / 언어</span>

            </div>
            <button id="closeModalBtn" class="w-10 h-10 rounded-full bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-gray-400 hover:text-white transition-colors border-0 cursor-pointer">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="p-5 pb-2 bg-gray-900">
            <div class="relative flex items-center">

            <div id="languageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                </div>
            <div id="noResult" class="hidden flex-col items-center justify-center py-12 text-gray-500">
                <i class="fa-regular fa-face-frown-open text-4xl mb-3"></i>
                <p class="m-0">No results / 검색 결과 없음</p>
            </div>
        </div>
    </div>
</div>

<div id="toastNotification" class="lang-toast fixed bottom-6 right-6 bg-gray-800 border border-gray-700 shadow-lg rounded-xl p-4 flex items-center gap-3 z-[99999]">
    <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center text-green-400 shrink-0">
        <i class="fa-solid fa-check"></i>
    </div>
    <div class="flex flex-col justify-center">

        <p id="toastLangName" class="text-xs text-gray-400 m-0 p-0 mt-0.5">Korean</p>
    </div>
</div>

let currentLang = 'ko';

// 글자 수에 따른 폰트 사이즈 동적 조절 함수
function adjustFontSize() {
    document.querySelectorAll('.dynamic-text').forEach(el => {
        el.style.fontSize = ''; // 초기화
        let computedStyle = window.getComputedStyle(el);
        let fontSize = parseFloat(computedStyle.fontSize);
        // 컨테이너 폭을 초과하면 폰트를 줄임
        while (el.scrollWidth > el.clientWidth && fontSize > 10) {
            fontSize -= 0.5;
            el.style.fontSize = fontSize + 'px';
        }
    });
}

// 1. URL 파라미터, 2. localStorage, 3. 브라우저 언어 순으로 언어 감지
function getInitialLanguage() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlLang = urlParams.get('lang');
    if (urlLang && i18nData[urlLang]) return urlLang;

    const savedLang = localStorage.getItem('kingsmath_lang');
    if (savedLang && i18nData[savedLang]) return savedLang;

    const browserLangFull = navigator.language.toLowerCase();
    const browserLangShort = browserLangFull.split('-')[0];
    if (i18nData[browserLangFull]) return browserLangFull; // 예: pt-br
    if (i18nData[browserLangShort]) return browserLangShort;

    return 'en'; // 기본값 영어
}

function setLanguage(lang) {
    currentLang = lang;
    const data = i18nData[lang] || i18nData['en'];
    
    // 상태 유지 및 URL 업데이트
    localStorage.setItem('kingsmath_lang', lang);
    const newUrl = new URL(window.location);
    newUrl.searchParams.set('lang', lang);
    window.history.pushState({}, '', newUrl);

    // 폰트 변수 설정 (한국어만 Jua, 나머지는 기본 고딕)
    if(lang === 'ko') {
        document.documentElement.style.setProperty('--game-font', "'Jua', sans-serif");
    } else {
        document.documentElement.style.setProperty('--game-font', "sans-serif");
    }

    // 데이터 바인딩
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (data[key]) {
            if(el.tagName === 'SPAN' || el.tagName === 'DIV' || el.tagName === 'P' || el.tagName === 'H1' || el.tagName === 'H2' || el.tagName === 'A') {
                el.innerText = data[key];
            }
        }
    });
    
    // 플레이스홀더 등 예외 속성
    const nickInput = document.getElementById('startNickname');
    if(nickInput && data.nickPlaceholder) nickInput.placeholder = data.nickPlaceholder;

    // 좌측 상단 도메인 링크 텍스트 교체 및 속성 강제 (새창 방지)
    const homeLink = document.getElementById('homeLink');
    if(homeLink && data.homeLinkText) {
        homeLink.innerText = data.homeLinkText;
        homeLink.href = "/";
        homeLink.target = "_self";
    }

    // 다국어 SEO 반영
    document.getElementById('meta-title').innerText = data.gameTitle;
    if(document.getElementById('meta-desc') && data.seoDesc) document.getElementById('meta-desc').content = data.seoDesc;
    if(document.getElementById('meta-keywords') && data.seoKeywords) document.getElementById('meta-keywords').content = data.seoKeywords;

    // 상단 트리거 버튼 UI 동기화
    const langInfo = languagesList.find(l => l.code === lang) || languagesList[1];
    document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langInfo.country}.png`;
    document.getElementById('currentLangName').textContent = langInfo.name;

    updateUi();
    
    // 폰트 크기 동적 조절 (DOM 반영 후 실행)
    setTimeout(adjustFontSize, 50);
}

const triggerBtn = document.getElementById('langTriggerBtn');
const modal = document.getElementById('langModal');
const closeBtn = document.getElementById('closeModalBtn');
const searchInput = document.getElementById('searchInput');
const grid = document.getElementById('languageGrid');
const noResult = document.getElementById('noResult');
const toast = document.getElementById('toastNotification');
let toastTimeout;

function renderLanguages(filterText = '') {
    grid.innerHTML = '';
    const lowerFilter = filterText.toLowerCase();
    const filteredLangs = languagesList.filter(l => 
        l.name.toLowerCase().includes(lowerFilter) || 
        l.enName.toLowerCase().includes(lowerFilter) ||
        l.code.toLowerCase().includes(lowerFilter)
    );

    if (filteredLangs.length === 0) {
        grid.classList.add('hidden');
        noResult.classList.remove('hidden');
        noResult.classList.add('flex');
    } else {
        grid.classList.remove('hidden');
        noResult.classList.add('hidden');
        noResult.classList.remove('flex');

        filteredLangs.forEach(lang => {
            const isSelected = lang.code === currentLang;
            const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
            const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
            const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

            const btn = document.createElement('div');
            btn.className = `${baseClasses} ${stateClasses}`;
            btn.innerHTML = `
                <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                    <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                </div>
                <div class="flex-1 min-w-0 flex flex-col items-start m-0 p-0">
                    <span class="text-sm font-medium truncate w-full m-0 p-0 ${isSelected ? 'text-yellow-400' : 'text-white'}">${lang.name}</span>
                    <span class="text-xs text-gray-400 truncate w-full m-0 p-0">${lang.enName}</span>
                </div>
                ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
            `;
            btn.addEventListener('click', () => selectLanguage(lang));
            grid.appendChild(btn);
        });
    }
}

function selectLanguage(lang) {
    setLanguage(lang.code);
    closeModal();
    showToast(lang.name, lang.code);
    renderLanguages(searchInput.value);
}

function openModal() {
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    setTimeout(() => searchInput.focus(), 100);
}

function closeModal() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
}

function showToast(langName, langCode) {
    const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
    document.getElementById('ui-toast').textContent = toastMsg;
    document.getElementById('toastLangName').textContent = langName;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

triggerBtn.addEventListener('click', openModal);
closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });

let playerNickname = ""; let isScoreSaved = false; let gameState = 'START'; let frameId;

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'shoot') { osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
    else if (type === 'hit') { osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.05); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
    else if (type === 'explode') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
    else if (type === 'levelup') { osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.linearRampToValueAtTime(880, now + 0.3); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
}

function resize() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
window.addEventListener('resize', resize); resize();

function updateInputCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
    mouse.x = (clientX - rect.left) * scaleX; mouse.y = (clientY - rect.top) * scaleY;
}

function handleInput(e) {
    if (gameState === 'START') return; 
    if (e.target.closest('.card') || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'A') return;
    if (Date.now() < inputLockUntil) return;
    if (gameState === 'PLAYING') {
        e.preventDefault();
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } else { clientX = e.clientX; clientY = e.clientY; }
        updateInputCoords(clientX, clientY);
    }
}
window.addEventListener('touchstart', handleInput, { passive: false }); window.addEventListener('touchmove', handleInput, { passive: false });
window.addEventListener('mousemove', (e) => { if (Date.now() < inputLockUntil) return; if (gameState === 'PLAYING') updateInputCoords(e.clientX, e.clientY); });

function randomRange(min, max) { return Math.random() * (max - min) + min; }
function getDistance(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

class Bullet {
    constructor(x, y, angle, damage) { this.x = x; this.y = y; this.speed = 10; this.vx = Math.cos(angle) * this.speed; this.vy = Math.sin(angle) * this.speed; this.damage = damage; this.radius = 4; this.life = 80; this.color = '#ffff00'; }
    update() { this.x += this.vx; this.y += this.vy; this.life--; }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); }
}
class Enemy {
    constructor() {
        if (Math.random() < 0.5) { this.x = Math.random() < 0.5 ? -30 : canvas.width + 30; this.y = Math.random() * canvas.height; } else { this.x = Math.random() * canvas.width; this.y = Math.random() < 0.5 ? -30 : canvas.height + 30; }
        let hpMin = 3 + level * 2; let hpMax = 8 + level * 5; this.hp = Math.floor(randomRange(hpMin, hpMax)); this.maxHp = this.hp;
        let baseSpeed = randomRange(0.5, 1.2); this.speed = baseSpeed + (level * 0.05);
        let baseR = 15 + (this.hp * 0.8); if (baseR > 40) baseR = 40; this.radius = baseR; 
        this.sides = Math.floor(randomRange(3, 7)); this.angle = 0; this.spinSpeed = randomRange(-0.03, 0.03); this.color = `hsl(${this.hp * 25}, 70%, 50%)`;
    }
    update() { const angle = Math.atan2(player.y - this.y, player.x - this.x); this.x += Math.cos(angle) * this.speed; this.y += Math.sin(angle) * this.speed; this.angle += this.spinSpeed; }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.beginPath();
        for (let i = 0; i < this.sides; i++) { const rot = (i * 2 * Math.PI) / this.sides; const px = Math.cos(rot) * this.radius; const py = Math.sin(rot) * this.radius; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
        ctx.closePath(); ctx.fillStyle = 'rgba(0, 0, 0, 0.9)'; ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.fill(); ctx.stroke(); ctx.restore();
        // 캔버스 폰트는 var(--game-font)를 자바스크립트에서 읽기 어려우므로 동적으로 바인딩
        let cf = currentLang === 'ko' ? "'Jua', sans-serif" : "sans-serif";
        ctx.font = `bold ${this.radius}px ${cf}`; 
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = 'black'; ctx.strokeText(Math.ceil(this.hp), this.x, this.y); ctx.fillStyle = '#fff'; ctx.fillText(Math.ceil(this.hp), this.x, this.y);
    }
}
class Particle {
    constructor(x, y, color) { this.x = x; this.y = y; this.vx = randomRange(-4, 4); this.vy = randomRange(-4, 4); this.life = randomRange(10, 25); this.color = color; this.size = randomRange(1, 3); }
    update() { this.x += this.vx; this.y += this.vy; this.life--; this.size *= 0.9; }
    draw() { ctx.globalAlpha = this.life / 25; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1; }
}
class FloatingText {
    constructor(x, y, text, color, size = 16) { this.x = x; this.y = y; this.text = text; this.color = color; this.life = 30; this.vy = -2; this.size = size * 0.8; }
    update() { this.y += this.vy; this.life--; }
    draw() {
        let cf = currentLang === 'ko' ? "'Jua', sans-serif" : "sans-serif";
        ctx.globalAlpha = this.life / 30; ctx.fillStyle = this.color; ctx.strokeStyle = 'black'; ctx.lineWidth = 2;
        ctx.font = `bold ${this.size}px ${cf}`; ctx.strokeText(this.text, this.x, this.y); ctx.fillText(this.text, this.x, this.y); ctx.globalAlpha = 1;
    }
}
class XpOrb {
    constructor(x, y, val) { this.x = x; this.y = y; this.val = val; this.radius = 4; this.attracted = false; }
    update() {
        const d = getDistance(this.x, this.y, player.x, player.y); if (d < 120) this.attracted = true;
        if (this.attracted) { const angle = Math.atan2(player.y - this.y, player.x - this.x); this.x += Math.cos(angle) * 8; this.y += Math.sin(angle) * 8; }
        return d < player.radius + 10;
    }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle = '#00ff00'; ctx.fill(); }
}

function init() {
    score = 0; level = 1; xp = 0; xpToNextLevel = 10; gameTime = 0; player.x = canvas.width / 2; player.y = canvas.height / 2; player.damage = 1; player.projectiles = 1; player.fireRate = 10; player.radius = player.baseRadius;
    player.bonuses = { two: 0, three: 0, five: 0, triangle: 0, square: 0, pentagon: 0, divisors: { 12: 0, 24: 0, 48: 0, 96: 0 } }; player.critChance = 0; 
    bullets = []; enemies = []; particles = []; damageTexts = []; xpOrbs = []; isScoreSaved = false; updateUi();
}

function updateUi() {
    document.getElementById('scoreVal').innerText = score; document.getElementById('dmgVal').innerText = player.damage; document.getElementById('levelVal').innerText = level;
    const statsContainer = document.getElementById('bonusStats'); statsContainer.innerHTML = '';
    const addStat = (text, color) => { const div = document.createElement('div'); div.innerText = text; div.className = color; statsContainer.appendChild(div); };
    if (player.critChance > 0) addStat(`2배 공격 확률 ${Math.floor(player.critChance * 100)}%`, "text-yellow-400");
    if (player.bonuses.two > 0) addStat(`2의 배수 +${Math.round(player.bonuses.two * 100)}%`, "text-white");
    if (player.bonuses.three > 0) addStat(`3의 배수 +${Math.round(player.bonuses.three * 100)}%`, "text-green-400");
    if (player.bonuses.five > 0) addStat(`5의 배수 +${Math.round(player.bonuses.five * 100)}%`, "text-purple-400");
    [12, 24, 48, 96].forEach(num => { if (player.bonuses.divisors[num] > 0) { addStat(`${num}의 약수 +${Math.round(player.bonuses.divisors[num] * 100)}%`, "text-pink-400"); } });
    if (player.bonuses.triangle > 0) addStat(`🔺 +${Math.round(player.bonuses.triangle * 100)}%`, "text-red-400");
    if (player.bonuses.square > 0) addStat(`🟥 +${Math.round(player.bonuses.square * 100)}%`, "text-blue-400");
    if (player.bonuses.pentagon > 0) addStat(`⬠ +${Math.round(player.bonuses.pentagon * 100)}%`, "text-orange-400");
    updateXpBar();
}

function spawnEnemy() { const spawnRate = Math.max(15, 70 - (level * 3) - Math.floor(gameTime / 300)); if (gameTime % spawnRate === 0) enemies.push(new Enemy()); }
function findNearestEnemy() { let nearest = null; let minDist = Infinity; for (const e of enemies) { const d = getDistance(player.x, player.y, e.x, e.y); if (d < minDist && d < 400) { minDist = d; nearest = e; } } return nearest; }
function levelUp() {
    gameState = 'LEVELUP'; document.getElementById('levelup-screen').classList.remove('hidden'); playSound('levelup');
    const container = document.getElementById('cards-container'); container.innerHTML = '';
    const t = i18nData[currentLang] || i18nData['en'];
    const upgrades = [
        { type: 'add', val: 1, title: t.c_add1_t, desc: t.c_add1_d, math: t.c_add1_m },
        { type: 'add', val: 2, title: t.c_add2_t, desc: t.c_add2_d, math: t.c_add2_m },
        { type: 'mult', val: 1.5, title: t.c_mult_t, desc: t.c_mult_d, math: t.c_mult_m },
        { type: 'proj', val: 1, title: t.c_proj_t, desc: t.c_proj_d, math: t.c_proj_m },
        { type: 'rate', val: 0.85, title: t.c_rate_t, desc: t.c_rate_d, math: t.c_rate_m },
        { type: 'bonus_two', val: 0.5, title: t.c_b2_t, desc: t.c_b2_d, math: t.c_b2_m },
        { type: 'bonus_three', val: 0.5, title: t.c_b3_t, desc: t.c_b3_d, math: t.c_b3_m },
        { type: 'bonus_five', val: 0.5, title: t.c_b5_t, desc: t.c_b5_d, math: t.c_b5_m },
        { type: 'bonus_div', num: 12, val: 1.0, title: t.c_div12_t, desc: t.c_div12_d, math: t.c_div12_m },
        { type: 'bonus_div', num: 24, val: 1.0, title: t.c_div24_t, desc: t.c_div24_d, math: t.c_div24_m },
        { type: 'bonus_div', num: 48, val: 1.0, title: t.c_div48_t, desc: t.c_div48_d, math: t.c_div48_m },
        { type: 'bonus_div', num: 96, val: 1.0, title: t.c_div96_t, desc: t.c_div96_d, math: t.c_div96_m },
        { type: 'bonus_shape', sides: 3, val: 0.5, title: t.c_tri_t, desc: t.c_tri_d, math: t.c_tri_m },
        { type: 'bonus_shape', sides: 4, val: 0.5, title: t.c_squ_t, desc: t.c_squ_d, math: t.c_squ_m },
        { type: 'bonus_shape', sides: 5, val: 0.5, title: t.c_pen_t, desc: t.c_pen_d, math: t.c_pen_m },
        { type: 'crit', val: 0.2, title: t.c_crit_t, desc: t.c_crit_d, math: t.c_crit_m },
    ];
    let picks = [];
    if (level === 2) {
        const mandatories = upgrades.filter(u => (u.type === 'add' && u.val === 2) || u.type === 'proj');
        const guaranteed = mandatories[Math.floor(Math.random() * mandatories.length)]; picks.push(guaranteed);
        const others = upgrades.filter(u => u !== guaranteed); others.sort(() => Math.random() - 0.5); picks.push(...others.slice(0, 2));
    } else { upgrades.sort(() => Math.random() - 0.5); picks = upgrades.slice(0, 3); }
    
    picks.forEach(up => {
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<div class="card-content"><div class="card-title">${up.title}</div><div class="card-desc dynamic-text">${up.desc}</div></div><div class="card-math">${up.math}</div>`;
        card.onclick = (e) => { e.stopPropagation(); applyUpgrade(up); }; container.appendChild(card);
    });
    setTimeout(adjustFontSize, 50);
}

function applyUpgrade(up) {
    if (up.type === 'add') player.damage += up.val; else if (up.type === 'mult') player.damage = Math.floor(player.damage * up.val) || 1;
    else if (up.type === 'proj') player.projectiles += up.val; else if (up.type === 'rate') player.fireRate = Math.max(5, Math.floor(player.fireRate * up.val));
    else if (up.type === 'bonus_two') player.bonuses.two += up.val; else if (up.type === 'bonus_three') player.bonuses.three += up.val; else if (up.type === 'bonus_five') player.bonuses.five += up.val;
    else if (up.type === 'bonus_div') { if (player.bonuses.divisors[up.num] !== undefined) { player.bonuses.divisors[up.num] += up.val; } }
    else if (up.type === 'crit') player.critChance = Math.min(1.0, player.critChance + up.val);
    else if (up.type === 'bonus_shape') { if (up.sides === 3) player.bonuses.triangle += up.val; else if (up.sides === 4) player.bonuses.square += up.val; else if (up.sides >= 5) player.bonuses.pentagon += up.val; }
    updateUi(); inputLockUntil = Date.now() + 500; gameState = 'PLAYING'; document.getElementById('levelup-screen').classList.add('hidden'); requestAnimationFrame(loop);
}

function addXp(amount) { xp += amount; if (xp >= xpToNextLevel) { xp = 0; xpToNextLevel = Math.floor(xpToNextLevel * 1.3); level++; player.radius = Math.min(30, player.radius + 1); levelUp(); } updateXpBar(); }
function updateXpBar() { const pct = (xp / xpToNextLevel) * 100; document.getElementById('xpBar').style.width = `${pct}%`; }

function update() {
    if (gameState !== 'PLAYING') return; gameTime++;
    if (Date.now() >= inputLockUntil) { const dx = mouse.x - player.x; const dy = mouse.y - player.y; if (Math.hypot(dx, dy) > 5) { player.x += dx * 0.08; player.y += dy * 0.08; } player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x)); player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y)); }
    player.fireTimer++;
    if (player.fireTimer >= player.fireRate) {
        const target = findNearestEnemy();
        if (target) { player.fireTimer = 0; const angle = Math.atan2(target.y - player.y, target.x - player.x); for(let i=0; i<player.projectiles; i++) { const spread = (i - (player.projectiles-1)/2) * 0.2; bullets.push(new Bullet(player.x, player.y, angle + spread, player.damage)); } playSound('shoot'); }
    }
    spawnEnemy();
    bullets.forEach((b, i) => { b.update(); if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1); });
    enemies.forEach((e, i) => {
        e.update();
        if (getDistance(player.x, player.y, e.x, e.y) < player.radius + e.radius - 5) { gameState = 'GAMEOVER'; document.getElementById('finalScore').innerText = score; document.getElementById('game-over-screen').classList.remove('hidden'); document.getElementById('restartBtn').classList.add('hidden'); playSound('explode'); if (!isScoreSaved) autoSubmitScore(); }
        bullets.forEach((b, bi) => {
            if (getDistance(b.x, b.y, e.x, e.y) < e.radius + b.radius) {
                let finalDmg = b.damage; let isCrit = false; const hpVal = Math.ceil(e.hp);
                if (player.bonuses.two > 0 && hpVal % 2 === 0) { finalDmg *= (1 + player.bonuses.two); isCrit = true; }
                if (player.bonuses.three > 0 && hpVal % 3 === 0) { finalDmg *= (1 + player.bonuses.three); isCrit = true; }
                if (player.bonuses.five > 0 && hpVal % 5 === 0) { finalDmg *= (1 + player.bonuses.five); isCrit = true; }
                if (player.bonuses.divisors[12] > 0 && 12 % hpVal === 0) { finalDmg *= (1 + player.bonuses.divisors[12]); isCrit = true; }
                if (player.bonuses.divisors[24] > 0 && 24 % hpVal === 0) { finalDmg *= (1 + player.bonuses.divisors[24]); isCrit = true; }
                if (player.bonuses.divisors[48] > 0 && 48 % hpVal === 0) { finalDmg *= (1 + player.bonuses.divisors[48]); isCrit = true; }
                if (player.bonuses.divisors[96] > 0 && 96 % hpVal === 0) { finalDmg *= (1 + player.bonuses.divisors[96]); isCrit = true; }
                if (player.bonuses.triangle > 0 && e.sides === 3) { finalDmg *= (1 + player.bonuses.triangle); isCrit = true; }
                if (player.bonuses.square > 0 && e.sides === 4) { finalDmg *= (1 + player.bonuses.square); isCrit = true; }
                if (player.bonuses.pentagon > 0 && e.sides >= 5) { finalDmg *= (1 + player.bonuses.pentagon); isCrit = true; }
                if (Math.random() < player.critChance) { finalDmg *= 2; isCrit = true; damageTexts.push(new FloatingText(e.x, e.y - 20, `2x!`, '#ff5555', 20)); }
                e.hp -= finalDmg; let newR = 15 + (Math.max(0, e.hp) * 0.8); if (newR > 40) newR = 40; e.radius = newR;
                if (isCrit) { damageTexts.push(new FloatingText(e.x, e.y - 10, `-${Math.floor(finalDmg)}`, '#ffcc00', 20)); playSound('hit'); } else { damageTexts.push(new FloatingText(e.x, e.y, `-${Math.floor(finalDmg)}`, '#fff', 14)); playSound('hit'); }
                bullets.splice(bi, 1); for(let k=0; k<2; k++) particles.push(new Particle(b.x, b.y, e.color));
                if (e.hp <= 0) { score += Math.floor(e.maxHp * 10); updateUi(); enemies.splice(i, 1); xpOrbs.push(new XpOrb(e.x, e.y, 1)); for(let k=0; k<8; k++) particles.push(new Particle(e.x, e.y, e.color)); playSound('explode'); }
            }
        });
    });
    xpOrbs.forEach((orb, i) => { if (orb.update()) { addXp(orb.val); xpOrbs.splice(i, 1); } }); particles.forEach((p, i) => { p.update(); if (p.life <= 0) particles.splice(i, 1); }); damageTexts.forEach((t, i) => { t.update(); if (t.life <= 0) damageTexts.splice(i, 1); });
}

function draw() {
    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#151520'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x < canvas.width; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); } for (let y = 0; y < canvas.height; y += 40) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); } ctx.stroke();
    ctx.globalCompositeOperation = 'lighter'; xpOrbs.forEach(orb => orb.draw()); bullets.forEach(b => b.draw()); enemies.forEach(e => e.draw()); particles.forEach(p => p.draw());
    ctx.save(); ctx.translate(player.x, player.y); ctx.shadowBlur = 15; ctx.shadowColor = '#FFD700'; ctx.font = `${player.radius * 2}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👑', 0, 0); ctx.restore();
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = 'white'; 
    let cf = currentLang === 'ko' ? "'Jua', sans-serif" : "sans-serif";
    ctx.font = `bold 11px ${cf}`; ctx.textAlign = 'center'; ctx.fillText(Math.floor(player.damage), player.x, player.y - player.radius - 5); damageTexts.forEach(t => t.draw());
}

function loop() { if (gameState === 'PLAYING') { update(); draw(); frameId = requestAnimationFrame(loop); } else if (gameState === 'LEVELUP') draw(); }

document.getElementById('startBtn').addEventListener('click', () => {
    const nameInput = document.getElementById('startNickname'); const name = nameInput.value.trim(); if (name.length < 1) { alert("닉네임!"); nameInput.focus(); return; }
    localStorage.setItem('kingMathNickname', name); playerNickname = name;
    document.getElementById('start-screen').classList.add('hidden'); if (audioCtx.state === 'suspended') audioCtx.resume();
    gameState = 'PLAYING'; init(); player.x = canvas.width / 2; player.y = canvas.height * 0.8; loop();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('game-over-screen').classList.add('hidden'); loadRankings(); document.getElementById('start-screen').classList.remove('hidden');
});

const rankingList = document.getElementById('ranking-list');
async function loadRankings() {
    const t = i18nData[currentLang] || i18nData['en'];
    rankingList.innerHTML = `<div class="text-center text-gray-500 mt-5 text-sm">${t.loading}</div>`;
    try {
        const res = await fetch('ranking.php?action=list'); if(!res.ok) throw new Error('Network error'); const data = await res.json(); rankingList.innerHTML = '';
        if (data.length === 0) { rankingList.innerHTML = `<div class="text-center text-gray-500 mt-5 text-sm">${t.noRank}</div>`; return; }
        data.forEach((item, index) => {
            const rank = index + 1; let color = 'text-gray-300'; if(rank===1) color = 'text-yellow-400'; else if(rank===2) color = 'text-gray-200'; else if(rank===3) color = 'text-orange-400';
            const div = document.createElement('div'); div.className = `flex items-center px-2 py-1 text-xs md:text-sm border-b border-gray-700 ${rank<=3 ? 'bg-gray-700/30' : ''}`;
            div.innerHTML = `<div class="w-6 text-center font-bold ${color}">${rank}</div><div class="flex-1 truncate text-white px-2">${item.nickname}</div><div class="w-16 text-right text-yellow-500 font-mono">${item.score}</div>`; rankingList.appendChild(div);
        });
    } catch (e) { rankingList.innerHTML = '<div class="text-center text-gray-600 mt-5 text-xs">Offline</div>'; }
}

async function autoSubmitScore() {
    const t = i18nData[currentLang] || i18nData['en']; isScoreSaved = true; const msgDiv = document.getElementById('auto-save-msg'); const restartBtn = document.getElementById('restartBtn'); msgDiv.innerHTML = `<span class="text-blue-400 animate-pulse">${t.saving}</span>`;
    try {
        const formData = new FormData(); formData.append('action', 'submit'); formData.append('nickname', playerNickname); formData.append('score', score);
        const res = await fetch('ranking.php', { method: 'POST', body: formData }); const data = await res.json();
        if (data.status === 'success') msgDiv.innerHTML = `<span class="text-green-400 text-sm">${t.saved} <span class="text-yellow-300 text-xl mx-1">${data.rank}</span></span>`;
        else if (data.message === 'bad_word') msgDiv.innerHTML = `<span class="text-red-400 text-sm">${t.badWord}</span>`; else msgDiv.innerHTML = `<span class="text-red-400 text-sm">${t.saveFail}</span>`;
    } catch (e) { msgDiv.innerHTML = '<span class="text-gray-500 text-sm">Offline Mode</span>'; } finally { restartBtn.classList.remove('hidden'); }
}
