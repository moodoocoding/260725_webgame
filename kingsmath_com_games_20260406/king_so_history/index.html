<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

body { font-family: 'Jua', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: normal; }

i[class^="fa-"], i[class*=" fa-"] {
    font-family: "Font Awesome 6 Free" !important;
    font-weight: 900 !important;
}

:root {
    --bg: #121212;
    --panel-bg: #1e1e2e;
    --dark: #e0e0e0;
    --text-muted: #a0a0a0;
    --border-color: #333333;

    --dog-color: #332b00;
    --cat-color: #1e1b2e;
    --rabbit-color: #2e151a;
    --hamster-color: #2e1e0f;
    --panda-color: #0f2e26;
    --monkey-color: #221826;

    --correct: #69db7c;
    --wrong: #ff6b6b;
    --eliminated: #333333;
}

body {
    margin: 0; background: var(--bg); color: var(--dark); overflow: hidden;
    user-select: none; -webkit-user-select: none; 
    touch-action: none; 
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    transition: background 0.3s, color 0.3s;
}

/* UI 모달 및 언어 선택 전용 CSS */
#langModal, #langModal *, #historyModal, #historyModal *, #langTriggerContainer, #langTriggerContainer *, #toastNotification, #toastNotification * {
    box-sizing: border-box !important;
}

.lang-ui-text, .break-keep {
    font-family: 'Noto Sans KR', sans-serif !important;
    word-break: keep-all !important;
}

.custom-scrollbar::-webkit-scrollbar { width: 8px; }
.custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

.modal-overlay {
    opacity: 0; visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-content {
    transform: scale(0.95) translateY(-10px); opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

.toast-anim {
    transform: translateY(100%); opacity: 0;
    transition: all 0.3s ease;
}
.toast-anim.show { transform: translateY(0); opacity: 1; }

.dynamic-text-container {
    display: inline-block;
    white-space: nowrap;
    transition: transform 0.2s;
    transform-origin: left center;
}

/* --- Game UI Components --- */
#overlay {
    position: fixed; inset: 0; background: var(--bg); opacity: 0.98;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; backdrop-filter: blur(15px);
    text-align: center; overflow-y: auto; padding-bottom: 50px;
}

.title-area { margin: 30px 0 20px 0; }
#msgTitle { font-size: 3.5rem; color: #ffcb05; -webkit-text-stroke: 1px #3b4cca; margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: normal; line-height: 1.2; padding: 0 10px; transition: font-size 0.3s;}
.subtitle { color: var(--text-muted); font-size: 1.2rem; margin-top: 10px; font-weight: normal; }
.top-link { color: #ffcb05; text-decoration: none; font-weight: normal; }

#setupArea { width: 500px; max-width: 95vw; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.setup-group { text-align: left; }
.setup-label { font-size: 1.3rem; color: var(--dark); margin-bottom: 8px; display: block; font-weight: normal; }

.custom-select {
    width: 100%; font-family: inherit; font-size: 1.2rem; padding: 15px;
    border-radius: 15px; border: 2px solid var(--border-color);
    background: var(--panel-bg); color: var(--dark); outline: none;
    cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: normal;
}

.btn-large {
    font-size: 2rem; padding: 15px 0; border-radius: 50px; border: none;
    background: #e3350d; color: white; cursor: pointer;
    box-shadow: 0 6px 0 #9e2308; transition: 0.1s; font-family: inherit;
    width: 100%; font-weight: normal; overflow: hidden;
}
.btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 #9e2308; }

/* 작고 귀여운 버튼 스타일 추가 */
.btn-cute {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1.1rem;
    padding: 10px 20px;
    border-radius: 30px;
    background: #ffcb05; /* 귀여운 노란색 */
    color: #3b4cca; /* 진한 파란색 텍스트 */
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 0 #d9aa00; /* 입체감 */
    transition: 0.1s;
    font-family: inherit;
    font-weight: bold;
    margin: 0 auto;
}
.btn-cute:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #d9aa00;
}
.btn-cute i {
    font-size: 1.2rem;
    color: #e3350d; /* 포인트 레드 아이콘 */
}

#otherGameLink { display: block; margin-top: 10px; color: var(--text-muted); text-decoration: underline; font-size: 1.1rem; }

.side-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    font-size: 2.1rem; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; color: #fff; text-decoration: none;
    transition: 0.2s; -webkit-tap-highlight-color: transparent;
}
.side-btn:active { transform: translateY(-50%) scale(0.9); background: rgba(0,0,0,0.8); }
.left-btn { left: 20px; } 
.right-btn { right: 20px; } 

@media (max-width: 768px) {
    .side-btn { width: 45px; height: 45px; font-size: 1.5rem; }
    .left-btn { left: 10px; }
    .right-btn { right: 10px; }
}

/* --- Game Screen Structure --- */
#topZone { position: relative; display: flex; flex-direction: column; z-index: 10; }
#header { height: 100px; background: var(--panel-bg); display: flex; align-items: center; justify-content: center; padding: 0 20px; border-bottom: 2px solid var(--border-color); position: relative; }
.header-title { font-size: 2rem; color: var(--dark); display: flex; align-items: center; gap: 10px; position: absolute; left: 90px; font-weight: normal; }
.timer-box { font-size: 4rem; font-weight: normal; color: #ff6b6b; background: rgba(0,0,0,0.1); padding: 5px 30px; border-radius: 20px; min-width: 120px; text-align: center; }
.timer-urgent { color: #fff; background: #ff6b6b; animation: pulse 0.5s infinite; }

#mainQuestionBoard { background: var(--panel-bg); padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; flex-grow: 1; position: relative; }
#qNumber { font-size: 1.5rem; color: var(--text-muted); margin-bottom: 10px; font-weight: normal; }
#bigQuestion { font-size: clamp(2rem, 5vw, 3.5rem); color: var(--dark); line-height: 1.3; font-family: 'Noto Sans KR', sans-serif; font-weight: bold; width: 100%; max-width: 1200px; }

/* Result Popup */
#resultPopup { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30, 30, 46, 0.98); backdrop-filter: blur(10px); z-index: 100; flex-direction: column; align-items: center; justify-content: center; border-bottom: 4px solid var(--border-color); }
#resultTitle { font-size: 3rem; margin: 0 0 20px 0; color: var(--dark); font-weight: normal; text-align: center; white-space: pre-line; }
.result-list { list-style: none; padding: 0; margin: 0; width: 80%; max-width: 600px; max-height: 60%; overflow-y: auto; }
.result-item { display: flex; justify-content: space-between; padding: 15px; background: rgba(128,128,128,0.1); margin-bottom: 8px; border-radius: 12px; font-size: 1.5rem; color: var(--dark); border: 1px solid var(--border-color); font-weight: normal; }
.rank-1 { background: #ffd43b; color: #000; font-weight: normal; border: none; }

/* Player Arena */
#arena { display: flex; flex: 1; width: 100vw; overflow: hidden; background: var(--bg); }
.player-col { flex: 1; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 10px 5px; position: relative; transition: opacity 0.3s; }
.player-col:last-child { border-right: none; }
.player-col.eliminated { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }

.p-header { text-align: center; margin-bottom: 5px; width: 100%; flex-shrink: 0;}
.p-emoji { font-size: 3rem; display: block; }
.p-name { font-size: 1.8rem; white-space: nowrap; font-weight: normal; margin-top: 5px; }
.p-score { font-size: 1.4rem; color: #ffd43b; font-weight: normal; margin-top: 2px; display: block; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 320px; flex: 1; align-content: center; padding-bottom: 10px; }

/* === 선택지 폰트 60% 축소 === */
.choice-btn { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; color: var(--dark); font-size: 0.6rem; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,0.1); transition: 0.1s; padding: 8px 6px; min-height: 60px; font-weight: 500; overflow: hidden; text-align: center; flex-direction: column; word-break: keep-all; line-height: 1.3; }
.choice-btn:active { transform: translateY(2px); box-shadow: none; }
.choice-btn.selected { background: #3b4cca; color: white; border-color: #2a3899; }
.choice-btn.correct { background: var(--correct); color: #fff; border-color: #40c057; animation: bounce 0.5s; }
.choice-btn.wrong { background: var(--wrong); color: #fff; border-color: #fa5252; opacity: 0.5; }

/* Feedback Overlay */
.feedback-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; flex-direction: column; font-size: 5rem; z-index: 20; border-radius: 0; }
.feedback-overlay.secret { background: #000000 !important; opacity: 1; display: flex; color: white; transition: none; animation: none; }
.feedback-overlay.show-result { display: flex; animation: none; }
.submitted-text { font-size: 1.5rem; margin-top: 15px; color: #fff; text-align: center; line-height: 1.5; font-weight: normal; }
.final-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; box-sizing: border-box; background: rgba(0,0,0,0.85); padding: 15px 10px; border-radius: 15px; text-align: center; z-index: 50; border: 2px solid #fff; display: none; animation: popIn 0.5s; word-break: keep-all; overflow-wrap: break-word; }
.final-status h3 { margin: 0; font-size: 1.2rem; color: #fff; font-weight: normal; }
.final-status p { margin: 5px 0 0 0; font-size: 1.8rem; color: #ffd43b; font-weight: normal; line-height: 1.2;}

/* Countdown */
#countdownLayer { position: fixed; inset: 0; background: #000000; z-index: 2000; display: none; align-items: center; justify-content: center; }
#countdownText { font-size: 25rem; color: #ffec99; text-shadow: 0 0 50px rgba(255, 212, 59, 0.8); font-weight: normal; opacity: 0; }
@keyframes countPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.0); opacity: 0; } }
.count-animate { animation: countPop 0.8s ease-in-out forwards; }

@keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

/* 1920x1080 & Large Screen Optimization */
@media (min-width: 1600px) {
    #header { height: 140px; } .header-title { font-size: 3rem; left: 110px; } .timer-box { font-size: 6rem; padding: 10px 50px; } #mainQuestionBoard { min-height: 350px; padding: 30px; } #qNumber { font-size: 2rem; margin-bottom: 20px; } 
    .p-emoji { font-size: 4rem; } .p-name { font-size: 2.2rem; } .p-score { font-size: 2rem; } .choice-grid { max-width: 450px; gap: 15px; } 
    .choice-btn { font-size: 0.78rem; min-height: 80px; border-radius: 15px; border-width: 2px; } 
    #resultTitle { font-size: 4rem; margin-bottom: 40px; } .result-item { font-size: 1.5rem; padding: 9px; } .btn-large { font-size: 2.5rem; padding: 20px 0; } #msgTitle { font-size: 5rem; } .setup-label { font-size: 1.8rem; } .custom-select { font-size: 1.5rem; padding: 20px; }
    .btn-cute { font-size: 1.4rem; padding: 12px 25px; border-radius: 40px; } .btn-cute i { font-size: 1.5rem; }
}
@media (max-width: 768px) {
    .choice-btn { font-size: 0.5rem; min-height: 45px; padding: 5px; } .header-title span:last-child { display: none; } .p-name { display: none; } .p-score { font-size: 1.1rem; }
}

.bg-dog { background: var(--dog-color); } .bg-cat { background: var(--cat-color); } .bg-rabbit { background: var(--rabbit-color); } .bg-hamster { background: var(--hamster-color); } .bg-panda { background: var(--panda-color); } .bg-monkey { background: var(--monkey-color); }
</style>
</head>

/* =========================================
   역사 인물 모달 생성 함수
   ========================================= */
function openHistoryModal() {
    const modal = document.getElementById('historyModal');
    const content = document.getElementById('historyModalContent');
    
    // 데이터가 아직 안 그려졌을 때만 렌더링
    if (content.innerHTML.trim() === '') {
        const grouped = {};
        historyQuizData.forEach(item => {
            if (!grouped[item.period]) grouped[item.period] = [];
            grouped[item.period].push(item);
        });

        let html = '';
        for (const [period, items] of Object.entries(grouped)) {
            html += `<div class="mb-8">
                <h3 class="text-2xl text-yellow-400 border-b-2 border-gray-700 pb-2 mb-4 font-bold flex items-center gap-2">
                    <i class="fa-solid fa-landmark"></i>${period}
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            
            items.forEach(item => {
                html += `
                    <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700 hover:border-yellow-500/50 transition-colors">
                        <div class="flex items-end gap-2 mb-2">
                            <span class="text-xl font-bold text-white">${item.name}</span>
                            <span class="text-sm text-gray-400">${item.time}</span>
                        </div>
                        <p class="text-gray-300 text-sm break-keep leading-relaxed">${item.description}</p>
                    </div>
                `;
            });
            
            html += `</div></div>`;
        }
        content.innerHTML = html;
    }
    
    modal.classList.add('active');
}

function closeHistoryModal() {
    document.getElementById('historyModal').classList.remove('active');
}

document.getElementById('viewHistoryBtn').addEventListener('click', openHistoryModal);
document.getElementById('closeHistoryModalBtn').addEventListener('click', closeHistoryModal);
document.getElementById('historyModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('historyModal')) closeHistoryModal();
});

/* =========================================
   언어 설정 및 UI 초기화
   ========================================= */
let currentLang = 'ko'; 
function initLanguage() {
    updateUIText(currentLang);
}

function updateUIText(langCode) {
    const txt = STRINGS[langCode] || STRINGS['en'];

    document.getElementById('pageTitle').innerText = txt.pageTitle;
    document.getElementById('pageDesc').setAttribute('content', txt.desc);
    document.getElementById('pageKeywords').setAttribute('content', txt.keywords);
    document.getElementById('domainLink').innerText = txt.domain_txt;
    
    document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.getAttribute('data-lang-key');
        if (txt[key]) el.innerHTML = txt[key];
    });

    const langObj = languagesList.find(l => l.code === langCode);
    if(langObj) {
        document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langObj.country}.png`;
        document.getElementById('currentLangName').innerText = langObj.name;
    }

    document.getElementById('searchInput').placeholder = txt.ui_search;

}

function resizeDynamicTexts() {
    document.querySelectorAll('.dynamic-text-container').forEach(el => {
        el.style.transform = 'scale(1)'; 
        const parent = el.parentElement;
        if (parent && el.scrollWidth > parent.clientWidth) {
            const scale = (parent.clientWidth - 20) / el.scrollWidth;
            el.style.transform = `scale(${Math.max(scale, 0.5)})`;
        }
    });
}
window.addEventListener('resize', resizeDynamicTexts);

const TEAM_DATA = [
    { id: 'dog', icon: '🐶', color: 'bg-dog', key: 'team_dog' },
    { id: 'cat', icon: '🐱', color: 'bg-cat', key: 'team_cat' },
    { id: 'rabbit', icon: '🐰', color: 'bg-rabbit', key: 'team_rabbit' },
    { id: 'hamster', icon: '🐹', color: 'bg-hamster', key: 'team_hamster' },
    { id: 'panda', icon: '🐼', color: 'bg-panda', key: 'team_panda' },
    { id: 'monkey', icon: '🐵', color: 'bg-monkey', key: 'team_monkey' }
];

const state = {
    players: [], mode: 'challenge',
    currentQ: 0, maxQ: 10, timer: 30, timerInterval: null,
    phase: 'setup', problem: null, usedIds: new Set()
};

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const t = audioCtx.currentTime;
    if (type === 'start') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.linearRampToValueAtTime(880, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.5);
    } else if (type === 'count') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'correct') {
        const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, t); osc2.frequency.setValueAtTime(659.25, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.4);
        gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.3, t + 0.1); gain2.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4); osc2.start(t); osc2.stop(t + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'end') {
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
        });
    }
}

function updateSelectOptions() {
    const txt = STRINGS[currentLang] || STRINGS['ko'];
    const modeVal = document.getElementById('gameMode').value;
    const playerVal = document.getElementById('playerCount').value;

    document.getElementById('gameMode').innerHTML = `
        <option value="challenge">${txt.mode_chall}</option>
        <option value="survival">${txt.mode_surv}</option>
    `;
    const playerSelect = document.getElementById('playerCount');
    playerSelect.innerHTML = '';
    for(let i=1; i<=6; i++) {
        const opt = document.createElement('option');
        opt.value = i; opt.innerText = i === 1 ? txt.p_1 : `${i}${txt.p_n}`;
        playerSelect.appendChild(opt);
    }

    if(modeVal) document.getElementById('gameMode').value = modeVal;
    if(playerVal) document.getElementById('playerCount').value = playerVal;
    else document.getElementById('playerCount').value = '6'; 
}

/* =========================================
   역사 문제 생성기 (5가지 유형)
   ========================================= */

function getDistractors(targetIdx, count, conditionFn = null) {
    const total = historyQuizData.length;
    let res = [];
    while(res.length < count) {
        let r = Math.floor(Math.random() * total);
        if (r !== targetIdx && !res.includes(r)) {
            if (!conditionFn || conditionFn(historyQuizData[r])) {
                res.push(r);
            }
        }
    }
    return res.map(i => historyQuizData[i]);
}

async function generateHistoryProblem(qNum) {
    const total = historyQuizData.length;
    if (state.usedIds.size >= total) state.usedIds.clear();

    let tIdx;
    while (true) {
        tIdx = Math.floor(Math.random() * total);
        if (!state.usedIds.has(tIdx)) {
            state.usedIds.add(tIdx);
            break;
        }
    }

    const target = historyQuizData[tIdx];
    
    let qType = Math.floor(Math.random() * 5); 
    let qStr = "", aVal = "", options = [];

    switch(qType) {
        case 0: 
            // 1. 업적 -> 이름 맞추기 (4지선다)
            qStr = `<div class="text-3xl sm:text-5xl text-white break-keep leading-tight">${target.description}</div>`;
            aVal = target.name;
            options = [target, ...getDistractors(tIdx, 3)].map(x => ({ label: x.name, value: x.name }));
            break;
            
        case 1: 
            // 2. 이름 -> 업적 OX 문제
            let isTrue = Math.random() < 0.5;
            let displayDesc = isTrue ? target.description : getDistractors(tIdx, 1)[0].description;
            qStr = `<div class="text-5xl sm:text-6xl text-yellow-400 mb-6">${target.name}</div>
                    <div class="text-2xl sm:text-4xl text-white break-keep bg-gray-800/50 p-6 rounded-xl border border-gray-600">"${displayDesc}"</div>
                    <div class="text-xl text-gray-400 mt-6">(설명이 맞으면 O, 틀리면 X)</div>`;
            aVal = isTrue ? "O" : "X";
            options = [
                { label: "<span class='text-blue-500 text-3xl font-bold'>O</span>", value: "O" },
                { label: "<span class='text-red-500 text-3xl font-bold'>X</span>", value: "X" }
            ];
            break;

        case 2: 
            // 3. 이름 -> 업적 4지선다
            qStr = `<div class="text-5xl sm:text-6xl text-yellow-400 mb-4">${target.name}</div>
                    <div class="text-2xl sm:text-3xl text-white">이 인물의 업적으로 알맞은 것은?</div>`;
            aVal = target.description;
            options = [target, ...getDistractors(tIdx, 3)].map(x => ({ 
                label: x.description, 
                value: x.description 
            }));
            break;

        case 3: 
            // 4. 누구 먼저? (시대 선후 관계)
            let distItem = getDistractors(tIdx, 1)[0];
            let distIdx = historyQuizData.indexOf(distItem);
            
            qStr = `<div class="text-3xl sm:text-5xl text-white break-keep leading-tight mb-4">누가 더 <span class="text-red-400 font-bold">먼저</span> 있었던 인물일까요?</div>`;
            aVal = (tIdx < distIdx) ? target.name : distItem.name;
            
            options = [target, distItem].map(x => ({
                label: `<div class="font-bold text-lg text-yellow-300 mb-1">${x.name}</div><div class="text-xs break-keep opacity-90">${x.description}</div>`,
                value: x.name
            }));
            break;

        case 4: 
            // 5. 시대 -> 해당 시대 인물 선택
            qStr = `<div class="text-4xl sm:text-6xl text-blue-300 font-bold mb-6 border-b-4 border-blue-400 pb-2 inline-block">[ ${target.period} ]</div>
                    <div class="text-3xl sm:text-4xl text-white">이 시대의 인물은 누구일까요?</div>`;
            aVal = target.name;
            let timeDistractors = getDistractors(tIdx, 3, (item) => item.period !== target.period);
            if (timeDistractors.length < 3) {
                timeDistractors = getDistractors(tIdx, 3); 
            }
            options = [target, ...timeDistractors].map(x => ({ label: x.name, value: x.name }));
            break;
    }
    
    if (qType !== 1 && qType !== 3) options.sort(() => Math.random() - 0.5);
    if (qType === 3) options.sort(() => Math.random() - 0.5);
    
    return { q: qStr, aVal: aVal, options: options, type: qType, target: target };
}

/* =========================================
   Game Lifecycle
   ========================================= */
function initGame() {
    initAudio();
    
    if (typeof historyQuizData === 'undefined' || !historyQuizData.length) {
        alert("data.js 파일을 찾을 수 없거나 데이터가 없습니다.\n동일 폴더 내에 historyQuizData 배열이 있는 data.js 파일이 필요합니다.");
        return;
    }

    const pCount = parseInt(document.getElementById('playerCount').value);
    state.mode = document.getElementById('gameMode').value;
    state.currentQ = 0;
    state.players = [];
    state.usedIds.clear();

    const arena = document.getElementById('arena');
    arena.innerHTML = '';
    
    const txt = STRINGS[currentLang] || STRINGS['ko'];

    for(let i=0; i<pCount; i++) {
        let teamInfo = TEAM_DATA[i];
        let localizedName = txt[teamInfo.key]; 
        state.players.push({ id: teamInfo.id, icon: teamInfo.icon, color: teamInfo.color, name: localizedName, score: 0, survived: 0, alive: true, answered: false, selected: null, isGoldenBellWinner: false, rank: 0, answerTime: 0 });
        
        const col = document.createElement('div');
        col.className = `player-col ${state.players[i].color}`;
        col.id = `p-${i}`;
        col.innerHTML = `
            <div class="p-header">
                <span class="p-emoji">${state.players[i].icon}</span>
                <span class="p-name dynamic-font-target">${state.players[i].name}</span>
                <span class="p-score dynamic-font-target" id="p-score-${i}" style="display: ${state.mode === 'challenge' ? 'block' : 'none'};">0 ${txt.score_pt}</span>
            </div>
            <div class="choice-grid" id="p-choices-${i}"></div>
            <div class="feedback-overlay" id="p-fb-${i}"></div>
            <div class="final-status" id="p-final-${i}"></div>
        `;
        arena.appendChild(col);
    }

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('resultPopup').style.display = 'none';
    document.getElementById('langTriggerContainer').style.display = 'none';

    playSound('start');
    nextTurn();
}

async function nextTurn() {
    const aliveCount = state.players.filter(p=>p.alive).length;

    if (state.mode === 'survival' && aliveCount <= 1 && state.players.length > 1) { endGame(); return; }
    if (state.mode === 'survival' && aliveCount === 0) { endGame(); return; }
    if (state.mode === 'challenge' && state.currentQ >= 10) { endGame(); return; }

    if (state.mode === 'survival' && state.currentQ >= 70 && aliveCount > 0) {
        triggerGoldenBellWin();
        return;
    }

    state.currentQ++;
    state.phase = 'loading'; 
    state.players.forEach((p, idx) => {
        if(p.alive) {
            p.answered = false; p.selected = null; p.answerTime = 0;
            const fb = document.getElementById(`p-fb-${idx}`);
            fb.className = 'feedback-overlay'; fb.innerHTML = '';
        }
    });

    const maxQText = state.mode==='challenge' ? '10' : '70';
    const txt = STRINGS[currentLang] || STRINGS['ko'];
    
    document.getElementById('qNumber').innerText = `${txt.q_num} ${state.currentQ} / ${maxQText}`;
    
    document.getElementById('bigQuestion').innerHTML = `<div style="font-size: 2rem; color:#ffcb05; margin-top:20px;">문제를 불러오는 중... <br><i class="fa-solid fa-spinner fa-spin mt-4"></i></div>`;

    state.problem = await generateHistoryProblem(state.currentQ);
    
    state.phase = 'counting';
    document.getElementById('bigQuestion').innerText = txt.ready;
    
    await runCountdown();

    state.phase = 'playing';
    document.getElementById('bigQuestion').innerHTML = state.problem.q;

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const grid = document.getElementById(`p-choices-${idx}`);
        grid.innerHTML = '';
        
        if(state.problem.options.length === 2) {
            grid.style.gridTemplateColumns = "1fr";
        } else {
            grid.style.gridTemplateColumns = "1fr 1fr";
        }

        state.problem.options.forEach(optObj => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerHTML = optObj.label;
            btn.dataset.val = optObj.value;
            btn.onpointerdown = (e) => { e.preventDefault(); handleAnswer(idx, optObj.value, btn); };
            grid.appendChild(btn);
        });
    });
    startTimer();
}

async function runCountdown() {
    const layer = document.getElementById('countdownLayer');
    const txt = document.getElementById('countdownText');
    layer.style.display = 'flex';
    for(let i=3; i>0; i--) {
        txt.innerText = i; 
        txt.classList.remove('count-animate');
        void txt.offsetWidth; 
        txt.classList.add('count-animate');
        playSound('count'); 
        await new Promise(r => setTimeout(r, 1000));
    }
    layer.style.display = 'none';
}

function startTimer() {
    state.timer = 30;
    const tBox = document.getElementById('mainTimer');
    tBox.innerText = 30; tBox.classList.remove('timer-urgent');
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timer--; tBox.innerText = state.timer;
        if(state.timer <= 5) { tBox.classList.add('timer-urgent'); playSound('count'); }
        if(state.timer <= 0) finishRound();
    }, 1000);
}

function handleAnswer(pIdx, val, btnElem) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive) return;

    playSound('click');
    p.answered = true; p.selected = val;
    p.answerTime = state.timer; 
    
    const allBtns = document.getElementById(`p-choices-${pIdx}`).children;
    for(let b of allBtns) b.style.opacity = '0.5';
    btnElem.style.opacity = '1'; btnElem.classList.add('selected');

    const fb = document.getElementById(`p-fb-${pIdx}`);
    const txt = STRINGS[currentLang] || STRINGS['ko'];
    fb.innerHTML = `
        <div style="font-size:3rem; margin-bottom:10px;">🔒</div>
        <div class="submitted-text">${txt.submitted}</div>
    `;
    fb.classList.add('secret'); 
    
    const living = state.players.filter(pl => pl.alive);
    if(living.every(pl => pl.answered)) finishRound();
}

function finishRound() {
    clearInterval(state.timerInterval);
    state.phase = 'result';
    const correctAns = state.problem.aVal;
    let someoneWrong = false;

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const fb = document.getElementById(`p-fb-${idx}`);
        const choices = document.getElementById(`p-choices-${idx}`).children;

        fb.classList.remove('secret'); fb.innerHTML = '';
        
        for(let btn of choices) {
            let bVal = btn.dataset.val;
            if(bVal === correctAns) btn.classList.add('correct');
            else if(p.selected === bVal) btn.classList.add('wrong');
        }

        if(p.selected === correctAns) {
            fb.innerHTML = '<span style="color:#69db7c">⭕</span>'; fb.classList.add('show-result');
            p.survived++;
            if(state.mode === 'challenge') {
                p.score += (10 + p.answerTime); 
                document.getElementById(`p-score-${idx}`).innerText = `${p.score} ${STRINGS[currentLang||'ko'].score_pt}`;
            }
        } else {
            someoneWrong = true;
            fb.innerHTML = '<span style="color:#ff6b6b">❌</span>'; fb.classList.add('show-result');
            if(state.mode === 'survival') {
                p.alive = false;
                setTimeout(() => {
                    document.getElementById(`p-${idx}`).classList.add('eliminated');
                }, 1500);
            }
        }
    });
    if(!someoneWrong) playSound('correct'); else playSound('wrong');
    setTimeout(() => nextTurn(), 3500);
}

function assignRanks() {
    let ranked = [...state.players];
    if(state.mode === 'challenge') {
        ranked.sort((a,b) => b.score - a.score);
    } else {
        ranked.sort((a,b) => {
            if (a.alive && !b.alive) return -1;
            if (!a.alive && b.alive) return 1;
            return b.survived - a.survived;
        });
    }
    
    let currentRank = 1;
    ranked.forEach((p, i) => {
        if (i > 0) {
            const prev = ranked[i-1];
            let isTie = false;
            if (state.mode === 'challenge') {
                if (p.score === prev.score) isTie = true;
            } else {
                if (p.alive && prev.alive) isTie = true;
                else if (!p.alive && !prev.alive && p.survived === prev.survived) isTie = true;
            }
            if (!isTie) currentRank = i + 1;
        } else {
            currentRank = 1;
        }
        const originalPlayer = state.players.find(pl => pl.id === p.id);
        originalPlayer.rank = currentRank;
    });
}

function getRankEmojiHtml(rank) {
    let rankEmoji = '';
    if (rank === 1) rankEmoji = '🥇';
    else if (rank === 2) rankEmoji = '🥈';
    else if (rank === 3) rankEmoji = '🥉';
    else if (rank === 4) rankEmoji = '<span style="font-size: 70%;">4️⃣</span>';
    else if (rank === 5) rankEmoji = '<span style="font-size: 70%;">5️⃣</span>';
    else if (rank === 6) rankEmoji = '<span style="font-size: 70%;">6️⃣</span>';
    return `<div style="font-size: 3rem; margin-bottom: 5px;">${rankEmoji}</div>`;
}

function triggerGoldenBellWin() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');

    state.players.forEach(p => {
        if(p.alive) p.isGoldenBellWinner = true;
    });
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    const list = document.getElementById('finalResultList');
    const txt = STRINGS[currentLang] || STRINGS['ko'];
    
    document.getElementById('resultTitle').innerHTML = "🎉 역사 인물 골든벨 달성! 🎉<br><span style='font-size: 2rem; color: #ffd43b;'>생존자 전원 승리!</span>";
    popup.style.display = 'flex'; list.innerHTML = '';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (p.isGoldenBellWinner) {
            finalDiv.innerHTML = `${rankHtml}<h3>영광의 우승</h3><p>🔔 한국사 마스터 🔔</p>`;
            finalDiv.style.border = "4px solid #ffd43b";
            finalDiv.style.background = "rgba(255, 212, 59, 0.2)";
        } else {
            finalDiv.innerHTML = `${rankHtml}<h3>${txt.record}</h3><p>${p.survived} ${txt.survived_count}</p>`;
        }
    });

    renderResultList(true);
}

function endGame() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    const txt = STRINGS[currentLang] || STRINGS['ko'];
    document.getElementById('resultTitle').innerText = txt.result_title;
    popup.style.display = 'flex';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (state.mode === 'challenge') { 
            finalDiv.innerHTML = `${rankHtml}<h3>${txt.final_score}</h3><p>${p.score} ${txt.score_pt}</p>`; 
        } else { 
            finalDiv.innerHTML = p.alive ? `${rankHtml}<h3>${txt.record}</h3><p>${txt.winner}</p>` : `${rankHtml}<h3>${txt.record}</h3><p>${p.survived} ${txt.survived_count}</p>`; 
            if(p.alive) finalDiv.style.border = "4px solid #ffd43b"; 
        }
    });

    renderResultList(false);
}

function renderResultList(isGoldenBell) {
    const list = document.getElementById('finalResultList');
    list.innerHTML = '';
    const txt = STRINGS[currentLang] || STRINGS['ko'];

    let ranked = [...state.players].sort((a,b) => a.rank - b.rank);

    ranked.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = `result-item ${p.rank === 1 ? 'rank-1' : ''}`;
        
        let status;
        if (isGoldenBell && p.isGoldenBellWinner) status = "🔔 한국사 마스터!";
        else if (state.mode === 'challenge') status = `${p.score} ${txt.score_pt}`;
        else status = p.alive ? txt.winner : `${p.survived} ${txt.survived_count}`;

        li.innerHTML = `<span>${p.rank}${txt.rank} ${p.icon} ${p.name}</span><span>${status}</span>`;
        list.appendChild(li);
    });
}

/* =========================================
   언어 모달 이벤트 (UI 호환성을 위해 유지)
   ========================================= */
const triggerBtn = document.getElementById('langTriggerBtn');
const modal = document.getElementById('langModal');
const closeBtn = document.getElementById('closeModalBtn');
const searchInput = document.getElementById('searchInput');
const grid = document.getElementById('languageGrid');
const noResult = document.getElementById('noResult');
const toast = document.getElementById('toastNotification');
const toastLangName = document.getElementById('toastLangName');
let toastTimeout;

function renderLanguages(filterText = '') {
    grid.innerHTML = '';
    const lowerFilter = filterText.toLowerCase();
    
    const filteredLangs = languagesList.filter(lang => 
        lang.name.toLowerCase().includes(lowerFilter) || 
        lang.enName.toLowerCase().includes(lowerFilter) ||
        lang.code.toLowerCase().includes(lowerFilter)
    );

    if (filteredLangs.length === 0) {
        grid.classList.add('hidden');
        noResult.classList.remove('hidden');
        noResult.classList.add('flex');
    } else {
        grid.classList.remove('hidden');
        noResult.classList.add('hidden');
        noResult.classList.remove('flex');

        filteredLangs.forEach(lang => {
            const isSelected = lang.code === currentLang;
            
            const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden lang-ui-text";
            const stateClasses = isSelected 
                ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

            const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

            const btn = document.createElement('div');
            btn.className = `${baseClasses} ${stateClasses}`;

            btn.innerHTML = `
                <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                    <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                </div>
                <div class="flex-1 min-w-0 flex flex-col items-start">
                    <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                    <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                </div>
                ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
            `;

            btn.addEventListener('click', () => selectLanguage(lang));
            grid.appendChild(btn);
        });
    }
}

function selectLanguage(lang) {
    currentLang = lang.code;
    updateUIText(currentLang);
    closeModal();
    
    document.getElementById('ui-toast').textContent = (STRINGS[currentLang]||STRINGS['ko']).ui_toast;
    toastLangName.textContent = lang.name;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    
    renderLanguages(searchInput.value);
}

function openModal() { modal.classList.add('active'); setTimeout(() => searchInput.focus(), 100); }
function closeModal() { modal.classList.remove('active'); }

triggerBtn.addEventListener('click', openModal);
closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });

window.addEventListener('DOMContentLoaded', () => {
    initLanguage();      
    renderLanguages();   
    setTimeout(resizeDynamicTexts, 100); 
});

</script>
