<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5YW0T2C109');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>괄호킹 모바일 👑</title>
    <meta name="description" id="meta-desc" content="60초 안에 알맞은 곳에 괄호를 넣어 식을 완성하세요! 최고 점수에 도전하세요.">
    <meta name="keywords" id="meta-keywords" content="수학, 게임, 괄호킹, 타임어택, 킹수학">
    <meta name="theme-color" content="#f0f4f8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Tailwind 기본 스타일 초기화 방지
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

        :root {
            --bg-start: #f0f4f8;
            --bg-game: #1e1e2e;
            --primary-blue: #339af0;
            --dark-blue: #1864ab;
            --accent-yellow: #ffd43b;
            --text-dark: #343a40;
            --text-light: #f8f9fa;
            --correct: #40c057;
            --wrong: #ff6b6b;
        }

        /* 폰트 적용 로직 - 한글일 때만 Noto Sans, 그 외는 기본 sans-serif */
        body {
            margin: 0; padding: 0;
            background-color: #000;
            font-family: sans-serif; /* 다국어 공통 기본 무난한 폰트 */
            height: 100vh; height: 100dvh; 
            display: flex; justify-content: center; overflow: hidden;
        }
        body.lang-ko {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 폰트 어썸 아이콘 깨짐 방지 강제 적용 */
        .fa, .fas, .fa-solid, .fa-regular, .fa-brands, i[class^="fa-"], i[class*=" fa-"] {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }
        .fa-brands {
            font-family: "Font Awesome 6 Brands" !important;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        #game-container {
            width: 100%; max-width: 600px; height: 100%;
            background: var(--bg-start);
            position: relative; display: flex; flex-direction: column;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }

        .hidden { display: none !important; }
        .center { text-align: center; }
        button { cursor: pointer; border: none; font-family: sans-serif; transition: transform 0.1s; outline: none; }
        body.lang-ko button { font-family: 'Noto Sans KR', sans-serif; }
        button:active { transform: scale(0.95); }

        /* --- 1. 시작 화면 --- */
        #start-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            padding-top: 2vh; padding-bottom: 5vh;
            background: linear-gradient(180deg, #e3fafc 0%, #f0f4f8 100%);
            overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 10; touch-action: pan-y; 
        }

        #start-screen::-webkit-scrollbar { width: 8px; }
        #start-screen::-webkit-scrollbar-track { background: #e9ecef; border-radius: 4px; }
        #start-screen::-webkit-scrollbar-thumb { background: #adb5bd; border-radius: 4px; }
        
        #top-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 20px; margin-bottom: 1vh; flex-shrink: 0; z-index: 50; }
        
        /* 다국어 버튼과 기존 버튼의 완벽한 디자인 동기화 */
        #kingsmath-link-btn, #langTriggerBtn {
            font-size: 2.2vh; color: var(--dark-blue); text-decoration: none; font-weight: bold;
            background: #fff; padding: 5px 15px; border: 2px solid var(--primary-blue);
            border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 6px;
            cursor: pointer; height: 4.5vh;
        }

        .main-title { font-size: 7vh; color: var(--dark-blue); margin: 1vh 0; text-shadow: 3px 3px 0px #a5d8ff; line-height: 1.1; text-align: center; flex-shrink: 0; font-weight: 900; }
        .title-mobile { font-size: 40%; vertical-align: middle; color: var(--primary-blue); }
        
        #qr-area { margin: 2vh 0; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
        #qrcode { padding: 10px; background: white; border: 2px dashed var(--primary-blue); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .qr-help { font-size: 1.8vh; margin-top: 5px; color: #868e96; font-weight: 700;}

        #qr-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; display: none; justify-content: center; align-items: center; }
        #qr-modal img { width: 90vw; height: 90vw; max-width: 500px; max-height: 500px; border: 10px solid #fff; object-fit: contain; background: #fff; }

        .input-guide { font-size: 2.5vh; color: var(--dark-blue); margin-bottom: 1vh; font-weight: 900; animation: bounce 2s infinite; text-align: center; flex-shrink: 0; padding: 0 10px; word-break: keep-all; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-5px);} 60% {transform: translateY(-3px);} }

        /* inherit 제거, 폰트 명시 */
        input#nickname { width: 85%; padding: 2vh; font-size: 4vh; text-align: center; border: 4px dashed var(--primary-blue); border-radius: 20px; font-family: sans-serif; margin-bottom: 2vh; color: var(--text-dark); background-color: #fff; flex-shrink: 0; font-weight: 700;}
        body.lang-ko input#nickname { font-family: 'Noto Sans KR', sans-serif; }
        input#nickname:focus { outline: none; border-style: solid; }

        /* 다이나믹 텍스트 조정을 위해 클래스 추가: dynamic-text */
        .btn-start { width: 85%; padding: 1.5vh; font-size: 4.5vh; font-weight: 900; background-color: var(--primary-blue); color: white; border: 3px dashed rgba(255,255,255,0.5); border-radius: 30px; box-shadow: 0 0.6vh var(--dark-blue); margin-bottom: 1.5vh; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: clip; }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0.2vh var(--dark-blue); }

        .btn-link { width: 85%; padding: 1.2vh; font-size: 3vh; font-weight: 700; background-color: #74c0fc; color: white; border: 2px dashed rgba(255,255,255,0.5); border-radius: 25px; box-shadow: 0 0.5vh #228be6; margin-bottom: 2vh; text-decoration: none; display: inline-block; text-align: center; flex-shrink: 0; white-space: nowrap; overflow: hidden; }
        
        #ranking-board { margin-top: 1vh; width: 90%; background: #fff; border: 3px dashed #a5d8ff; border-radius: 15px; padding: 1vh; max-height: 30vh; overflow-y: auto; touch-action: pan-y; flex-shrink: 0; margin-bottom: 2vh; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8vh 0.5vh; border-bottom: 1px dashed #eee; font-size: 2.2vh; color: var(--text-dark); font-weight: 700;}

        /* --- 2. 게임 화면 --- */
        #game-screen { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-game); position: relative; overflow: hidden; width: 100%; }
        #game-header { background-color: #2b2b3d; display: flex; flex-direction: column; padding: 10px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 20; gap: 8px; border-bottom: 2px solid #444; }
        .header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .control-btn { font-size: 3vh; background: none; border: none; cursor: pointer; color: white; }
        .stat-box { background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 8px; display: flex; align-items: center; border: 2px solid #555; width: 45%; justify-content: space-between; }
        .stat-label { font-size: 2.2vh; color: #adb5bd; font-weight: 900; margin-right: 5px; }
        .stat-val { font-size: 3.5vh; color: var(--accent-yellow); font-weight: 900; }
        .timer-warning { color: var(--wrong) !important; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        #play-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; width: 100%; }
        
        .equation-board {
            display: flex; align-items: center; justify-content: center; flex-wrap: nowrap; 
            padding: 15px 5px; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.2); border-radius: 20px;
            margin-bottom: 30px; border: 2px solid #444; gap: 0px; 
        }

        .eq-text { font-size: clamp(1.8rem, 5.5vw, 3.2rem); font-weight: 700; padding: 0 2px; color: white; line-height: 1; }
        .eq-target { font-size: clamp(2rem, 6.5vw, 3.5rem); font-weight: 900; color: var(--accent-yellow); margin-left: 8px; text-shadow: 0 0 10px rgba(255,212,59,0.5); line-height: 1; }

        .drop-zone {
            min-width: 2px; width: auto; height: clamp(40px, 8vw, 70px); 
            border: 2px solid transparent; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s ease; margin: 0; padding: 0; gap: 0px;
        }
        .drop-zone.drag-over { min-width: clamp(20px, 4vw, 30px); margin: 0 2px; border: 2px dashed rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); }
        .drop-zone.filled { min-width: 2px; margin: 0; border-color: transparent; background: transparent;}
        .drop-zone.filled.drag-over { border-color: var(--accent-yellow); background: rgba(255, 212, 59, 0.2); }
        .drop-zone.filled.drag-over.insert-left { padding-left: clamp(20px, 4vw, 30px); padding-right: 0px; }
        .drop-zone.filled.drag-over.insert-right { padding-left: 0px; padding-right: clamp(20px, 4vw, 30px); }

        .paren-bank {
            min-height: 90px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; gap: 30px; flex-wrap: wrap; width: 90%;
            border: 2px dashed #555; margin-bottom: 20px;
        }

        .draggable-paren {
            min-width: clamp(15px, 3vw, 25px); height: clamp(40px, 8vw, 60px); 
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-family: sans-serif;
            background: transparent; color: var(--primary-blue);
            display: flex; align-items: center; justify-content: center; font-weight: 900;
            cursor: grab; box-shadow: none; touch-action: none; flex-shrink: 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8); line-height: 1;
            position: relative; 
        }
        body.lang-ko .draggable-paren { font-family: 'Noto Sans KR', sans-serif; }
        
        .draggable-paren::after { content: ''; position: absolute; top: -20px; bottom: -20px; left: -20px; right: -20px; background: transparent; z-index: 10; }

        .dragging { 
            position: fixed !important; z-index: 9999 !important; cursor: grabbing; opacity: 1; 
            transform: scale(1.4); margin: 0 !important; pointer-events: none;
            color: #a5d8ff; text-shadow: 0px 0px 15px rgba(51,154,240,0.9), 0px 0px 5px #fff;
        }
        .drop-zone.filled .draggable-paren { text-shadow: none; color: #74c0fc; }

        .check-btn {
            width: 80%; height: 70px; font-size: 4vh; font-weight: 900; border: none; color: white; cursor: pointer;
            background: var(--correct); border-radius: 35px; box-shadow: 0 6px 0 #2b8a3e;
            transition: 0.1s; margin-top: auto; margin-bottom: 20px; white-space: nowrap; overflow: hidden;
        }
        .check-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b8a3e; }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
        .shake-anim { animation: shake 0.4s; }

        #game-footer { height: 8vh; background: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #eee; border-top: 2px solid #444; z-index: 20; }
        #ingame-nickname { font-size: 3vh; font-weight: 900; color: var(--primary-blue); }

        #levelup-overlay { position: absolute; inset:0; pointer-events: none; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; background: rgba(0,0,0,0.5); }
        #levelup-text { font-size: 10vh; color: var(--accent-yellow); text-shadow: 4px 4px 0 #000; font-weight: 900; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(50px) scale(0.5); opacity: 0; } 50% { transform: translateY(-20px) scale(1.2); opacity: 1; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

        #countdown-screen { 
            position: absolute; inset: 0; 
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            z-index: 100; display: flex; justify-content: center; align-items: center; 
        }
        #countdown-text { 
            font-size: 20vh; font-weight: 900; color: var(--primary-blue); 
            text-shadow: 0 0 30px rgba(51,154,240,0.8); opacity: 0; 
        }
        @keyframes countPop { 
            0% { transform: scale(0.3); opacity: 0; } 
            20% { transform: scale(1.2); opacity: 1; }
            40% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0; } 
        }

        /* --- 3. 결과 화면 --- */
        #result-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(227, 250, 252, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; padding-bottom: 5vh; }
        .result-score { font-size: 10vh; color: var(--primary-blue); margin: 1vh 0; font-weight: 900; text-shadow: 2px 2px 0px #fff; }
        #result-ranking-board { margin-top: 2vh; width: 85%; background: #fff; border: 3px dashed var(--primary-blue); border-radius: 15px; padding: 1vh; flex-shrink: 0; max-height: 25vh; overflow-y: auto; touch-action: pan-y; }

        /* --- 다국어 모달 UI (격리 및 호환성 보장) --- */
        /* 박스 사이징 강제 보정 */
        #langModal, #langModal * { box-sizing: border-box !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }


/* 스크롤이 필요한 영역의 터치 잠금 강제 해제 */
#start-screen, #start-screen * { touch-action: pan-y !important; }
#ranking-board, #ranking-board * { touch-action: pan-y !important; }
#result-ranking-board, #result-ranking-board * { touch-action: pan-y !important; }
#langModal .custom-scrollbar, #langModal .custom-scrollbar * { touch-action: pan-y !important; }


    </style>
</head>
<body>

<div id="qr-modal" onclick="this.style.display='none'">
    <div id="qr-modal-content"></div>
</div>

<div id="game-container">
    <div id="start-screen">
        <div id="top-nav">
            <a id="kingsmath-link-btn" href="https://11ukul.com/kingsmathgames/" target="_self">킹수학.com</a>
            
            <div id="langTriggerContainer" style="z-index: 99999;">
                <button id="langTriggerBtn">
                    <i class="fa-solid fa-globe"></i>
                    <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="Flag" style="width:20px; height:auto; border-radius:2px;">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
            </div>
        </div>

        <div class="main-title dynamic-text" id="main-title-el">
            <span data-i18n="title">괄호킹</span>
            <span class="title-mobile" data-i18n="subtitle">모바일</span>
        </div>

        <div id="qr-area">
            <div id="qrcode" onclick="showBigQR()"></div>
            <div class="qr-help" data-i18n="qrHelp">QR을 눌러서 공유하세요!</div>
        </div>
        
        <div class="input-guide dynamic-text" data-i18n="guide">알맞은 곳에 괄호를 넣어 식을 완성하세요!</div>

        <input type="text" id="nickname" maxlength="8" placeholder="닉네임 입력" onfocus="this.select()" data-i18n-ph="placeholder">
        
        <button class="btn-start dynamic-text" onclick="checkNameAndStart()" data-i18n="startBtn">🚀 게임 시작</button>
        <button class="btn-link dynamic-text" onclick="location.href='https://11ukul.com/kingsmathgames/'" data-i18n="moreGames">🎮 다른 게임 고르기</button>
        
        <div id="ranking-board">
            <div class="center" data-i18n="rankingLoading">랭킹 로딩중... 🏃‍♂️</div>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="game-header">
            <div class="header-row">
                <button class="control-btn" onclick="goHome()">🏠</button>
                <button class="control-btn" onclick="restartGame()">🔄</button>
            </div>
            <div class="header-row">
                <div class="stat-box" id="timer-box">
                    <span class="stat-label">TIME</span>
                    <span class="stat-val" id="timer-val">60</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-val" id="score-val">0</span>
                </div>
            </div>
        </div>

        <div id="play-area">
            <div class="equation-board" id="eq-board"></div>
            <div class="paren-bank" id="paren-bank"></div>
            
            <button class="check-btn dynamic-text" id="btn-check" onclick="checkAnswer()" data-i18n="checkBtn">정답 확인</button>
        </div>
        
        <div id="levelup-overlay">
            <div id="levelup-text"><i class="fa-solid fa-check"></i> +10</div>
        </div>
        
        <div id="game-footer">
            <span id="ingame-nickname">Player</span>
        </div>

        <div id="countdown-screen" class="hidden">
            <div id="countdown-text">3</div>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 class="dynamic-text" style="font-size: 5vh; margin:0; color:var(--dark-blue);" data-i18n="gameOver">시간 종료! ⌛</h2>
        <h3 id="res-nickname" style="font-size: 4vh; margin: 10px 0; color:var(--text-dark); font-weight: 700;">Player</h3>
        <div style="font-size:2vh; color:#868e96; font-weight:bold;">FINAL SCORE</div>
        <div class="result-score"><span id="res-score">0</span></div>
        <div id="res-rank" class="dynamic-text" style="font-size: 3vh; margin-bottom:20px; color:var(--text-dark); font-weight: 700;" data-i18n="rankQuery">순위 확인 중... 🤔</div>
        
        <button class="btn-start dynamic-text" onclick="restartGame()" data-i18n="restartBtn">🔄 다시 하기</button>
        <button class="btn-start dynamic-text" onclick="goHome()" style="background:#74c0fc; box-shadow: 0 0.6vh #228be6;" data-i18n="homeBtn">🏠 처음으로</button>
        
        <div id="result-ranking-board"></div>
    </div>
</div>

<div id="langModal" class="modal-overlay fixed inset-0 flex items-start sm:items-center justify-center bg-black/60 backdrop-blur-sm pt-16 sm:pt-0 px-4" style="z-index: 99999 !important;">
    <div class="modal-content bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden text-white" style="font-family: sans-serif;">
        <div class="flex items-center justify-between p-5 border-b border-gray-800 bg-gray-900/95 sticky top-0 z-10">
            <div><h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-language text-yellow-500"></i><span>Language</span></h2></div>
            <button id="closeModalBtn" class="w-10 h-10 rounded-full bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="p-5 pb-2 bg-gray-900">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search / 검색 ..." class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block pl-11 p-3.5 outline-none transition-all placeholder-gray-500">
            </div>
        </div>
        <div class="p-5 overflow-y-auto custom-scrollbar flex-1">
            <div id="languageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
            <div id="noResult" class="hidden flex-col items-center justify-center py-12 text-gray-500"><i class="fa-regular fa-face-frown-open text-4xl mb-3"></i><p>No results</p></div>
        </div>
    </div>

    // --- Math Logic ---
    function strictEval(expr) {
        let tokens = expr.split(' ').filter(t => t.trim() !== '');
        let out = [], ops = [];
        let prec = {'+':1, '-':1, '*':2, '/':2};
        
        function applyOp() {
            if (out.length < 2) return false;
            let op = ops.pop();
            let b = out.pop(), a = out.pop();
            let res;
            if(op === '+') res = a + b;
            else if(op === '-') res = a - b;
            else if(op === '*') res = a * b;
            else if(op === '/') res = a / b;
            
            if (res < 0 || !Number.isInteger(res)) return false; 
            out.push(res);
            return true;
        }
        
        for(let t of tokens) {
            if(!isNaN(t)) out.push(Number(t));
            else if(t === '(') ops.push(t);
            else if(t === ')') {
                while(ops.length > 0 && ops[ops.length-1] !== '(') { if(!applyOp()) return null; }
                ops.pop();
            } else {
                while(ops.length > 0 && ops[ops.length-1] !== '(' && prec[ops[ops.length-1]] >= prec[t]) {
                    if(!applyOp()) return null;
                }
                ops.push(t);
            }
        }
        while(ops.length > 0) { if(!applyOp()) return null; }
        return out.length === 1 ? out[0] : null;

                "( N O N ) O N O N", 
                "N O ( N O N ) O N", 
                "N O N O ( N O N )",
                
                // 2. 숫자 3개를 묶는 패턴
                "( N O N O N ) O N", 
                "N O ( N O N O N )"
            ];
            
            let struct = forms[Math.floor(Math.random() * forms.length)];

            let nums = Array.from({length: numCount}, () => randNum());
            let ops = Array.from({length: numCount - 1}, () => randOp());

            let nIdx = 0, oIdx = 0;
            let exprWithP = struct.replace(/N/g, () => nums[nIdx++]).replace(/O/g, () => ops[oIdx++]);
            let exprWithoutP = exprWithP.replace(/[\(\)]/g, '');

            let valP = strictEval(exprWithP);
            if (valP === null) continue; 
            
            let valNP = strictEval(exprWithoutP);

            // 괄호가 있을 때와 없을 때의 결과가 다르고, 양의 정수일 때만 문제로 채택
            if (Number.isInteger(valP) && valP > 0 && valP !== valNP && valP < 1000) {
                return { nums, ops, target: valP, solution: exprWithP };
            }
        }
        
        // 500번 반복해도 문제를 못 찾았을 경우의 기본 문제
        return { nums: [2, 3, 4, 5], ops: ['+', '*', '-'], target: 15, solution: "( 2 + 3 ) * 4 - 5" };
    }

    // --- UI Rendering ---
    function loadNextPuzzle() {
        currentPuzzle = generateRandomPuzzle();
        
        const board = document.getElementById('eq-board');
        const bank = document.getElementById('paren-bank');
        board.innerHTML = ''; bank.innerHTML = '';

        ['(', ')'].forEach(sym => {
            let el = document.createElement('div');
            el.className = 'draggable-paren';
            el.dataset.val = sym;
            el.innerText = sym;
            bank.appendChild(el);
        });

        for(let i=0; i<currentPuzzle.nums.length; i++) {
            let dz1 = document.createElement('div');
            dz1.className = 'drop-zone';
            board.appendChild(dz1);
            
            let numEl = document.createElement('div');
            numEl.className = 'eq-text'; numEl.innerText = currentPuzzle.nums[i];
            board.appendChild(numEl);
            
            let dz2 = document.createElement('div');
            dz2.className = 'drop-zone';
            board.appendChild(dz2);
            
            if (i < currentPuzzle.ops.length) {
                let opEl = document.createElement('div');
                opEl.className = 'eq-text';
                opEl.innerText = currentPuzzle.ops[i] === '*' ? '×' : currentPuzzle.ops[i];
                opEl.dataset.realOp = currentPuzzle.ops[i];
                board.appendChild(opEl);
            }
        }
        let eqEl = document.createElement('div');
        eqEl.className = 'eq-text'; eqEl.innerText = '=';
        board.appendChild(eqEl);
        
        let targetEl = document.createElement('div');
        targetEl.className = 'eq-target'; targetEl.innerText = currentPuzzle.target;
        board.appendChild(targetEl);
    }

    function resetBrackets() {
        const bank = document.getElementById('paren-bank');
        const board = document.getElementById('eq-board');
        
        document.querySelectorAll('.draggable-paren').forEach(p => {
            bank.appendChild(p);
            p.style.position = ''; p.style.left = ''; p.style.top = '';
        });
        
        document.querySelectorAll('.drop-zone').forEach(dz => {
            dz.classList.remove('filled', 'drag-over', 'insert-left', 'insert-right');
        });
        board.classList.remove('shake-anim');
    }

    // --- Drag and Drop Logic ---
    let activeDrags = new Map();

    function getClosestDropZone(x, y) {
        let closest = null, minDist = 100;
        document.querySelectorAll('.drop-zone').forEach(dz => {
            let rect = dz.getBoundingClientRect();
            let cx = rect.left + rect.width / 2;
            let cy = rect.top + rect.height / 2;
            let dist = Math.hypot(x - cx, y - cy);
            if (dist < minDist) { minDist = dist; closest = dz; }
        });
        return closest;
    }

    function moveElement(el, x, y) {
        let offsetY = window.matchMedia("(pointer: coarse)").matches ? 40 : 0;
        el.style.left = (x - el.offsetWidth / 2) + 'px';
        el.style.top = (y - el.offsetHeight / 2 - offsetY) + 'px';
    }

    document.addEventListener('pointerdown', e => {
        if(!isPlaying) return;
        const target = e.target.closest('.draggable-paren');
        if(!target) return;
        e.preventDefault();

        if (target.parentElement.classList.contains('drop-zone')) {
            target.parentElement.classList.remove('filled');
        }

        target.setPointerCapture(e.pointerId);
        target.classList.add('dragging');
        activeDrags.set(e.pointerId, target);
        document.body.appendChild(target); 
        moveElement(target, e.clientX, e.clientY);
    });

    document.addEventListener('pointermove', e => {
        const el = activeDrags.get(e.pointerId);
        if(el) {
            moveElement(el, e.clientX, e.clientY);
            let dropZone = getClosestDropZone(e.clientX, e.clientY);
            
            document.querySelectorAll('.drop-zone').forEach(dz => dz.classList.remove('drag-over', 'insert-left', 'insert-right'));
            
            if (dropZone) {
                dropZone.classList.add('drag-over');
                let parens = Array.from(dropZone.children).filter(c => c.classList.contains('draggable-paren'));
                if (parens.length > 0) {
                    let rect = dropZone.getBoundingClientRect();
                    let cx = rect.left + rect.width / 2;
                    if (e.clientX < cx) dropZone.classList.add('insert-left');
                    else dropZone.classList.add('insert-right');
                }
            }
        }
    });

    function handlePointerEnd(e) {
        const el = activeDrags.get(e.pointerId);
        if(!el) return;
        el.releasePointerCapture(e.pointerId);
        activeDrags.delete(e.pointerId);

        let dropZone = getClosestDropZone(e.clientX, e.clientY);
        el.classList.remove('dragging');
        el.style.left = ''; el.style.top = '';

        document.querySelectorAll('.drop-zone').forEach(dz => dz.classList.remove('drag-over', 'insert-left', 'insert-right'));

        if (dropZone) {
            let insertBeforeNode = null;
            let parens = Array.from(dropZone.children).filter(c => c.classList.contains('draggable-paren'));
            if (parens.length > 0) {
                let rect = parens[0].getBoundingClientRect();
                if (e.clientX < rect.left + rect.width/2) insertBeforeNode = parens[0];
            }
            if (insertBeforeNode) dropZone.insertBefore(el, insertBeforeNode);
            else dropZone.appendChild(el);
            dropZone.classList.add('filled');
        } else {
            document.getElementById('paren-bank').appendChild(el);
        }
    }
    document.addEventListener('pointerup', handlePointerEnd);
    document.addEventListener('pointercancel', handlePointerEnd);

    // --- Answer Checking ---
    function isValidBrackets(str) {
        let stack = [];
        for (let char of str) {
            if (char === '(') stack.push(char);
            else if (char === ')') {
                if (stack.length === 0 || stack.pop() !== '(') return false;
            }
        }
        return stack.length === 0;
    }

    function checkAnswer() {
        if(!isPlaying) return;
        const board = document.getElementById('eq-board');
        let exprStr = "";
        
        for(let child of board.children) {
            if(child.classList.contains('drop-zone')) {
                for(let bracket of child.children) exprStr += bracket.dataset.val + " ";
            } else if(child.classList.contains('eq-text') && child.innerText !== '=') {
                exprStr += (child.dataset.realOp || child.innerText) + " ";
            }
        }
        
        if(!exprStr.includes('(') || !exprStr.includes(')')) {
            triggerWrong(); return;
        }

        if (!isValidBrackets(exprStr)) {
            triggerWrong(); return;
        }
        
        let result = strictEval(exprStr);
        if (result !== null && result === currentPuzzle.target) {
            triggerCorrect();
        } else {
            triggerWrong();
        }
    }

    function triggerWrong() {
        playSound('wrong');
        const board = document.getElementById('eq-board');
        board.classList.remove('shake-anim');
        void board.offsetWidth;
        board.classList.add('shake-anim');
        setTimeout(() => resetBrackets(), 400);
    }

    function triggerCorrect() {
        playSound('correct');
        score += SCORE_PER_PUZZLE;
        document.getElementById('score-val').innerText = score;
        
        const overlay = document.getElementById('levelup-overlay');
        const txt = document.getElementById('levelup-text');
        overlay.style.display = 'flex';
        txt.style.animation = 'none';
        void txt.offsetWidth;
        txt.style.animation = 'floatUp 0.8s ease-out forwards';
        
        setTimeout(() => {
            overlay.style.display = 'none';
            loadNextPuzzle(); 
        }, 800);
    }


    // --- Game Flow ---
    function initGame() {
        score = 0; timeLeft = GAME_DURATION;
        document.getElementById('score-val').innerText = score;
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('timer-val').classList.remove('timer-warning');
        document.getElementById('ingame-nickname').innerText = myNickname;
        
        loadNextPuzzle();
        isPlaying = true;
        startTimer();
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            timeLeft--;
            const tVal = document.getElementById('timer-val');
            tVal.innerText = timeLeft;
            if(timeLeft <= 10) tVal.classList.add('timer-warning');
            if(timeLeft <= 5 && timeLeft > 0) playSound('tick');
            if(timeLeft <= 0) endGame();
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        playSound('end');

        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('res-nickname').innerText = myNickname;
        document.getElementById('res-score').innerText = score;
        
        submitScore(myNickname, score);
        adjustDynamicFontSize(); // 결과 화면 폰트 다이나믹 조절
    }

    // --- UI Actions ---
    function checkNameAndStart() {
        const input = document.getElementById('nickname');
        const val = input.value.trim();
        const t = i18n[currentLang] || i18n['en'];

        if(val.length < 1) { alert(t.alertName); return; }
        const badWords = ["시발", "씨발", "개새끼", "fuck", "shit"];
        if(badWords.some(w => val.includes(w))) { alert(t.alertBad); return; }

        myNickname = val;
        localStorage.setItem("kingsmath_name", val);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        
        async function runAsyncCountdown() {
            const screen = document.getElementById('countdown-screen');
            const text = document.getElementById('countdown-text');
            screen.classList.remove('hidden');
            
            const steps = ["3", "2", "1", "GO!"];
            for (let i = 0; i < steps.length; i++) {
                text.innerText = steps[i];
                text.style.animation = 'none';
                void text.offsetWidth; 
                text.style.animation = 'countPop 1s ease-in-out forwards';
                
                if (steps[i] === "GO!") playSound('start');
                else playSound('tick');
                
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            screen.classList.add('hidden');
            initGame();
        }
        runAsyncCountdown();
    }

    function restartGame() {
        isPlaying = false; clearInterval(timerInterval);
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        async function runAsyncCountdown() {
            const screen = document.getElementById('countdown-screen');
            const text = document.getElementById('countdown-text');
            screen.classList.remove('hidden');
            const steps = ["3", "2", "1", "GO!"];
            for (let i = 0; i < steps.length; i++) {
                text.innerText = steps[i];
                text.style.animation = 'none'; void text.offsetWidth; 
                text.style.animation = 'countPop 1s ease-in-out forwards';
                if (steps[i] === "GO!") playSound('start');
                else playSound('tick');
                await new Promise(r => setTimeout(r, 1000));
            }
            screen.classList.add('hidden');
            initGame();
        }
        runAsyncCountdown();
    }

    function goHome() {
        if (document.fullscreenElement) {
            // 전체화면 시 지체없이 DOM 초기화
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('langTriggerContainer').style.display = 'block';
            loadRanking();
            if(window.playSound) window.playSound('click');
        } else {
            // 전체화면이 아닐 경우 깔끔하게 리로드
            location.reload();
        }
    }


    // --- Ranking API ---
    function submitScore(name, score) {
        const t = i18n[currentLang] || i18n['en'];
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', score);

        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = t.rankResult.replace('{rank}', data.rank);
                loadResultRanking();
            } else {
                document.getElementById("res-rank").innerText = t.rankingError;
            }
        })
        .catch(e => { console.error(e); document.getElementById("res-rank").innerText = "Network Error"; });
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const t = i18n[currentLang] || i18n['en'];
        list.innerHTML = `<div class="center">${t.rankingLoading}</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="margin-top:20px;">${t.rankingEmpty}</div>`; return;
            }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1);
                let style = (idx < 3) ? "font-size:1.5em;" : "color:var(--dark-blue); font-weight:bold;";
                html += `<div class="rank-item">
                    <span style="width:15%; text-align:center; ${style}">${rankDisplay}</span>
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#868e96; font-weight:bold;">${item.score}</span>
                </div>`;
            });
            list.innerHTML = html;
        }).catch(e => { list.innerHTML = `<div class="center" style="color:red;">${t.rankingError}</div>`; });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board");
        list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#888;">TOP 3 Loading...</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) { list.innerHTML = ``; return; }
            let html = "";
            const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i];
                let rankIcon = ["🥇","🥈","🥉"][i];
                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;">
                    <span style="width:15%; text-align:center;">${rankIcon}</span>
                    <span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-dark); font-weight:700;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; font-weight:bold; color:var(--primary-blue);">${item.score}</span>
                </div>`;
            }
            list.innerHTML = html;
        }).catch(e => { list.style.display = 'none'; });
    }

    // --- 언어 동적 폰트 스케일링 로직 ---
    function adjustDynamicFontSize() {
        // 긴 단어 국가 대비 폰트 리사이징 처리
        const elements = document.querySelectorAll('.dynamic-text');
        elements.forEach(el => {
            el.style.fontSize = ''; // 초기화
            if(el.scrollWidth > el.clientWidth) {
                let currentSize = parseFloat(window.getComputedStyle(el).fontSize);
                while(el.scrollWidth > el.clientWidth && currentSize > 12) {
                    currentSize -= 1;
                    el.style.fontSize = currentSize + 'px';
                }
            }
        });
    }

    // --- 언어 및 QR 초기화 ---
    function getInitialLanguage() {
        // 1순위: URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        if (urlLang && i18n[urlLang]) return urlLang;

        // 2순위: 로컬 스토리지
        const savedLang = localStorage.getItem('kingsmath_lang');
        if (savedLang && i18n[savedLang]) return savedLang;

        // 3순위: 브라우저 언어
        const navLang = navigator.language.slice(0, 2);
        if (navLang && i18n[navLang]) return navLang;

        // 기본값
        return 'en';
    }

    function changeLang(langCode, showNotification = false) {
        if(!i18n[langCode]) langCode = 'en';
        currentLang = langCode;
        const t = i18n[langCode];
        
        // 폰트 클래스 토글 (충돌 방지 격리)
        if (langCode === 'ko') {
            document.body.classList.add('lang-ko');
        } else {
            document.body.classList.remove('lang-ko');
        }

        // DOM 텍스트 번역 적용
        document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t[el.getAttribute('data-i18n')]; });
        document.getElementById("nickname").placeholder = t.placeholder;
        
        // 모달/UI 국기 및 링크
        const langObj = languagesList.find(l => l.code === langCode) || languagesList[1];
        document.getElementById("currentFlag").src = `https://flagcdn.com/w40/${langObj.country}.png`;
        document.getElementById("kingsmath-link-btn").innerText = langCode === 'ko' ? "킹수학.com" : "KingsMath.com";
        
        // SEO 메타 태그
        document.title = t.metaTitle;
        document.getElementById("meta-desc").setAttribute("content", t.metaDesc);
        document.getElementById("meta-keywords").setAttribute("content", t.keywords);

        // 상태 저장 및 공유용 URL 업데이트
        localStorage.setItem("kingsmath_lang", langCode);
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + "?lang=" + langCode;
        window.history.pushState({path:newUrl}, '', newUrl);

        initQR(); loadRanking();
        
        // 렌더링 이후 레이아웃 텍스트 깨짐 방지 조정
        setTimeout(adjustDynamicFontSize, 50);

        if (showNotification) {
            showToast(langObj.name, t.toast);
        }
    }

    function initQR() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; 
        try {
            new QRCode(qrContainer, {
                text: window.location.href, width: 120, height: 120, colorDark : "#1864ab", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
        } catch(e) {}
    }

    function showBigQR() {
        const modal = document.getElementById("qr-modal");
        const content = document.getElementById("qr-modal-content");
        content.innerHTML = "";
        const src = document.querySelector("#qrcode canvas")?.toDataURL("image/png") || document.querySelector("#qrcode img")?.src;
        if (src) {
            const img = new Image(); img.src = src;
            content.appendChild(img); modal.style.display = "flex";
        }
    }

    // --- 언어 모달 UI 로직 ---
    const langModal = document.getElementById('langModal');
    const searchInput = document.getElementById('searchInput');
    const languageGrid = document.getElementById('languageGrid');
    const noResult = document.getElementById('noResult');
    const toast = document.getElementById('toastNotification');

    function renderLanguages(filterText = '') {
        languageGrid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            languageGrid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            languageGrid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}" style="font-family: sans-serif;">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full" style="font-family: sans-serif;">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;

                btn.addEventListener('click', () => {
                    changeLang(lang.code, true);
                    closeModal();
                    renderLanguages(searchInput.value);
                });
                languageGrid.appendChild(btn);
            });
        }
    }

    function openModal() {
        langModal.classList.add('active');
        document.body.style.overflow = 'hidden';
        renderLanguages(); // 리스트업 보장
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeModal() {
        langModal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, msg) {
        document.getElementById('ui-toast').textContent = msg;
        document.getElementById('toastLangName').textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    // 모달 이벤트 리스너 세팅
    document.getElementById('langTriggerBtn').addEventListener('click', openModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    langModal.addEventListener('click', (e) => { if (e.target === langModal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && langModal.classList.contains('active')) closeModal(); });
    searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });


    // --- 초기화 ---
    window.onload = function() {
        const savedName = localStorage.getItem("kingsmath_name");
        if(savedName) document.getElementById("nickname").value = savedName;
        
        // 초기 언어 세팅 (우선순위 로직)
        const initLangCode = getInitialLanguage();
        changeLang(initLangCode);
        
        // 언어 목록 초기 렌더링 호출 (누락 방지)
        renderLanguages();
    };
    
</script>
