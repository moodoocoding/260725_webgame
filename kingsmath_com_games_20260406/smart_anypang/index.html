<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5YW0T2C109');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="seo-title">애니팡 킹 🐯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 기존 index.html의 CSS를 모두 포함하되 게임보드만 수정 */
        :root {
            --bg-gray: #c0c0c0; --win-blue: #000080; --cell-size: 45px;
        }
        /* ... (중략: 기존 스타일 복사) ... */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(7, var(--cell-size));
            grid-template-rows: repeat(7, var(--cell-size));
            background: #000; gap: 1px; border: 3px solid var(--border-dark);
        }
        .cell {
            width: var(--cell-size); height: var(--cell-size);
            background: #fff; display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; cursor: pointer; transition: transform 0.1s;
        }
        .cell.selected { background: #ffff00; outline: 3px solid #ff0000; z-index: 10; }
        .cell.matched { animation: pop 0.3s forwards; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); opacity: 0.5; } 100% { transform: scale(0); opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <div id="start-top-bar">
            <a id="kings-link" href="#" class="text-white font-bold">킹수학닷컴</a>
            <button id="langTriggerBtn" class="text-white">🌐 한국어</button>
        </div>
        <div class="title-box" id="txt-title" style="margin-top:50px;">애니팡 킹</div>
        <div class="input-group" style="margin-top:20px;">
            <input type="text" id="nickname" maxlength="8" placeholder="Player 1">
            <button class="win-btn start-btn-large" onclick="checkNameAndStart()" id="btn-start">게임 시작</button>
        </div>
        <div id="ranking-board" class="mt-4"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="info-panel">
            <div>
                <div class="text-xs text-center">SCORE</div>
                <div id="score-counter" class="lcd-panel">0000</div>
            </div>
            <div id="smiley-btn" class="smiley-face">🐯</div>
            <div>
                <div class="text-xs text-center">TIME</div>
                <div id="time-left" class="lcd-panel">60</div>
            </div>
        </div>
        <div id="board-area">
            <div class="window-frame">
                <div id="game-grid" class="game-grid"></div>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div class="result-window">
            <div class="result-content">
                <div id="result-msg" style="font-size:2rem;">게임 종료!</div>
                <div id="final-score" class="final-time">0</div>
                <div id="rank-msg" class="text-blue-700">순위 기록 중...</div>
                <button class="win-btn mt-4" onclick="location.reload()">다시 하기</button>
            </div>
        </div>
    </div>
</div>

<script>
    // [1] 게임 설정
    const GRID_SIZE = 7;
    const GAME_TIME = 60;
    const ITEMS = ['🍎', '🍊', '🍇', '🍉', '🍓', '🍋']; // 과일 테마
    const API_URL = "./ranking.php";

    let score = 0;
    let timeLeft = GAME_TIME;
    let grid = [];
    let selectedCell = null;
    let isProcessing = false;

    // [2] 게임 초기화
    function initGame() {
        score = 0; timeLeft = GAME_TIME;
        updateScore(0);
        createBoard();
        startTimer();
    }

    function createBoard() {
        const gridEl = document.getElementById('game-grid');
        gridEl.innerHTML = '';
        grid = [];
        for (let r = 0; r < GRID_SIZE; r++) {
            grid[r] = [];
            for (let c = 0; c < GRID_SIZE; c++) {
                const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = item;
                cell.onclick = () => handleCellClick(r, c);
                gridEl.appendChild(cell);
                grid[r][c] = { el: cell, type: item };
            }
        }
        // 시작 시 매칭된 게 있으면 다시 섞기
        if (checkMatches().length > 0) createBoard();
    }

    // [3] 게임 로직 (클릭 및 교체)
    function handleCellClick(r, c) {
        if (isProcessing || timeLeft <= 0) return;

        if (!selectedCell) {
            selectedCell = { r, c };
            grid[r][c].el.classList.add('selected');
        } else {
            const r2 = r, c2 = c;
            const r1 = selectedCell.r, c1 = selectedCell.c;
            
            // 인접한지 확인
            if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                swapCells(r1, c1, r2, c2);
            }
            
            grid[r1][c1].el.classList.remove('selected');
            selectedCell = null;
        }
    }

    async function swapCells(r1, c1, r2, c2) {
        isProcessing = true;
        // 위치 교체
        const tempType = grid[r1][c1].type;
        grid[r1][c1].type = grid[r2][c2].type;
        grid[r2][c2].type = tempType;
        renderGrid();

        const matches = checkMatches();
        if (matches.length > 0) {
            await handleMatches();
        } else {
            // 매칭 안되면 원복
            grid[r2][c2].type = grid[r1][c1].type;
            grid[r1][c1].type = tempType;
            setTimeout(renderGrid, 200);
        }
        isProcessing = false;
    }

    function checkMatches() {
        let matchedIndices = [];
        // 가로 검사
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE - 2; c++) {
                if (grid[r][c].type && grid[r][c].type === grid[r][c+1].type && grid[r][c].type === grid[r][c+2].type) {
                    matchedIndices.push({r, c}, {r, c:c+1}, {r, c:c+2});
                }
            }
        }
        // 세로 검사
        for (let c = 0; c < GRID_SIZE; c++) {
            for (let r = 0; r < GRID_SIZE - 2; r++) {
                if (grid[r][c].type && grid[r][c].type === grid[r+1][c].type && grid[r][c].type === grid[r+2][c].type) {
                    matchedIndices.push({r, c}, {r:r+1, c}, {r:r+2, c});
                }
            }
        }
        return matchedIndices;
    }

    async function handleMatches() {
        let matches = checkMatches();
        if (matches.length === 0) return;

        // 점수 추가 및 애니메이션
        score += matches.length * 10;
        updateScore(score);
        
        matches.forEach(m => {
            grid[m.r][m.c].el.classList.add('matched');
            grid[m.r][m.c].type = null;
        });

        await new Promise(res => setTimeout(res, 300));

        // 블록 내리기
        for (let c = 0; c < GRID_SIZE; c++) {
            let emptySpaces = 0;
            for (let r = GRID_SIZE - 1; r >= 0; r--) {
                if (grid[r][c].type === null) emptySpaces++;
                else if (emptySpaces > 0) {
                    grid[r + emptySpaces][c].type = grid[r][c].type;
                    grid[r][c].type = null;
                }
            }
            for (let r = 0; r < emptySpaces; r++) {
                grid[r][c].type = ITEMS[Math.floor(Math.random() * ITEMS.length)];
            }
        }
        renderGrid();
        await handleMatches(); // 연속 콤보 확인
    }

    function renderGrid() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                grid[r][c].el.innerText = grid[r][c].type || '';
                grid[r][c].el.classList.remove('matched');
            }
        }
    }

    // [4] 타이머 및 시스템
    function startTimer() {
        const timerIntv = setInterval(() => {
            timeLeft--;
            document.getElementById('time-left').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerIntv);
                gameOver();
            }
        }, 1000);
    }

    function updateScore(s) {
        document.getElementById('score-counter').innerText = String(s).padStart(4, '0');
    }

    function gameOver() {
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        submitScore(document.getElementById('nickname').value, score);
    }

    // [5] 랭킹 전송
    function submitScore(name, score) {
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', score); 
        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('rank-msg').innerText = `현재 순위: ${data.rank}위!`;
            }
        });
    }

    function checkNameAndStart() {
        if(!document.getElementById('nickname').value) return alert("이름을 입력하세요!");
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        initGame();
    }
</script>
</body>
</html>
