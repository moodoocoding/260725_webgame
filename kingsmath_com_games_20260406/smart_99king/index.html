<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5YW0T2C109');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>구구단 킹 모바일 🎀</title>
    <meta name="description" content="재미있는 구구단 게임! 친구들과 대결해보세요.">
    <meta name="keywords" content="킹수학, 구구단게임, 곱셈게임, 초등수학, math game, times table">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* ==============================================================
           1. 게임 오리지널 CSS (절대 수정/삭제하지 않음)
        ============================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --primary-pink: #ff9ff3; 
            --deep-pink: #f368e0;    
            --bg-pink: #ffeef2;      
            --soft-white: #ffffff;
            --text-color: #5f27cd;   
        }

        /* 캔버스 등에서 inherit 오류를 방지하기 위해 명시적 적용 방지, 이모지 깨짐 방지용 폰트 스택 */
        * { touch-action: manipulation; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-pink);
            font-family: 'Jua', 'Apple Color Emoji', 'Segoe UI Emoji', 'Comic Sans MS', 'Malgun Gothic', sans-serif;
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            justify-content: center;
            overflow: hidden;
            color: #444;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100%;
            max-width: 60vh; 
            height: 100%;
            background: var(--soft-white);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.3);
            border: 4px dashed #ffd1df;
            border-radius: 15px;
        }

        .hidden { display: none !important; }
        .center { text-align: center; }
        button { cursor: pointer; border: none; font-family: inherit; transition: transform 0.05s; }

        #start-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 10vh; /* 상단 UI 공간 확보를 위해 패딩 증가 */
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 5vh;
            background: linear-gradient(180deg, #fff0f6 0%, #fff 100%);
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }
        
        .main-title { 
            font-size: 8vh; 
            color: var(--deep-pink); 
            margin: 1vh 0; 
            text-shadow: 3px 3px 0px #ffcce0; 
            line-height: 1.2;
            text-align: center;
            word-break: keep-all;
            transition: font-size 0.3s ease; /* 동적 리사이징 부드럽게 */
        }
        
        #qrcode-area {
            margin: 1.5vh 0;
            padding: 10px;
            background: white;
            border: 3px dashed var(--primary-pink);
            border-radius: 15px;
            cursor: pointer;
        }

        .qr-invite-text {
            font-size: 1.8vh;
            color: #aaa;
            text-align: center;
            margin-top: -1vh;
            margin-bottom: 1.5vh;
            cursor: pointer;
            font-weight: bold;
        }
        
        .desc { 
            font-size: 3vh; color: #ff6b81; margin: 1.5vh 0; font-weight: bold; text-align: center; transition: font-size 0.3s ease; 
        }

        input#nickname {
            width: 85%;
            padding: 1.5vh;
            font-size: 4vh; 
            text-align: center;
            border: 3px dashed var(--primary-pink);
            border-radius: 30px; 
            font-family: inherit;
            margin-bottom: 2vh;
            color: var(--deep-pink);
            background-color: #fff9fc;
            user-select: text;
            -webkit-user-select: text;
        }
        input#nickname::placeholder { color: #ffc2d1; font-size: 3vh; }
        input#nickname:focus { outline: none; border-color: var(--deep-pink); border-style: solid; }

        .btn-start {
            width: 85%;
            padding: 1.5vh;
            font-size: 5vh; 
            background-color: var(--deep-pink);
            color: white;
            border: 3px dashed rgba(255,255,255,0.5);
            border-radius: 30px;
            box-shadow: 0 0.6vh #c445b0;
            margin-bottom: 2vh;
            word-break: keep-all;
            transition: font-size 0.3s ease, transform 0.05s, box-shadow 0.05s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0.2vh #c445b0; }

        .link-btn {
            font-size: 2.5vh;
            text-decoration: none;
            color: #666;
            background: #ffeaa7;
            padding: 1vh 2.5vh;
            border-radius: 20px;
            border: 2px dashed #d1b86e;
            box-shadow: 0 0.4vh #d1b86e;
            display: inline-block;
            text-align: center;
        }

        #ranking-board {
            margin-top: 2vh;
            width: 90%;
            background: #fff;
            border: 3px dashed #ffeaa7;
            border-radius: 15px;
            padding: 1vh;
            height: 40vh; 
            overflow-y: auto; 
            flex-shrink: 0; 
        }
        
        .rank-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.8vh 0.5vh; 
            border-bottom: 1px dashed #eee; 
            font-size: 2.5vh; 
        }

        #game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #fff9fc;
            position: relative;
            overflow: hidden;
            touch-action: none; 
        }

        .top-bar { padding: 1.5vh; }
        
        .nav-btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1vh;
        }
        .nav-btn {
            background: white;
            border: 2px dashed var(--primary-pink);
            border-radius: 15px;
            color: var(--deep-pink);
            font-size: 2vh;
            padding: 5px 15px;
            box-shadow: 0 2px 0 #ffcce0;
        }
        .nav-btn:active { transform: translateY(2px); box-shadow: none; }

        .info-bar {
            display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5px; padding: 0 5px;
        }
        .info-nick { font-size: 3.5vh; color: #5f27cd; font-weight: bold; }
        .score-display { font-size: 3.5vh; color: var(--deep-pink); font-weight: bold; }

        #timer-bar-bg { width: 100%; height: 1.5vh; background: #ffe0eb; border-radius: 10px; overflow: hidden; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #timer-bar { width: 100%; height: 100%; background: #badc58; transition: width 1s linear; border-radius: 10px; }
        
        #problem-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; background-image: radial-gradient(#fff0f6 20%, transparent 20%); background-size: 2vh 2vh;
        }

        #combo-text { 
            position: absolute; top: -15px; font-size: 4vh; color: #ff9f43; transform: scale(0); transition: transform 0.2s; 
            z-index: 10; text-shadow: 2px 2px 0 white; width: 100%; text-align: center;
        }
        .combo-active { transform: scale(1.3) rotate(-10deg) !important; }

        #question-text { font-size: 9vh; color: #333; margin-bottom: 1vh; margin-top: 0vh; }
        
        #input-display {
            font-size: 7.2vh; color: var(--deep-pink); width: 28vh; height: 12vh; line-height: 12vh; background: white;
            border-radius: 15px; border: 3px dashed var(--primary-pink); text-align: center; display: flex; justify-content: center; align-items: center;
        }

        .cursor-blink { display: inline-block; width: 2px; height: 6vh; background-color: #ddd; margin-left: 5px; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #keypad {
            height: 45vh; padding: 1vh; padding-bottom: 3vh; background: #fff0f6; border-radius: 30px 30px 0 0;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vh; border-top: 4px dashed #ffcce0;
        }

        .key-btn {
            background: white; font-size: 5vh; color: var(--text-color); border-radius: 20px;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 0.4vh #eecce2; color: #ff6b81; border: 2px dashed white; 
        }
        .key-btn:active { transform: translateY(3px); box-shadow: 0 0.1vh #eecce2; background: #fff5f8; }
        
        .key-c { background: #ffcccc; color: #ff4757; box-shadow: 0 0.4vh #ffaaaa; font-size: 3vh; }
        .key-ok { background: var(--deep-pink); color: white; box-shadow: 0 0.4vh #c445b0; border: 2px dashed rgba(255,255,255,0.5); font-size: 3vh; }

        #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding-bottom: 5vh; 
        }
        .result-score { font-size: 9vh; color: var(--deep-pink); margin: 1vh 0; font-weight: bold; }
        
        .shake { animation: shake 0.3s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
        .bg-red { background-color: #ffcccc !important; transition: background 0.2s; }

        #qr-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 182, 193, 0.9);
            display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        #qrcode-large img, #qrcode-large canvas { max-width: 90vw; height: auto; }

        #countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff;
            display: flex; justify-content: center; align-items: center; z-index: 500;
            font-size: 20vh; font-weight: bold; color: var(--deep-pink); text-shadow: 5px 5px 0px #fff;
        }

        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: #fff0f6; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background-color: #ffdae9; border-radius: 10px; border: 4px solid #fff0f6; background-clip: content-box; }
        * { scrollbar-width: thin; scrollbar-color: #ffdae9 #fff0f6; }


        /* ==============================================================
           2. 독립된 언어 모달 & 상단 UI (게임과 격리, 이모지/폰트 깨짐 방지 반영)
        ============================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        /* 박스 사이징 보정 및 내부 요소의 폰트 어썸 충돌 방지 */
        .global-header-ui, .global-header-ui *, 
        #langModal, #langModal *, 
        #toastNotification, #toastNotification * {
            box-sizing: border-box !important;
            margin: 0; padding: 0;
        }

        /* 폰트어썸 클래스 외의 텍스트에만 폰트 적용되도록 최상단에만 선언 */
        .global-header-ui, #langModal, #toastNotification {
            font-family: 'Noto Sans KR', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
        }

        .global-header-ui {
            position: absolute;
            top: 2vh; left: 0; width: 100%; padding: 0 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 99999;
            pointer-events: none; /* 빈 공간 클릭 투과 */
        }
        .global-header-ui > * { pointer-events: auto; }

        /* 좌우 상단 버튼 (핑크 배경, 흰색 텍스트/이모지 반영) */
        .top-pill-btn {
            display: flex; align-items: center; gap: 6px;
            background-color: var(--deep-pink); /* 핑크 배경 */
            border: 2px solid var(--primary-pink); border-radius: 50px;
            padding: 8px 14px; color: #ffffff; /* 흰색 텍스트 */
            font-size: 14px; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(4px); text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(243, 104, 224, 0.4);
            transition: all 0.2s;
        }
        .top-pill-btn:hover { background-color: var(--primary-pink); border-color: #ffffff; }
        .top-pill-btn img { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; }
        .top-pill-btn i { color: #ffffff !important; } /* 이모지(아이콘) 흰색 강제 처리 */
        
        .lang-text-hide-mobile { display: inline-block; }
        @media (max-width: 400px) { .lang-text-hide-mobile { display: none; } }

        /* 모달 오버레이 */
        .lang-modal-overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
            display: flex; align-items: flex-start; justify-content: center;
            padding: 4rem 1rem 1rem 1rem;
            opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-modal-overlay.active { opacity: 1; visibility: visible; }
        
        /* 모달 컨텐츠 박스 */
        .lang-modal-content {
            background-color: #111827; border: 1px solid #374151;
            border-radius: 1rem; width: 100%; max-width: 56rem;
            max-height: 85vh; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95) translateY(-10px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-modal-overlay.active .lang-modal-content { transform: scale(1) translateY(0); opacity: 1; }

        /* 모달 헤더 */
        .lang-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem; border-bottom: 1px solid #1f2937; background-color: rgba(17, 24, 39, 0.95);
        }
        .lang-modal-title { color: #ffffff; font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .lang-close-btn {
            width: 2.5rem; height: 2.5rem; border-radius: 50%; background-color: #1f2937; border: none;
            color: #9ca3af; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .lang-close-btn:hover { background-color: #374151; color: #ffffff; }

        /* 모달 검색 영역 */
        .lang-modal-search { padding: 1.25rem; background-color: #111827; position: relative; }
        .lang-search-icon { position: absolute; left: 2.25rem; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .lang-search-input {
            width: 100%; background-color: #1f2937; border: 1px solid #374151; color: #ffffff;
            border-radius: 0.75rem; padding: 0.875rem 0.875rem 0.875rem 2.75rem;
            outline: none; font-size: 0.875rem; transition: border-color 0.2s;
        }
        .lang-search-input:focus { border-color: #eab308; box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2); }

        /* 언어 그리드 목록 */
        .lang-modal-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
        .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; }
        
        .lang-item-btn {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem;
            border-radius: 0.75rem; border: 1px solid #374151; background-color: rgba(31, 41, 55, 0.4);
            cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
            text-align: left;
        }
        .lang-item-btn:hover { background-color: #374151; border-color: #6b7280; }
        .lang-item-btn.selected { background-color: #1f2937; border-color: #eab308; box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.5); }
        .lang-item-flag { width: 2rem; height: 1.5rem; object-fit: cover; border-radius: 0.25rem; border: 1px solid rgba(55,65,81,0.5); }
        .lang-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .lang-item-name { color: #ffffff; font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lang-item-btn.selected .lang-item-name { color: #facc15; }
        .lang-item-enname { color: #9ca3af; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lang-check-icon { color: #eab308; font-size: 1.125rem; margin-left: auto; }

        .lang-no-result { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 0; color: #6b7280; }
        .lang-no-result.flex { display: flex; }

        /* 모달 스크롤바 */
        .lang-modal-body::-webkit-scrollbar { width: 8px; }
        .lang-modal-body::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .lang-modal-body::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .lang-modal-body::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* 토스트 알림 */
        .lang-toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 99999;
            background-color: #1f2937; border: 1px solid #374151; border-radius: 0.75rem;
            padding: 1rem; display: flex; align-items: center; gap: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(150%); opacity: 0; transition: all 0.3s ease;
        }
        .lang-toast.show { transform: translateY(0); opacity: 1; }
        .lang-toast-icon { width: 2rem; height: 2rem; border-radius: 50%; background-color: rgba(34, 197, 94, 0.2); color: #4ade80; display: flex; justify-content: center; align-items: center; }
        .lang-toast-text { color: #ffffff; font-size: 0.875rem; font-weight: 500; }
        .lang-toast-sub { color: #9ca3af; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="global-header-ui" class="global-header-ui">
    <a href="/" target="_self" class="top-pill-btn">
        <i class="fa-solid fa-crown"></i>
        <span id="header-link-text">킹수학.com</span>
    </a>

    <button id="langTriggerBtn" class="top-pill-btn" onclick="openLangModal()">
        <i class="fa-solid fa-globe"></i>
        <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR">
        <span id="currentLangName" class="lang-text-hide-mobile">한국어</span>
        <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i>
    </button>
</div>

<div id="game-container">
    <div id="start-screen">
        <div class="main-title" data-i18n="mainTitle">🐰구구단킹 <span style="font-size:0.5em">모바일</span></div>        
        <div id="qrcode-area" onclick="toggleQR(true)"></div>
        <div class="qr-invite-text" data-i18n="qrInvite" onclick="toggleQR(true)">QR 코드로 초대하기</div>

        <div class="desc" data-i18n="desc">🕒1분 동안 친구들과 대결해봐요!</div>
        
        <input type="text" id="nickname" maxlength="8" placeholder="닉네임 입력" onfocus="this.select()" data-i18n-ph="placeholder">
        
        <button class="btn-start" onclick="startGame()" data-i18n="startBtn">🚀 게임 시작!</button>
        
        <a href="/" target="_self" class="link-btn" data-i18n="otherGamesBtn">🎲 다른 게임 하러가기</a>
        
        <div id="ranking-board">
            <div class="center" data-i18n="rankingLoading">랭킹을 불러오고 있어요... 🏃‍♂️</div>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="countdown-overlay" class="hidden"></div>

        <div class="top-bar">
            <div class="nav-btn-group">
                <button class="nav-btn" onclick="forceGoHome()" data-i18n="homeBtn">🏠 처음으로</button>
                <button class="nav-btn" onclick="forceRestart()" data-i18n="restartBtn">🔄 다시하기</button>
            </div>

            <div class="info-bar">
                <span id="game-nickname" class="info-nick" data-i18n="friend">친구</span>
                <span class="score-display">⭐ <span id="score">0</span></span>
            </div>
            
            <div id="timer-bar-bg"><div id="timer-bar"></div></div>
        </div>
        
        <div id="problem-area">
            <div id="combo-text">COMBO 0</div>
            <div id="question-text">2 x 2</div>
            <div id="input-display">
                <span id="input-text"></span>
                <span class="cursor-blink"></span>
            </div>
        </div>

        <div id="keypad">
            <button class="key-btn" onpointerdown="inputNum(1)">1</button>
            <button class="key-btn" onpointerdown="inputNum(2)">2</button>
            <button class="key-btn" onpointerdown="inputNum(3)">3</button>
            <button class="key-btn" onpointerdown="inputNum(4)">4</button>
            <button class="key-btn" onpointerdown="inputNum(5)">5</button>
            <button class="key-btn" onpointerdown="inputNum(6)">6</button>
            <button class="key-btn" onpointerdown="inputNum(7)">7</button>
            <button class="key-btn" onpointerdown="inputNum(8)">8</button>
            <button class="key-btn" onpointerdown="inputNum(9)">9</button>
            <button class="key-btn key-c" onpointerdown="inputClear()" data-i18n="keyClear">지움</button>
            <button class="key-btn" onpointerdown="inputNum(0)">0</button>
            <button class="key-btn key-ok" onpointerdown="checkAnswer()" data-i18n="keyOk">확인</button>
        </div>
    </div>

        { code: 'tr', country: 'tr', name: 'Türkçe', enName: 'Turkish' }
    ];

    // 토스트 알림 전용 16개국 번역 데이터
    const toastTranslations = {
        'ko': '언어가 변경되었습니다.', 'en': 'Language changed.', 'zh': '语言已更改。',
        'ja': '言語が変更されました。', 'es': 'Idioma cambiado.', 'fr': 'Langue modifiée.',
        'de': 'Sprache geändert.', 'it': 'Lingua cambiata.', 'pt-br': 'Idioma alterado.',
        'ru': 'Язык изменен.', 'hi': 'भाषा बदल दी गई है।', 'bn': 'ভাষা পরিবর্তন করা হয়েছে।',
        'id': 'Bahasa telah diubah.', 'vi': 'Ngôn ngữ đã thay đổi.', 'th': 'เปลี่ยนภาษาแล้ว',
        'tr': 'Dil değiştirildi.'
    };

    // --- 전역 변수 ---
    let currentLang = 'en'; 
    const GAME_TIME = 60;
    let timer = GAME_TIME;
    let score = 0;
    let currentCombo = 0;
    let currentAnswer = 0;
    let userInput = "";
    let timerInterval;
    let isGameRunning = false;
    let myNickname = "";
    let toastTimeout;

    const forbiddenWords = [
      "시발", "씨발", "개새끼", "병신", "지랄", "닥쳐", "엿먹어", "꺼져", "젠장", "빌어먹을",
      "옘병", "염병", "쓰레기", "개놈", "새끼", "죽어", "미친", "미친놈", "미친년", "개소리",
      "씹", "좆", "존나", "졸라", "개같은", "호구", "찐따", "바보", "멍청이", "등신",
      "섹스", "성관계", "자위", "보지", "자지", "야동", "강간", "변태", "콘돔", "오르가즘",
      "성폭행", "따먹", "발기", "사정", "유두", "클리", "딜도", "망가", "성노예", "창녀",
      "걸레", "룸살롱", "조건만남", "원조교제", "몸캠", "벗방", "야한", "19금",
      "느금마", "니애미", "느개비", "니애비", "앰창", "엠창", "패드립", "애미", "애비",
      "고아", "후레자식", "가정교육",
      "짱깨", "쪽발이", "맘충", "한남", "김치녀", "된장녀", "틀딱", "급식충", "장애인", "애자",
      "전라디언", "홍어", "운지", "일베", "메갈", "페미", "게이", "레즈", "트젠",
      "ㅅㅂ", "ㅆㅂ", "ㅂㅅ", "ㅈㄹ", "ㄲㅈ", "ㄷㅊ", "ㅁㅊ", "존맛", "존예", "존잘",
      "씨1발", "시1발", "개1새끼", "병1신", "좃", "젖", "뵹신", "쉬발", "슈발", "시바",
      "10새끼", "10새기", "십새끼", "시불", "썅",
    ];

    window.onload = function() {
        initLanguage();

        const currentUrl = window.location.href;
        new QRCode(document.getElementById("qrcode-area"), { text: currentUrl, width: 70, height: 70 });
        new QRCode(document.getElementById("qrcode-large"), { text: currentUrl, width: 500, height: 500 });

        const savedName = localStorage.getItem("kingsmath_nickname");
        if(savedName) document.getElementById("nickname").value = savedName;

        loadRanking();
        
        // 언어 검색 바인딩
        document.getElementById('langSearchInput').addEventListener('input', (e) => {
            renderLanguages(e.target.value);
        });
        
        // 모달 외곽 클릭 닫기
        document.getElementById('langModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('langModal')) closeLangModal();
        });

        // ESC 키 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLangModal();
        });

        // 게임 화면 터치 무브 방지 등 (기존 로직 유지)
        const gameScreen = document.getElementById("game-screen");
        gameScreen.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
        gameScreen.addEventListener('dblclick', function(e) { e.preventDefault(); });
        gameScreen.addEventListener('dragstart', function(e) { e.preventDefault(); });
        gameScreen.addEventListener('mousedown', function(e) {
            if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') e.preventDefault();
        });
    };

    // ==========================================
    // 다국어 처리 로직 (1~3순위 완벽 반영)
    // ==========================================
    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        let lang = urlParams.get('lang');

        if (!lang) lang = localStorage.getItem('kingsmath_lang');
        if (!lang) {
            const browserLang = navigator.language || navigator.userLanguage;
            lang = browserLang.substring(0, 2); 
        }

        if (!i18nData[lang]) lang = 'en'; // 기본값

        changeLang(lang, false); 
        renderLanguages();
    }

    function changeLang(langCode, updateHistory = true) {
        if (!i18nData[langCode]) return;
        currentLang = langCode;
        localStorage.setItem('kingsmath_lang', langCode);
        document.documentElement.lang = langCode;

        const data = i18nData[langCode];
        
        // 텍스트 변환 및 길이 기반 동적 폰트 조절 로직 적용
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(data[key]) {
                el.innerHTML = data[key];
                
                const textLen = el.innerText.length;
                
                // 동적 폰트 사이즈 조정
                if (el.classList.contains('btn-start')) {
                    if (textLen > 18) el.style.fontSize = '3vh';
                    else if (textLen > 12) el.style.fontSize = '4vh';
                    else el.style.fontSize = '5vh';
                } else if (el.classList.contains('main-title')) {
                    if (textLen > 18) el.style.fontSize = '4.5vh';
                    else if (textLen > 12) el.style.fontSize = '6vh';
                    else el.style.fontSize = '8vh';
                } else if (el.classList.contains('desc')) {
                    if (textLen > 25) el.style.fontSize = '2.2vh';
                    else el.style.fontSize = '3vh';
                }
            }
        });

        // 기타 UI 업데이트
        document.getElementById("nickname").placeholder = data.placeholder;
        document.title = data.pageTitle;
        document.querySelector('meta[name="description"]').setAttribute("content", data.metaDesc);
        
        // 상단 링크 (킹수학 vs KingsMath)
        document.getElementById('header-link-text').innerText = (langCode === 'ko') ? "킹수학.com" : "KingsMath.com";

        // 언어 버튼 정보 갱신
        const langObj = languages.find(l => l.code === langCode);
        if(langObj) {
            document.getElementById("currentFlag").src = `https://flagcdn.com/w40/${langObj.country}.png`;
            document.getElementById("currentLangName").innerText = langObj.name;
        }

        if (updateHistory) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', langCode);
            window.history.pushState({}, '', newUrl);
        }
    }

    // 모달 렌더링
    function renderLanguages(filterText = '') {
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('langNoResult');
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.style.display = 'none';
            noResult.classList.add('flex');
        } else {
            grid.style.display = 'grid';
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const btn = document.createElement('div');
                btn.className = `lang-item-btn ${isSelected ? 'selected' : ''}`;
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

                btn.innerHTML = `
                    <img src="${flagUrl}" alt="${lang.country}" class="lang-item-flag">
                    <div class="lang-item-info">
                        <span class="lang-item-name">${lang.name}</span>
                        <span class="lang-item-enname">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check lang-check-icon"></i>' : ''}
                `;

                btn.addEventListener('click', () => {
                    changeLang(lang.code);
                    closeLangModal();
                    showToast(lang.name, lang.code);
                    renderLanguages(document.getElementById('langSearchInput').value); // 갱신
                });
                grid.appendChild(btn);
            });
        }
    }

    function openLangModal() {
        document.getElementById('langModal').classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('langSearchInput').focus(), 100);
    }

    function closeLangModal() {
        document.getElementById('langModal').classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, langCode) {
        const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
        document.getElementById('ui-toast').textContent = toastMsg;
        document.getElementById('toastLangName').textContent = langName;
        
        const toast = document.getElementById('toastNotification');
        toast.classList.add('show');
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    // ==========================================
    // 게임 로직 및 풀스크린 제어
    // ==========================================
    document.addEventListener('keydown', function(event) {
        if(!isGameRunning) return; 
        if(event.key >= '0' && event.key <= '9') inputNum(event.key);
        else if(event.key === 'Enter') checkAnswer();
        else if(event.key === 'Backspace') {
            if(userInput.length > 0) {
                userInput = userInput.slice(0, -1);
                updateInputDisplay();
            }
        }
        else if(event.key === 'Delete' || event.key === 'Escape') inputClear();
    });

    function toggleQR(show) {
        const modal = document.getElementById('qr-modal');
        if(show) modal.classList.remove('hidden');
        else modal.classList.add('hidden');
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }
    
    function playSound(type) {
        if (type === 'start') { playTone(600, 'sine', 0.1); setTimeout(()=>playTone(1200, 'sine', 0.4), 100); }
        else if (type === 'correct') { playTone(1046, 'sine', 0.1); setTimeout(()=>playTone(2093, 'triangle', 0.1), 100); }
        else if (type === 'wrong') { playTone(200, 'sawtooth', 0.1); setTimeout(()=>playTone(150, 'sawtooth', 0.3), 100); } 
        else if (type === 'timer') { playTone(800, 'square', 0.05); }
        else if (type === 'count') { playTone(440, 'sine', 0.2); }
        else if (type === 'go') { playTone(880, 'square', 0.4); } 
        else if (type === 'gameover') {
            playTone(523.25, 'triangle', 0.1); 
            setTimeout(() => playTone(659.25, 'triangle', 0.1), 100); 
            setTimeout(() => playTone(783.99, 'triangle', 0.1), 200); 
            setTimeout(() => playTone(1046.50, 'triangle', 0.6), 300); 
        }
    }

    function startGame() {
        const nameInput = document.getElementById("nickname").value.trim();
        const txt = i18nData[currentLang]; 

        if(nameInput.length < 1) { 
            alert(txt.alertName); 
            document.getElementById("nickname").focus();
            return; 
        }
        
        let cleanName = nameInput.replace(/[^a-zA-Z0-9가-힣]/g, "");
        
        for(let bad of forbiddenWords) {
            if(cleanName.includes(bad)) {
                alert(txt.alertBadWord);
                document.getElementById("nickname").value = "";
                return;
            }
        }

        localStorage.setItem("kingsmath_nickname", cleanName);
        myNickname = cleanName;
        document.getElementById("game-nickname").innerText = myNickname;

        // 게임 시작 시 상단 글로벌 언어 UI 숨김
        document.getElementById("global-header-ui").classList.add("hidden");

        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        
        startCountdown();
    }

    function startCountdown() {
        const overlay = document.getElementById("countdown-overlay");
        overlay.classList.remove("hidden");
        
        let count = 3;
        overlay.innerText = count;
        playSound('count');

        const countInterval = setInterval(() => {
            count--;
            if(count > 0) {
                overlay.innerText = count;
                playSound('count');
            } else if (count === 0) {
                overlay.innerText = i18nData[currentLang].start; 
                playSound('go');
            } else {
                clearInterval(countInterval);
                overlay.classList.add("hidden");
                realGameStart(); 
            }
        }, 1000);
    }

    function realGameStart() {
        resetGameVars();
        nextProblem();
        startTimer();
    }

    function resetGameVars() {
        if(timerInterval) clearInterval(timerInterval);
        score = 0; currentCombo = 0; timer = GAME_TIME; userInput = "";
        updateScoreUI(); updateInputDisplay();
        document.getElementById("timer-bar").style.width = "100%";
        document.getElementById("timer-bar").style.backgroundColor = "#badc58";
    }

    function startTimer() {
        isGameRunning = true;
        timerInterval = setInterval(() => {
            timer--;
            const percent = (timer / GAME_TIME) * 100;
            const bar = document.getElementById("timer-bar");
            bar.style.width = percent + "%";

            if (timer <= 10) {
                bar.style.backgroundColor = "#ff6b81";
                if(timer <= 5) playSound('timer');
            }
            if (timer <= 0) endGame();
        }, 1000);
    }

    function nextProblem() {
        userInput = ""; updateInputDisplay();
        const num1 = Math.floor(Math.random() * 8) + 2; 
        const num2 = Math.floor(Math.random() * 9) + 1;
        currentAnswer = num1 * num2;
        document.getElementById("question-text").innerText = `${num1} × ${num2}`;
    }

    function updateInputDisplay() { document.getElementById("input-text").innerText = userInput; }

    function inputNum(n) {
        if(!isGameRunning) return;
        if(userInput.length > 2) return;
        userInput += n;
        updateInputDisplay();
    }
    
    function inputClear() { userInput = ""; updateInputDisplay(); }

    function checkAnswer() {
        if(!isGameRunning || userInput === "") return;
        const userVal = parseInt(userInput);
        
        if (userVal === currentAnswer) {
            playSound('correct'); currentCombo++;
            const bonus = currentCombo * 5; 
            score += (10 + bonus);
            showComboEffect(); nextProblem();
        } else {
            playSound('wrong'); currentCombo = 0;
            score -= 5; if(score < 0) score = 0;
            
            const container = document.getElementById("game-container");
            container.classList.add("shake", "bg-red");
            setTimeout(() => container.classList.remove("shake", "bg-red"), 300);
            
            const textEl = document.getElementById("input-text");
            textEl.style.color = "#ff0000"; 
            textEl.innerText = currentAnswer; 
            userInput = ""; 

            setTimeout(() => { textEl.style.color = ""; nextProblem(); }, 500);
        }
        updateScoreUI();
    }

    function showComboEffect() {
        const comboEl = document.getElementById("combo-text");
        const txt = i18nData[currentLang].combo;
        if(currentCombo > 1) {
            comboEl.innerText = `${currentCombo} ${txt}`;
            comboEl.classList.add("combo-active");
            setTimeout(() => comboEl.classList.remove("combo-active"), 500);
        } else {
            comboEl.innerText = "";
        }
    }

    function updateScoreUI() { document.getElementById("score").innerText = score; }

    function endGame() {
        clearInterval(timerInterval);
        isGameRunning = false;
        playSound('gameover');

        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        
        document.getElementById("res-nickname").innerText = myNickname;
        document.getElementById("res-score").innerText = score;
        submitScore(myNickname, score);
    }

    function restartGame() { startGame(); }

    function goHome() {
        if (document.fullscreenElement) {
            // 전체 화면 모드일 때 새로고침 대신 초기화 로직 실행
            if(timerInterval) clearInterval(timerInterval);
            isGameRunning = false;
            
            // 글로벌 언어 UI 다시 보이기
            document.getElementById("global-header-ui").classList.remove("hidden");

            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("start-screen").classList.remove("hidden");
            
            loadRanking();
            if(window.playSound) window.playSound('click');
        } else {
            // 전체 화면이 아닐 땐 즉시 새로고침
            location.reload();
        }
    }

    function forceGoHome() { goHome(); }

    function forceRestart() {
        if(timerInterval) clearInterval(timerInterval);
        isGameRunning = false;
        restartGame();
    }

    // --- 서버 통신 ---
    const API_URL = "./ranking.php";

    function submitScore(name, score) {
        const txt = i18nData[currentLang];
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `action=submit&nickname=${encodeURIComponent(name)}&score=${score}`
        })
        .then(res => res.json())
        .then(data => {
            if(data.rank) {
                let msg = txt.rankResult.replace('{rank}', data.rank);
                document.getElementById("res-rank").innerText = msg;
            } else {
                document.getElementById("res-rank").innerText = txt.rankSaved;
            }
        })
        .catch(e => {
            document.getElementById("res-rank").innerText = txt.rankErr;
        });
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const txt = i18nData[currentLang];

        fetch(API_URL + "?action=list")
        .then(res => res.json())
        .then(data => {
            let html = "";
            if(data.length === 0) {
                html = `<div class='center' style='padding:20px;'>${txt.rankingEmpty}</div>`;
            } else {
                data.forEach((item, index) => {
                    let rankHtml = "";
                    if(index < 3) {
                        let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : "🥉";
                        rankHtml = `<span style="width:20%; text-align:center; font-size:1.5em; line-height:1;">${medal}</span>`;
                    } else {
                        rankHtml = `<span style="width:20%; text-align:center; color:#ff9ff3; font-weight:bold;">${index+1}</span>`;
                    }
                    html += `<div class="rank-item">
                        ${rankHtml}
                        <span style="width:50%; padding-left:10px;">${item.nickname}</span>
                        <span style="width:30%; text-align:right; color:#888;">${item.score}</span>
                    </div>`;
                });
            }
            list.innerHTML = html;
        })
        .catch(err => {
            list.innerHTML = `<div class='center' style='padding:10px;'>${txt.rankingError}</div>`;
        });
    }
</script>
