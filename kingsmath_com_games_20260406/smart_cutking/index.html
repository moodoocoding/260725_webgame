<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컷킹 모바일 - 킹수학</title>
    <meta name="description" content="60초 동안 미션에 맞춰 도형을 잘라라! 컷킹 모바일 게임." id="meta-desc">
    <meta name="keywords" content="도형자르기, 수학게임, 킹수학, 초등수학" id="meta-keywords">
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* --- [1] 기본 설정 (핑크 톤 테마 유지) --- */
        :root {
            --bg-color: #FFF0F5;        
            --bg-pattern: #FFB7B2;       
            --main-accent: #FF69B4;     
            --soft-pink: #FFC0CB;        
            --neon-pink: #FF6B6B;        
            --neon-blue: #4D96FF;        
            --neon-green: #00D26A;       
            --text-color: #5D4037;       
            --stitch-border: 3px dashed #fff; 
            --box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--bg-pattern) 2px, transparent 2px);
            background-size: 20px 20px;
            color: var(--text-color);
            font-family: 'Jua', sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 공통 유틸리티 */
        .hidden { display: none !important; }
        .flex-center { display: flex; justify-content: center; align-items: center; }
        button { font-family: inherit; cursor: pointer; border: none; outline: none; }
        
        /* 다국어 동적 폰트 조절용 클래스 */
        .dynamic-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            display: block;
        }

        /* 모바일 컨테이너 */
        #app-container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
            display: flex;
            flex-direction: column;
            border-left: 5px solid #FFC0CB;
            border-right: 5px solid #FFC0CB;
        }

        /* --- [2] 시작 화면 --- */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-top: 60px;
            text-align: center;
            width: 100%;
        }

        /* 좌측 상단 링크 버튼 */
        .top-link {
            position: absolute;
            top: 15px;
            left: 20px;
            color: var(--main-accent);
            text-decoration: none;
            font-size: 16px;
            z-index: 100;
            border-bottom: 2px dashed var(--main-accent);
            padding-bottom: 2px;
            font-family: 'Jua', sans-serif;
        }

        /* [요구사항 13] 좌측 링크와 디자인 대칭을 이루는 우측 상단 다국어 버튼 */
        #langTriggerBtn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--main-accent);
            font-size: 16px;
            background: transparent;
            border: none;
            border-bottom: 2px dashed var(--main-accent);
            padding: 0 0 2px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            z-index: 99999;
            font-family: 'Jua', sans-serif;
        }

        .main-title {
            font-size: 45px!important; color: var(--main-accent);
            text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff;
            margin-bottom: 5px; width: 100%; line-height: 1.2; letter-spacing: -1px;
            padding: 0 10px;
        }
        .small-title { font-size: 32px !important; } 

        .sub-desc {
            font-size: 18px; color: #888; background: #fff;
            padding: 5px 15px; border-radius: 20px; border: 2px dashed #FFB7B2;
            margin-bottom: 15px; display: inline-block;
        }
        .small-text { font-size: 14px !important; }

        /* QR 섹션 */
        .qr-section {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 25px; cursor: pointer;
        }
        #qr-small {
            width: 80px; height: 80px; border-radius: 15px;
            border: 4px dashed var(--main-accent);
            transition: transform 0.2s; background: white; padding: 5px;
        }
        #qr-small:hover { transform: scale(1.1) rotate(5deg); }
        .qr-hint { font-size: 12px; color: var(--main-accent); margin-top: 5px; font-weight: bold; }

        #qr-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.9); z-index: 9999; cursor: pointer;
        }
        #qr-large { width: 80vw; max-width: 300px; border-radius: 10px; }
        
        .input-group {
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        input#nickname {
            width: 90%; padding: 15px; font-size: 22px; text-align: center;
            border-radius: 25px; border: 3px dashed var(--main-accent);
            background: #fff; color: var(--text-color); font-family: inherit;
            box-shadow: 0 4px 0 rgba(255, 105, 180, 0.2);
            outline: none;
        }
        input#nickname::placeholder { color: #FFB7B2; }
        
        .btn-start {
            width: 90%; padding: 15px; font-size: 26px; border-radius: 50px;
            background: var(--main-accent); color: white; border: 2px dashed #fff;
            box-shadow: 0 5px 0 #D04F90; transition: transform 0.1s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 1px 0 #D04F90; }

        #ranking-area {
            width: 95%; margin-top: 30px; background: #fff;
            border-radius: 20px; border: 3px solid #FFC0CB; padding: 15px;
            box-shadow: var(--box-shadow); position: relative;
            margin-bottom: 30px;
        }
        #ranking-area::before {
            content: ''; position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%) rotate(-2deg); width: 100px; height: 25px;
            background: rgba(255,255,255,0.6); border: 1px dotted #ccc;
        }

        .rank-header { 
            font-size: 20px; color: var(--main-accent); margin-bottom: 10px; 
            border-bottom: 2px dashed #FFEFF4; padding-bottom: 5px;
        }
        
        #ranking-list {
            height: 300px; overflow-y: auto; text-align: left;
        }
        #ranking-list::-webkit-scrollbar { width: 5px; }
        #ranking-list::-webkit-scrollbar-thumb { background: #FFC0CB; border-radius: 10px; }
        
        .rank-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; border-bottom: 1px dashed #eee; font-size: 16px;
        }
        .rank-num {
            display: inline-block; width: 24px; height: 24px; line-height: 24px;
            text-align: center; font-size: 13px; color: white;
            background: #FFC0CB; border-radius: 50%; font-weight: bold;
        }

        /* --- [3] 게임 화면 --- */
        #game-screen {
            flex: 1; position: relative; display: flex; flex-direction: column;
            overflow: hidden; height: 100vh;
        }

        /* 상단 HUD */
        .top-hud {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: rgba(255,255,255,0.8);
            border-bottom: 2px dashed #FFB7B2; z-index: 50; font-size: 20px;
        }
        .hud-item { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .btn-home-emoji { font-size: 24px; background: none; border: none; padding: 0; cursor: pointer; }
        .val-time { color: var(--neon-pink); }
        .val-score { color: var(--neon-green); }

        /* 미션 박스 */
        .mission-wide-box {
            width: 96%; margin: 10px auto 5px auto; background: #FFF0F5;
            border-radius: 15px; padding: 10px; text-align: center;
            border: 3px dashed #FFB7B2; white-space: nowrap; 
        }
        .mission-label { font-size: 14px; color: #888; margin-right: 10px;}
        .target-val {
            font-size: 32px; color: var(--main-accent); display: inline-block;
            text-shadow: 2px 2px 0 #fff; font-weight: bold; line-height: 1;
        }
        
        /* 분수 스타일 */
        .fraction { display: inline-block; vertical-align: middle; text-align: center; font-size: 0.8em; }
        .fraction sup { display: block; border-bottom: 2px solid currentColor; padding-bottom: 2px; }
        .fraction sub { display: block; padding-top: 2px; }

        /* 캔버스 영역 */
        #canvas-container {
            position: relative; width: 96%; margin: 5px auto;
            height: 50vh; 
            background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 20px 20px; background-color: #fff;
            border-radius: 30px; border: 4px solid #FFC0CB;
            overflow: hidden; touch-action: none; cursor: crosshair;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* 하단 설명 텍스트 */
        #bottom-instruction {
            position: absolute; bottom: 20px; width: 90%; left: 5%;
            text-align: center; background: rgba(255, 240, 245, 0.9);
            padding: 10px; border-radius: 20px; border: 2px dashed var(--main-accent);
            color: var(--text-color); font-weight: bold; pointer-events: none;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* 피드백 오버레이 */
        #feedback-overlay {
            position: absolute; top: 10%; left: 50%;
            transform: translateX(-50%) scale(0);
            text-align: center; pointer-events: none; z-index: 100;
            opacity: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .fb-angle { 
            font-size: 40px; color: var(--text-color); margin-bottom: 5px; 
            font-weight: bold; background: rgba(255,255,255,0.8);
            padding: 0 10px; border-radius: 10px;
        }
        .fb-diff { 
            font-size: 20px; font-weight: bold; padding: 8px 20px; 
            border-radius: 20px; background: white; display: inline-block;
            border: 2px solid #ddd; box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }
        .fb-score {
            font-size: 24px; font-weight: bold; margin-top: 8px;
            color: var(--main-accent); background: rgba(255, 255, 255, 0.95);
            padding: 5px 15px; border-radius: 15px; border: 2px solid #FFC0CB;
        }
        .fb-good { color: var(--neon-green); border-color: var(--neon-green); background: #E8F5E9; }
        .fb-bad { color: var(--neon-pink); border-color: var(--neon-pink); background: #FFEBEE; }
        
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .pop-out { animation: popOut 0.3s ease-in forwards; }

        @keyframes popIn {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            80% { transform: translateX(-50%) scale(1.1); opacity: 1; }
            100% { transform: translateX(-50%) scale(1.0); opacity: 1; }
        }
        @keyframes popOut {
            0% { transform: translateX(-50%) scale(1.0); opacity: 1; }
            100% { transform: translateX(-50%) scale(0); opacity: 0; }
        }

        #countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            color: var(--main-accent);
            font-size: 100px; font-weight: bold;
            text-shadow: 4px 4px 0 #fff, 0 0 20px rgba(255,105,180,0.5);
        }

        /* --- [4] 결과 화면 --- */
        #result-screen {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(255, 240, 245, 0.95); z-index: 200;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .res-title { font-size: 36px; margin-bottom: 10px; color: var(--text-color); }
        .res-score { font-size: 70px; color: var(--main-accent); font-weight: bold; margin-bottom: 20px; text-shadow: 3px 3px 0 #fff; }
        .res-msg { 
            font-size: 18px; color: #888; margin-bottom: 40px; 
            background: white; padding: 10px 20px; border-radius: 15px; border: 2px dashed #FFB7B2;
        }
        .btn-group { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; }


        /* =========================================================
           [다국어 언어 모달 전용 독립 CSS - 절대 게임 CSS와 충돌 방지]
           ========================================================= */
        #langModal, #langModal * { box-sizing: border-box !important; }
        
        /* 폰트어썸 깨짐 방지 예외처리 */
        .fa, .fas, .fa-solid, .fa-regular { 
            font-family: "Font Awesome 6 Free" !important; 
            font-weight: 900 !important; 
        }

        .gl-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .gl-modal-overlay.active { opacity: 1; visibility: visible; }
        
        .gl-modal-content {
            background: #1f2937; border: 1px solid #374151; border-radius: 16px;
            width: 90%; max-width: 800px; max-height: 85vh; display: flex; flex-direction: column;
            transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            font-family: sans-serif; /* 모달 내부는 기본 폰트 적용 */
        }
        .gl-modal-overlay.active .gl-modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .gl-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px; border-bottom: 1px solid #374151; background: #1f2937;
            border-top-left-radius: 16px; border-top-right-radius: 16px;
        }
        .gl-modal-header h2 { margin: 0; font-size: 20px; color: #fff; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .gl-modal-close-btn {
            background: #374151; border: none; width: 36px; height: 36px; border-radius: 50%;
            color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .gl-modal-close-btn:hover { background: #4b5563; color: #fff; }

        .gl-modal-search { padding: 20px; background: #1f2937; position: relative; }
        .gl-modal-search input {
            width: 100%; padding: 14px 14px 14px 44px; background: #374151; border: 1px solid #4b5563;
            color: #fff; border-radius: 12px; font-size: 15px; outline: none; transition: border 0.2s;
            box-shadow: none; font-family: sans-serif;
        }
        .gl-modal-search input:focus { border-color: #eab308; }
        .gl-modal-search i { position: absolute; left: 36px; top: 50%; transform: translateY(-50%); color: #9ca3af; }

        .gl-modal-body {
            padding: 0 20px 20px 20px; overflow-y: auto; flex: 1;
        }
        .gl-modal-body::-webkit-scrollbar { width: 8px; }
        .gl-modal-body::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .gl-modal-body::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }

        .gl-lang-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
        }
        .gl-lang-card {
            display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(55, 65, 81, 0.4);
            border: 1px solid #374151; border-radius: 12px; cursor: pointer; transition: all 0.2s;
        }
        .gl-lang-card:hover { background: #374151; border-color: #6b7280; }
        .gl-lang-card.selected { background: #1f2937; border-color: #eab308; box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.5); }
        .gl-lang-card img { width: 32px; height: 24px; border-radius: 4px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .gl-lang-info { display: flex; flex-direction: column; overflow: hidden; }
        .gl-lang-name { color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gl-lang-card.selected .gl-lang-name { color: #fde047; }
        .gl-lang-en-name { color: #9ca3af; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gl-lang-check { margin-left: auto; color: #eab308; font-size: 16px; }

        .gl-toast-noti {
            position: fixed; bottom: 24px; right: 24px; background: #1f2937; border: 1px solid #374151;
            padding: 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); z-index: 99999;
            transform: translateY(150%); opacity: 0; transition: all 0.3s ease;
            font-family: sans-serif;
        }
        .gl-toast-noti.show { transform: translateY(0); opacity: 1; }
        .gl-toast-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(34, 197, 94, 0.2); color: #4ade80; display: flex; align-items: center; justify-content: center; }
        .gl-toast-text p { margin: 0; color: #fff; font-size: 14px; font-weight: 500; }
        .gl-toast-text span { color: #9ca3af; font-size: 12px; }
        
        #gl-noResultMsg { display: none; flex-direction: column; align-items: center; padding: 40px 0; color: #6b7280; font-family: sans-serif; }
        #gl-noResultMsg i { font-size: 36px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div id="langModal" class="gl-modal-overlay">
    <div class="gl-modal-content">
        <div class="gl-modal-header">
            <h2><i class="fa-solid fa-language" style="color:#eab308;"></i> Language / 언어</h2>
            <button class="gl-modal-close-btn" onclick="closeLangModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="gl-modal-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="langSearchInput" placeholder="Search / 검색 ...">
        </div>
        <div class="gl-modal-body">
            <div id="langGrid" class="gl-lang-grid"></div>
            <div id="gl-noResultMsg">
                <i class="fa-regular fa-face-frown-open"></i>
                <p>No results / 검색 결과 없음</p>
            </div>
        </div>
    </div>
</div>

<div id="langToast" class="gl-toast-noti">
    <div class="gl-toast-icon"><i class="fa-solid fa-check"></i></div>
    <div class="gl-toast-text">
        <p id="toastMsg">언어가 변경되었습니다.</p>
        <span id="toastSub">Korean</span>
    </div>
</div>


<div id="qr-modal" class="hidden flex-center" onclick="closeQrModal()">
    <div class="qr-modal-content">
        <img id="qr-large" src="" alt="QR Code Large">
        <div id="modal-close-hint" style="color:var(--text-color); margin-top:20px; font-size:20px;">터치하면 닫힙니다 🐰</div>
    </div>
</div>

<div id="app-container">

    <div id="start-screen">
        <a href="/" target="_self" id="top-link-anchor" class="top-link">킹수학.com</a>
        
        <button id="langTriggerBtn" onclick="openLangModal()">
            <img id="currentFlag" src="https://flagcdn.com/w40/kr.png" alt="KR" style="width: 18px; height: 13px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.1);">
            <span id="currentLangName">한국어</span>
            <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
        </button>

        <div style="margin-top: 20px;">
            <div class="main-title dynamic-text" id="main-title" data-lang-key="title">✂️컷킹 <span style="font-size:0.6em;">모바일</span></div>
            <div class="sub-desc dynamic-text" id="sub-desc" data-lang-key="desc">60초 동안 미션만큼 잘라내!</div>
            
            <div class="qr-section" onclick="openQrModal()">
                <img id="qr-small" src="" alt="QR Code">
                <div class="qr-hint dynamic-text" id="qr-hint" data-lang-key="invite">QR 코드로 친구 초대하기 🎀</div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="nickname" maxlength="8" placeholder="닉네임 입력">
            <button class="btn-start dynamic-text" onclick="startGame()" id="btn-start" data-lang-key="start">💖 게임 시작</button>
            <a href="/" target="_self" id="btn-other" data-lang-key="other_games" style="font-size: 14px; color: #888; text-decoration: none; background: white; padding: 8px 16px; border-radius: 20px; border: 1px solid #ddd;">🎮 다른 게임 고르기</a>
        </div>

        <div id="ranking-area">

    let currentLang = 'en';
    
    // 모달 및 토스트 변수
    const langModal = document.getElementById('langModal');
    const langGrid = document.getElementById('langGrid');
    const langSearchInput = document.getElementById('langSearchInput');
    const noResultMsg = document.getElementById('gl-noResultMsg');
    const langToast = document.getElementById('langToast');
    let toastTimer;

    // 언어 감지 및 초기화 (우선순위: URL -> LocalStorage -> Browser)
    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        const storedLang = localStorage.getItem('kingsmath_lang');
        const navLang = navigator.language.substring(0, 2);

        if (urlLang && I18N[urlLang]) currentLang = urlLang;
        else if (storedLang && I18N[storedLang]) currentLang = storedLang;
        else if (['ko','en','zh','ja','es','fr','ru','id','vi','th','pt','hi','bn','tr','de','it'].includes(navLang)) {
            if (navLang === 'zh') currentLang = 'zh';
            else if (navLang === 'ja') currentLang = 'ja';
            else if (navLang === 'pt') currentLang = 'pt-br';
            else currentLang = navLang;
        } else currentLang = 'en';

        applyLanguage(currentLang);
    }

    // 모달에 언어 리스트 렌더링
    function renderLanguages(filterText = '') {
        langGrid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            langGrid.style.display = 'none';
            noResultMsg.style.display = 'flex';
        } else {
            langGrid.style.display = 'grid';
            noResultMsg.style.display = 'none';

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                
                const card = document.createElement('div');
                card.className = `gl-lang-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <img src="${flagUrl}" alt="${lang.country}">
                    <div class="gl-lang-info">
                        <span class="gl-lang-name">${lang.name}</span>
                        <span class="gl-lang-en-name">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check gl-lang-check"></i>' : ''}
                `;
                card.onclick = () => selectLanguage(lang.code, lang.name, flagUrl);
                langGrid.appendChild(card);
            });
        }
    }

    function selectLanguage(langCode, langName, flagUrl) {
        changeLang(langCode, flagUrl, langName);
        closeLangModal();
        
        // 토스트 알림 띄우기
        const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
        document.getElementById('toastMsg').innerText = toastMsg;
        document.getElementById('toastSub').innerText = langName;
        
        langToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => langToast.classList.remove('show'), 3000);
    }

    function changeLang(lang, flagUrl = null, langName = null) {
        if(!I18N[lang]) return;
        currentLang = lang;
        
        // State 유지 & URL 업데이트
        localStorage.setItem('kingsmath_lang', lang);
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('lang', lang);
        window.history.pushState({}, '', newUrl);
        
        applyLanguage(lang, flagUrl, langName);
    }

    function applyLanguage(lang, flagUrl = null, langName = null) {
        const data = I18N[lang];
        
        // 메인 텍스트 번역 적용
        const elements = document.querySelectorAll('[data-lang-key]');
        elements.forEach(el => {
            const key = el.getAttribute('data-lang-key');
            if (data[key]) {
                el.innerHTML = data[key];
                if (data[key].length > 50) el.classList.add('small-text');
                else el.classList.remove('small-text');
            }
        });
        
        const mainTitle = document.getElementById('main-title');
        if (data.title.length > 60) mainTitle.classList.add('small-title');
        else mainTitle.classList.remove('small-title');

        document.getElementById('nickname').placeholder = data.placeholder;
        document.getElementById('modal-close-hint').innerText = data.modal_close;
        
        // 버튼 업데이트 (좌측 버튼과 대칭)
        if(flagUrl && langName) {
            document.getElementById("currentFlag").src = flagUrl;
            document.getElementById("currentLangName").innerText = langName;
        } else {
            const langObj = languages.find(l => l.code === lang);
            document.getElementById("currentFlag").src = `https://flagcdn.com/w40/${langObj.country}.png`;
            document.getElementById("currentLangName").innerText = langObj.name;
        }

        // 링크/도메인 하드코딩 업데이트 (_self 적용)
        const linkBtn = document.getElementById("top-link-anchor");
        if(lang === 'ko') { 
            linkBtn.innerText = "킹수학.com"; 
            document.body.style.fontFamily = "'Jua', sans-serif"; // 기존 한국어 폰트
        } else { 
            linkBtn.innerText = "KingsMath.com"; 
            document.body.style.fontFamily = "sans-serif"; // 타언어 기본 폰트
        }
        
        // SEO 메타 태그 업데이트
        document.documentElement.lang = lang; 
        document.title = data.metaTitle; 
        document.getElementById('meta-desc').setAttribute('content', data.metaDesc);

        adjustFontSize();
        generateQRCode();
        if(!isGameRunning) loadRanking();
    }

    // 동적 폰트 크기 조절 기능
    function adjustFontSize() {
        document.querySelectorAll('.dynamic-text').forEach(el => {
            el.style.fontSize = ''; 
            setTimeout(() => {
                let parentWidth = el.parentElement.clientWidth;
                if(parentWidth === 0) return;
                let fontSize = parseFloat(window.getComputedStyle(el).fontSize);
                while (el.scrollWidth > parentWidth - 20 && fontSize > 10) {
                    fontSize -= 1;
                    el.style.fontSize = fontSize + 'px';
                }
            }, 50);
        });
    }

    // 언어 모달 제어
    function openLangModal() {
        langModal.classList.add('active');
        document.body.style.overflow = 'hidden'; 
        renderLanguages();
        // setTimeout(() => langSearchInput.focus(), 100);
    }
    function closeLangModal() {
        langModal.classList.remove('active');
        document.body.style.overflow = '';
    }

    langSearchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });
    langModal.addEventListener('click', (e) => { if (e.target === langModal) closeLangModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && langModal.classList.contains('active')) closeLangModal(); });

    /* --- [게임 전역 변수 및 캔버스] --- */
    const GAME_TIME_LIMIT = 60; 
    let timer = GAME_TIME_LIMIT;
    let score = 0;
    
    // 컷킹 전용 변수
    let targetRatio = 0.5;
    let shapeType = 'rect';
    let totalPixels = 0;
    
    let isGameRunning = false;
    let isDrawing = false;
    let path = [];

    let lastDrawSoundTime = 0; 
    
    let fbTimeout1 = null;
    let fbTimeout2 = null;

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const ghostCanvas = document.createElement('canvas');
    const ghostCtx = ghostCanvas.getContext('2d', { willReadFrequently: true });

    let cx, cy, baseSize; 

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    window.onload = function() {
        initLanguage();
        const savedName = localStorage.getItem("kingsmath_nickname");
        if(savedName) document.getElementById("nickname").value = savedName;
        window.addEventListener('resize', initCanvasSize);

        canvas.addEventListener('pointerdown', handleStart);
        canvas.addEventListener('pointermove', handleMove);
        canvas.addEventListener('pointerup', handleEnd);
        canvas.addEventListener('pointerleave', handleEnd);
    };

    function generateQRCode() {
        const currentUrl = window.location.href;
        const encodedUrl = encodeURIComponent(currentUrl);
        const qrBaseUrl = "https://api.qrserver.com/v1/create-qr-code/?color=000000&bgcolor=ffffff&data=" + encodedUrl;        
        document.getElementById('qr-small').src = qrBaseUrl + "&size=100x100";
        document.getElementById('qr-large').src = qrBaseUrl + "&size=500x500";
    }

    function openQrModal() { document.getElementById('qr-modal').classList.remove('hidden'); }
    function closeQrModal() { document.getElementById('qr-modal').classList.add('hidden'); }

    function initCanvasSize() {
        const container = document.getElementById('canvas-container');
        const w = container.clientWidth;
        const h = container.clientHeight;
        
        canvas.width = w; canvas.height = h;
        ghostCanvas.width = w; ghostCanvas.height = h;
        
        cx = w / 2;
        cy = h / 2;
        baseSize = Math.min(w, h) * 0.7;
        
        if(isGameRunning && !waitingNext) redrawGame();
    }

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playTone(freq, type, duration) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime); 
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }
    
    function playCutSound() { playTone(400, 'sawtooth', 0.1); setTimeout(()=>playTone(200, 'sawtooth', 0.1), 50); }

    function startGame() {
        const nameInput = document.getElementById("nickname").value.trim();
        const langData = I18N[currentLang];

        if(nameInput.length < 1) { alert(langData.alert_nick); return; }

        const forbiddenWords = ["시발","씨발","병신","지랄","개새끼","섹스","자위","보지","자지","fuck","shit","sex"];
        const cleanNickname = nameInput.replace(/[^a-zA-Z0-9가-힣]/g, "").toLowerCase();
        for (let word of forbiddenWords) {
            if (cleanNickname.includes(word)) {
                alert(langData.alert_bad);
                document.getElementById("nickname").value = "";
                return;
            }
        }

        localStorage.setItem("kingsmath_nickname", nameInput);
        initAudio();

        // 게임 시작 시 몰입을 위해 언어 선택 모달 트리거 버튼 숨김
        document.getElementById('langTriggerBtn').style.display = 'none';

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        startCountdown(); 
    }

    function resetGame() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        startCountdown();
    }

    function startCountdown() {
        const cntEl = document.getElementById('countdown-overlay');
        cntEl.classList.remove('hidden');
        let count = 3;
        cntEl.innerText = count;

        isGameRunning = false;
        clearInterval(gameInterval);

        const timerId = setInterval(() => {
            count--;
            if(count > 0) {
                cntEl.innerText = count;
                playTone(800, 'square', 0.1); 
            } else if (count === 0) {
                cntEl.innerText = "CUT!✂️";
                playTone(1200, 'square', 0.2);
            } else {
                clearInterval(timerId);
                cntEl.classList.add('hidden');
                resetGameLogic(); 
            }
        }, 1000);
    }

    // [전체화면 홈 버튼 요구사항 적용]
    function goHome() {
        // 1. 만약 전체 화면 모드라면
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            // 새로고침 대신 화면 초기화 로직 실행 (전체 화면 유지)
            isGameRunning = false;
            clearInterval(gameInterval);
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // 화면 전환 및 버튼 원상 복구
            document.getElementById('langTriggerBtn').style.display = 'flex';
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('countdown-overlay').classList.add('hidden'); 
            
            loadRanking();
            if (window.playSound) window.playSound('click'); // 효과음 호환성 유지
        } else {
            // 2. 전체 화면이 아니라면 그냥 새로고침
            location.reload();
        }
    }

    function resetGameLogic() {
        if(fbTimeout1) clearTimeout(fbTimeout1);
        if(fbTimeout2) clearTimeout(fbTimeout2);
        
        const fbOverlay = document.getElementById('feedback-overlay');
        fbOverlay.classList.remove('pop-in', 'pop-out');
        fbOverlay.style.opacity = 0;

        score = 0;
        timer = GAME_TIME_LIMIT;
        isGameRunning = true;
        waitingNext = false;
        
        updateUI();
        initCanvasSize();
        nextProblem();
        
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 1000);
    }

    function gameLoop() {
        if(!isGameRunning) return;
        timer--;
        if(timer <= 5) playTone(800, 'square', 0.05);
        updateUI();

        if(timer <= 0) {
            finishGame();
        }
    }

    function updateUI() {
        document.getElementById('ui-score').innerText = score;
        document.getElementById('ui-timer').innerText = timer;
        const timerEl = document.getElementById('ui-timer');
        if(timer <= 5) timerEl.style.color = "var(--neon-pink)";
        else timerEl.style.color = "var(--main-accent)";
    }

    function nextProblem() {
        const langData = I18N[currentLang];
        
        const isKeepMode = Math.random() < 0.5;
        const modeText = isKeepMode ? langData.left_txt : langData.cut_txt;

        const types = ['percent', 'fraction'];
        const type = types[Math.floor(Math.random() * types.length)];
        let labelText = "";
        let valRatio = 0; 

        if (type === 'percent') {
            const p = [20, 30, 40, 50, 60, 70, 80];
            const val = p[Math.floor(Math.random() * p.length)];
            valRatio = val / 100;
            labelText = `${val}% ${modeText}`;
        } else {
            const denoms = [2, 3, 4, 5];
            const d = denoms[Math.floor(Math.random() * denoms.length)];
            valRatio = 1 / d;
            labelText = `<span class="fraction"><sup>1</sup><sub>${d}</sub></span> ${modeText}`;
        }

        if (isKeepMode) {
            targetRatio = valRatio;
        } else {
            targetRatio = 1 - valRatio;
        }

        document.getElementById('ui-target').innerHTML = labelText;

        const shapes = ['rect', 'circle', 'triangle', 'star', 'heart'];
        shapeType = shapes[Math.floor(Math.random() * shapes.length)];
        
        resetCanvasForNewRound();
    }

    function resetCanvasForNewRound() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
        
        drawBaseShape(ctx, "#FF69B4"); 
        drawBaseShape(ghostCtx, "#FFFFFF"); 
        
        totalPixels = countPixels(ghostCtx);
    }
    
    function drawBaseShape(c, color) {
        c.fillStyle = color;
        c.beginPath();
        
        if(shapeType === 'rect') {
            c.rect(cx - baseSize/2, cy - baseSize/2, baseSize, baseSize);
        } else if(shapeType === 'circle') {
            c.arc(cx, cy, baseSize/2, 0, Math.PI*2);
        } else if(shapeType === 'triangle') {
            const r = baseSize/2 + 20;
            const yOffset = r * 0.2; 
            c.moveTo(cx, cy - r + yOffset);
            c.lineTo(cx + r * Math.cos(Math.PI/6), cy + r * Math.sin(Math.PI/6) + yOffset);
            c.lineTo(cx - r * Math.cos(Math.PI/6), cy + r * Math.sin(Math.PI/6) + yOffset);
            c.closePath();
        } else if(shapeType === 'star') {
             const outerRadius = baseSize / 2;
             const innerRadius = baseSize / 4;
             let rot = Math.PI / 2 * 3;
             let x = cx; let y = cy;
             let step = Math.PI / 5;
             c.moveTo(cx, cy - outerRadius);
             for (let i = 0; i < 5; i++) {
                 x = cx + Math.cos(rot) * outerRadius;
                 y = cy + Math.sin(rot) * outerRadius;
                 c.lineTo(x, y);
                 rot += step;
                 x = cx + Math.cos(rot) * innerRadius;
                 y = cy + Math.sin(rot) * innerRadius;
                 c.lineTo(x, y);
                 rot += step;
             }
             c.closePath();
        } else if(shapeType === 'heart') {
            const r = baseSize / 4;
            const startY = cy - 2.5 * r;
            c.moveTo(cx, startY + r);
            c.bezierCurveTo(cx, startY, cx - 2*r, startY, cx - 2*r, startY + 1.5*r);
            c.bezierCurveTo(cx - 2*r, startY + 3*r, cx, startY + 4*r, cx, startY + 5*r);
            c.bezierCurveTo(cx, startY + 4*r, cx + 2*r, startY + 3*r, cx + 2*r, startY + 1.5*r);
            c.bezierCurveTo(cx + 2*r, startY, cx, startY, cx, startY + r);
            c.closePath();
        }
        c.fill();
    }

    function countPixels(c) {
        const imgData = c.getImageData(0, 0, ghostCanvas.width, ghostCanvas.height);
        let count = 0;
        for(let i=3; i<imgData.data.length; i+=16) { 
            if(imgData.data[i] > 0) count++;
        }
        return count;
    }
    
    function handleStart(e) {
        if(!isGameRunning || waitingNext) return;
        e.preventDefault();
        isDrawing = true;
        path = [];
        addPoint(e);
        playDrawFeedback();
    }

    function handleMove(e) {
        if(!isGameRunning || !isDrawing || waitingNext) return;
        e.preventDefault();
        addPoint(e);
        drawTrace(); 
        playDrawFeedback();
    }

    function handleEnd(e) {
        if(!isGameRunning || !isDrawing || waitingNext) return;
        isDrawing = false;
        
        if(path.length > 5) {
            playCutSound();
            applyCut();
            evaluateAnswer();
        } else {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            redrawGame(); 
        }
    }

    function addPoint(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if(clientX) {
            path.push({x: clientX - rect.left, y: clientY - rect.top});
        }
    }
    
    function drawTrace() {
        redrawGame(); 
        ctx.beginPath();
        ctx.strokeStyle = "#FF9EAA"; 
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        if(path.length > 0) {
            ctx.moveTo(path[0].x, path[0].y);
            for(let i=1; i<path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
        }
    }
    
    function redrawGame() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(ghostCanvas, 0, 0); 
        ctx.globalCompositeOperation = 'source-in';
        ctx.fillStyle = "#FF69B4";
        ctx.fillRect(0,0,canvas.width, canvas.height); 
        ctx.restore();
    }

    function applyCut() {
        [ctx, ghostCtx].forEach(c => {
            c.save();
            c.globalCompositeOperation = 'destination-out';
            c.beginPath();
            c.moveTo(path[0].x, path[0].y);
            for(let i=1; i<path.length; i++) {
                c.lineTo(path[i].x, path[i].y);
            }
            c.closePath(); 
            c.fill();      
            c.restore();
        });
    }

    function playDrawFeedback() {
        const now = Date.now();
        if (now - lastDrawSoundTime > 80) {
            playTone(300 + Math.random()*100, 'sine', 0.05); 
            lastDrawSoundTime = now;
        }
    }

    function evaluateAnswer() {
        waitingNext = true;
        
        const currentPixels = countPixels(ghostCtx);
        const currentRatio = currentPixels / totalPixels;
        
        const diffPercent = Math.abs(targetRatio - currentRatio) * 100;
        
        const fbOverlay = document.getElementById('feedback-overlay');
        const fbAngle = document.getElementById('fb-angle-text');
        const fbDiff = document.getElementById('fb-diff-text');
        const fbScore = document.getElementById('fb-score-text'); 
        
        const langData = I18N[currentLang]; 

        let earned = 0;
        let isSuccess = false;

        if (diffPercent <= 5) { earned = 500; isSuccess = true; }
        else if (diffPercent <= 10) { earned = 300; isSuccess = true; }
        else if (diffPercent <= 20) { earned = 100; isSuccess = true; }
        else { earned = 0; }

        if(earned > 0) score += earned;

        if(isSuccess) playTone(600 + earned, 'sine', 0.2);
        else playTone(150, 'sawtooth', 0.3);

        fbAngle.innerText = (currentRatio * 100).toFixed(1) + "%";
        fbDiff.innerText = langData.diff_fmt.replace("{val}", diffPercent.toFixed(1));
        fbDiff.className = "fb-diff " + (isSuccess ? "fb-good" : "fb-bad");
        
        if(earned > 0) {
            fbScore.innerText = langData.pt_fmt.replace("{val}", earned);
            fbScore.style.color = "var(--neon-green)";
        } else {
            fbScore.innerText = langData.pt_fmt.replace("{val}", 0);
            fbScore.style.color = "#aaa";
        }
        
        fbOverlay.classList.remove('pop-in', 'pop-out');
        fbOverlay.style.opacity = 1; 
        void fbOverlay.offsetWidth; 
        fbOverlay.classList.add('pop-in');

        fbTimeout1 = setTimeout(() => {
            fbOverlay.classList.remove('pop-in');
            fbOverlay.classList.add('pop-out');
            
            fbTimeout2 = setTimeout(() => {
                if(isGameRunning) {
                    waitingNext = false;
                    nextProblem();
                    updateUI();
                    
                    fbOverlay.style.opacity = 0;
                    fbOverlay.classList.remove('pop-out');
                }
            }, 300); 
        }, 800); 
    }

    function finishGame() {
        isGameRunning = false;
        clearInterval(gameInterval);
        playTone(300, 'triangle', 0.5);

        document.getElementById('res-final-score').innerText = score;
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        submitScore(localStorage.getItem("kingsmath_nickname"), score);
    }

    const API_URL = "./ranking.php";

    function submitScore(name, score) {
        const langData = I18N[currentLang];
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `action=submit&nickname=${encodeURIComponent(name)}&score=${score}`
        })
        .then(res => res.json())
        .then(data => {
            const msgEl = document.getElementById("res-msg");
            if(data.rank) {
                msgEl.innerHTML = langData.rank_fmt.replace("{rank}", data.rank);
            } else {
                msgEl.innerText = langData.saved;
            }
        })
        .catch(e => {
            document.getElementById("res-msg").innerText = "Success!";
        });
    }

    function loadRanking() {
        const list = document.getElementById("ranking-list");
        const langData = I18N[currentLang];
        
        fetch(API_URL + "?action=list")
        .then(res => res.json())
        .then(data => {
            let html = "";
            if(data.length === 0) {
                html = `<div style='padding:20px; color:#aaa; text-align:center;'>${langData.no_rank}</div>`;
            } else {
                data.forEach((item, index) => {
                    let medal = "";
                    let style = "";
                    
                    if(index===0) { medal="🥇"; style="width:15%; font-weight:bold;"; }
                    else if(index===1) { medal="🥈"; style="width:15%; font-weight:bold;"; }
                    else if(index===2) { medal="🥉"; style="width:15%; font-weight:bold;"; }
                    else { 
                        medal = `<span class="rank-num">${index+1}</span>`;
                        style="width:15%;";
                    }
                    
                    html += `
                    <div class="rank-row">
                        <span style="${style}">${medal}</span>
                        <span style="width:50%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#555;">${item.nickname}</span>
                        <span style="width:35%; text-align:right; color:var(--main-accent); font-weight:bold;">${item.score}</span>
                    </div>`;
                });
            }
            list.innerHTML = html;
        })
        .catch(err => {});
    }

</script>
