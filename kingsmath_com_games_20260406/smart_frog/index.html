            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            width: 95%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-color: var(--ui-base);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);

            display: flex;
            align-items: center;
            justify-content: center;

            transition: transform 0.1s;
            border-radius: 6px;

        .tile-visited { background-color: var(--tile-visited); border-bottom: 3px solid #2e7d32; }
        .tile-stone { background-color: var(--tile-stone); border-bottom: 3px solid #455a64; cursor: default; }
        .tile-frog {
            background-color: var(--primary-green);
            z-index: 10;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(139, 195, 74, 0.6);
            border-bottom: 3px solid #689f38;
        }

        .tile-backtrackable::after {
            content: '↩️';
            position: absolute;
            font-size: 0.8rem;
            top: 2px;
            right: 2px;
            opacity: 0.8;
            text-shadow: 1px 1px 0 #000;
        }
        .frog-anim { animation: frogPop 0.2s ease-out alternate; }
        @keyframes frogPop { 0% { transform: scale(0.8); } 100% { transform: scale(1.1); } }

        #game-footer { height: 10vh; background: #0f1c0f; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #eee; border-top: 2px solid var(--deep-green); z-index: 20; gap: 5px; }
        #ingame-guide { font-size: 2vh; color: var(--accent-color); margin-bottom: 0.2vh; animation: bounce 2s infinite; }
        #ingame-nickname { font-size: 3vh; font-weight: bold; }

        #levelup-overlay { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; flex-direction: column; align-items: center; z-index: 50; }
        #levelup-text { font-size: 6vh; color: var(--accent-color); text-shadow: 2px 2px 0 #000; font-weight: bold; animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 50% { transform: translateY(-20px) scale(1.2); opacity: 1; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

        #countdown-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; justify-content: center; align-items: center; }
        #countdown-text { font-size: 15vh; font-weight: bold; color: var(--accent-color); text-shadow: 0 0 20px #ff5252; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- 3. 결과 화면 --- */
        #result-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 46, 26, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; padding-bottom: 5vh; backdrop-filter: blur(5px); }
        .result-score { font-size: 8vh; color: var(--accent-color); margin: 1vh 0; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #result-ranking-board { margin-top: 2vh; width: 85%; background: #0f1c0f; border: 3px dashed var(--primary-green); border-radius: 15px; padding: 1vh; flex-shrink: 0; max-height: 25vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; color: #fff; }
        #result-ranking-board * { touch-action: pan-y; }

        /* --- 다국어 모달 UI 전용 CSS 영역 --- */
        #langModal, #langModal * { box-sizing: border-box !important; font-family: 'Noto Sans KR', sans-serif; }
        #langModal i, #toastNotification i { font-family: "Font Awesome 6 Free" !important; font-weight: 900; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>

    // --- 초기 언어 감지 및 모달 제어 로직 ---
    const triggerBtn = document.getElementById('langTriggerBtn');
    const modal = document.getElementById('langModal');
    const closeBtn = document.getElementById('closeModalBtn');
    const searchInput = document.getElementById('searchInput');
    const grid = document.getElementById('languageGrid');

    const toast = document.getElementById('toastNotification');

    function getInitialLang() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        if(langParam && i18n[langParam]) return langParam;

        const savedLang = localStorage.getItem('kingsmath_lang');
        if(savedLang && i18n[savedLang]) return savedLang;

        const browserLang = navigator.language.slice(0, 2);
        if(i18n[browserLang]) return browserLang;

        return 'en';
    }

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;
                btn.addEventListener('click', () => changeLang(lang.code, lang));
                grid.appendChild(btn);
            });
        }
    }

    function openModal() {
        modal.classList.add('active');
        renderLanguages(searchInput.value);
        document.body.style.overflow = 'hidden';
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, langCode) {
        const toastMsg = i18n[langCode].toast || "Language changed.";
        document.getElementById('ui-toast').textContent = toastMsg;
        toastLangName.textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function changeLang(langCode, langObj = null) {
        if(!i18n[langCode]) return;
        currentLang = langCode;
        const t = i18n[langCode];
        
        if (!langObj) langObj = languagesList.find(l => l.code === langCode);

        document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t[el.getAttribute('data-i18n')]; });
        document.getElementById("nickname").placeholder = t.placeholder;
        document.getElementById("nickname").setAttribute('data-i18n-ph', 'placeholder');
        
        currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;

        const linkBtn = document.getElementById("kingsmath-link-btn");
        if(langCode === 'ko') linkBtn.innerText = "킹수학.com";
        else linkBtn.innerText = "KingsMath.com";

        const mainTitle = document.getElementById('main-title-el');
        if(['ru', 'es', 'fr', 'pt-br', 'de', 'it', 'id', 'vi'].includes(langCode)) {
            mainTitle.style.fontSize = "5vh";
        } else if(['th'].includes(langCode)) {
            mainTitle.style.fontSize = "6vh";
        } else {
            mainTitle.style.fontSize = "7vh"; 
        }

        document.title = t.metaTitle;
        document.getElementById("meta-desc").setAttribute("content", t.metaDesc);

        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + langCode;
        window.history.pushState({path:newUrl}, '', newUrl);
        localStorage.setItem("kingsmath_lang", langCode);

        initQR(); 
        loadRanking(); 

        closeModal();
        if (langObj) showToast(langObj.name, langCode); 
    }

    triggerBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });


    // --- QR Code ---
    let qrObject = null;
    function initQR() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; 
        const url = window.location.href;
        try {
            qrObject = new QRCode(qrContainer, {
                text: url, width: 128, height: 128, colorDark : "#1a2e1a", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
        } catch(e) { console.error("QR Code 생성 실패", e); }
    }

    function showBigQR() {
        const modal = document.getElementById("qr-modal");
        const modalContent = document.getElementById("qr-modal-content");
        modalContent.innerHTML = "";
        
        const qrCanvas = document.querySelector("#qrcode canvas");
        const qrImg = document.querySelector("#qrcode img");
        
        let src = "";
        if (qrCanvas) src = qrCanvas.toDataURL("image/png");
        else if (qrImg) src = qrImg.src;

        if (src) {
            const newImg = new Image();
            newImg.src = src;
            modalContent.appendChild(newImg);
            modal.style.display = "flex";
        }
    }

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'move') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'back') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'levelup') {
            osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(783.99, now + 0.1); osc.frequency.setValueAtTime(1046.50, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        } else if (type === 'tick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now+0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'end') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(100, now+0.5);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        }
    }

    // --- Frog King Board Logic ---
    let board = [];
    let frogPos = {x: 0, y: 0};
    let moveHistory = [];
    let totalTarget = (GRID_SIZE * GRID_SIZE) - STONE_COUNT;
    let filledCount = 1;

    function initGame() {
        score = 0;
        timeLeft = GAME_DURATION;
        document.getElementById('score-val').innerText = score;
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('timer-val').classList.remove('timer-warning');
        document.getElementById('ingame-nickname').innerText = myNickname;
        
        createNewLevel();
        
        isPlaying = true;
        startTimer();
    }

    function createNewLevel() {
        let valid = false;
        while (!valid) {
            board = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill('DIRT'));
            let placed = 0;
            while (placed < STONE_COUNT) {
                const rx = Math.floor(Math.random() * GRID_SIZE);
                const ry = Math.floor(Math.random() * GRID_SIZE);
                if ((rx !== 0 || ry !== 0) && board[ry][rx] === 'DIRT') {
                    board[ry][rx] = 'STONE'; placed++;
                }
            }
            if (isWinnable(board, STONE_COUNT)) valid = true;
        }
        
        board[0][0] = 'FROG';
        frogPos = {x: 0, y: 0};
        moveHistory = [];
        filledCount = 1;
        renderBoard();
    }

    function isWinnable(testBoard, stoneCount) {
        const targetCount = (GRID_SIZE * GRID_SIZE) - stoneCount;
        let visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        let maxSteps = 2000; let steps = 0;

        function dfs(x, y, count) {
            if (count === targetCount) return true;
            if (steps++ > maxSteps) return false;
            visited[y][x] = true;

            const dirs = [{x:0,y:1},{x:0,y:-1},{x:1,y:0},{x:-1,y:0}];
            for (let d of dirs) {
                const nx = x + d.x, ny = y + d.y;
                if (nx>=0 && nx<GRID_SIZE && ny>=0 && ny<GRID_SIZE && !visited[ny][nx] && testBoard[ny][nx] === 'DIRT') {
                    if (dfs(nx, ny, count + 1)) return true;
                }
            }
            visited[y][x] = false;
            return false;
        }
        return dfs(0, 0, 1);
    }

    function renderBoard() {
        const boardEl = document.getElementById('grid-container');
        boardEl.innerHTML = '';
        const lastMove = moveHistory.length > 0 ? moveHistory[moveHistory.length - 1] : null;

        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.x = x; tile.dataset.y = y;

                const state = board[y][x];
                if (state === 'DIRT') { tile.classList.add('tile-dirt'); }
                else if (state === 'STONE') { tile.classList.add('tile-stone'); tile.innerText = '⛰️'; }
                else if (state === 'VISITED') {
                    tile.classList.add('tile-visited'); tile.innerText = '🌿';
                    if (lastMove && lastMove.x === x && lastMove.y === y) tile.classList.add('tile-backtrackable');
                }
                else if (state === 'FROG') { tile.classList.add('tile-frog', 'frog-anim'); tile.innerText = '🐸'; }

                boardEl.appendChild(tile);
            }
        }
    }

    // 보드 터치 조작 로직
    document.getElementById('grid-container').addEventListener('pointerdown', function(e) {
        if (!isPlaying) return;
        const tile = e.target.closest('.tile');
        if (!tile) return;
        e.preventDefault();

        const x = parseInt(tile.dataset.x);
        const y = parseInt(tile.dataset.y);
        const dx = Math.abs(x - frogPos.x);
        const dy = Math.abs(y - frogPos.y);

        if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
            if (board[y][x] === 'DIRT') {
                moveHistory.push({ ...frogPos });
                board[frogPos.y][frogPos.x] = 'VISITED';
                frogPos = { x, y };
                board[y][x] = 'FROG';
                filledCount++;
                score += SCORE_PER_TILE;
                updateScoreUI();
                playSound('move');
                renderBoard();
                checkClear();
            } else if (board[y][x] === 'VISITED') {
                const lastPos = moveHistory[moveHistory.length - 1];
                if (lastPos && lastPos.x === x && lastPos.y === y) {
                    board[frogPos.y][frogPos.x] = 'DIRT';
                    moveHistory.pop();
                    frogPos = { x, y };
                    board[y][x] = 'FROG';
                    filledCount--;
                    score = Math.max(0, score - SCORE_PER_TILE); // 되돌아가면 점수 차감
                    updateScoreUI();
                    playSound('back');
                    renderBoard();
                }
            }
        }
    });

    function checkClear() {
        if (filledCount === totalTarget) {
            score += SCORE_BONUS_CLEAR;
            updateScoreUI();
            playSound('levelup');
            showLevelUpEffect();
            createNewLevel();
        }
    }

    function updateScoreUI() {
        document.getElementById('score-val').innerText = score;
    }

    function showLevelUpEffect() {
        const el = document.getElementById('levelup-overlay');
        const txt = document.getElementById('levelup-text');
        
        el.style.display = 'flex';
        txt.style.animation = 'none';
        el.offsetHeight; 
        txt.style.animation = 'floatUp 0.8s ease-out forwards';
        
        setTimeout(() => { el.style.display = 'none'; }, 800);
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            timeLeft--;
            const tVal = document.getElementById('timer-val');
            tVal.innerText = timeLeft;
            
            if(timeLeft <= 10) tVal.classList.add('timer-warning');
            if(timeLeft <= 5 && timeLeft > 0) playSound('tick');

            if(timeLeft <= 0) endGame();
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        playSound('end');

        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('res-nickname').innerText = myNickname;
        document.getElementById('res-score').innerText = score;
        
        document.getElementById('result-ranking-board').innerHTML = "";
        submitScore(myNickname, score);
    }


    // --- UI & Utils ---
    function checkNameAndStart() {
        const input = document.getElementById('nickname');
        const val = input.value.trim();
        const t = i18n[currentLang];

        if(val.length < 1) { alert(t.alertName); return; }
        // 금칙어 검증 로직 추가 (안전 강화)
        const badWords = ["시발", "씨발", "개새끼", "fuck", "shit"];
        if(badWords.some(w => val.includes(w))) { alert(t.alertBad); return; }

        myNickname = val;
        localStorage.setItem("kingsmaze_name", val);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        
        startCountdown();
    }

    function startCountdown() {
        const screen = document.getElementById('countdown-screen');
        const text = document.getElementById('countdown-text');
        screen.classList.remove('hidden');
        
        let cnt = 3;
        text.innerText = cnt;
        playSound('tick');
        
        const intv = setInterval(() => {
            cnt--;
            if(cnt > 0) {
                text.innerText = cnt;
                text.style.animation = 'none';
                text.offsetHeight; 
                text.style.animation = 'pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                playSound('tick');
            } else {
                clearInterval(intv);
                text.innerText = "GO!";
                playSound('start');
                setTimeout(() => {
                    screen.classList.add('hidden');
                    initGame();
                }, 500);
            }
        }, 1000);
    }

    function restartGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        startCountdown();
    }

    function goHome() {
        if (document.fullscreenElement) {
            isPlaying = false;
            clearInterval(timerInterval);
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            
            document.getElementById('langTriggerContainer').style.display = 'block'; 
            
            if(window.playSound) window.playSound('tick');
            loadRanking();
        } else {
            location.reload();
        }
    }

    // --- Ranking System ---
    function submitScore(name, score) {
        const t = i18n[currentLang];
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', score);

        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = t.rankResult.replace('{rank}', data.rank);
                loadResultRanking();
            } else {
                document.getElementById("res-rank").innerText = "Ranking Error";
            }
        })
        .catch(e => console.error(e));
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center">${t.rankingLoading}</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="margin-top:20px;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1);
                let style = (idx < 3) ? "font-size:1.5em;" : "color:#8bc34a; font-weight:bold;";
                
                html += `<div class="rank-item">
                    <span style="width:15%; text-align:center; ${style}">${rankDisplay}</span>
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#ccc; font-weight:bold;">${item.score}</span>
                </div>`;
            });
            list.innerHTML = html;
        })
        .catch(e => {
            list.innerHTML = `<div class="center" style="color:#ff5252;">${t.rankingError}</div>`;
        });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#888;">TOP 3 Loading...</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="font-size:1.8vh;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i];
                let rankIcon = ["🥇","🥈","🥉"][i];
                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;">
                    <span style="width:15%; text-align:center;">${rankIcon}</span>
                    <span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; font-weight:bold; color:#8bc34a;">${item.score}</span>
                </div>`;
            }
            list.innerHTML = html;
        })
        .catch(e => {
            list.style.display = 'none'; 
        });
    }

    // --- Init ---
    window.onload = function() {
        const savedName = localStorage.getItem("kingsmaze_name"); // 로컬스토리지 공유용 (미로킹과 통합 시 필요)
        if(savedName) document.getElementById("nickname").value = savedName;
        
        const initLang = getInitialLang();
        changeLang(initLang);
        renderLanguages(); 
    };

</script>
