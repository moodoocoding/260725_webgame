<!DOCTYPE html>
<html lang="ko">
<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>

    <meta name="keywords" content="그림그리기, AI평가, 전자칠판, 킹수학, 교육용게임, 캐치마인드" id="meta-keywords">
    
    <title id="page-title">그림 그려 킹 랭킹</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false }
      }
    </script>

    <style>
        #langSelectorContainer { position: absolute; top: 1rem; right: 1rem; z-index: 99999 !important; font-family: 'Noto Sans KR', sans-serif !important; }
        #langModal { z-index: 99999 !important; font-family: 'Noto Sans KR', sans-serif !important; }
        #langModal * { box-sizing: border-box !important; }
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s ease; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        /* [모바일 최적화] */
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; font-weight: 400 !important; }

        :root {
            --bg-color: #2b2b2b; --card-bg: #3a3a3a; --text-color: #f0f0f0; --accent-color: #FFD93D; 
            --p0-main: #2980b9;
        }

        body { margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); font-family: 'Jua', 'Noto Sans KR', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; }

        header { background-color: #1e1e1e; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); z-index: 10; height: 60px; }
        header h1 { font-size: 1.4rem; margin: 0; text-shadow: 1px 1px 0 #000; cursor: pointer; color: var(--accent-color); }

        #timer-display { font-size: 2rem; color: #fff; background: #444; padding: 2px 15px; border-radius: 10px; border: 2px solid #666; text-align: center; display: none; }
        #timer-display.urgent { background: #c0392b; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }

        #app-container { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; width: 100%; height: calc(100% - 60px); overflow-y: auto; padding: 10px 0; }

        /* --- 설정 화면 (랭킹 갤러리 포함) --- */
        #setup-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; background: var(--card-bg); padding: 20px; border-radius: 20px; border: 3px solid #444; z-index: 20; max-width: 500px; width: 95%; margin: auto; }
        .screen-title { font-size: 2.2rem; color: #fff; text-shadow: 2px 2px 0 #000; text-align: center; margin-bottom: 5px; }
        .screen-desc { font-size: 1rem; color: #ccc; text-align: center; line-height: 1.4; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; border: 1px solid #555; width: 100%; }
        .highlight { color: #ff7675; }

        /* 명예의 전당 (Top 3 갤러리) */
        #top3-gallery-container { width: 100%; margin-top: 10px; }
        #top3-gallery-container h3 { margin: 0 0 10px 0; text-align: center; color: var(--accent-color); font-size: 1.3rem; }
        #top3-gallery { display: flex; gap: 10px; width: 100%; overflow-x: auto; padding-bottom: 5px; }
        .gallery-card { background: #222; border-radius: 10px; padding: 10px; text-align: center; border: 2px solid #555; flex: 1; min-width: 120px; }
        .gallery-card img { width: 100%; aspect-ratio: 1/1; background: #fff; border-radius: 5px; margin: 5px 0; object-fit: cover; }
        .gallery-score { font-size: 1.2rem; color: #ff7675; font-weight: bold; }
        .gallery-name { font-size: 1rem; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gallery-subject { font-size: 0.9rem; color: #3498db; }

        /* API 입력 필드 영역 */
        .api-input-section { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-top: 10px; width: 100%; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; border: 1px dashed #666; }
        .api-input-section input { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #555; background: #222; color: #fff; font-size: 1rem; text-align: center; font-family: 'Arial', sans-serif; }
        .api-input-section input:focus { outline: none; border-color: var(--accent-color); }
        .api-link { font-size: 0.8rem; color: #3498db; text-decoration: underline; cursor: pointer; }

        #btn-start { margin-top: 10px; padding: 15px 40px; font-size: 1.5rem; background-color: #ff7675; color: white; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 0 #d63031; width: 100%; font-family: 'Jua', sans-serif; }
        #btn-start:active { transform: translateY(6px); box-shadow: none; }

        /* --- 게임 화면 --- */
        #big-subject-display { font-size: 2.5rem; color: var(--accent-color); text-shadow: 2px 2px 0 #000; text-align: center; margin: 15px 0; z-index: 10; display: none; }
        
        #game-board { display: none; width: 100%; max-width: 500px; padding: 0 15px; margin: auto; }

        .team-card {
            background: var(--card-bg); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 3px solid var(--p0-main); padding: 15px; width: 100%; position: relative;
        }

        .result-badge { font-size: 2.5rem; color: var(--accent-color); text-shadow: 2px 2px 0 #000; margin-bottom: 10px; display: none; text-align: center; width: 100%; }

        .canvas-container { width: 100%; max-width: 100%; aspect-ratio: 1 / 1; background: #fff; border-radius: 10px; overflow: hidden; border: 2px solid #aaa; touch-action: none; margin: 0 auto; }
        canvas { width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

        /* 도구 팔레트 */
        .tools-area { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; }
        .color-palette { display: flex; gap: 8px; }
        .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: transform 0.2s; }
        .color-btn.active { transform: scale(1.2); border-color: #FFD93D; box-shadow: 0 0 10px #FFD93D; }
        .action-btns { display: flex; gap: 10px; }
        .tool-btn { background: #555; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; } 
        .tool-btn:active { background: #333; }

        .btn-individual-finish { width: 100%; margin-top: 15px; padding: 12px 0; background: #e74c3c; color: white; border: 2px solid #c0392b; border-radius: 10px; font-size: 1.5rem; cursor: pointer; font-family: 'Jua', sans-serif; }
        .btn-individual-finish:disabled { background: #7f8c8d; border-color: #95a5a6; }

        /* 하단 컨트롤 (채점 및 다시하기) */
        #game-over-controls { display: none; margin-top: 15px; margin-bottom: 20px; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 500px; padding: 0 15px; margin: 15px auto; }
        .big-btn { width: 100%; padding: 15px; font-size: 1.5rem; color: white; border: 3px solid #fff; border-radius: 15px; cursor: pointer; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); font-family: 'Jua', sans-serif; }
        #btn-grade { background: linear-gradient(to bottom, #9b59b6, #8e44ad); box-shadow: 0 6px 0 #5e3370; }
        #btn-restart { background: linear-gradient(to bottom, #7f8c8d, #bdc3c7); box-shadow: 0 6px 0 #555; }
        .big-btn:active { transform: translateY(6px); box-shadow: none !important; }

        /* 랭킹 등록 영역 */
        #ranking-submit-section { display: none; width: 100%; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border: 2px dashed #e67e22; }
        #nickname-input { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 1.2rem; text-align: center; font-family: 'Jua', sans-serif; }
        #btn-submit-rank { background: linear-gradient(to bottom, #f39c12, #e67e22); box-shadow: 0 6px 0 #d35400; }

        /* 플로팅 버튼 */
        .floating-btn { position: fixed; bottom: 20px; width: 45px; height: 45px; border-radius: 50%; background: #444; color: white; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; z-index: 60; border: 2px solid #666; cursor: pointer; }
        #btn-home { left: 15px; }
        #btn-fullscreen { right: 15px; }
    </style>
</head>
<body>

    <div id="langSelectorContainer" class="hidden"></div>
    
    <header>
        <h1 onclick="location.reload()" id="header-title">🎨 그림 그려 킹 랭킹</h1>
        <div id="timer-display">60</div>
    </header>

    <div id="app-container">
        <div id="big-subject-display"></div>

        <div id="setup-screen">
            <div class="screen-title">🎨 그림 그려 킹 랭킹</div>
            <div class="screen-desc">
                제시어를 보고 60초 동안 비슷하게 그려보세요!<br>
                AI가 평가한 후 점수가 높으면 랭킹에 등록됩니다.<br>
                <span class="highlight">🔥 Top 3 안에 들면 첫 화면에 내 그림이 박제됩니다!</span>
            </div>
            
            <div id="top3-gallery-container">
                <h3>🏆 명예의 전당 (Top 3)</h3>
                <div id="top3-gallery">
                    <div style="text-align:center; width:100%; color:#aaa; font-size:1rem; padding: 20px 0;">데이터를 불러오는 중...</div>
                </div>
            </div>

            <div class="api-input-section">
                <input type="password" id="api-key-input" placeholder="🔑 Gemini API 키 입력">
                <span id="btn-open-api-guide" class="api-link" onclick="document.getElementById('apiGuideFrame').classList.remove('hidden');">👉 무료 API 키 발급 받는 방법</span>
            </div>

            <button id="btn-start">도전 시작! 🚀</button>
        </div>

        <div id="game-board">
            <div class="team-card">
                <div id="result-badge" class="result-badge"></div>
                <div class="canvas-container">
                    <canvas id="main-canvas"></canvas>
                </div>
                <div class="tools-area">
                    <div class="color-palette" id="color-palette"></div>
                    <div class="action-btns">
                        <button class="tool-btn" id="btn-clear">🔄</button>
                    </div>
                </div>
                <button id="btn-finish" class="btn-individual-finish">✅ 다 그렸어요!</button>
            </div>
        </div>

        <div id="game-over-controls">
            <button id="btn-grade" class="big-btn">🤖 AI 점수 확인하기</button>
            
            <div id="ranking-submit-section">
                <input type="text" id="nickname-input" placeholder="닉네임 (최대 8자)" maxlength="8">
                <button id="btn-submit-rank" class="big-btn">🏆 랭킹 등록하기</button>
            </div>

            <button id="btn-restart" class="big-btn" style="display:none;">🏠 처음으로</button>
        </div>
    </div>
    
    <iframe id="apiGuideFrame" src="api.html" class="hidden fixed inset-0 w-full h-full" style="z-index: 100000; border: none; background: #fff;"></iframe>

    <div id="btn-home" class="floating-btn" onclick="location.reload()">🏠</div>
    <div id="btn-fullscreen" class="floating-btn">⛶</div>

    <script>
        const COLORS = ['#000000', '#e74c3c', '#3498db', '#2ecc71', '#f1c40f'];
        const SUBJECTS = [
            "사과", "바나나", "포도", "수박", "자동차", "자전거", "비행기", "고양이", "강아지", "토끼",
            "안경", "모자", "가방", "신발", "시계", "피자", "햄버거", "아이스크림", "컴퓨터", "스마트폰",
            "축구공", "눈사람", "무지개", "물고기", "나비", "칫솔", "거울", "가위", "프라이팬", "냉장고"
        ];

        let state = {
            isPlaying: false, timeLeft: 60, timerInterval: null, currentSubject: "", finalScore: 0,
            color: COLORS[0], isDrawing: false, ctx: null, canvas: null
        };
        let activeApiKey = localStorage.getItem('drawKingApiKey') || "";
        if (activeApiKey) document.getElementById('api-key-input').value = activeApiKey;

        // 1. 랭킹 불러오기 (Top 3 갤러리)
        async function loadTop3Gallery() {
            try {
                const res = await fetch('ranking.php?action=list');
                const data = await res.json();
                const gallery = document.getElementById('top3-gallery');
                
                if(data.length === 0) {
                    gallery.innerHTML = '<div style="text-align:center; width:100%; color:#aaa; font-size:1rem; padding: 20px 0;">아직 등록된 그림이 없어요!<br>첫 번째 킹이 되어보세요.</div>';
                    return;
                }

                gallery.innerHTML = '';
                // 1~3등까지만 표시
                const top3 = data.slice(0, 3);
                const medals = ['🥇', '🥈', '🥉'];
                
                top3.forEach((item, index) => {
                    let imgSrc = item.image_path ? item.image_path : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='; // 투명 이미지 처리
                    
                    gallery.innerHTML += `
                        <div class="gallery-card">
                            <div class="gallery-score">${medals[index]} ${item.score}점</div>
                            <img src="${imgSrc}" alt="drawing">
                            <div class="gallery-subject">${item.subject || '제시어 없음'}</div>
                            <div class="gallery-name">${item.nickname}</div>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('top3-gallery').innerHTML = '<div style="color:#ff7675; padding:10px;">랭킹을 불러오지 못했습니다.</div>';
            }
        }
        
        window.addEventListener('DOMContentLoaded', loadTop3Gallery);

        // 2. 캔버스 초기화
        function initCanvas() {
            state.
