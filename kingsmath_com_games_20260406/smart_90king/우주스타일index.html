<script>
    /* --- 전역 변수 --- */
    const GAME_TIME_LIMIT = 60; 
    let timer = GAME_TIME_LIMIT;
    let score = 0;
    let targetAngle = 0;
    let currentDragRad = 0; 
    let baseAngleRad = 0;   
    let isGameRunning = false;
    let isTouching = false;
    let gameInterval = null;
    let waitingNext = false;
    let lastDrawSoundTime = 0; 
    
    let fbTimeout1 = null;
    let fbTimeout2 = null;

    // 캔버스 관련
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let cx, cy; 
    let radius; 

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    window.onload = function() {
        const savedName = localStorage.getItem("kingsmath_nickname");
        if(savedName) document.getElementById("nickname").value = savedName;
        
        loadRanking();
        generateQRCode();

        window.addEventListener('resize', initCanvasSize);
        canvas.addEventListener('pointerdown', handleStart);
        canvas.addEventListener('pointermove', handleMove);
        canvas.addEventListener('pointerup', handleEnd);
        canvas.addEventListener('pointerleave', handleEnd);
    };

    function generateQRCode() {
        const currentUrl = window.location.href;
        const targetUrl = currentUrl.length > 5 ? currentUrl : "/";
        const encodedUrl = encodeURIComponent(targetUrl);
        const qrBaseUrl = "https://api.qrserver.com/v1/create-qr-code/?color=000000&bgcolor=ffffff&data=" + encodedUrl;
        
        document.getElementById('qr-small').src = qrBaseUrl + "&size=100x100";
        document.getElementById('qr-large').src = qrBaseUrl + "&size=500x500";
    }

    function openQrModal() { document.getElementById('qr-modal').classList.remove('hidden'); }
    function closeQrModal() { document.getElementById('qr-modal').classList.add('hidden'); }

    function initCanvasSize() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        cx = canvas.width / 2;
        // 원 위치: 상단 40% 지점
        cy = canvas.height * 0.40; 
        radius = Math.min(canvas.width, canvas.height) * 0.4; 
        
        if(isGameRunning) drawGame();
    }

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playTone(freq, type, duration) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime); 
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // [수정 2] 게임 시작 시 카운트다운 먼저 실행
    function startGame() {
        const nameInput = document.getElementById("nickname").value.trim();
        if(nameInput.length < 1) { alert("닉네임을 입력해주세요!"); return; }
        localStorage.setItem("kingsmath_nickname", nameInput);
        initAudio();

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        startCountdown(); // 바로 시작하지 않고 카운트다운 호출
    }

    // [수정 3] 다시하기 버튼 클릭 시 카운트다운 후 재시작
    function resetGame() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        startCountdown();
    }

    // [수정 2] 카운트다운 함수 구현
    function startCountdown() {
        const cntEl = document.getElementById('countdown-overlay');
        cntEl.classList.remove('hidden');
        let count = 3;
        cntEl.innerText = count;

        // 기존 게임 루프 등 정지
        isGameRunning = false;
        clearInterval(gameInterval);

        const timerId = setInterval(() => {
            count--;
            if(count > 0) {
                cntEl.innerText = count;
                playTone(800, 'square', 0.1); // 삑
            } else if (count === 0) {
                cntEl.innerText = "GO!";
                playTone(1200, 'square', 0.2); // 삑!
            } else {
                clearInterval(timerId);
                cntEl.classList.add('hidden');
                resetGameLogic(); // 실제 게임 시작
            }
        }, 1000);
    }

    function goHome() {
        isGameRunning = false;
        clearInterval(gameInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('countdown-overlay').classList.add('hidden'); // 혹시 켜져있으면 끔
        loadRanking();
    }

    function resetGameLogic() {
        if(fbTimeout1) clearTimeout(fbTimeout1);
        if(fbTimeout2) clearTimeout(fbTimeout2);
        
        // 피드백 오버레이 초기화
        const fbOverlay = document.getElementById('feedback-overlay');
        fbOverlay.classList.remove('pop-in', 'pop-out');
        fbOverlay.style.opacity = 0;

        score = 0;
        timer = GAME_TIME_LIMIT;
        isGameRunning = true;
        waitingNext = false;
        
        updateUI();
        initCanvasSize();
        nextProblem();
        
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 1000);
    }

    function gameLoop() {
        if(!isGameRunning) return;
        timer--;
        if(timer <= 5) playTone(800, 'square', 0.05);
        updateUI();

        if(timer <= 0) {
            finishGame();
        }
    }

    function updateUI() {
        document.getElementById('ui-score').innerText = score;
        document.getElementById('ui-timer').innerText = timer;
        const timerEl = document.getElementById('ui-timer');
        if(timer <= 5) timerEl.style.color = "red";
        else timerEl.style.color = "var(--neon-pink)";
    }

    function nextProblem() {
        targetAngle = Math.floor(Math.random() * 160) + 10;
        document.getElementById('ui-target').innerText = targetAngle + "°";
        
        baseAngleRad = (Math.random() * Math.PI * 2) - Math.PI; 
        currentDragRad = baseAngleRad; 
        
        drawGame();
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 전체 원 테두리
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. 기준선
        const baseX = cx + Math.cos(baseAngleRad) * radius;
        const baseY = cy + Math.sin(baseAngleRad) * radius;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(baseX, baseY);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // 3. 중심점
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI*2);
        ctx.fillStyle = "white";
        ctx.fill();
        ctx.strokeStyle = varColor('neon-blue');
        ctx.lineWidth = 2;
        ctx.stroke();

        // 4. 플레이어 드래그 영역 (부채꼴)
        if (isTouching) {
            const endX = cx + Math.cos(currentDragRad) * radius;
            const endY = cy + Math.sin(currentDragRad) * radius;

            // 드래그 선
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = "var(--neon-green)";
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 부채꼴 채우기
            let diff = currentDragRad - baseAngleRad;
            while(diff <= -Math.PI) diff += 2*Math.PI;
            while(diff > Math.PI) diff -= 2*Math.PI;
            
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, baseAngleRad, currentDragRad, diff < 0);
            ctx.lineTo(cx, cy); 
            ctx.fillStyle = "rgba(57, 255, 20, 0.3)";
            ctx.fill();
        }
    }
    
    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim();
    }

    function getRawAngleRad(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        if(!clientX) return currentDragRad;

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        return Math.atan2(y - cy, x - cx);
    }

    function handleStart(e) {
        if(!isGameRunning || waitingNext) return;
        e.preventDefault();
        isTouching = true;
        currentDragRad = getRawAngleRad(e);
        drawGame();
        playDrawFeedback(); 
    }

    function handleMove(e) {
        if(!isGameRunning || !isTouching || waitingNext) return;
        e.preventDefault();
        currentDragRad = getRawAngleRad(e);
        drawGame();
        playDrawFeedback(); 
    }

    function playDrawFeedback() {
        const now = Date.now();
        if (now - lastDrawSoundTime > 80) {
            let diff = Math.abs(currentDragRad - baseAngleRad);
            let freq = 300 + (diff * 50); 
            playTone(freq, 'sine', 0.05); 
            lastDrawSoundTime = now;
        }
    }

    function handleEnd(e) {
        if(!isGameRunning || !isTouching || waitingNext) return;
        isTouching = false;
        evaluateAnswer();
    }

    function evaluateAnswer() {
        waitingNext = true;

        let diffRad = currentDragRad - baseAngleRad;
        while(diffRad <= -Math.PI) diffRad += 2*Math.PI;
        while(diffRad > Math.PI) diffRad -= 2*Math.PI;
        
        const currentDeg = Math.abs(diffRad) * (180 / Math.PI);
        const error = Math.abs(targetAngle - currentDeg);

        const fbOverlay = document.getElementById('feedback-overlay');
        const fbAngle = document.getElementById('fb-angle-text');
        const fbDiff = document.getElementById('fb-diff-text');

        let earned = 0;
        let isSuccess = false;

        if (error <= 3) { earned = 500; isSuccess = true; }
        else if (error <= 6) { earned = 300; isSuccess = true; }
        else if (error <= 10) { earned = 100; isSuccess = true; }
        else { earned = 0; }

        if(earned > 0) score += earned;

        if(isSuccess) playTone(600 + earned, 'sine', 0.2);
        else playTone(150, 'sawtooth', 0.3);

        fbAngle.innerText = currentDeg.toFixed(1) + "°";
        fbDiff.innerText = error.toFixed(1) + "° 차이";
        fbDiff.className = "fb-diff " + (isSuccess ? "fb-good" : "fb-bad");
        
        fbOverlay.classList.remove('pop-in', 'pop-out');
        
        fbOverlay.style.opacity = 1; 
        void fbOverlay.offsetWidth; 
        fbOverlay.classList.add('pop-in');

        fbTimeout1 = setTimeout(() => {
            fbOverlay.classList.remove('pop-in');
            fbOverlay.classList.add('pop-out');
            
            fbTimeout2 = setTimeout(() => {
                if(isGameRunning) {
                    waitingNext = false;
                    nextProblem();
                    updateUI();
                    
                    fbOverlay.style.opacity = 0;
                    fbOverlay.classList.remove('pop-out');
                }
            }, 300); 
        }, 700); 
    }

    function finishGame() {
        isGameRunning = false;
        clearInterval(gameInterval);
        playTone(300, 'triangle', 0.5);

        document.getElementById('res-final-score').innerText = score;
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        submitScore(localStorage.getItem("kingsmath_nickname"), score);
    }

    const API_URL = "./ranking.php";

    function submitScore(name, score) {
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `action=submit&nickname=${encodeURIComponent(name)}&score=${score}`
        })
        .then(res => res.json())
        .then(data => {
            const msgEl = document.getElementById("res-msg");
            if(data.rank) msgEl.innerHTML = `당신은 현재 <span style='color:yellow'>${data.rank}등</span> 입니다!`;
            else msgEl.innerText = "점수가 저장되었습니다.";
        })
        .catch(e => {
            document.getElementById("res-msg").innerText = "수고하셨습니다!";
        });
    }

    function loadRanking() {
        const list = document.getElementById("ranking-list");
        fetch(API_URL + "?action=list")
        .then(res => res.json())
        .then(data => {
            let html = "";
            if(data.length === 0) {
                html = `<div style='padding:20px; color:#aaa; text-align:center;'>1등에 도전하세요!</div>`;
            } else {
                data.forEach((item, index) => {
                    let medal = "";
                    let style = "";
                    
                    if(index===0) { medal="🥇"; style="width:15%; color:yellow; font-weight:bold;"; }
                    else if(index===1) { medal="🥈"; style="width:15%; color:silver; font-weight:bold;"; }
                    else if(index===2) { medal="🥉"; style="width:15%; color:#cd7f32; font-weight:bold;"; }
                    else { 
                        medal = `<span class="rank-num">${index+1}</span>`;
                        style="width:15%;";
                    }
                    
                    html += `
                    <div class="rank-row">
                        <span style="${style}">${medal}</span>
                        <span style="width:50%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">${item.nickname}</span>
                        <span style="width:35%; text-align:right; color:var(--neon-green);">${item.score}</span>
                    </div>`;
                });
            }
            list.innerHTML = html;
        })
        .catch(err => {
        });
    }

</script>
