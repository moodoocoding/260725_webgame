        :root {
            --p1-main: #ff9f43; 
            --p2-main: #54a0ff;
            --bg-color: #1e1e2e;
            --accent: #feca57;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; width: 100%; height: 90vh; overflow: hidden;
            font-family: 'Jua', sans-serif;
            font-weight: 300;
            background: linear-gradient(135deg, #1e1e2e 0%, #2c3e50 100%);
            color: white;
            touch-action: none; user-select: none;
        }

        /* --- 언어 선택 스위처 --- */
        .lang-switcher {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 3000;
            background: #aaaaaa52;
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            gap: 12px;
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }
        .lang-btn {
            cursor: pointer;
            font-size: 1.8rem;
            transition: transform 0.2s;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            text-decoration: none;
            line-height: 1;
        }
        .lang-btn:hover {
            transform: scale(1.2);
        }

        /* --- 인트로 화면 UI --- */
        #intro-screen {
            position: fixed; inset: 0; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(30, 30, 46, 0.98);
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .title-area { text-align: center; margin-bottom: 20px; }
        .main-title { 
            font-size: 4.5rem; margin: 0; font-weight: normal;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0,242,254,0.3);
            white-space: nowrap;
        }
        .sub-title { font-size: 1.8rem; color: #a4b0be; margin-top: 10px; font-weight: 300; }
        .sub-title a { color: var(--accent); text-decoration: none; border-bottom: 2px solid var(--accent); transition: 0.2s; }
        .sub-title a:hover { color: #fff; border-color: #fff; }

        .content-box {
            display: flex; gap: 40px; align-items: stretch;
            max-width: 1000px; width: 100%;
        }

        /* 설명 카드 */
        .info-card {
            flex: 1; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; justify-content: center;
        }
        .info-item { margin-bottom: 25px; font-size: 1.5rem; line-height: 1.6; color: #dfe6e9; font-weight: 300; }
        .info-highlight { color: var(--accent); font-size: 1.6rem; }
        .info-icon { font-size: 2rem; vertical-align: middle; margin-right: 10px; }

        /* 선택 카드 */
        .select-card {
            flex: 1; display: flex; flex-direction: column; gap: 20px;
        }

        .option-group {
            background: rgba(0,0,0,0.2); padding: 25px; border-radius: 15px;
        }
        .group-label { font-size: 1.4rem; color: #74b9ff; margin-bottom: 15px; display: block; }

        .mode-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .mode-btn {
            flex: 1; min-width: 80px; padding: 15px 10px; border: 2px solid rgba(255,255,255,0.2);
            background: transparent; color: #fff; border-radius: 10px; cursor: pointer;
            font-family: 'Jua', sans-serif; font-size: 1.3rem; transition: 0.2s; font-weight: normal;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.1); }
        .mode-btn.selected {
            background: var(--accent); color: #2d3436; border-color: var(--accent);
            box-shadow: 0 0 15px rgba(254, 202, 87, 0.4);
        }

        .start-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .action-btn {
            padding: 20px; font-size: 2.2rem; border: none; border-radius: 50px; cursor: pointer;
            font-family: 'Jua', sans-serif; color: white; transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-weight: normal;
        }
        .action-btn:active { transform: scale(0.98); }
        .btn-start { background: linear-gradient(45deg, #1dd1a1, #10ac84); }

        /* --- 게임 메인 UI --- */
        #game-screen { display: none; flex-direction: column; width: 100%; height: 100%; }
        
        .top-hud { 
            height: 90px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 30px; background: rgba(0,0,0,0.3); z-index: 100; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .score-box { font-size: 3rem; min-width: 150px; display: flex; align-items: center; gap: 15px; }
        .timer-display { font-size: 3rem; color: #feca57; letter-spacing: 2px; }

        .play-area { flex: 1; display: flex; position: relative; }
        .player-zone { 
            flex: 1; position: relative; display: flex; 
            align-items: center; justify-content: center; 
            border-right: 2px dashed rgba(255,255,255,0.1); 
        }
        .player-zone:last-child { border-right: none; }

        /* 게임 구역 */
        .game-board { 
            height: 80%; /* 부모 높이의 80% */
            aspect-ratio: 1 / 1; /* 정사각형 비율 강제 */
            background: rgba(255,255,255,0.02); border-radius: 20px;
            position: relative; border: 3px solid rgba(255,255,255,0.1); overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
            touch-action: none;
            max-width: 90%;
        }

        /* 방울 디자인 */
        .bubble {
            position: absolute; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #2d3436; cursor: pointer; text-align: center;
            background: radial-gradient(circle at 30% 30%, #fff, var(--b-color));
            box-shadow: 0 5px 15px rgba(0,0,0,0.2), inset 2px 2px 5px rgba(255,255,255,0.5); 
            transition: transform 0.1s; word-break: keep-all; padding: 5px; 
            border: 2px solid rgba(255,255,255,0.8);
            user-select: none; line-height: 1.1;
            touch-action: none;
            /* 폰트 사이즈는 JS에서 동적으로 제어 */
        }
        
        .bubble.active-drag { transform: scale(1.15); box-shadow: 0 0 20px var(--accent); z-index: 999; }
        .bubble.shape { border: 3px solid #fff; background: radial-gradient(circle at 30% 30%, #ffffff, #dfe6e9); }
        .bubble svg { width: 65%; height: 65%; fill: none; stroke: #2d3436; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.1)); pointer-events: none; }
        
        .bubble svg.fill-shape { fill: rgba(45, 52, 54, 0.1); }

        /* 결과 화면 */
        #result-modal {
            display: none; position: fixed; inset: 0; background: rgba(10,10,20,0.95);
            z-index: 3000; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .result-title { font-size: 4rem; color: white; margin-bottom: 20px; text-align: center;}
        .result-score { font-size: 2.5rem; color: var(--accent); margin-bottom: 50px; text-align: center;}

        #line-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 500; }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #ff6b6b !important; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        
        /* 알림 메시지 */
        .toast-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 15px 30px; border-radius: 30px;
            font-size: 1.5rem; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 1001;
            white-space: nowrap;
        }

        /* 전체화면 버튼 스타일 */
        .fullscreen-btn {
            position: fixed; bottom: 20px; right: 20px; 
            width: 60px; height: 60px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 2100; /* 인트로보다 높게 */
            font-size: 2rem; border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.2s;
        }
        .fullscreen-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }

        /* 홈 버튼 (왼쪽 하단) */
        .home-btn {
            position: fixed; bottom: 20px; left: 20px; 
            width: 60px; height: 60px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 1000; 
            font-size: 2rem;
        }

        /* 반응형 */
        @media (max-width: 800px) {
            .content-box { flex-direction: column; gap: 20px; }
            .main-title { font-size: 3rem; white-space: normal; }
            .info-item { font-size: 1.2rem; }
            .mode-buttons { flex-direction: row; }
        }
    </style>
</head>

    let currentLang = 'en'; // 기본값

    // 언어 설정 함수
    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        const storedLang = localStorage.getItem('kingsmath_lang');
        const browserLang = navigator.language.slice(0, 2);

        if (urlLang && VOCAB[urlLang]) {
            currentLang = urlLang;
        } else if (storedLang && VOCAB[storedLang]) {
            currentLang = storedLang;
        } else if (VOCAB[browserLang]) {
            currentLang = browserLang;
        } else {
            currentLang = 'en';
        }
        applyLanguage(currentLang);
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('kingsmath_lang', lang);
        
        // URL 업데이트 (새로고침 없이)
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('lang', lang);
        window.history.pushState({}, '', newUrl);

        applyLanguage(lang);
        // 게임 중이면 즉시 언어 반영을 위해 리로드 권장하지만, 데이터가 꼬일 수 있으므로 리로드
        if(Game.isPlaying) location.reload();
    }

    // --- 1. 효과음 시스템 (Web Audio API) ---
    const AudioSys = {
        ctx: null,
        init() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        },
        playTone(freq, type, duration, vol=0.1) {
            if(!this.ctx) this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },
        playPop() { // 정답: 뽁!
            this.playTone(800, 'sine', 0.1, 0.2);
            setTimeout(() => this.playTone(1200, 'sine', 0.1, 0.2), 50);
        },
        playWrong() { // 오답: 띠용
            this.playTone(150, 'sawtooth', 0.3, 0.1);
        },
        playStart() { // 시작: 띠리링
            [440, 554, 659].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.2), i*100));
        },
        playEnd() { // 종료: 웅~
             this.playTone(300, 'triangle', 1.0, 0.2);
        },
        playTick() { // 5초전: 톡
             this.playTone(800, 'square', 0.05, 0.05);
        },
        playRefresh() { // 리셋: 휘리릭
             [600, 700, 800, 900].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.1), i*50));
        }
    };

    const Game = {
        mode: 2,
        topic: 'all',
        isPlaying: false,
        timer: 60,
        scores: { p1: 0, p2: 0 },
        activePointers: new Map(),
        bubbles: { p1: [], p2: [] },
        
        currentShapes: [],
        currentNames: [],

        setTopic(t) {
            this.topic = t;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        },

        start() {
            AudioSys.init();
            if(AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
            AudioSys.playStart();

            this.mode = 2;
            this.prepareData();
            
            this.isPlaying = true;
            document.getElementById('play-area').classList.remove('single-player');
            document.getElementById('intro-screen').style.display = 'none';
            
            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.display = 'flex';
            
            requestAnimationFrame(() => {
                this.initBoard('p1');
                this.initBoard('p2');
                this.canvas = document.getElementById('line-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                
                this.tick();
                this.renderLines();
            });

            window.addEventListener('resize', () => this.resize());
        },

        prepareData() {
            // 언어에 맞는 DB 가져오기
            const db = getShapesDB();
            
            if (this.topic === 'all') {
                this.currentShapes = [...db];
            } else if (this.topic === 'tri') {
                this.currentShapes = db.filter(s => s.cat === 'tri');
            } else if (this.topic === 'quad') {
                this.currentShapes = db.filter(s => s.cat === 'quad');
            } else {
                this.currentShapes = [...db];
            }

            const nameSet = new Set();
            this.currentShapes.forEach(s => {
                s.tags.forEach(tag => nameSet.add(tag));
            });
            this.currentNames = Array.from(nameSet);
        },

        initBoard(pid) {
            const v = VOCAB[currentLang];
            const board = document.getElementById(`board-${pid}`);
            board.innerHTML = `<div class="toast-msg" id="toast-${pid}">${v.toast}</div>`;
            this.bubbles[pid] = [];
            
            const count = 10; 
            for(let i=0; i<count; i++) this.spawnBubble(pid);
            
            board.onpointerdown = (e) => this.onDown(e, pid);
            board.onpointermove = (e) => this.onMove(e, pid);
            board.onpointerup = (e) => this.onUp(e, pid);

            this.checkDeadlock(pid);
        },

        spawnBubble(pid) {
            const board = document.getElementById(`board-${pid}`);
            const isShape = Math.random() > 0.5;
            
            const shapeData = this.currentShapes[Math.floor(Math.random() * this.currentShapes.length)];
            const nameData = this.currentNames[Math.floor(Math.random() * this.currentNames.length)];

            const el = document.createElement('div');
            el.className = `bubble ${isShape ? 'shape' : 'text'}`;
            
            // 반응형 크기 계산: 화면 너비/높이의 작은 쪽을 기준
            const boardW = board.clientWidth || 300;
            const boardH = board.clientHeight || 400;
            const baseSize = Math.min(boardW, boardH) * 0.18; // 약 18%
            const size = Math.max(45, Math.min(95, baseSize)); // 최소 45px, 최대 95px
            
            let x, y;
            let safe = false;
            let tries = 0;
            
            while(!safe && tries < 100) {
                x = Math.random() * (boardW - size);
                y = Math.random() * (boardH - size);
                safe = true;
                for(let b of this.bubbles[pid]) {
                    const dx = x - b.x;
                    const dy = y - b.y;
                    if(Math.sqrt(dx*dx + dy*dy) < size + 5) safe = false;
                }
                tries++;
            }
            
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            
            const colors = ['#fab1a0', '#81ecec', '#74b9ff', '#a29bfe', '#55efc4', '#ffeaa7'];
            const color = colors[Math.floor(Math.random()*colors.length)];
            el.style.setProperty('--b-color', color);

            if(isShape) {
                el.innerHTML = `<svg viewBox="0 0 100 100">${shapeData.svg}</svg>`;
                el.dataset.type = 'shape';
                el.dataset.id = shapeData.id;
                el.dataset.tags = JSON.stringify(shapeData.tags);
            } else {
                let displayName = nameData.replace('\n', '<br>'); // 줄바꿈 문자 처리
                
                el.innerHTML = displayName;
                el.dataset.type = 'name'; 
                el.dataset.name = nameData;

                // 텍스트 길이에 따라 폰트 조절 (동적 계산) - 크기를 더 작게 조정
                let fontSize = size * 0.35; 
                const len = displayName.replace('<br>', '').length;
                if (displayName.includes('<br>')) {
                    // If multiline, reduce size further to fit height
                    fontSize = size * 0.25;
                    if (len > 8) fontSize = size * 0.2;
                } else {
                    // Single line
                    if (len > 10) fontSize = size * 0.18;
                    else if (len > 6) fontSize = size * 0.22;
                    else if (len > 4) fontSize = size * 0.28;
                }
                
                // 요청사항: 현재 크기의 70%로 축소
                fontSize = fontSize * 0.7;

                el.style.fontSize = fontSize + 'px';
            }

            board.appendChild(el);
            this.bubbles[pid].push({ el, x, y, size });
            
            el.animate([{transform: 'scale(0)'}, {transform: 'scale(1)'}], {duration: 400, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)'});
        },

        checkDeadlock(pid) {
            const v = VOCAB[currentLang];
            const allBubbles = this.bubbles[pid];
            const shapes = allBubbles.filter(b => b.el.dataset.type === 'shape');
            const names = allBubbles.filter(b => b.el.dataset.type === 'name');
            
            let possible = false;

            for(let s of shapes) {
                const tags = JSON.parse(s.el.dataset.tags);
                for(let n of names) {
                    const targetName = n.el.dataset.name;

                    if(tags.includes(targetName)) {
                        possible = true;
                        break;
                    }
                    // '다각형(Polygon)' 특수 규칙: 원과 타원을 제외
                    else if (targetName === v.poly) {
                        if (!tags.includes(v.circle) && !tags.includes(v.oval)) {
                            possible = true;
                            break;
                        }
                    }
                }
                if(possible) break;
            }

            if(!possible && allBubbles.length > 0) {
                // console.log(`[${pid}] Deadlock detected! Resetting...`);
                
                const toast = document.getElementById(`toast-${pid}`);
                toast.style.opacity = 1;
                AudioSys.playRefresh();

                setTimeout(() => {
                    toast.style.opacity = 0;
                    allBubbles.forEach(b => b.el.remove());
                    this.bubbles[pid] = [];
                    for(let i=0; i<10; i++) this.spawnBubble(pid);
                    this.checkDeadlock(pid);
                }, 1000);
            }
        },

        onDown(e, pid) {
            if(!this.isPlaying) return;
            const bubble = e.target.closest('.bubble');
            if(bubble) {
                e.currentTarget.setPointerCapture(e.pointerId);
                bubble.classList.add('active-drag');
                
                // 멀티터치를 위한 포인터별 독립 상태 저장
                this.activePointers.set(e.pointerId, {
                    pid, startEl: bubble, path: [{x: e.clientX, y: e.clientY}]
                });
                
                AudioSys.play('select');
            }
        },

        onMove(e, pid) {
            const drag = this.activePointers.get(e.pointerId);
            if(!drag) return;
            
            const pos = {x: e.clientX, y: e.clientY};
            drag.path.push(pos);

            const hit = this.getBubbleAt(pos.x, pos.y, pid);
            if(hit && hit !== drag.startEl) {
                this.checkMatch(drag, hit);
            }
        },

        onUp(e, pid) {
            const drag = this.activePointers.get(e.pointerId);
            if(drag) {
                drag.startEl.classList.remove('active-drag');
                this.activePointers.delete(e.pointerId);
                if(e.currentTarget && e.currentTarget.releasePointerCapture) {
                    e.currentTarget.releasePointerCapture(e.pointerId);
                }
            }
        },

        checkMatch(drag, target) {
            const v = VOCAB[currentLang];
            const s = drag.startEl;
            const t = target;
            let isCorrect = false;

            if(s.dataset.type !== t.dataset.type) {
                const shape = s.dataset.type === 'shape' ? s : t;
                const name = s.dataset.type === 'name' ? s : t;
                
                if (shape.dataset.tags && name.dataset.name) {
                    const tags = JSON.parse(shape.dataset.tags);
                    const targetName = name.dataset.name;

                    if(tags.includes(targetName)) {
                        isCorrect = true;
                    } 
                    else if (targetName === v.poly) {
                        if (!tags.includes(v.circle) && !tags.includes(v.oval)) {
                            isCorrect = true;
                        }
                    }
                }
            }

            if(isCorrect) {
                this.addScore(drag.pid, 100);
                AudioSys.playPop(); 
                
                s.remove(); t.remove();
                this.bubbles[drag.pid] = this.bubbles[drag.pid].filter(b => b.el !== s && b.el !== t);
                this.activePointers.delete(drag.pointerId);

                setTimeout(() => {
                    if(this.isPlaying) {
                        this.spawnBubble(drag.pid); 
                        this.spawnBubble(drag.pid);
                        this.checkDeadlock(drag.pid);
                    }
                }, 300);
            } else {
                this.activePointers.delete(drag.pointerId);
                s.classList.remove('active-drag');

                this.addScore(drag.pid, -30);
                AudioSys.playWrong();
                
                const board = document.getElementById(`board-${drag.pid}`);
                board.classList.remove('shake');
                void board.offsetWidth; 
                board.classList.add('shake');
                
                if(board.releasePointerCapture) {
                    try { board.releasePointerCapture(drag.pointerId); } catch(err) {}
                }
            }
        },

        getBubbleAt(x, y, pid) {
            for(let b of this.bubbles[pid]) {
                const rect = b.el.getBoundingClientRect();
                const r = rect.width/2;
                const cx = rect.left + r;
                const cy = rect.top + r;
                if(Math.hypot(x-cx, y-cy) < r * 0.8) return b.el;
            }
            return null;
        },

        addScore(pid, val) {
            this.scores[pid] = Math.max(0, this.scores[pid] + val);
            const el = document.getElementById(`score-${pid}`);
            el.style.transform = "scale(1.3)";
            el.style.color = val > 0 ? "#55efc4" : "#ff7675";
            setTimeout(() => {
                el.textContent = this.scores[pid];
                el.style.transform = "scale(1)";
                el.style.color = pid === 'p1' ? 'var(--p1-main)' : 'var(--p2-main)';
            }, 200);
        },

        tick() {
            if(!this.isPlaying) return;
            this.timer--;
            
            if(this.timer <= 5 && this.timer > 0) AudioSys.playTick();
            
            document.getElementById('timer').textContent = this.timer;
            if(this.timer <= 0) this.end();
            else setTimeout(() => this.tick(), 1000);
        },

        renderLines() {
            this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
            
            this.activePointers.forEach(drag => {
                if(drag.path.length < 2) return;
                if(!drag.startEl.isConnected) return;

                this.ctx.beginPath();
                this.ctx.strokeStyle = drag.pid === 'p1' ? '#ff9f43' : '#54a0ff';
                this.ctx.lineWidth = 5;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.setLineDash([15, 10]);
                
                this.ctx.moveTo(drag.path[0].x, drag.path[0].y);
                for(let i=1; i<drag.path.length; i++) this.ctx.lineTo(drag.path[i].x, drag.path[i].y);
                this.ctx.stroke();
                
                const last = drag.path[drag.path.length-1];
                this.ctx.beginPath();
                this.ctx.fillStyle = '#fff';
                this.ctx.setLineDash([]);
                this.ctx.arc(last.x, last.y, 8, 0, Math.PI*2);
                this.ctx.fill();
            });
            
            if(this.isPlaying) requestAnimationFrame(() => this.renderLines());
        },

        resize() { 
            if(this.canvas) {
                this.canvas.width = window.innerWidth; 
                this.canvas.height = window.innerHeight; 
            }
        },

        end() {
            const v = VOCAB[currentLang];
            this.isPlaying = false;
            AudioSys.playEnd();
            
            document.getElementById('result-modal').style.display = 'flex';
            const {p1, p2} = this.scores;
            let winMsg = "";
            let scoreDetail = "";
            
            if(p1 > p2) winMsg = `${v.dog} ${v.win}`;
            else if(p2 > p1) winMsg = `${v.cat} ${v.win}`;
            else winMsg = v.draw;
            scoreDetail = `🐶 ${p1}  vs  🐱 ${p2}`;
            
            document.getElementById('winner-text').textContent = winMsg;
            document.getElementById('final-scores').textContent = scoreDetail;
        }
    };
</script>

</body>
</html>
