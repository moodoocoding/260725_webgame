        { code: 'hi', country: 'in', name: 'हिन्दी', enName: 'Hindi' },
        { code: 'bn', country: 'bd', name: 'বাংলা', enName: 'Bengali' },
        { code: 'tr', country: 'tr', name: 'Türkçe', enName: 'Turkish' },
        { code: 'de', country: 'de', name: 'Deutsch', enName: 'German' },
        { code: 'it', country: 'it', name: 'Italiano', enName: 'Italian' }
    ];

    let currentLang = 'ko';

    /* -----------------------------------------------------------
       2. 오디오 및 게임 변수
    ----------------------------------------------------------- */
    let audioCtx;
    const activeOscillators = {};
    const noteFreqs = { 48: 130.81, 49: 138.59, 50: 146.83, 51: 155.56, 52: 164.81, 53: 174.61, 54: 185.00, 55: 196.00, 56: 207.65, 57: 220.00, 58: 233.08, 59: 246.94, 60: 261.63, 61: 277.18, 62: 293.66, 63: 311.13, 64: 329.63, 65: 349.23, 66: 369.99, 67: 392.00, 68: 415.30, 69: 440.00, 70: 466.16, 71: 493.88, 72: 523.25, 73: 554.37, 74: 587.33, 75: 622.25, 76: 659.25, 77: 698.46, 78: 739.99, 79: 783.99, 80: 830.61, 81: 880.00, 82: 932.33, 83: 987.77 };
    let fixedNames = {};
    const instruments = {
        epiano: { type: 'sine', attack: 0.01, decay: 1.5, sustain: 0.2, release: 0.5, filterFreq: 1500 },
        marimba: { type: 'sine', attack: 0.005, decay: 0.3, sustain: 0.0, release: 0.2, filterFreq: 1000 },
        organ: { type: 'square', attack: 0.05, decay: 0.1, sustain: 0.6, release: 0.1, filterFreq: 800 },
        synth: { type: 'sawtooth', attack: 0.05, decay: 0.2, sustain: 0.4, release: 0.3, filterFreq: 1200 },
        flute: { type: 'triangle', attack: 0.15, decay: 0.1, sustain: 0.8, release: 0.4, filterFreq: 1500 }
    };
    let currentKeyIndex = 0;
    let showEng = false, showKor = false, showSol = true;
    const majorIntervals = [0, 2, 4, 5, 7, 9, 11];

    /* -----------------------------------------------------------
       3. 다국어 적용 로직 (계이름 포함)
    ----------------------------------------------------------- */
    function applyLanguage(langCode, updateUrl = true) {
        currentLang = langCode;
        localStorage.setItem('kingsmath_lang', langCode);
        const data = i18n[langCode];

        document.title = data.title;
        document.getElementById('ui-title').innerText = data.title;
        document.getElementById('opt-epiano').innerText = data.epiano;
        document.getElementById('opt-marimba').innerText = data.marimba;
        document.getElementById('opt-organ').innerText = data.organ;
        document.getElementById('opt-synth').innerText = data.synth;
        document.getElementById('opt-flute').innerText = data.flute;
        document.getElementById('btn-down').innerText = data.flat;
        document.getElementById('btn-up').innerText = data.sharp;
        document.getElementById('toggle-eng').innerText = data.engName;
        document.getElementById('toggle-kor').innerText = data.korName;
        document.getElementById('toggle-sol').innerText = data.solName;

        fixedNames = {
            0: { eng: 'C', kor: data.c },
            1: { eng: 'C#<br>Db', kor: `${data.up} ${data.c}<br>${data.down} ${data.d}` },
            2: { eng: 'D', kor: data.d },
            3: { eng: 'D#<br>Eb', kor: `${data.up} ${data.d}<br>${data.down} ${data.e}` },
            4: { eng: 'E', kor: data.e },
            5: { eng: 'F', kor: data.f },
            6: { eng: 'F#<br>Gb', kor: `${data.up} ${data.f}<br>${data.down} ${data.g}` },
            7: { eng: 'G', kor: data.g },
            8: { eng: 'G#<br>Ab', kor: `${data.up} ${data.g}<br>${data.down} ${data.a}` },
            9: { eng: 'A', kor: data.a },
            10: { eng: 'A#<br>Bb', kor: `${data.up} ${data.a}<br>${data.down} ${data.b}` },
            11: { eng: 'B', kor: data.b }
        };

        window.keys = [
            { index: 0, name: `${data.c}${data.major} (C)`, sig: 'C', rootMidi: 60, scaleNotes: ['c/4', 'd/4', 'e/4', 'f/4', 'g/4', 'a/4', 'b/4', 'c/5'] },
            { index: 1, name: `${data.down}${data.d}${data.major} (Db)`, sig: 'Db', rootMidi: 61, scaleNotes: ['db/4', 'eb/4', 'f/4', 'gb/4', 'ab/4', 'bb/4', 'c/5', 'db/5'] },
            { index: 2, name: `${data.d}${data.major} (D)`, sig: 'D', rootMidi: 62, scaleNotes: ['d/4', 'e/4', 'f#/4', 'g/4', 'a/4', 'b/4', 'c#/5', 'd/5'] },
            { index: 3, name: `${data.down}${data.e}${data.major} (Eb)`, sig: 'Eb', rootMidi: 63, scaleNotes: ['eb/4', 'f/4', 'g/4', 'ab/4', 'bb/4', 'c/5', 'd/5', 'eb/5'] },
            { index: 4, name: `${data.e}${data.major} (E)`, sig: 'E', rootMidi: 64, scaleNotes: ['e/4', 'f#/4', 'g#/4', 'a/4', 'b/4', 'c#/5', 'd#/5', 'e/5'] },
            { index: 5, name: `${data.f}${data.major} (F)`, sig: 'F', rootMidi: 65, scaleNotes: ['f/4', 'g/4', 'a/4', 'bb/4', 'c/5', 'd/5', 'e/5', 'f/5'] },
            { index: 6, name: `${data.down}${data.g}${data.major} (Gb)`, sig: 'Gb', rootMidi: 66, scaleNotes: ['gb/4', 'ab/4', 'bb/4', 'cb/5', 'db/5', 'eb/5', 'f/5', 'gb/5'] },
            { index: 7, name: `${data.g}${data.major} (G)`, sig: 'G', rootMidi: 67, scaleNotes: ['g/4', 'a/4', 'b/4', 'c/5', 'd/5', 'e/5', 'f#/5', 'g/5'] },
            { index: 8, name: `${data.down}${data.a}${data.major} (Ab)`, sig: 'Ab', rootMidi: 68, scaleNotes: ['ab/4', 'bb/4', 'c/5', 'db/5', 'eb/5', 'f/5', 'g/5', 'ab/5'] },
            { index: 9, name: `${data.a}${data.major} (A)`, sig: 'A', rootMidi: 69, scaleNotes: ['a/4', 'b/4', 'c#/5', 'd/5', 'e/5', 'f#/5', 'g#/5', 'a/5'] },
            { index: 10, name: `${data.down}${data.b}${data.major} (Bb)`, sig: 'Bb', rootMidi: 70, scaleNotes: ['bb/4', 'c/5', 'd/5', 'eb/5', 'f/5', 'g/5', 'a/5', 'bb/5'] },
            { index: 11, name: `${data.b}${data.major} (B)`, sig: 'B', rootMidi: 71, scaleNotes: ['b/4', 'c#/5', 'd#/5', 'e/5', 'f#/5', 'g#/5', 'a#/5', 'b/5'] }
        ];

        const currentLangInfo = languages.find(l => l.code === langCode);
        document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${currentLangInfo.country}.png`;
        document.getElementById('currentLangName').textContent = currentLangInfo.name;

        if (updateUrl) {
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + langCode;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }
        updateApp();
    }

    /* -----------------------------------------------------------
       4. 악보 및 건반 렌더링 (계이름 현지화 반영)
    ----------------------------------------------------------- */
    function drawStaff(keyData) {
        const div = document.getElementById('staff-container');
        div.innerHTML = '';
        const renderer = new Vex.Flow.Renderer(div, Vex.Flow.Renderer.Backends.SVG);
        renderer.resize(1200, 240);
        const context = renderer.getContext();
        context.scale(1.7, 1.7);
        const stave = new Vex.Flow.Stave(20, 20, 650);
        stave.addClef('treble').addKeySignature(keyData.sig);
        stave.setContext(context).draw();
        
        // 현재 언어의 계이름 배열 가져오기
        const localSolfege = i18n[currentLang].solfege;

        const notes = keyData.scaleNotes.map((noteStr, i) => {
            const note = new Vex.Flow.StaveNote({ clef: "treble", keys: [noteStr], duration: "q" });
            // i가 7인 경우(옥타브) 첫 번째 계이름 사용
            const label = i === 7 ? localSolfege[0] : localSolfege[i];
            const textAnno = new Vex.Flow.Annotation(label)
                .setVerticalJustification(Vex.Flow.Annotation.VerticalJustify.BOTTOM) 
                .setFont("Malgun Gothic", 16, "bold");
            note.addModifier(0, textAnno); 
            return note;
        });
        Vex.Flow.Formatter.FormatAndDraw(context, stave, notes);
    }

    function renderPiano() {
        const container = document.getElementById('white-keys');
        container.innerHTML = '';
        const currentKey = window.keys[currentKeyIndex];
        const localSolfege = i18n[currentLang].solfege;

        for (let midi = 48; midi <= 83; midi++) {
            const pitchClass = midi % 12;
            const isBlack = [1, 3, 6, 8, 10].includes(pitchClass);
            let solfegeText = '', isRoot = false;
            const distanceFromRoot = (midi - currentKey.rootMidi + 120) % 12; 
            const scaleIndex = majorIntervals.indexOf(distanceFromRoot);
            
            if (scaleIndex !== -1) { 
                solfegeText = localSolfege[scaleIndex]; 
                if (scaleIndex === 0) isRoot = true; 
            }

            const keyDiv = document.createElement('div');
            keyDiv.dataset.midi = midi;
            let labelsHtml = `<div class="label-stack">`;
            if (showEng) labelsHtml += `<span class="eng-name">${fixedNames[pitchClass].eng}</span>`;
            if (showKor) labelsHtml += `<span class="kor-name">${fixedNames[pitchClass].kor}</span>`;
            if (showSol) labelsHtml += `<span class="solfege-text ${isRoot ? 'root-note' : ''}">${solfegeText}</span>`;
            labelsHtml += `</div>`;
            keyDiv.innerHTML = labelsHtml;

            if (!isBlack) { keyDiv.className = 'white-key'; container.appendChild(keyDiv); }
            else { keyDiv.className = 'black-key'; container.lastChild.appendChild(keyDiv); }
        }
        setupEvents();
    }

    /* [이하 로직은 기존과 동일 - 오디오, 이벤트, 모달 제어 등] */
    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const paramLang = urlParams.get('lang');
        const storedLang = localStorage.getItem('kingsmath_lang');
        const browserLang = navigator.language.split('-')[0];
        if (paramLang && i18n[paramLang]) currentLang = paramLang;
        else if (storedLang && i18n[storedLang]) currentLang = storedLang;
        else if (i18n[browserLang]) currentLang = browserLang;
        else currentLang = 'en';
        applyLanguage(currentLang, false);
    }

    function renderLanguages(filterText = '') {
        const grid = document.getElementById('languageGrid');
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        const filteredLangs = languages.filter(lang => lang.name.toLowerCase().includes(lowerFilter) || lang.enName.toLowerCase().includes(lowerFilter));
        filteredLangs.forEach(lang => {
            const isSelected = lang.code === currentLang;
            const btn = document.createElement('div');
            btn.className = `flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden ${isSelected ? 'bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50' : 'bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500'}`;
            btn.innerHTML = `
                <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50"><img src="https://flagcdn.com/w40/${lang.country}.png" class="w-full h-full object-cover"></div>
                <div class="flex-1 min-w-0 flex flex-col items-start">
                    <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                    <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                </div>
                ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}`;
            btn.onclick = () => { applyLanguage(lang.code); showToast(lang.name, lang.code); closeModal(); };
            grid.appendChild(btn);
        });
    }

    function openModal() { document.getElementById('langModal').classList.add('active'); renderLanguages(); }
    function closeModal() { document.getElementById('langModal').classList.remove('active'); }
    function showToast(langName, langCode) {
        document.getElementById('ui-toast').textContent = i18n[langCode].toast;
        document.getElementById('toastLangName').textContent = langName;
        const toast = document.getElementById('toastNotification');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function playNote(midi, id) {
        if (!audioCtx || !noteFreqs[midi] || activeOscillators[id]) return;
        const inst = instruments[document.getElementById('instrument-selector').value];
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
        osc.type = inst.type; osc.frequency.setValueAtTime(noteFreqs[midi], audioCtx.currentTime);
        filter.type = 'lowpass'; filter.frequency.value = inst.filterFreq;
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.8, now + inst.attack); gain.gain.linearRampToValueAtTime(0.8 * inst.sustain, now + inst.attack + inst.decay);
        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); osc.start();
        activeOscillators[id] = { osc, gain, inst };
    }
    function stopNote(id) {
        if (activeOscillators[id]) {
            const { osc, gain, inst } = activeOscillators[id]; const now = audioCtx.currentTime;
            gain.gain.cancelScheduledValues(now); gain.gain.setValueAtTime(gain.gain.value, now); gain.gain.linearRampToValueAtTime(0, now + inst.release);
            osc.stop(now + inst.release); delete activeOscillators[id];
        }
    }
    function setupEvents() {
        const pianoContainer = document.getElementById('piano-container');
        const handleStart = (e) => { if(e.target.closest('.option-btn, #langTriggerBtn, #langModal')) return; e.preventDefault(); initAudio(); const touches = e.changedTouches || [e]; for (let t of touches) { const el = document.elementFromPoint(t.clientX, t.clientY); const target = el ? el.closest('.black-key, .white-key') : null; if (target) { const id = t.identifier || 'mouse'; target.classList.add('pressed'); playNote(target.dataset.midi, id); } } };
        const handleEnd = (e) => { const touches = e.changedTouches || [e]; for (let t of touches) stopNote(t.identifier || 'mouse'); document.querySelectorAll('.pressed').forEach(k => k.classList.remove('pressed')); };
        pianoContainer.onpointerdown = handleStart; pianoContainer.onpointerup = handleEnd; pianoContainer.onpointerleave = handleEnd;
    }
    function updateApp() { const currentKey = window.keys[currentKeyIndex]; document.getElementById('current-key-name').innerText = currentKey.name; drawStaff(currentKey); renderPiano(); }

    document.getElementById('btn-home').addEventListener('click', () => { if (document.fullscreenElement) { currentKeyIndex = 0; applyLanguage(currentLang, false); } else { location.reload(); } });
    document.getElementById('langTriggerBtn').onclick = openModal;
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('searchInput').oninput = (e) => renderLanguages(e.target.value);
    document.getElementById('toggle-eng').onclick = function() { showEng = !showEng; this.classList.toggle('active'); renderPiano(); };
    document.getElementById('toggle-kor').onclick = function() { showKor = !showKor; this.classList.toggle('active'); renderPiano(); };
    document.getElementById('toggle-sol').onclick = function() { showSol = !showSol; this.classList.toggle('active'); renderPiano(); };
    document.getElementById('btn-up').onclick = () => { currentKeyIndex = (currentKeyIndex + 1) % 12; updateApp(); };
    document.getElementById('btn-down').onclick = () => { currentKeyIndex = (currentKeyIndex - 1 + 12) % 12; updateApp(); };

    window.onload = initLanguage;
</script>
</body>
</html>
