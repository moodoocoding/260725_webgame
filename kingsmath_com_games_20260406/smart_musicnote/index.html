        .center { text-align: center; }

        #kingsmath-link-btn, #langTriggerBtn {

            background: rgba(0,0,0,0.4); padding: 5px 15px; border: 2px dashed #555;
            border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 6px;

        #langTriggerBtn i { color: var(--accent-color); font-family: "Font Awesome 6 Free" !important; font-weight: 900; }

        #play-board { flex: 1; display: flex; position: relative; padding: 15px; justify-content: space-between; align-items: center; background: var(--bg-color); }
        .num-column { display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 30%; z-index: 5; gap: 8px; }
        .num-btn { width: 100%; flex: 1; background: #334155; border: 2px solid #475569; border-radius: 10px; color: #fff; display: flex; justify-content: center; align-items: center; font-size: 2.2vh; cursor: pointer; transition: transform 0.1s; text-align: center; word-break: keep-all; box-shadow: 0 4px 6px rgba(0,0,0,0.3); touch-action: none; }
        .num-btn.active { background: var(--primary-color); color: #fff; transform: scale(1.05); z-index: 10; border-color: #fff; }
        .num-btn.matched { background: var(--correct-color); border-color: #fff; transform: scale(1.1); animation: popSuccess 0.3s; color: #000; }
        .num-btn.wrong { background: var(--wrong-color); animation: shake 0.3s; }

        @keyframes popSuccess { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }

        .svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
        .drag-path { stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.8; pointer-events: none; stroke: var(--primary-color); }
        .result-path { stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 1; transition: stroke 0.2s; }

        /* 오버레이 */
        #countdown-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; display: flex; justify-content: center; align-items: center; }
        #countdown-text { font-size: 15vh; font-weight: bold; color: var(--accent-color); text-shadow: 0 0 20px #ff5252; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- 3. 결과 화면 --- */
        #result-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 26, 46, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; padding-bottom: 5vh; backdrop-filter: blur(5px); }
        .result-score { font-size: 8vh; color: var(--accent-color); margin: 1vh 0; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #result-ranking-board { margin-top: 2vh; width: 85%; background: #0f172a; border: 3px dashed var(--primary-color); border-radius: 15px; padding: 1vh; flex-shrink: 0; max-height: 25vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; color: #fff; }

        /* --- 다국어 모달 --- */
        #langModal, #langModal * { box-sizing: border-box !important; font-family: 'Noto Sans KR', sans-serif; }
        #langModal i, #toastNotification i { font-family: "Font Awesome 6 Free" !important; font-weight: 900; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s ease; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');

            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playPitch(pitchKey) {
        if (pitchKey === 'rest') return; 
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freqs[pitchKey], now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.4);
    }

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'tick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now+0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now+0.3);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'end') {
            osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(783.99, now + 0.1); osc.frequency.setValueAtTime(1046.50, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        }
    }

    function shootFireworks() {
        var duration = 3 * 1000; var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };
        function randomInRange(min, max) { return Math.random() * (max - min) + min; }
        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) { return clearInterval(interval); }
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    function getTerm(type, key) {
        const l = musicTerms[currentLang] ? currentLang : 'en';
        return musicTerms[l][type][key];
    }

    // --- Game Setup & Board Logic ---
    function setupBoard() {
        const leftCol = document.getElementById('left-column');
        const rightCol = document.getElementById('right-column');
        leftCol.innerHTML = ''; rightCol.innerHTML = '';

        pitchKeys.forEach(p => {
            const btn = document.createElement('div');
            btn.className = `num-btn num-btn-left`;
            btn.dataset.side = 'left'; btn.dataset.type = 'pitch'; btn.dataset.val = p;
            leftCol.appendChild(btn);
        });

        durationKeys.forEach(d => {
            const btn = document.createElement('div');
            btn.className = `num-btn num-btn-right`;
            btn.dataset.side = 'right'; btn.dataset.type = 'duration'; btn.dataset.val = d;
            rightCol.appendChild(btn);
        });

        updateBoardLabels();
    }

    function updateBoardLabels() {
        document.querySelectorAll('.num-btn-left').forEach(b => { b.innerText = getTerm('pLabels', b.dataset.val); });
        document.querySelectorAll('.num-btn-right').forEach(b => { b.innerText = getTerm('dLabels', b.dataset.val); });
    }

    function updateRightToRests() {
        document.querySelectorAll('.num-btn-right').forEach(b => { b.innerText = getTerm('rLabels', b.dataset.val); });
    }

    function resetBoard() {
        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active', 'matched', 'wrong'));
        document.getElementById('svg-layer').innerHTML = '';
        updateBoardLabels();
    }

    function generateProblem() {
        resetBoard();
        
        let randPitch;
        if (Math.random() < 0.25) {
            randPitch = 'rest';
        } else {
            const notesOnly = pitchKeys.filter(k => k !== 'rest');
            randPitch = notesOnly[Math.floor(Math.random() * notesOnly.length)];
        }
        const randDur = durationKeys[Math.floor(Math.random() * durationKeys.length)];

        targetPitch = randPitch;
        targetDuration = randDur;

        const vfContainer = document.getElementById(`target-vf`);
        vfContainer.innerHTML = '';
        
        const { Renderer, Stave, StaveNote, Voice, Formatter } = Vex.Flow;
        const renderer = new Renderer(vfContainer, Renderer.Backends.SVG);
        renderer.resize(120, 130); // 모바일에 맞게 약간 키움
        const context = renderer.getContext();
        
        const stave = new Stave(10, 15, 100);
        stave.addClef("treble");
        stave.setContext(context).draw();

        let vfKey = randPitch === 'rest' ? 'b/4' : randPitch; 
        let vfDur = randPitch === 'rest' ? randDur + 'r' : randDur;
        let stemDir = 1;
        if (vfKey === 'b/4' || vfKey === 'c/5') stemDir = -1;

        const note = new StaveNote({ keys: [vfKey], duration: vfDur, stem_direction: stemDir });
        const voice = new Voice({ num_beats: 1, beat_value: 1 }).setStrict(false);
        voice.addTickables([note]);
        new Formatter().joinVoices([voice]).format([voice], 50);
        voice.draw(context, stave);
    }

    // --- Drag and Line Drawing Logic ---
    const playBoard = document.getElementById('play-board');
    playBoard.addEventListener('pointerdown', onPointerDown);
    playBoard.addEventListener('pointermove', onPointerMove);
    playBoard.addEventListener('pointerup', onPointerUp);
    // 모바일에서 스크롤 방지
    playBoard.addEventListener('touchstart', (e) => { if(e.target.closest('.num-btn')) e.preventDefault(); }, {passive: false});

    function onPointerDown(e) {
        if (!isPlaying || timeLeft <= 0) return;
        const btn = e.target.closest('.num-btn');
        if (!btn) return;
        
        if(e.cancelable) e.preventDefault(); 
        
        const side = btn.dataset.side;
        const type = btn.dataset.type;
        const val = btn.dataset.val;

        // 쉼표 처리
        if (type === 'pitch' && val === 'rest') updateRightToRests();

        const svg = document.getElementById('svg-layer');
        const boardRect = playBoard.getBoundingClientRect();
        const btnRect = btn.getBoundingClientRect();

        const startX = btnRect.left + btnRect.width / 2 - boardRect.left;
        const startY = btnRect.top + btnRect.height / 2 - boardRect.top;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${startX} ${startY}`);
        path.classList.add('drag-path');
        svg.appendChild(path);

        btn.classList.add('active');
        playSound('click');

        activeDrag = {
            startEl: btn, startSide: side, startType: type, startVal: val, pathEl: path,
            boardRect: boardRect, completed: false, pointerId: e.pointerId
        };
        btn.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
        if (!activeDrag || activeDrag.completed || e.pointerId !== activeDrag.pointerId) return;
        if(e.cancelable) e.preventDefault();

        const currentX = e.clientX - activeDrag.boardRect.left;
        const currentY = e.clientY - activeDrag.boardRect.top;

        // M은 유지하고 L(LineTo)을 덮어씀 (부드러운 직선)
        const d = activeDrag.pathEl.getAttribute('d').split('L')[0] + ` L ${currentX} ${currentY}`;
        activeDrag.pathEl.setAttribute('d', d);

        const hitElement = document.elementFromPoint(e.clientX, e.clientY);
        const targetBtn = hitElement ? hitElement.closest('.num-btn') : null;

        if (targetBtn && targetBtn.dataset.side !== activeDrag.startSide) {
            let isMatch = false;
            const targetType = targetBtn.dataset.type;
            const targetVal = targetBtn.dataset.val;

            if (activeDrag.startType === 'pitch' && targetType === 'duration') {
                if (activeDrag.startVal === targetPitch && targetVal === targetDuration) isMatch = true;
            } else if (activeDrag.startType === 'duration' && targetType === 'pitch') {
                if (activeDrag.startVal === targetDuration && targetVal === targetPitch) isMatch = true;
            }

            completeDrag(targetBtn, isMatch);
        }
    }

    function onPointerUp(e) {
        if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
        if(e.cancelable) e.preventDefault();
        
        if (!activeDrag.completed) {
            if (activeDrag.pathEl.parentNode) activeDrag.pathEl.parentNode.removeChild(activeDrag.pathEl);
            activeDrag.startEl.classList.remove('active');
            updateBoardLabels(); 
        }
        if(activeDrag.startEl && activeDrag.startEl.hasPointerCapture(e.pointerId)) {
            activeDrag.startEl.releasePointerCapture(e.pointerId);
        }
        activeDrag = null;
    }

    function completeDrag(targetBtn, isSuccess) {
        activeDrag.completed = true;
        try { activeDrag.startEl.releasePointerCapture(activeDrag.pointerId); } catch(e){}

        if (isSuccess) {
            activeDrag.pathEl.classList.remove('drag-path');
            activeDrag.pathEl.classList.add('result-path');
            activeDrag.pathEl.setAttribute('stroke', '#00cec9');
            
            const btnRect = targetBtn.getBoundingClientRect();
            const endX = btnRect.left + btnRect.width / 2 - activeDrag.boardRect.left;
            const endY = btnRect.top + btnRect.height / 2 - activeDrag.boardRect.top;
            const d = activeDrag.pathEl.getAttribute('d').split('L')[0] + ` L ${endX} ${endY}`;
            activeDrag.pathEl.setAttribute('d', d);

            activeDrag.startEl.classList.add('matched');
            targetBtn.classList.add('matched');
            
            score++;
            document.getElementById(`score-val`).innerText = score;
            playPitch(targetPitch);

            setTimeout(() => { generateProblem(); }, 500);

        } else {
            const btnRect = targetBtn.getBoundingClientRect();
            const endX = btnRect.left + btnRect.width / 2 - activeDrag.boardRect.left;
            const endY = btnRect.top + btnRect.height / 2 - activeDrag.boardRect.top;
            const d = activeDrag.pathEl.getAttribute('d').split('L')[0] + ` L ${endX} ${endY}`;
            activeDrag.pathEl.setAttribute('d', d);

            activeDrag.pathEl.setAttribute('stroke', '#ff7675'); 
            activeDrag.startEl.classList.add('wrong');
            targetBtn.classList.add('wrong');
            playSound('wrong');

            setTimeout(() => {
                activeDrag.startEl.classList.remove('active', 'wrong');
                targetBtn.classList.remove('active', 'wrong');
                if(activeDrag.pathEl.parentNode) activeDrag.pathEl.parentNode.removeChild(activeDrag.pathEl);
                updateBoardLabels();
            }, 300);
        }
    }


    // --- Core UI Flow ---
    function checkNameAndStart() {
        const input = document.getElementById('nickname');
        const val = input.value.trim();
        const t = i18n[currentLang];

        if(val.length < 1) { alert(t.alertName); return; }
        
        const badWords = ["시발", "씨발", "개새끼", "fuck", "shit"];
        if(badWords.some(w => val.includes(w))) { alert(t.alertBad); return; }

        myNickname = val;
        localStorage.setItem("kingsmaze_name", val);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        
        setupBoard();
        startCountdown();
    }

    function startCountdown() {
        const screen = document.getElementById('countdown-screen');
        const text = document.getElementById('countdown-text');
        screen.classList.remove('hidden');
        
        let cnt = 3;
        text.innerText = cnt;
        playSound('tick');
        
        const intv = setInterval(() => {
            cnt--;
            if(cnt > 0) {
                text.innerText = cnt;
                text.style.animation = 'none';
                text.offsetHeight; 
                text.style.animation = 'pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                playSound('tick');
            } else {
                clearInterval(intv);
                text.innerText = "GO!";
                playSound('start');
                setTimeout(() => {
                    screen.classList.add('hidden');
                    startGame();
                }, 500);
            }
        }, 1000);
    }

    function startGame() {
        score = 0;
        timeLeft = GAME_DURATION;
        isPlaying = true;
        
        document.getElementById('score-val').innerText = score;
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('timer-val').classList.remove('timer-warning');

        generateProblem();
        
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            timeLeft--;
            const tVal = document.getElementById('timer-val');
            tVal.innerText = timeLeft;
            
            if(timeLeft <= 5 && timeLeft > 0) {
                tVal.classList.add('timer-warning');
                playSound('tick');
            }

            if(timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        playSound('end');
        showResult();
    }

    function restartGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        startCountdown();
    }

    function goHome() {
        isPlaying = false;
        clearInterval(timerInterval);
        
        document.getElementById('svg-layer').innerHTML = '';
        
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'block'; 
        
        if(window.playSound) window.playSound('click');
        loadRanking();
    }

    function showResult() {
        document.getElementById('game-screen').classList.add('hidden');
        const resScreen = document.getElementById('result-screen');
        resScreen.classList.remove('hidden');
        
        document.getElementById('res-nickname').innerText = myNickname;
        document.getElementById('res-score').innerText = score;
        document.getElementById('result-ranking-board').innerHTML = "";
        
        if(score >= 20) shootFireworks(); 
        
        submitScoreAPI(myNickname, score);
    }

    // --- Ranking System API ---
    function submitScoreAPI(name, finalScore) {
        const t = i18n[currentLang];
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', finalScore);

        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = t.rankResult.replace('{rank}', data.rank);
                loadResultRanking();
            } else {
                document.getElementById("res-rank").innerText = "Ranking Error";
            }
        })
        .catch(e => console.error(e));
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center">${t.rankingLoading}</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="margin-top:20px;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1);
                let style = (idx < 3) ? "font-size:1.5em;" : "color:var(--primary-color); font-weight:bold;";
                
                html += `<div class="rank-item">
                    <span style="width:15%; text-align:center; ${style}">${rankDisplay}</span>
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#ccc; font-weight:bold;">${item.score}</span>
                </div>`;
            });
            list.innerHTML = html;
        })
        .catch(e => {
            list.innerHTML = `<div class="center" style="color:#ff5252;">${t.rankingError}</div>`;
        });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#888;">TOP 3 Loading...</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="font-size:1.8vh;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i];
                let rankIcon = ["🥇","🥈","🥉"][i];
                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;">
                    <span style="width:15%; text-align:center;">${rankIcon}</span>
                    <span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; font-weight:bold; color:#00cec9;">${item.score}</span>
                </div>`;
            }
            list.innerHTML = html;
        })
        .catch(e => { list.style.display = 'none'; });
    }

    // --- Init ---
    window.onload = function() {
        const savedName = localStorage.getItem("kingsmaze_name"); 
        if(savedName) document.getElementById("nickname").value = savedName;
        
        const initLang = getInitialLang();
        changeLang(initLang, null, true);
        renderLanguages(); 
    };

</script>
</body>
</html>
