/* --- 전자칠판 및 모바일 터치 최적화 (파란색 하이라이트, 드래그 방지) --- */
* {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

/* 기존 게임 기본 폰트 설정 */
body { font-family: 'Jua', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: normal; }
body.lang-vi { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important; }

i[class^="fa-"], i[class*=" fa-"] {
    font-family: "Font Awesome 6 Free" !important;
    font-weight: 900 !important;
}

:root {
    --bg: #121212;
    --panel-bg: #1e1e2e;
    --dark: #e0e0e0;
    --text-muted: #a0a0a0;
    --border-color: #333333;

    --dog-color: #332b00;
    --cat-color: #1e1b2e;
    --rabbit-color: #2e151a;
    --hamster-color: #2e1e0f;
    --panda-color: #0f2e26;
    --monkey-color: #221826;

    --correct: #69db7c;
    --wrong: #ff6b6b;
    --eliminated: #333333;
}

body {
    margin: 0; background: var(--bg); color: var(--dark); overflow: hidden;
    touch-action: none; 
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    transition: background 0.3s, color 0.3s;
}

/* --- UI 모달 및 토스트 전용 CSS --- */
.custom-scrollbar::-webkit-scrollbar { width: 8px; }
.custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

.modal-overlay {
    opacity: 0; visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-content {
    transform: scale(0.95) translateY(-10px); opacity: 0; font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

.toast-anim {
    transform: translateY(100%); opacity: 0; font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.3s ease;
}
.toast-anim.show { transform: translateY(0); opacity: 1; }

/* --- Game UI Components --- */
#overlay {
    position: fixed; inset: 0; background: var(--bg); opacity: 0.98;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; backdrop-filter: blur(15px);
    text-align: center; overflow-y: auto; padding-bottom: 50px;
}

.title-area { margin: 30px 0 20px 0; }
#msgTitle { font-size: 4rem; color: var(--dark); margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: normal; line-height: 1.2; padding: 0 10px; transition: font-size 0.3s;}
.subtitle { color: var(--text-muted); font-size: 1.2rem; margin-top: 10px; font-weight: normal; }
.top-link { color: #339af0; text-decoration: none; font-weight: bold; }

#setupArea { width: 500px; max-width: 95vw; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.setup-group { text-align: left; }
.setup-label { font-size: 1.3rem; color: var(--dark); margin-bottom: 8px; display: block; font-weight: normal; }

.custom-select {
    width: 100%; font-family: inherit; font-size: 1.2rem; padding: 15px;
    border-radius: 15px; border: 2px solid var(--border-color);
    background: var(--panel-bg); color: var(--dark); outline: none;
    cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: normal;
}

.btn-large {
    font-size: 2rem; padding: 15px 0; border-radius: 50px; border: none;
    background: #339af0; color: white; cursor: pointer;
    box-shadow: 0 6px 0 #1c7ed6; transition: 0.1s; font-family: inherit;
    width: 100%; margin-top: 20px; font-weight: normal;
}
.btn-large:active { transform: translateY(4px); box-shadow: 0 2px 0 #1c7ed6; }
#otherGameLink { display: block; margin-top: 20px; color: var(--text-muted); text-decoration: underline; font-size: 1.1rem; }

.side-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    font-size: 2.1rem; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; color: #fff; text-decoration: none;
    transition: 0.2s; -webkit-tap-highlight-color: transparent;
}
.side-btn:active { transform: translateY(-50%) scale(0.9); background: rgba(0,0,0,0.8); }
.left-btn { left: 20px; }
.right-btn { right: 20px; }

@media (max-width: 768px) {
    .side-btn { width: 35px; height: 35px; font-size: 1.3rem; }
    .left-btn { left: 10px; }
    .right-btn { right: 10px; }
}

/* --- Game Screen Structure (상하 50:50 분할) --- */
#topZone { position: relative; display: flex; flex-direction: column; z-index: 10; flex: 0 0 50%; height: 50%; }
#header { height: 80px; flex-shrink: 0; background: var(--panel-bg); display: flex; align-items: center; justify-content: center; padding: 0 20px; border-bottom: 2px solid var(--border-color); position: relative; }
.header-title { font-size: 1.8rem; color: var(--dark); display: flex; align-items: center; gap: 10px; position: absolute; left: 20px; font-weight: normal; }
.timer-box { font-size: 3rem; font-weight: normal; color: #ff6b6b; background: rgba(0,0,0,0.1); padding: 5px 20px; border-radius: 20px; min-width: 100px; text-align: center; }
.timer-urgent { color: #fff; background: #ff6b6b; animation: pulse 0.5s infinite; }

#mainQuestionBoard { background: var(--panel-bg); padding: 10px; text-align: center; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; position: relative; overflow: hidden; width: 100%; }
#qNumber { font-size: 3.2rem; color: var(--text-muted); margin-bottom: 5px; font-weight: normal; flex-shrink: 0; }

/* 큰 글씨 & 한 줄 고정 (white-space: nowrap) */
#bigQuestion { font-size: clamp(1rem, 4.8vw, 6rem); color: #ffd43b; line-height: 1.2; font-family: inherit; font-weight: normal; white-space: nowrap; width: 100%; padding: 0 10px; box-sizing: border-box; overflow: hidden; text-overflow: clip;}

/* Result Popup */
#resultPopup { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30, 30, 46, 0.98); backdrop-filter: blur(10px); z-index: 100; flex-direction: column; align-items: center; justify-content: center; border-bottom: 4px solid var(--border-color); }
#resultTitle { font-size: 3rem; margin: 0 0 20px 0; color: var(--dark); font-weight: normal; }
.result-list { list-style: none; padding: 0; margin: 0; width: 80%; max-width: 600px; max-height: 60%; overflow-y: auto; }

/* Player Arena & Keypads (하단 50% 분할 및 맨 아래 정렬) */
#arena { display: flex; flex: 0 0 50%; height: 50%; width: 100vw; overflow: hidden; background: var(--bg); }
.player-col { flex: 1; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 5px 5px 15px 5px; position: relative; transition: opacity 0.3s; }
.player-col:last-child { border-right: none; }
.player-col.eliminated { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }

.p-header { text-align: center; margin-bottom: 5px; width: 100%; flex-shrink: 0;}
.p-emoji { font-size: 2rem; display: block; }
.p-name { font-size: 1rem; white-space: nowrap; font-weight: normal; }
.p-info { font-size: 1rem; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; margin-top: 2px; color: var(--dark); font-weight: normal; }

.input-display { 
    font-size: 1rem; color: #fff; background: rgba(255,255,255,0.1); 
    border: 2px solid var(--border-color); border-radius: 8px; 
    width: 95%; max-width: 400px; min-height: 40px; margin: 5px 0 10px 0; 
    display: flex; align-items: center; justify-content: center; 
    word-break: break-all; padding: 5px; text-align: center; letter-spacing: 1px;
    flex-shrink: 0;
}

/* Keypad Grid System (화면 끝까지 채우면서 정렬) */
.keypad-container { display: flex; flex-direction: column; gap: 5px; width: 95%; max-width: 400px; flex: 1; justify-content: flex-end; padding-bottom: 5px; margin-top: auto; }
.keypad-row { display: flex; gap: 5px; justify-content: center; flex: 1; min-height: 30px; max-height: 75px; }

.key-btn { 
    flex: 1; background: var(--panel-bg); border: 1px solid var(--border-color); 
    border-radius: 6px; color: var(--dark); font-size: 1.2rem; font-family: inherit; 
    cursor: pointer; display: flex; align-items: center; justify-content: center; 
    box-shadow: 0 3px 0 rgba(0,0,0,0.2); transition: 0.1s; padding: 0;
    touch-action: none; /* 다중 터치 스크롤 방지 */
}
.key-btn:active { transform: translateY(2px); box-shadow: none; }
.key-unit { background: #e67e22; color: white; border-color: #d35400; }
.key-action { background: #7f8c8d; color: white; border-color: #2c3e50; }
.key-submit { background: #27ae60; color: white; border-color: #1e8449; }
.key-delete { background: #c0392b; color: white; border-color: #922b21; }

.num-pad .key-btn { font-size: 1.5rem; }

/* Feedback Overlay */
.feedback-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; flex-direction: column; font-size: 5rem; z-index: 20; border-radius: 0; }
.feedback-overlay.secret { background: #000000 !important; opacity: 1; display: flex; color: white; transition: none; animation: none; }
.feedback-overlay.show-result { display: flex; animation: none; }
.submitted-text { font-size: 1.5rem; margin-top: 15px; color: #fff; text-align: center; line-height: 1.5; font-weight: normal; }
.final-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; box-sizing: border-box; background: rgba(0,0,0,0.85); padding: 15px 10px; border-radius: 15px; text-align: center; z-index: 50; border: 2px solid #fff; display: none; animation: popIn 0.5s; word-break: keep-all; overflow-wrap: break-word; }
.final-status h3 { margin: 0; font-size: 1.2rem; color: #fff; font-weight: normal; }
.final-status p { margin: 5px 0 0 0; font-size: 1.8rem; color: #ffd43b; font-weight: normal; line-height: 1.2;}

/* Countdown */
#countdownLayer { position: fixed; inset: 0; background: #000000; z-index: 2000; display: none; align-items: center; justify-content: center; }
#countdownText { font-size: 25rem; color: #ffec99; text-shadow: 0 0 50px rgba(255, 212, 59, 0.8); font-weight: normal; opacity: 0; }
@keyframes countPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.0); opacity: 0; } }
.count-animate { animation: countPop 0.8s ease-in-out forwards; }

/* Desktop Optimization */
@media (min-width: 1200px) {
    .key-btn { font-size: 1.5rem; }
    .num-pad .key-btn { font-size: 1.2rem; }
    .input-display { font-size: 1rem; min-height: 60px; }
    .keypad-row { max-height: 90px; }
}
@media (max-width: 768px) {
    .p-name { display: none; } .p-info { font-size: 0.8rem; }
    .key-btn { font-size: 1rem; }
    .num-pad .key-btn { font-size: 1rem; }
    .input-display { font-size: 0.5rem; min-height: 30px; margin: 2px 0; }
    .keypad-row { min-height: 25px; }
}

.bg-dog { background: var(--dog-color); } .bg-cat { background: var(--cat-color); } .bg-rabbit { background: var(--rabbit-color); } .bg-hamster { background: var(--hamster-color); } .bg-panda { background: var(--panda-color); } .bg-monkey { background: var(--monkey-color); }
</style>
</head>

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const t = audioCtx.currentTime;

    if (type === 'start') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.linearRampToValueAtTime(880, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.5);
    } else if (type === 'count') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'correct') {
        const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, t); osc2.frequency.setValueAtTime(659.25, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.4);
        gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.3, t + 0.1); gain2.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4); osc2.start(t); osc2.stop(t + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'end') {
        const freqs = [523.25, 659.25, 783.99, 1046.50];
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
        });
    }
}

function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// 숫자를 뒤에서부터 4자리씩 끊어 색깔 블록으로 만들어주는 함수
function formatNumber(numStr) {
    if (!/^\d+$/.test(numStr)) return numStr; // 숫자가 아닌 한글 텍스트인 경우 그대로 반환

    // 4자리마다 색상을 다르게 적용 (일: 노랑, 만: 파랑, 억: 주황, 조: 초록)
    const colors = ['#ffd43b', '#4dabf7', '#ff922b', '#51cf66']; 
    let result = '';
    let temp = numStr;
    let groupIdx = 0;

    while (temp.length > 0) {
        let chunk = temp.slice(-4);
        temp = temp.slice(0, -4);
        result = `<span style="color: ${colors[groupIdx % 4]}">${chunk}</span>` + result;
        groupIdx++;
    }
    return result;
}

// 한글 텍스트에 단위별 띄어쓰기 및 색상 적용
function formatKorean(korStr) {
    if(korStr === "영") return `<span style="color: #ffd43b">영</span>`;
    let res = "";
    let temp = korStr;
    let match;
    // Parse 조
    if (match = temp.match(/^(.*?조)(.*)$/)) {
        res += `<span style="color: #51cf66">${match[1]}</span> `;
        temp = match[2];
    }
    // Parse 억
    if (match = temp.match(/^(.*?억)(.*)$/)) {
        res += `<span style="color: #ff922b">${match[1]}</span> `;
        temp = match[2];
    }
    // Parse 만
    if (match = temp.match(/^(.*?만)(.*)$/)) {
        res += `<span style="color: #4dabf7">${match[1]}</span> `;
        temp = match[2];
    }
    // Remainder
    if (temp.length > 0) {
        res += `<span style="color: #ffd43b">${temp}</span>`;
    }
    return res.trim();
}
function getKoreanVariants(numStr) {
    const units = ['', '만', '억', '조'];
    const subUnits = ['', '십', '백', '천'];
    const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];

    let chunks = [];
    let temp = numStr;
    while (temp.length > 0) {
        chunks.push(temp.slice(-4));
        temp = temp.slice(0, -4);
    }

    let chunkVariantsList = [];

    for (let i = 0; i < chunks.length; i++) {
        let chunkStr = chunks[i];
        let cNum = parseInt(chunkStr, 10);
        if (cNum === 0) {
            chunkVariantsList.push([""]);
            continue;
        }

        let cLen = chunkStr.length;
        let cVars = [""];

        for (let j = 0; j < cLen; j++) {
            let d = parseInt(chunkStr[j], 10);
            if (d === 0) continue;

            let pos = cLen - 1 - j;
            let dKor = digits[d];
            let subUnit = subUnits[pos];

            let newVars = [];
            for (let prefix of cVars) {
                if (d === 1 && pos > 0) {
                    // 1인 경우 '일'을 생략하는 경우와 '일'을 명시적으로 붙이는 경우 모두 생성
                    newVars.push(prefix + subUnit);        // 예: 십, 백, 천
                    newVars.push(prefix + "일" + subUnit); // 예: 일십, 일백, 일천
                } else {
                    newVars.push(prefix + dKor + subUnit);
                }
            }
            cVars = newVars;
        }
        chunkVariantsList.push(cVars);
    }

    let fullVariants = [""];

    for (let i = 0; i < chunkVariantsList.length; i++) {
        let cVars = chunkVariantsList[i];
        let unit = units[i];
        let cNum = parseInt(chunks[i], 10);

        if (cNum === 0) continue;

        let newFullVars = [];
        for (let cVar of cVars) {
            for (let prefix of fullVariants) {
                if (cNum === 1 && i > 0) {
                    // 1만, 1억, 1조의 경우 '일' 생략 및 포함 모두 허용
                    newFullVars.push(unit + prefix);
                    newFullVars.push("일" + unit + prefix);
                } else {
                    newFullVars.push(cVar + unit + prefix);
                }
            }
        }
        fullVariants = newFullVars;
    }

    if (fullVariants.length === 0 || fullVariants[0] === "") return ["영"];

    // 중복 및 공백을 제거하여 최종 정답 목록 생성
    let variants = new Set(fullVariants.map(v => v.replace(/\s+/g, '')));
    return Array.from(variants);
}

function generateProblem() {
    const rangeOpt = document.getElementById('numberRange').value;
    const typeOpt = document.getElementById('problemType').value;

    let length;
    if (rangeOpt === 'range1') length = 2; // 십
    else if (rangeOpt === 'range2') length = 3; // 백
    else if (rangeOpt === 'range3') length = 4; // 천
    else if (rangeOpt === 'range4') length = getRandomInt(5, 8); // 만 ~ 천만
    else if (rangeOpt === 'range5') length = getRandomInt(9, 12); // 억 ~ 천억
    else if (rangeOpt === 'range6') length = getRandomInt(13, 16); // 조 ~ 천조
    else { // 랜덤
        const lengths = [2, 3, 4, getRandomInt(5, 8), getRandomInt(9, 12), getRandomInt(13, 16)];
        length = lengths[getRandomInt(0, 5)];
    }

    // 숫자 문자열 생성 ('0' 등장 확률 대폭 상승)
    let numStr = getRandomInt(1, 9).toString();
    for (let i = 1; i < length; i++) {
        let rand = Math.random();
        if (rand < 0.4) { // 40% 확률로 0 생성
            numStr += "0";
        } else {
            numStr += getRandomInt(1, 9).toString();
        }
    }

    let qType = typeOpt;
    if (qType === 'random') {
        qType = Math.random() > 0.5 ? 'read' : 'write';
    }

    let variants = getKoreanVariants(numStr);
    let q, validAnswers;

    if (qType === 'read') {
        // 숫자 -> 한글 읽기 (숫자에 4자리 색상 포맷팅 적용)
        q = formatNumber(numStr);
        validAnswers = variants; // 띄어쓰기 제거된 유효 답안 배열
    } else {
        // 한글 -> 숫자 쓰기 (질문에 띄어쓰기 및 단위별 색상 적용)
        q = formatKorean(variants[0]);
        validAnswers = [numStr];
    }

    return { q, a: validAnswers, type: qType, numLength: length };
}

// 화면 업데이트 함수: 쓰기 모드일 경우 숫자에 바로 4자리 색상 포맷팅을 적용
function updateInputDisplay(pIdx) {
    const p = state.players[pIdx];
    const disp = document.getElementById(`p-disp-${pIdx}`);
    if (state.problem.type === 'write') {
        disp.innerHTML = formatNumber(p.input);
    } else {
        disp.innerText = p.input;
    }
}

function addChar(pIdx, char) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive) return;
    playSound('click');
    
    // 연속 띄어쓰기 방지
    if (char === ' ' && (p.input.length === 0 || p.input.endsWith(' '))) return;

    p.input += char;
    updateInputDisplay(pIdx);
}

function delChar(pIdx) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive) return;
    if(p.input.length > 0) {
        playSound('click');
        p.input = p.input.slice(0, -1);
        updateInputDisplay(pIdx);
    }
}

function submitAnswer(pIdx) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive || p.input.trim() === "") return;

    playSound('click');
    p.answered = true;
    
    const fb = document.getElementById(`p-fb-${pIdx}`);
    const txt = STRINGS[currentLang] || STRINGS['ko'];
    fb.innerHTML = `
        <div style="font-size:3rem; margin-bottom:10px;">🔒</div>
        <div class="submitted-text">${txt.submitted}</div>
    `;
    fb.classList.add('secret'); 
    
    const living = state.players.filter(pl => pl.alive);
    if(living.every(pl => pl.answered)) finishRound();
}

async function nextTurn() {
    if (state.currentQ >= 1) { endGame(); return; } // 단판승부

    state.currentQ++;
    state.phase = 'counting';
    state.problem = generateProblem();

    state.players.forEach((p, idx) => {
        if(p.alive) {
            p.answered = false; p.input = "";
            const fb = document.getElementById(`p-fb-${idx}`);
            fb.className = 'feedback-overlay'; fb.innerHTML = '';
            document.getElementById(`p-disp-${idx}`).innerHTML = ""; // 초기화
            renderKeypad(idx, state.problem.type);
        }
    });
    
    const txt = STRINGS[currentLang] || STRINGS['ko'];
    document.getElementById('qNumber').innerText = `${txt.q_num}`;
    document.getElementById('bigQuestion').innerText = txt.ready;
    
    await runCountdown();

    state.phase = 'playing';
    document.getElementById('bigQuestion').innerHTML = state.problem.q;
    startTimer();
}

async function runCountdown() {
    const layer = document.getElementById('countdownLayer');
    const txt = document.getElementById('countdownText');
    layer.style.display = 'flex';
    
    for(let i=3; i>0; i--) {
        txt.innerText = i; 
        txt.classList.remove('count-animate');
        void txt.offsetWidth; 
        txt.classList.add('count-animate');
        playSound('count'); 
        await new Promise(r => setTimeout(r, 1000));
    }
    layer.style.display = 'none';
}

function startTimer() {
    let t = 60; // 기본 60초
    
    if (state.problem && state.problem.numLength) {
        let len = state.problem.numLength;
        if (len >= 5 && len <= 12) {
            t = 90; // 만 ~ 천만, 억 ~ 천억
        } else if (len >= 13) {
            t = 120; // 조 ~ 천조
        }
    }

    state.timer = t;
    const tBox = document.getElementById('mainTimer');
    tBox.innerText = t; tBox.classList.remove('timer-urgent');
    
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timer--; tBox.innerText = state.timer;
        if(state.timer <= 5) { tBox.classList.add('timer-urgent'); playSound('count'); }
        if(state.timer <= 0) finishRound();
    }, 1000);
}

function finishRound() {
    clearInterval(state.timerInterval);
    state.phase = 'result';
    const validAnswers = state.problem.a;
    let someoneWrong = false;
    const txt = STRINGS[currentLang] || STRINGS['ko'];

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const fb = document.getElementById(`p-fb-${idx}`);
        const info = document.getElementById(`p-info-${idx}`);
        const disp = document.getElementById(`p-disp-${idx}`);

        fb.classList.remove('secret'); fb.innerHTML = '';
        
        // 정답 검사 (띄어쓰기 무시)
        const userInputClean = p.input.replace(/\s+/g, '');
        const isCorrect = validAnswers.includes(userInputClean);

        if(isCorrect) {
            disp.style.borderColor = "#40c057";
            fb.innerHTML = '<span style="color:#69db7c">⭕</span>'; fb.classList.add('show-result');
            p.survived++;
            p.score += 10; 
            info.innerText = `${p.score}${txt.score_pt}`; 
        } else {
            disp.style.borderColor = "#fa5252";
            someoneWrong = true;
            
            // 오답 시에도 정답이 숫자인 경우 4자리 포맷팅, 한글인 경우 색상 및 띄어쓰기 적용해 보여줌
            fb.innerHTML = `
                <span style="color:#ff6b6b">❌</span>
                <div style="font-size:1.5rem; color:#ffd43b; margin-top:10px;">정답: ${state.problem.type === 'read' ? formatKorean(validAnswers[0]) : formatNumber(validAnswers[0])}</div>
            `;
            fb.classList.add('show-result');
            p.alive = false;
            setTimeout(() => {
                document.getElementById(`p-${idx}`).classList.add('eliminated');
                info.innerText = txt.eliminated;
            }, 2000);
        }
    });
    
    if(!someoneWrong) playSound('correct'); else playSound('wrong');
    setTimeout(() => nextTurn(), 3500);
}

function endGame() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');
    
    const popup = document.getElementById('resultPopup');
    const list = document.getElementById('finalResultList');
    popup.style.display = 'flex'; list.innerHTML = '';
    
    const txt = STRINGS[currentLang] || STRINGS['ko'];

    // 개별 참가자 상태 업데이트
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        if (p.score > 0) { 
            finalDiv.innerHTML = `<h3>${txt.final_score}</h3><p style="color:#69db7c;">${txt.correct}</p>`; 
            finalDiv.style.border = "4px solid #69db7c";
        } else { 
            finalDiv.innerHTML = `<h3>${txt.final_score}</h3><p style="color:#ff6b6b;">${txt.incorrect}</p>`; 
        }
    });

    // 정답자만 추출하여 가로로 나열
    let winners = state.players.filter(p => p.score > 0);

    if (winners.length > 0) {
        let winnerNames = winners.map(p => `${p.icon} ${p.name}`).join(', ');
        list.innerHTML = `
            <div style="text-align: center; line-height: 1.6;">
                <div style="font-size: 4rem; color: #ffd43b; margin-bottom: 20px;">큰 수 킹!👑</div>
                <div style="font-size: 2.5rem; color: #ffffff; word-break: keep-all;">${winnerNames}</div>
            </div>`;
    } else {
        list.innerHTML = `
            <div style="text-align: center; font-size: 3rem; color: #ff6b6b; padding: 20px;">
                모두 오답입니다 😭
            </div>`;
    }
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
    } else {
        document.exitFullscreen();
    }
});

document.getElementById('startBtn').addEventListener('click', initGame);
document.getElementById('restartBtn').addEventListener('click', () => { 
    document.getElementById('overlay').style.display = 'flex'; 
    document.getElementById('resultPopup').style.display = 'none'; 
    document.getElementById('langTriggerContainer').style.display = 'block'; 
});

// 우클릭 방지, 스크롤 방지, 다중 터치 줌 방지 등 글로벌 차단
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('dragstart', event => event.preventDefault());
document.addEventListener('wheel', function(e) { if (e.ctrlKey) { e.preventDefault(); } }, { passive: false });
document.addEventListener('touchstart', function(e) { if (e.touches.length > 1) { e.preventDefault(); } }, { passive: false });

window.addEventListener('DOMContentLoaded', () => {
    renderLanguages();
    applyLanguage();
});

document.getElementById('btn-home').addEventListener('click', () => {
    if (document.fullscreenElement) {
        clearInterval(state.timerInterval);
        state.phase = 'setup';
        
        document.getElementById('resultPopup').style.display = 'none';
        document.getElementById('countdownLayer').style.display = 'none';
        document.getElementById('arena').innerHTML = '';
        document.getElementById('mainTimer').innerText = '60';
        document.getElementById('mainTimer').classList.remove('timer-urgent');
        document.getElementById('bigQuestion').innerText = STRINGS[currentLang].ready;

        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('langTriggerContainer').style.display = 'block';

        if(window.playSound) window.playSound('click');
    } else {
        location.reload();
    }
});
</script>
