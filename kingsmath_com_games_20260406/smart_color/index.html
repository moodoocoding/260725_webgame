            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;
                btn.addEventListener('click', () => changeLang(lang.code, lang));
                grid.appendChild(btn);
            });
        }
    }

    function openModal() {
        // [수정된 부분] 시작 화면이 보이지 않을 때(게임 중이거나 결과 화면일 때) 모달 열림 방지
        if (document.getElementById('start-screen').classList.contains('hidden')) return;
        
        modal.classList.add('active');
        renderLanguages(searchInput.value);
        document.body.style.overflow = 'hidden';
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, langCode) {
        const toastMsg = i18n[langCode].toast || "Language changed.";
        document.getElementById('ui-toast').textContent = toastMsg;
        toastLangName.textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function changeLang(langCode, langObj = null) {
        if(!i18n[langCode]) return;
        currentLang = langCode;
        const t = i18n[langCode];
        
        if (!langObj) langObj = languagesList.find(l => l.code === langCode);

        // 업데이트
        document.querySelectorAll('[data-i18n]').forEach(el => { 
            const key = el.getAttribute('data-i18n');
            let str = t[key];
            if(str) {
                const arg = el.getAttribute('data-i18n-arg');
                if(arg) str = str.replace('{n}', arg);
                el.innerText = str;
            }
        });
        
        document.getElementById("nickname").placeholder = t.placeholder;
        document.getElementById("nickname").setAttribute('data-i18n-ph', 'placeholder');
        
        currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;

        const linkBtn = document.getElementById("kingsmath-link-btn");
        if(langCode === 'ko') linkBtn.innerText = "킹수학.com";
        else linkBtn.innerText = "KingsMath.com";

        const mainTitle = document.getElementById('main-title-el');
        if(['ru', 'es', 'fr', 'pt-br', 'de', 'it', 'id', 'vi'].includes(langCode)) {
            mainTitle.style.fontSize = "5vh";
        } else if(['th'].includes(langCode)) {
            mainTitle.style.fontSize = "6vh";
        } else {
            mainTitle.style.fontSize = "7vh"; 
        }

        document.title = t.metaTitle;
        document.getElementById("meta-desc").setAttribute("content", t.metaDesc);

        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + langCode;
        window.history.pushState({path:newUrl}, '', newUrl);
        localStorage.setItem("kingsmath_lang", langCode);

        initQR(); 
        loadRanking(); 

        closeModal();
        if (langObj) showToast(langObj.name, langCode); 
    }

    triggerBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });


    // --- QR Code ---
    let qrObject = null;
    function initQR() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; 
        const url = window.location.href;
        try {
            qrObject = new QRCode(qrContainer, {
                text: url, width: 128, height: 128, colorDark : "#1a1a2e", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
        } catch(e) { console.error("QR Code 생성 실패", e); }
    }

    function showBigQR() {
        const modal = document.getElementById("qr-modal");
        const modalContent = document.getElementById("qr-modal-content");
        modalContent.innerHTML = "";
        
        const qrCanvas = document.querySelector("#qrcode canvas");
        const qrImg = document.querySelector("#qrcode img");
        
        let src = "";
        if (qrCanvas) src = qrCanvas.toDataURL("image/png");
        else if (qrImg) src = qrImg.src;

        if (src) {
            const newImg = new Image();
            newImg.src = src;
            modalContent.appendChild(newImg);
            modal.style.display = "flex";
        }
    }

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'tick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now+0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'pop') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'end') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(100, now+0.5);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'bell') {
            osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(783.99, now + 0.1); 
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
            osc.start(now); osc.stop(now + 0.8);
        }
    }

    function shootFireworks() {
        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };
        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) { return clearInterval(interval); }
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    // --- Color Math ---
    function hslToRgb(h, s, l) {
        s /= 100; l /= 100;
        const k = n => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
    }

    // --- Sliders Logic ---
    function bindSliders() {
        ['h', 's', 'l'].forEach(type => {
            const track = document.getElementById(`track-${type}`);
            track.addEventListener('pointerdown', onSliderPointerDown);
            track.addEventListener('pointermove', onSliderPointerMove);
        });
    }

    function updateSliderFromEvent(e, track) {
        if (!isPlaying) return;
        const rect = track.getBoundingClientRect();
        let y = e.clientY - rect.top;
        y = Math.max(0, Math.min(y, rect.height));
        const ratio = y / rect.height; 
        const type = track.dataset.type;

        if (type === 'h') tempH = ratio * 360; 
        if (type === 's') tempS = (1 - ratio) * 100; 
        if (type === 'l') tempL = (1 - ratio) * 100; 

        updateColorUI();
    }

    function onSliderPointerDown(e) {
        e.currentTarget.setPointerCapture(e.pointerId);
        updateSliderFromEvent(e, e.currentTarget);
        playSound('pop');
    }

    function onSliderPointerMove(e) {
        if (e.currentTarget.hasPointerCapture(e.pointerId)) {
            updateSliderFromEvent(e, e.currentTarget);
        }
    }

    function updateColorUI() {
        const trackS = document.getElementById(`track-s`);
        trackS.style.background = `linear-gradient(to bottom, hsl(${tempH}, 100%, 50%), hsl(${tempH}, 0%, 50%))`;
        
        const trackL = document.getElementById(`track-l`);
        trackL.style.background = `linear-gradient(to bottom, white, hsl(${tempH}, ${tempS}%, 50%), black)`;

        document.getElementById(`thumb-h`).style.top = `${(tempH / 360) * 100}%`;
        document.getElementById(`thumb-s`).style.top = `${(100 - tempS)}%`;
        document.getElementById(`thumb-l`).style.top = `${(100 - tempL)}%`;

        selectedRGB = hslToRgb(tempH, tempS, tempL);
        const colorStr = `hsl(${tempH}, ${tempS}%, ${tempL}%)`;

        const preview = document.getElementById(`color-preview`);
        preview.style.backgroundColor = colorStr;
        preview.innerText = ""; 
    }

    // --- Game Logic ---
    function initGame() {
        // Reset Temp Colors (Center)
        tempH = 180; tempS = 50; tempL = 50;
        updateColorUI();
        document.getElementById(`color-preview`).innerText = i18n[currentLang].previewWait;
        
        // Random Target Color (Advanced Rule: h:0~360, s:40~100, l:15~85)
        let h = Math.floor(Math.random() * 360);
        let s = Math.floor(Math.random() * 60) + 40; 
        let l = Math.floor(Math.random() * 70) + 15;
        targetRGB = hslToRgb(h, s, l);
        const targetColorStr = `hsl(${h}, ${s}%, ${l}%)`;

        const memoScreen = document.getElementById('memorize-screen');
        const memoBox = document.getElementById('memo-color-box');
        const memoText = document.getElementById('memo-text');
        
        memoBox.style.backgroundColor = targetColorStr;
        memoScreen.classList.remove('hidden');

        let memoCount = MEMORIZE_TIME;
        memoText.innerText = i18n[currentLang].memoWait.replace('{n}', memoCount);
        playSound('tick');

        const memoIv = setInterval(() => {
            memoCount--;
            if(memoCount > 0) {
                memoText.innerText = i18n[currentLang].memoWait.replace('{n}', memoCount);
                playSound('tick');
            } else {
                clearInterval(memoIv);
                playSound('bell');
                memoScreen.classList.add('hidden');
                startSelectionPhase();
            }
        }, 1000);
    }

    function startSelectionPhase() {
        isPlaying = true;
        timeLeft = SELECTION_TIME;
        
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('timer-val').classList.remove('timer-warning');
        
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            timeLeft--;
            const tVal = document.getElementById('timer-val');
            tVal.innerText = timeLeft;
            
            if(timeLeft <= 5 && timeLeft > 0) {
                tVal.classList.add('timer-warning');
                playSound('tick');
            }

            if(timeLeft <= 0) {
                document.getElementById('color-preview').innerText = i18n[currentLang].timeOver;
                submitColor();
            }
        }, 1000);
    }

    function submitColor() {
        if(!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        
        if(!selectedRGB) selectedRGB = [0,0,0]; // No interaction fallback
        
        // 거리 계산 및 일치율 산정
        let d = Math.sqrt(
            Math.pow(targetRGB[0] - selectedRGB[0], 2) +
            Math.pow(targetRGB[1] - selectedRGB[1], 2) +
            Math.pow(targetRGB[2] - selectedRGB[2], 2)
        );
        
        let rawPercent = Math.max(0, 100 - (d / MAX_DIST) * 100);
        // 서버 전송을 위한 100배 정수 스케일링 (예: 98.45% -> 9845)
        finalScoreInt = Math.round(rawPercent * 100); 

        playSound('end');
        showResult();
    }

    function showResult() {
        document.getElementById('game-screen').classList.add('hidden');
        const resScreen = document.getElementById('result-screen');
        resScreen.classList.remove('hidden');
        
        const displayScore = (finalScoreInt / 100).toFixed(2) + '%';
        
        document.getElementById('res-nickname').innerText = myNickname;
        document.getElementById('res-score').innerText = displayScore;
        
        document.getElementById('result-ranking-board').innerHTML = "";
        
        if(finalScoreInt >= 9000) shootFireworks(); // 90% 이상이면 폭죽
        
        submitScoreAPI(myNickname, finalScoreInt);
    }

    // --- UI & Utils ---
    function checkNameAndStart() {
        const input = document.getElementById('nickname');
        const val = input.value.trim();
        const t = i18n[currentLang];

        if(val.length < 1) { alert(t.alertName); return; }
        
        const badWords = ["시발", "씨발", "개새끼", "fuck", "shit"];
        if(badWords.some(w => val.includes(w))) { alert(t.alertBad); return; }

        myNickname = val;
        localStorage.setItem("kingsmaze_name", val);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        
        startCountdown();
    }

    function startCountdown() {
        const screen = document.getElementById('countdown-screen');
        const text = document.getElementById('countdown-text');
        screen.classList.remove('hidden');
        
        let cnt = 3;
        text.innerText = cnt;
        playSound('tick');
        
        const intv = setInterval(() => {
            cnt--;
            if(cnt > 0) {
                text.innerText = cnt;
                text.style.animation = 'none';
                text.offsetHeight; 
                text.style.animation = 'pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                playSound('tick');
            } else {
                clearInterval(intv);
                text.innerText = "GO!";
                playSound('start');
                setTimeout(() => {
                    screen.classList.add('hidden');
                    initGame();
                }, 500);
            }
        }, 1000);
    }

    function restartGame() {
        // [수정된 부분] 다시 하기 클릭 시 혹시 모를 모달 강제 닫힘 보장 및 언어 선택 팝업 방지
        closeModal();
        
        isPlaying = false;
        clearInterval(timerInterval);
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        startCountdown();
    }

    function goHome() {
        if (document.fullscreenElement) {
            isPlaying = false;
            clearInterval(timerInterval);
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            
            document.getElementById('langTriggerContainer').style.display = 'block'; 
            
            if(window.playSound) window.playSound('tick');
            loadRanking();
        } else {
            location.reload();
        }
    }

    // --- Ranking System API ---
    function submitScoreAPI(name, scoreInt) {
        const t = i18n[currentLang];
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', scoreInt);

        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = t.rankResult.replace('{rank}', data.rank);
                loadResultRanking();
            } else {
                document.getElementById("res-rank").innerText = "Ranking Error";
            }
        })
        .catch(e => console.error(e));
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center">${t.rankingLoading}</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="margin-top:20px;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1);
                let style = (idx < 3) ? "font-size:1.5em;" : "color:#FFD93D; font-weight:bold;";
                let formattedScore = (item.score / 100).toFixed(2) + '%';
                
                html += `<div class="rank-item">
                    <span style="width:15%; text-align:center; ${style}">${rankDisplay}</span>
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#ccc; font-weight:bold;">${formattedScore}</span>
                </div>`;
            });
            list.innerHTML = html;
        })
        .catch(e => {
            list.innerHTML = `<div class="center" style="color:#ff5252;">${t.rankingError}</div>`;
        });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#888;">TOP 3 Loading...</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="font-size:1.8vh;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i];
                let rankIcon = ["🥇","🥈","🥉"][i];
                let formattedScore = (item.score / 100).toFixed(2) + '%';

                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;">
                    <span style="width:15%; text-align:center;">${rankIcon}</span>
                    <span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; font-weight:bold; color:#FFD93D;">${formattedScore}</span>
                </div>`;
            }
            list.innerHTML = html;
        })
        .catch(e => {
            list.style.display = 'none'; 
        });
    }

    // --- Init ---
    window.onload = function() {
        const savedName = localStorage.getItem("kingsmaze_name"); 
        if(savedName) document.getElementById("nickname").value = savedName;
        
        const initLang = getInitialLang();
        changeLang(initLang);
        renderLanguages(); 
        bindSliders();
    };

</script>
