    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap');
        
        :root {
            --pika-yellow: #FFD93D;
            --pika-red: #FF6B6B;
            --pika-brown: #5d4037;
            --bg-color: #faf8ef;
        }

        body {
            margin: 0; padding: 0;
            background-color: #333;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== 게임 전용 CSS (폰트 독립) ===== */
        #game-container {
            font-weight: normal; 
            width: 100%; max-width: 600px;
            height: 100vh; height: 100dvh;
            margin: 0 auto;
            background: var(--bg-color);
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }

        #game-container.font-ko { font-family: 'Jua', sans-serif; }
        #game-container.font-other { font-family: sans-serif; }
        #game-container h1, #game-container h2, #game-container h3, 
        #game-container p, #game-container span:not(.fa-solid):not(.fa-brands):not(.fa-regular), 
        #game-container button, #game-container input {
            font-weight: normal !important;
        }

        .btn-main {
            background-color: var(--pika-brown);
            color: white;
            border: 3px dashed rgba(255,255,255,0.4);
            border-radius: 20px; 
            box-shadow: 0 6px 0 #3e2723;
            transition: all 0.1s;
        }
        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3e2723;
        }

        .ranking-box {
            background: rgba(255, 255, 255, 0.95);
            border: 3px dashed #d7ccc8;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            min-height: 0; 
        }
        
        .ranking-content {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 5px;
        }

        .ranking-content::-webkit-scrollbar { width: 6px; }
        .ranking-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 10px; }
        .ranking-content::-webkit-scrollbar-thumb { background: #ffcc80; border-radius: 10px; }

        .silhouette { filter: brightness(0) opacity(0.8); }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes scaleFade {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        .animate-scaleFade { animation: scaleFade 1s ease-in-out forwards; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slideUp { animation: slideUp 0.3s ease-out forwards; }

        .dynamic-text {
            font-size: clamp(1rem, 4vw, 1.5rem);
            word-break: keep-all;
        }

        /* ===== 다국어 모달 전용 CSS (완벽 격리) ===== */
        .lang-modal-wrapper {
            font-family: 'Noto Sans KR', sans-serif !important;
        }
        .lang-modal-wrapper * {
            box-sizing: border-box !important;
        }
        .lang-modal-wrapper i {
            font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
            font-weight: 900;
        }
        .lang-modal-wrapper .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .lang-modal-wrapper .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .lang-modal-wrapper .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .lang-modal-wrapper .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .lang-modal-overlay {
            opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-modal-overlay.active {
            opacity: 1; visibility: visible;
        }
        .lang-modal-content {
            transform: scale(0.95) translateY(-10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-modal-overlay.active .lang-modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .lang-toast {
            transform: translateY(100%); opacity: 0;
            transition: all 0.3s ease;
        }
        .lang-toast.show {
            transform: translateY(0); opacity: 1;
        }
    </style>

        function getLang() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('lang')) return params.get('lang').toLowerCase();
            const stored = localStorage.getItem('kingsmath_lang');
            if (stored) return stored;
            const nav = navigator.language.split('-')[0].toLowerCase();
            if (LANGUAGES.some(l => l.code === nav)) return nav;
            return 'en';
        }

        const t = (lang, key, ...args) => {
            let str = TRANSLATIONS[lang][key] || TRANSLATIONS['en'][key];
            args.forEach((arg, i) => {
                str = str.replace(`{${i}}`, arg);
            });
            return str;
        };

        // --- Language Modal Component ---

            );

                <div className="lang-modal-wrapper">
                    <div id="langModalOverlay" className="lang-modal-overlay active fixed inset-0 z-[99999] flex items-start sm:items-center justify-center bg-black/60 backdrop-blur-sm pt-16 sm:pt-0 px-4" onClick={(e) => e.target.id === 'langModalOverlay' && onClose()}>

        // --- Main App ---
        function App() {
            const [lang, setLang] = useState(getLang());
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [toastInfo, setToastInfo] = useState({ show: false, msg: '', name: '' });

            const [gameState, setGameState] = useState('start'); 
            const [score, setScore] = useState(0);
            const [round, setRound] = useState(1);
            const [nickname, setNickname] = useState(localStorage.getItem('monster_king_name') || '');
            const [ranking, setRanking] = useState([]);
            const [options, setOptions] = useState([]);
            const [questionData, setQuestionData] = useState(null);
            
            const [timeLeft, setTimeLeft] = useState(10000); 
            const [countdown, setCountdown] = useState(3);
            const [myRank, setMyRank] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            
            const [lastResult, setLastResult] = useState({ isCorrect: false, points: 0, timeBonus: 0 });
            const [qrUrl, setQrUrl] = useState('');

            const MAX_ROUNDS = 14; 
            const timerRef = useRef(null);
            const timeLeftRef = useRef(10000); 

            const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

            useEffect(() => {
                // SEO Update
                document.title = `${t(lang, 'gameTitle1')} ${t(lang, 'gameTitle2')} | ${t(lang, 'siteName')}`;
            }, [lang]);

            useEffect(() => {
                if (typeof window !== 'undefined') {
                    setQrUrl(encodeURIComponent(window.location.href));
                }
                loadRanking();
            }, []);

            const loadRanking = () => {
                fetch(API_URL + '?action=list')
                    .then(res => res.json())
                    .then(data => setRanking(data))
                    .catch(e => console.error("Ranking load error", e));
            };

            const changeLanguage = (selectedLang) => {
                setLang(selectedLang.code);
                localStorage.setItem('kingsmath_lang', selectedLang.code);
                const url = new URL(window.location);
                url.searchParams.set('lang', selectedLang.code);
                window.history.pushState({}, '', url);
                
                setIsModalOpen(false);
                setToastInfo({ 
                    show: true, 
                    msg: t(selectedLang.code, 'toastMsg'), 
                    name: selectedLang.name 
                });
                setTimeout(() => setToastInfo(prev => ({ ...prev, show: false })), 3000);
            };

            const fetchRoundData = async () => {
                setIsLoading(true);
                try {
                    const count = (round === 7 || round === 8 || round === 13) ? 30 : 5;
                    const ids = Array.from({length: count}, () => Math.floor(Math.random() * 493) + 1);
                    
                    const pkmnResponses = await Promise.all(ids.map(id => fetch(`https://pokeapi.co/api/v2/pokemon/${id}`)));
                    const pkmnData = await Promise.all(pkmnResponses.map(r => r.json()));
                    
                    const speciesResponses = await Promise.all(ids.map(id => fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`)));
                    const speciesData = await Promise.all(speciesResponses.map(r => r.json()));

                    const targetLang = POKEAPI_LANG_MAP[lang] || 'en';

                    let pool = pkmnData.map((pkmn, i) => {
                        const localName = speciesData[i].names.find(n => n.language.name === targetLang)?.name || pkmn.name;
                        return {
                            id: pkmn.id,
                            name: localName,
                            front: pkmn.sprites.other['official-artwork'].front_default || pkmn.sprites.front_default,
                            back: pkmn.sprites.back_default || pkmn.sprites.front_default,
                            types: pkmn.types.map(t => t.type.name),
                            attack: pkmn.stats.find(s => s.stat.name === 'attack')?.base_stat || 0,
                            height: pkmn.height,
                            weight: pkmn.weight,
                            moves: pkmn.moves.map(m => m.move)
                        };
                    });

                    let qData = {};
                    let selectedOptions = [];
                    let target = null;
                    let answer = null;

                    switch(round) {
                        case 1:
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            qData = { text: t(lang, 'q1'), mainImage: target.front, isMainSilhouette: false, optionType: 'text', answer: target };
                            break;
                        case 2:
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            qData = { text: t(lang, 'q2', target.name), mainImage: null, isMainSilhouette: false, optionType: 'front', answer: target };
                            break;
                        case 3:
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            qData = { text: t(lang, 'q3'), mainImage: target.back, isMainSilhouette: false, optionType: 'text', answer: target };
                            break;
                        case 4:
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            qData = { text: t(lang, 'q4', target.name), mainImage: null, isMainSilhouette: false, optionType: 'back', answer: target };
                            break;
                        case 5:
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            qData = { text: t(lang, 'q5'), mainImage: target.front, isMainSilhouette: true, optionType: 'text', answer: target };
                            break;
                        case 6:
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            qData = { text: t(lang, 'q6', target.name), mainImage: null, isMainSilhouette: false, optionType: 'silhouette', answer: target };
                            break;
                        case 7:
                        case 8:
                            let typeGroups = {};
                            pool.forEach(p => {
                                let tType = p.types[0];
                                if(!typeGroups[tType]) typeGroups[tType] = [];
                                typeGroups[tType].push(p);
                            });
                            let validTypes = Object.keys(typeGroups).filter(tType => typeGroups[tType].length >= 2);
                            if(validTypes.length === 0) return fetchRoundData();
                            let chosenType = validTypes[0];
                            let sameTypePkmn = typeGroups[chosenType].slice(0, 2);
                            target = sameTypePkmn[0];
                            answer = sameTypePkmn[1];
                            let otherTypes = pool.filter(p => !p.types.includes(chosenType)).slice(0, 3);
                            if(otherTypes.length < 3) return fetchRoundData(); 
                            selectedOptions = shuffle([answer, ...otherTypes]);
                            if (round === 7) {
                                qData = { text: t(lang, 'q7', target.name), mainImage: null, isMainSilhouette: false, optionType: 'front', answer: answer };
                            } else {
                                qData = { text: t(lang, 'q8'), mainImage: target.front, isMainSilhouette: false, optionType: 'text', answer: answer };
                            }
                            break;
                        case 9:
                            selectedOptions = pool.slice(0, 4);
                            let maxAtk = Math.max(...selectedOptions.map(o => o.attack));
                            answer = selectedOptions.find(o => o.attack === maxAtk);
                            selectedOptions = shuffle(selectedOptions);
                            qData = { text: t(lang, 'q9'), mainImage: null, isMainSilhouette: false, optionType: 'front', answer: answer };
                            break;
                        case 10:
                            selectedOptions = pool.slice(0, 4);
                            let maxHt = Math.max(...selectedOptions.map(o => o.height));
                            answer = selectedOptions.find(o => o.height === maxHt);
                            selectedOptions = shuffle(selectedOptions);
                            qData = { text: t(lang, 'q10'), mainImage: null, isMainSilhouette: false, optionType: 'front', answer: answer };
                            break;

                        case 11:
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            let randomMove = target.moves[Math.floor(Math.random() * target.moves.length)];
                            let moveRes = await fetch(randomMove.url);
                            let moveData = await moveRes.json();
                            let localMoveName = moveData.names.find(n => n.language.name === targetLang)?.name || moveData.name;
                            qData = { text: t(lang, 'q11', localMoveName), mainImage: null, isMainSilhouette: false, optionType: 'front', answer: target };
                            break;
                            
                        case 12: 
                            selectedOptions = shuffle(pool.slice(0, 4));
                            target = selectedOptions[Math.floor(Math.random() * 4)];
                            
                            let movePromises = selectedOptions.map(opt => {
                                let m = opt.moves[Math.floor(Math.random() * opt.moves.length)];
                                return fetch(m.url).then(r => r.json());
                            });
                            let movesData = await Promise.all(movePromises);
                            
                            let optionMoves = movesData.map((mData, idx) => {
                                let localName = mData.names.find(n => n.language.name === targetLang)?.name || mData.name;
                                return {
                                    id: selectedOptions[idx].id, 
                                    name: localName,
                                    front: selectedOptions[idx].front 
                                };
                            });
                            
                            answer = optionMoves.find(o => o.id === target.id);
                            selectedOptions = shuffle(optionMoves);
                            qData = { text: t(lang, 'q12', target.name), mainImage: target.front, isMainSilhouette: false, optionType: 'text', answer: answer };
                            break;

                        case 13:
                            let tGroups = {};
                            pool.forEach(p => {
                                let tType = p.types[0];
                                if(!tGroups[tType]) tGroups[tType] = [];
                                tGroups[tType].push(p);
                            });
                            let vTypes = Object.keys(tGroups).filter(tType => tGroups[tType].length >= 3);
                            if(vTypes.length === 0) return fetchRoundData(); 
                            
                            let cType = vTypes[0];
                            let sTypePkmn = tGroups[cType].slice(0, 3);
                            let oTypes = pool.filter(p => !p.types.includes(cType));
                            
                            if(oTypes.length < 1) return fetchRoundData();
                            answer = oTypes[0];
                            
                            selectedOptions = shuffle([...sTypePkmn, answer]);
                            qData = { text: t(lang, 'q13'), mainImage: null, isMainSilhouette: false, optionType: 'front', answer: answer };
                            break;

                        case 14:
                            selectedOptions = pool.slice(0, 4);
                            let maxWt = Math.max(...selectedOptions.map(o => o.weight));
                            answer = selectedOptions.find(o => o.weight === maxWt);
                            selectedOptions = shuffle(selectedOptions);
                            qData = { text: t(lang, 'q14'), mainImage: null, isMainSilhouette: false, optionType: 'front', answer: answer };
                            break;
                    }
                    setOptions(selectedOptions);
                    setQuestionData(qData);

                    const imagesToLoad = [];
                    if (qData.mainImage) imagesToLoad.push(qData.mainImage);
                    if (qData.optionType !== 'text') {
                        selectedOptions.forEach(opt => {
                            imagesToLoad.push(qData.optionType === 'back' ? opt.back : opt.front);
                        });
                    }
                    await Promise.all(imagesToLoad.map(src => new Promise(res => {
                        const img = new Image();
                        img.onload = res;
                        img.onerror = res;
                        img.src = src;
                    })));

                } catch (e) { 
                    console.error("Data load failed, retrying...", e); 
                    fetchRoundData(); 
                }
                setIsLoading(false);
            };

            const startGame = () => {
                if (!nickname.trim()) { alert("Please enter nickname!"); return; }
                localStorage.setItem('monster_king_name', nickname);
                setScore(0);
                setRound(1);
                startNewRound();
            };

            const startNewRound = () => {
                setGameState('countdown');
                setCountdown(3);
                setQuestionData(null);
                fetchRoundData();
            };

            useEffect(() => {
                if (gameState === 'countdown') {
                    if (countdown > 0) {
                        const tId = setTimeout(() => setCountdown(c => c - 1), 1000);
                        return () => clearTimeout(tId);
                    } else {
                        setGameState('playing');
                        setTimeLeft(10000);
                        timeLeftRef.current = 10000;
                    }
                }
            }, [gameState, countdown]);

            useEffect(() => {
                if (gameState === 'playing') {
                    const startTime = Date.now();
                    const maxDuration = 10000;
                    
                    const tick = () => {
                        const passed = Date.now() - startTime;
                        const remaining = Math.max(0, maxDuration - passed);
                        
                        timeLeftRef.current = remaining;
                        setTimeLeft(remaining);

                        if (remaining > 0) {
                            timerRef.current = requestAnimationFrame(tick);
                        } else {
                            handleAnswer(null);
                        }
                    };
                    timerRef.current = requestAnimationFrame(tick);
                    
                    return () => cancelAnimationFrame(timerRef.current);
                }
            }, [gameState]);

            const handleAnswer = (option) => {
                cancelAnimationFrame(timerRef.current);
                const currentTimeLeft = timeLeftRef.current; 
                const isCorrect = option && option.id === questionData.answer.id;
                
                const timeBonus = isCorrect ? Math.floor(currentTimeLeft / 100) : 0;
                const points = isCorrect ? 100 : 0;
                
                setLastResult({ isCorrect, points, timeBonus });
                
                if (isCorrect) {
                    setScore(s => s + points + timeBonus);
                }

                setGameState('result');
                setTimeout(() => {
                    if (round >= MAX_ROUNDS) {
                        finishGame();
                    } else {
                        setRound(r => r + 1);
                        startNewRound();
                    }
                }, 2000); 
            };

            const finishGame = () => {
                setGameState('gameover');
                const formData = new FormData();
                formData.append('nickname', nickname);
                formData.append('score', score);

                fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            setMyRank(data.rank);
                            loadRanking();
                        }
                    })
                    .catch(e => console.error(e));
            };

            const handleHomeClick = () => {
                if (document.fullscreenElement) {
                    setGameState('start');
                } else {
                    window.location.href = '/';
                }
            };

            const currentLangObj = LANGUAGES.find(l => l.code === lang) || LANGUAGES[1];
            const fontClass = lang === 'ko' ? 'font-ko' : 'font-other';

            return (
                <div id="game-container" className={fontClass}>
                    {gameState === 'start' && (
                        <div className="absolute top-4 right-4 sm:top-5 sm:right-5 z-[99999]">
                            <button onClick={() => setIsModalOpen(true)} className="bg-white/90 border border-amber-900/20 rounded-full px-3 py-1.5 text-xs text-amber-900 shadow-sm flex items-center gap-2 hover:bg-white transition-colors">
                                <i className="fa-solid fa-globe"></i>
                                <img src={`https://flagcdn.com/w40/${currentLangObj.country}.png`} alt={currentLangObj.country} className="w-4 h-auto rounded-[2px]" />
                                <span className="font-bold uppercase">{currentLangObj.code}</span>
                                <i className="fa-solid fa-chevron-down text-[10px]"></i>
                            </button>
                        </div>
                    )}

                    {isModalOpen && <LanguageModal currentLang={lang} onSelect={changeLanguage} onClose={() => setIsModalOpen(false)} />}
                    
                    <div className={`lang-toast fixed bottom-6 right-6 bg-gray-800 border border-gray-700 shadow-lg rounded-xl p-4 flex items-center gap-3 z-[99999] ${toastInfo.show ? 'show' : ''}`}>
                        <div className="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center text-green-400">
                            <i className="fa-solid fa-check"></i>
                        </div>
                        <div>
                            <p className="text-sm font-medium text-white">{toastInfo.msg}</p>
                            <p className="text-xs text-gray-400">{toastInfo.name}</p>
                        </div>
                    </div>

                    {gameState === 'start' && (
                        <div className="flex flex-col items-center p-5 w-full h-full animate-pop overflow-y-auto pt-16">
                            <div className="flex justify-between w-full mb-3 flex-shrink-0 absolute top-4 left-4">
                                <span className="bg-white/90 border border-amber-900/20 rounded-full px-3 py-1.5 text-xs text-amber-900 shadow-sm font-bold flex items-center">{t(lang, 'siteName')}</span>
                            </div>
                            
                            <h1 className="text-3xl md:text-4xl text-amber-900 text-center mb-4 drop-shadow-sm flex items-center justify-center gap-3 flex-shrink-0">
                                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" className="w-14 h-14 object-contain" alt="Pikachu" />
                                <div className="leading-tight">{t(lang, 'gameTitle1')}<br/><span className="text-2xl text-amber-700">{t(lang, 'gameTitle2')}</span></div>
                            </h1>
                            
                            <div className="w-28 h-28 bg-white border-2 border-dashed border-amber-500 rounded-2xl flex items-center justify-center mb-4 relative shadow-sm overflow-hidden flex-shrink-0">
                                {qrUrl && <img src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${qrUrl}`} className="w-20 h-20 object-contain z-10" alt="QR Code" />}
                                <div className="absolute inset-0 bg-yellow-50 opacity-50"></div>
                            </div>
                            
                            <input 
                                type="text" 
                                className="w-full p-3 text-xl text-center border-2 border-amber-800 rounded-2xl mb-3 outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-200 transition-colors shadow-inner flex-shrink-0" 
                                placeholder={t(lang, 'nickname')}
                                value={nickname}
                                onChange={(e) => setNickname(e.target.value)}
                            />
                            
                            <button onClick={startGame} className="w-full p-3 text-2xl btn-main mb-3 font-bold tracking-wide flex-shrink-0">{t(lang, 'start')}</button>
                            <a href="/" target="_self" className="w-full py-2 text-lg bg-white/80 border-2 border-amber-900/60 text-amber-900 rounded-xl text-center mb-4 block font-bold shadow-sm flex-shrink-0" style={{textDecoration: 'none'}}>{t(lang, 'otherGames')}</a>
                            
                            <div className="w-full ranking-box flex-shrink-0 pt-3 pb-2 px-3 mb-6" style={{ height: '350px' }}>
                                <p className="text-center text-amber-900 mb-2 font-bold border-b border-amber-200 pb-2 flex-shrink-0">{t(lang, 'hof')}</p>
                                <div className="ranking-content flex-1 space-y-1">
                                    {ranking.length > 0 ? ranking.slice(0, 100).map((r, i) => (
                                        <div key={i} className="flex justify-between items-center py-2 border-b border-gray-100 hover:bg-amber-50 rounded px-1 transition-colors">
                                            <span className="text-base flex items-center gap-2">
                                                <span className={`w-6 text-center ${i < 3 ? 'text-lg' : 'text-sm text-gray-500'}`}>{i+1 === 1 ? '🥇' : i+1 === 2 ? '🥈' : i+1 === 3 ? '🥉' : i+1}</span>
                                                <span className="text-gray-800">{r.nickname}</span>
                                            </span>
                                            <span className="text-amber-700 font-bold">{r.score}</span>
                                        </div>
                                    )) : <p className="text-center text-gray-400 py-4 text-sm">{t(lang, 'loadingRank')}</p>}
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState === 'countdown' && (
                        <div className="flex items-center justify-center h-full bg-yellow-400">
                            <h2 key={countdown} className="text-[20vh] text-white drop-shadow-2xl animate-scaleFade">{countdown === 0 ? "GO!" : countdown}</h2>
                        </div>
                    )}

                    {(gameState === 'playing' || gameState === 'result') && (
                        <div className="flex flex-col h-full bg-slate-100">
                            <div className="bg-yellow-400 p-4 border-b-4 border-amber-900 flex justify-between items-center shadow-md">
                                <div className="bg-amber-900 text-white px-4 py-1 rounded-xl text-center min-w-[80px]">
                                    <p className="text-xs">{t(lang, 'timeLeft')}</p>
                                    <p className={`text-2xl ${timeLeft <= 3000 ? 'text-red-400 animate-pulse' : ''}`}>{(timeLeft / 1000).toFixed(2)}</p>
                                </div>
                                <div className="bg-white border-2 border-amber-900 px-6 py-1 rounded-xl text-center">
                                    <p className="text-xs text-amber-700">{t(lang, 'score')}</p>
                                    <p className="text-2xl text-amber-900">{score}</p>
                                </div>
                            </div>

                            <div className="flex-1 p-4 md:p-6 flex flex-col items-center justify-center relative">
                                {gameState === 'result' && (
                                    <div className="absolute inset-0 z-50 flex items-center justify-center bg-white/90 backdrop-blur-sm animate-pop">
                                        <div className="text-center px-6">
                                            <div className={`text-7xl mb-4 ${lastResult.isCorrect ? 'text-green-500' : 'text-red-500'}`}>
                                                {lastResult.isCorrect ? <i className="fa-solid fa-circle-check"></i> : <i className="fa-solid fa-circle-xmark"></i>}
                                            </div>
                                            <h3 className={`text-4xl md:text-5xl mb-2 ${lastResult.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                                                {lastResult.isCorrect ? t(lang, 'correct') : t(lang, 'wrong')}
                                            </h3>
                                            {lastResult.isCorrect ? (
                                                <div className="bg-white border-2 border-amber-200 rounded-2xl p-4 shadow-sm animate-slideUp">
                                                    <p className="text-xl text-gray-600">{t(lang, 'baseScore')} <span className="text-blue-500">+{lastResult.points}</span></p>
                                                    <p className="text-xl text-gray-600">{t(lang, 'timeBonus')} <span className="text-orange-500">+{lastResult.timeBonus}</span></p>
                                                    <p className="text-2xl md:text-3xl mt-2 text-amber-900 font-bold">{t(lang, 'totalPts', lastResult.points + lastResult.timeBonus)}</p>
                                                </div>
                                            ) : (
                                                <div className="bg-white border-2 border-red-100 rounded-2xl p-4 shadow-sm animate-slideUp">
                                                    <p className="text-lg md:text-xl text-gray-600">{t(lang, 'answerIs', questionData.answer.name)}</p>
                                                </div>
                                            )}
                                            <img src={questionData.answer.front} className="w-40 h-40 mx-auto mt-4 drop-shadow-lg" />
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white w-full rounded-2xl p-4 border-4 border-amber-900 text-center mb-4 shadow-sm flex items-center justify-center min-h-[80px]">
                                    <p className="dynamic-text">{questionData?.text}</p>
                                </div>

                                {questionData?.mainImage ? (
                                    <div className="w-44 h-44 md:w-56 md:h-56 bg-white rounded-full border-8 border-amber-400 flex items-center justify-center shadow-inner mb-6 overflow-hidden flex-shrink-0">
                                        {isLoading ? (
                                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-900"></div>
                                        ) : (
                                            <img src={questionData.mainImage} className={`w-36 h-36 md:w-44 md:h-44 object-contain ${questionData.isMainSilhouette ? 'silhouette' : ''}`} />
                                        )}
                                    </div>
                                ) : (
                                    <div className="h-4"></div>
                                )}

                                <div className="grid grid-cols-2 gap-3 w-full">
                                    {options.map((opt, idx) => {
                                        let content = null;
                                        let btnClass = "";
                                        
                                        if (questionData?.optionType === 'text') {
                                            content = <span className="truncate w-full block text-[1rem] md:text-xl">{opt.name}</span>;
                                            btnClass = "bg-white p-2 rounded-2xl border-4 border-amber-900 text-amber-900 btn-main h-16 flex items-center justify-center overflow-hidden w-full";
                                        } else {
                                            let imgSrc = opt.front;
                                            if (questionData?.optionType === 'back') imgSrc = opt.back;
                                            content = <img src={imgSrc} className={`h-full object-contain mx-auto ${questionData?.optionType === 'silhouette' ? 'silhouette' : 'drop-shadow-sm'}`} />;
                                            btnClass = "bg-white p-2 rounded-2xl border-4 border-amber-900 btn-main h-28 md:h-36 flex items-center justify-center overflow-hidden w-full";
                                        }

                                        return (
                                            <button 
                                                key={`${opt.id}-${idx}`} 
                                                onClick={() => handleAnswer(opt)}
                                                className={btnClass}
                                                disabled={gameState === 'result'}
                                            >
                                                {content}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="p-3 bg-amber-900 text-white text-center">
                                {t(lang, 'round')} {round} / {MAX_ROUNDS} 👑 {nickname}
                            </div>
                        </div>
                    )}

                    {gameState === 'gameover' && (
                        <div className="flex flex-col items-center p-6 md:p-8 h-full animate-pop overflow-y-auto">
                            <h2 className="text-4xl md:text-5xl text-amber-900 mb-2">{t(lang, 'complete')}</h2>
                            <div className="bg-white border-4 border-amber-900 rounded-3xl p-6 w-full text-center mb-6 shadow-lg">
                                <p className="text-gray-500 mb-1">{t(lang, 'finalScore', nickname)}</p>
                                <p className="text-6xl md:text-7xl text-amber-900 mb-4 font-bold">{score}</p>
                                <p className="text-xl md:text-2xl text-blue-600 bg-blue-50 py-2 rounded-xl border border-blue-200">
                                    {t(lang, 'rankMsg', myRank ? myRank : '?')}
                                </p>
                            </div>
                            <div className="w-full ranking-box p-4 mb-6">
                                <p className="text-center mb-2 font-bold">{t(lang, 'top3')}</p>
                                {ranking.slice(0, 3).map((r, i) => (
                                    <div key={i} className="flex justify-between py-1 border-b border-dashed">
                                        <span>{i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'} {r.nickname}</span>
                                        <span>{r.score}</span>
                                    </div>
                                ))}
                            </div>
                            <button onClick={startGame} className="w-full p-4 text-2xl md:text-3xl btn-main mb-3 font-bold">{t(lang, 'playAgain')}</button>
                            <button onClick={handleHomeClick} className="w-full p-4 text-2xl md:text-3xl bg-white border-4 border-amber-900 text-amber-900 rounded-3xl font-bold">{t(lang, 'home')}</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
