    <style>
        /* === 다국어 모달 관련 독립 CSS === */
        #langSelectorContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999 !important; /* 최고 수준으로 높임 */
            font-family: sans-serif; /* 모달 전용 폰트 */
        }
        #langModal, #toastNotification {
            z-index: 99999 !important;
        }
        /* 모달 박스 사이징 강제 보정 */
        #langModal, #langModal * {
            box-sizing: border-box !important;
        }
        /* 폰트어썸 이모지 깨짐 방지 처리 */
        .fa-solid, .fa-regular, .fa-brands {
            font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", sans-serif !important;
        }

        /* 커스텀 스크롤바 (모달 내부 스크롤용) */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* 모달 등장 애니메이션 */
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        /* 토스트 알림 애니메이션 */
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* 동적 폰트 조절용 클래스 */
        .dynamic-text { transition: font-size 0.2s ease; }

        /* === 기본 게임 설정 === */
        :root {
            --wood-dark: #3e2723;
            --wood-light: #5d4037;
            --wood-border: #281813;
            --ui-font: 'Do Hyeon', sans-serif;
            --title-font: 'Black Han Sans', sans-serif;
            --num-font: 'Verdana', 'Arial', sans-serif;
            
            --p1-color: #00f3ff;
            --p2-color: #ff007f;
            --p3-color: #39ff14;
            --p4-color: #ffaa00;
        }

        body {
            margin: 0; padding: 0;
            background: #000;
            overflow: hidden;
            font-family: var(--ui-font);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            color: white;
        }

        /* === 3D 게임 씬 === */
        #game-scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1000px;
            overflow: hidden;
            background: radial-gradient(circle at center, #2a2a2a 0%, #000000 100%);
            z-index: 1;
        }

        .fog {
            position: absolute; bottom: 0; width: 100%; height: 50%;
            background: linear-gradient(to top, rgba(10, 5, 0, 0.9), transparent);
            pointer-events: none; z-index: 10;
        }

        /* === 좀비 컨테이너 === */
        .zombie-container {
            position: absolute;
            bottom: 0; 
            transform-style: preserve-3d;
            will-change: transform, opacity;
            display: flex; flex-direction: column; align-items: center;
        }

        /* UI 위치 및 레이아웃 */
        .zombie-ui {
            position: absolute; 
            bottom: 285px; /* 기본(서 있을 때) 이마 높이 */
            display: flex; 
            flex-direction: column-reverse; /* 아래: 문제, 위: 카운트다운 */
            align-items: center;
            width: 250px; text-align: center;
            z-index: 200;
            transition: bottom 0.3s;
            pointer-events: none;
        }

        .zombie-container.low-pos .zombie-ui { bottom: 300px; }
        .zombie-container.lowest-pos .zombie-ui { bottom: 300px; }

        .math-bubble {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #fff;
            color: #fff;
            font-size: 32px; 
            font-family: var(--num-font);
            font-weight: bold;
            padding: 2px 12px;
            border-radius: 12px;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            transition: transform 0.1s;
            margin-bottom: 0px; 
        }
        .math-bubble.changed {
            transform: scale(1.5);
            background: #ff0000;
        }

        .danger-countdown {
            font-size: 26px; 
            color: #ff0000;
            font-weight: bold;
            text-shadow: 0 0 5px yellow;
            animation: pulse 0.5s infinite alternate;
            display: none; 
            margin-bottom: 5px;
        }
        @keyframes pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }

        /* === 좀비 스타일 === */
        .zombie {
            position: relative;
            width: 140px; height: 280px;
            animation: shamble 1.5s ease-in-out infinite alternate;
            transition: transform 0.3s;
        }

        .zombie-container {
            --skin: #7da35e;
            --clothes: #5d4037;
        }

        .head, .arm, .leg, .ear, .rip {
            background-color: var(--skin) !important;
            box-shadow: inset 5px 5px 15px rgba(0,0,0,0.3); 
            position: absolute;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .torso {
            background-color: var(--clothes) !important;
            position: absolute;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .part-hidden { visibility: hidden; opacity: 0; }

        .head {
            top: -10px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 95px;
            border-radius: 20px 20px 30px 25px;
            z-index: 5;
        }

        .hair-strand {
            position: absolute; background: #222; width: 2px; height: 15px;
            top: -10px; border-radius: 50%; transform-origin: bottom center;
        }
        .ear { top: 40px; width: 15px; height: 20px; border-radius: 50%; z-index: -1; }
        .ear.left { left: -5px; transform: rotate(-10deg); }
        .ear.right { right: -5px; transform: rotate(10deg); }

        .eye-socket {
            position: absolute; top: 35px; width: 26px; height: 26px;
            background: rgba(0,0,0,0.4); border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }
        .eye-socket.left { left: 10px; }
        .eye-socket.right { right: 10px; }

        .eye {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; border-radius: 50%; width: 20px; height: 20px;
            overflow: hidden; box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        .eye::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 30%, transparent 60%, rgba(255,0,0,0.2) 100%),
                        linear-gradient(45deg, transparent 45%, rgba(255,0,0,0.3) 50%, transparent 55%);
            opacity: 0.7;
        }
        .pupil {
            position: absolute; background: #000; border-radius: 50%;
            width: 5px; height: 5px; top: 7px; left: 7px;
            animation: crazyEye 3s infinite;
        }

        .nose {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            width: 12px; height: 8px;
        }
        .nostril {
            position: absolute; top: 0; width: 4px; height: 6px;
            background: #1a1a1a; border-radius: 50%;
        }
        .nostril.left { left: 0; transform: rotate(-10deg); }
        .nostril.right { right: 0; transform: rotate(10deg); }

        .mouth {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 12px; background: #2a1a1a;
            border-radius: 5px 5px 10px 10px; overflow: visible;
            animation: bite 2s infinite;
        }
        .tooth {
            position: absolute; top: 0; width: 6px; height: 7px;
            background: #ddd; border-radius: 2px 2px 4px 4px; border: 1px solid #aaa;
        }

        .torso {
            top: 80px; left: 50%; transform: translateX(-50%);
            width: 90px; height: 110px; border-radius: 15px 15px 10px 10px;
            z-index: 3; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .rip {
            position: absolute; background: var(--skin); border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

        .arm {
            top: 90px; width: 28px; height: 100px; border-radius: 10px;
            z-index: 4; transform-origin: top center;
        }
        .hand {
            position: absolute; bottom: -5px; left: 0; width: 100%; height: 20px;
            background: inherit; border-radius: 50%;
        }

        .leg {
            top: 175px; width: 32px; height: 100px; border-radius: 5px;
            z-index: 2; transform-origin: top center; background-color: #3e2723;
        }
        .leg-skin {
            position: absolute; bottom: 0; width: 100%; height: 20px; background: inherit;
        }
        .foot {
            position: absolute; bottom: -8px; width: 40px; height: 18px;
            background: #111; border-radius: 8px 10px 2px 2px;
        }
        .leg.left { left: 35px; animation: walkLeg 0.8s ease-in-out infinite alternate; }
        .leg.right { right: 35px; animation: walkLeg 0.8s ease-in-out infinite alternate-reverse; }

        .z1 .arm.left { transform: rotate(40deg); animation: armSwayLeft1 1.5s ease-in-out infinite alternate; left: 10px; }
        .z1 .arm.right { transform: rotate(-10deg); animation: armSwayRight1 2s ease-in-out infinite alternate; right: 10px; }
        .z1 .drool { position: absolute; top: 10px; right: 5px; width: 4px; height: 20px; background: rgba(200, 255, 100, 0.6); border-radius: 2px; animation: droolDrop 2s infinite; }
        .z1 .scar { position: absolute; top: 20px; left: 15px; width: 25px; height: 2px; background: #4a0000; transform: rotate(15deg); box-shadow: 0 1px 0 rgba(255,255,255,0.2); }

        .z2 .arm.left { transform: rotate(80deg); animation: armRaise2 2s ease-in-out infinite alternate; left: 10px; }
        .z2 .arm.right { transform: rotate(-75deg); animation: armRaise2 2.2s ease-in-out infinite alternate-reverse; right: 10px; }
        .z2 .head { border-top-left-radius: 10px; }
        .z2 .brain { position: absolute; top: -8px; left: 10px; width: 30px; height: 15px; background: #e57373; border-radius: 10px 10px 0 0; z-index: -1; box-shadow: inset -2px -2px 5px #b71c1c; }
        .z2 .eye.left { background: #ccc; }
        .z2 .eye.left .pupil { background: #aaa; width: 3px; height: 3px; animation: none; }
        .z2 .eye.right { width: 16px; height: 16px; top: 48%; }

        .z3 .arm.left { transform: rotate(5deg); animation: armDangle3 3s ease-in-out infinite alternate; left: 10px; }
        .z3 .arm.right { transform: rotate(-10deg); animation: armDangle3 2.5s ease-in-out infinite alternate-reverse; right: 10px; }
        .z3 .head { background-image: radial-gradient(circle at 20% 80%, rgba(0,0,0,0.2) 5px, transparent 6px), radial-gradient(circle at 80% 20%, rgba(0,0,0,0.2) 8px, transparent 9px); }
        .z3 .eye-socket.right { width: 32px; height: 32px; right: 6px; top: 32px; background: rgba(0,0,0,0.3); }
        .z3 .eye.right { width: 28px; height: 28px; box-shadow: 0 0 5px red; }
        .z3 .eye.right .pupil { width: 2px; height: 2px; }
        .z3 .mouth { background: #4a0000; width: 40px; border-radius: 10px; }
        .z3 .blood-stain { position: absolute; bottom: -5px; right: 10px; width: 15px; height: 15px; background: #8a0b0b; border-radius: 50%; filter: blur(2px); opacity: 0.8; }

        .zombie.crawling { animation: crawl 1.2s ease-in-out infinite alternate; }
        .zombie.rolling { animation: rollHead 0.8s linear infinite; }

        @keyframes shamble { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
        @keyframes crawl { 0% { transform: rotate(-10deg) translateY(0); } 100% { transform: rotate(10deg) translateY(5px); } }
        @keyframes rollHead { 
            0% { transform: rotate(0deg) translateY(0); } 
            25% { transform: rotate(10deg) translateY(-10px); }
            50% { transform: rotate(0deg) translateY(0); }
            75% { transform: rotate(-10deg) translateY(-10px); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        @keyframes walkLeg { 0% { transform: rotate(-20deg); } 100% { transform: rotate(20deg); } }
        @keyframes crazyEye { 0%,100% { transform: translate(0,0); } 20% { transform: translate(2px, -2px); } 60% { transform: translate(-2px, 2px); } }
        @keyframes bite { 0%, 100% { height: 12px; } 50% { height: 20px; } }
        @keyframes droolDrop { 0% { height: 10px; opacity: 0.8; } 50% { height: 25px; opacity: 0.6; } 100% { height: 10px; opacity: 0.8; } }
        
        @keyframes armSwayLeft1 { 0% { transform: rotate(30deg); } 100% { transform: rotate(50deg); } }
        @keyframes armSwayRight1 { 0% { transform: rotate(-5deg); } 100% { transform: rotate(-20deg); } }
        @keyframes armRaise2 { 0% { transform: rotate(70deg); } 100% { transform: rotate(85deg); } }
        @keyframes armDangle3 { 0% { transform: rotate(5deg); } 100% { transform: rotate(15deg); } }

        .hit-effect { animation: shake 0.2s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } 100% { transform: translateX(0); } }

        /* === 총알 이펙트 === */
        .bullet {
            position: absolute;
            width: 10px; height: 10px;
            background: #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #ffaa00;
            z-index: 500;
            pointer-events: none;
            transition: transform 0.6s linear;
        }

        /* === UI 레이아웃 === */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            z-index: 100; pointer-events: none; 
        }

        .top-bar {
            height: 100px;
            background: rgba(0,0,0,0); 
            border-bottom: none; 
            box-shadow: none; 
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; pointer-events: auto;
        }

        .wave-info { font-size: 30px; color: #ffaa00; text-shadow: 2px 2px 0 #000; font-family: var(--num-font); font-weight: bold; }
        
        .timer-box {
            background: rgba(0,0,0,0.5); border: 2px solid #666; padding: 5px 20px;
            border-radius: 10px; text-align: center;
        }
        .timer-label { font-size: 14px; color: #aaa; display: block; white-space: nowrap; }
        .timer-val { font-size: 40px; font-family: var(--num-font); color: #00f3ff; font-weight: bold; }

        .life-box { font-size: 40px; letter-spacing: 5px; text-shadow: 2px 2px 0 #000; }

        .bottom-controls {
            margin-top: auto;
            height: 280px;
            background: linear-gradient(0deg, #1a0f0a, #3e2723);
            border-top: 5px solid #1a0f0a;
            display: flex; pointer-events: auto;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        .player-panel {
            flex: 1; border-right: 2px solid rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; padding: 10px;
            position: relative;
        }
        
        .player-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0V0zm20 20h20v20H20V20zM0 20h20v20H0V20z' fill='%235d4037' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.3; pointer-events: none;
        }

        .p1 { border-top: 5px solid var(--p1-color); } .p1 .score { color: var(--p1-color); }
        .p2 { border-top: 5px solid var(--p2-color); } .p2 .score { color: var(--p2-color); }
        .p3 { border-top: 5px solid var(--p3-color); } .p3 .score { color: var(--p3-color); }
        .p4 { border-top: 5px solid var(--p4-color); } .p4 .score { color: var(--p4-color); }

        .score-display { 
            width: 180px; display: flex; justify-content: space-between; font-size: 20px; 
            margin-bottom: 5px; font-weight: bold; text-shadow: 1px 1px 2px black; z-index: 1;
            flex-shrink: 0;
        }
        .score { font-family: var(--num-font); }
        
        .input-screen {
            width: 180px; height: 40px;
            background: #111; border: 2px solid #555;
            border-radius: 5px; margin-bottom: 8px;
            color: white; font-size: 28px; text-align: center; line-height: 36px;
            font-family: var(--num-font); font-weight: bold;
            box-shadow: inset 0 2px 5px #000; z-index: 1;
            flex-shrink: 0;
        }

        .keypad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
            width: 180px; 
            height: 160px;
            min-height: 160px;
            z-index: 1;
            flex-shrink: 0;
        }

        .key {
            background: linear-gradient(145deg, #4e342e, #3e2723);
            border: 1px solid #281813;
            border-radius: 6px;
            color: #d7ccc8; font-size: 24px; font-weight: bold;
            font-family: var(--num-font);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 0 #1a0f0a;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .key:active { transform: translateY(4px); box-shadow: 0 0 0 #1a0f0a; background: #5d4037; }
        .key-enter { grid-column: 3; background: linear-gradient(145deg, #8d6e63, #6d4c41); color: white; }
        .key-clear { background: #3e2723; color: #ff5555; }

        /* === 오버레이 === */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        .hidden { display: none !important; }

        .top-link {
            font-size: 20px; color: #4fc3f7; text-decoration: none; margin-bottom: 5px;
        }
        .top-link:hover { text-decoration: underline; color: #fff; }

        .game-title {
            font-family: 'Black Han Sans'; font-size: 80px;
            background: linear-gradient(to bottom, #ff0000, #550000);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
            margin-bottom: 5px;
            text-align: center;
            line-height: 1.1;
        }
        
        .game-intro {
            font-size: 24px; color: #ccc; margin-bottom: 25px; text-align: center; padding: 0 20px;
        }

        .btn-group { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 15px 40px; font-size: 24px; font-family: var(--ui-font);
            border: none; border-radius: 10px; cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
            white-space: nowrap;
        }
        .btn-start { background: #8a0b0b; color: white; }
        .btn-start:hover { background: #ff1111; transform: scale(1.1); }
        .btn-diff { background: #333; color: #aaa; border: 2px solid #555; }
        .btn-diff.selected { border-color: #ff0000; color: white; background: #550000; }
        
        .other-game-link {
            margin-top: 30px; font-size: 22px; color: #ffeb3b; text-decoration: none;
            border: 1px solid #ffeb3b; padding: 10px 20px; border-radius: 30px;
            transition: background 0.2s, color 0.2s;
        }
        .other-game-link:hover { background: #ffeb3b; color: #000; }

        .floating-text {
            position: absolute; font-size: 40px; font-weight: bold;
            font-family: var(--num-font);
            text-shadow: 2px 2px 0 #000; pointer-events: none;
            animation: floatUp 1s forwards; z-index: 600; 
        }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }

        .level-popup {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-family: 'Black Han Sans', sans-serif;

        .ambulance-move-l { animation: driveRight 5s linear forwards; }
        .flip-h { transform: scaleX(-1); }

        @keyframes driveRight { from { left: -10%; } to { left: 110%; } }
        @keyframes driveLeft { from { left: 110%; } to { left: -10%; } }

        .bomb-move { animation: flyBomb 6s linear forwards; }

        @keyframes flyBomb { 
            0% { bottom: 0%; transform: scale(1); }

    const AudioContext = window.AudioContext || window.webkitAudioContext;

    function playTone(freq, type, duration, vol = 0.1) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const MATH_SETTINGS = {
        generate: function(diff, wave) {
            let pType = 1;
            if (diff === 'easy') {
                if (Math.random() < 0.1 * wave) pType = 1; 
                else pType = 1;
            } 
            else if (diff === 'normal') {
                let tier2Chance = 0.1 * wave; 
                if (Math.random() < tier2Chance) pType = 2;
                else pType = 1;
            } 
            else { 
                let tier3Chance = 0.1 * wave;
                let tier2Chance = 0.3 + (0.1 * wave);
                const r = Math.random();
                if (r < tier3Chance) pType = 3;
                else if (r < tier2Chance) pType = 2;
                else pType = 1;
            }
            if (pType === 1) return PROBLEMS.tier1();
            if (pType === 2) return PROBLEMS.tier2();
            return PROBLEMS.tier3();
        }
    };

        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }

        container.className = 'special-container';
        
        const direction = Math.random() > 0.5 ? 'R' : 'L';
        
        if (direction === 'R') {
            container.classList.add('ambulance-move-r');
            container.innerHTML = `
                <div class="special-bubble ambulance-bubble">${prob.text}</div>
                <div class="special-emoji">🚑</div>
            `;
        } else {
            container.classList.add('ambulance-move-l');
            container.innerHTML = `
                <div class="special-bubble ambulance-bubble">${prob.text}</div>
                <div class="special-emoji flip-h">🚑</div>
            `;
        }
        
        container.style.top = (10 + Math.random() * 30) + '%';
        
        document.getElementById('game-scene').appendChild(container);

        const obj = {
            id: id,
            type: 'ambulance',
            el: container,
            answer: prob.ans,
            active: true
        };
        gameState.specials.push(obj);

        setTimeout(() => {
            if(obj.active) {
                removeSpecial(id);
            }
        }, 5000);
    }

    // 폭탄 생성
    function spawnBomb() {
        const id = gameState.nextSpecialId++;
        const prob = MATH_SETTINGS.generate(gameState.difficulty, gameState.wave);
        
        const container = document.createElement('div');
        container.className = 'special-container bomb-move';
        
        container.innerHTML = `
            <div class="special-bubble bomb-bubble">${prob.text}</div>
            <div class="special-emoji">💣</div>
        `;
        
        container.style.left = (20 + Math.random() * 60) + '%';
        
        document.getElementById('game-scene').appendChild(container);

        const obj = {
            id: id,
            type: 'bomb',
            el: container,
            answer: prob.ans,
            active: true
        };
        gameState.specials.push(obj);

        setTimeout(() => {
            if(obj.active) {
                removeSpecial(id);
            }
        }, 6000);
    }

    function removeSpecial(id) {
        const idx = gameState.specials.findIndex(s => s.id === id);
        if(idx !== -1) {
            gameState.specials[idx].active = false;
            if(gameState.specials[idx].el) gameState.specials[idx].el.remove();
            gameState.specials.splice(idx, 1);
        }
    }

    function applyHeal(x, y) {
        gameState.hearts++;
        updateHeartUI();
        showFloatingText(x, y, "♥", "red");
        showLevelPopup(TRANSLATIONS[currentLang].healed);
        sndHeal();
    }

    function applyNuke(x, y) {
        sndBomb();
        showLevelPopup(TRANSLATIONS[currentLang].nuked);
        
        gameState.zombies.forEach(z => {
            z.el.remove();
        });
        gameState.zombies = [];
    }

    // === 게임 루프 ===
    function gameLoop(timestamp) {
        if(!gameState.active) return;

        let currentCount = gameState.zombies.length;
        let forceSpawn = currentCount < 4;
        let timeToSpawn = timestamp - gameState.lastSpawnTime > gameState.spawnRate;

        if(forceSpawn || (timeToSpawn && currentCount < 7)) {
            if (forceSpawn && (timestamp - gameState.lastSpawnTime < 300)) {
                // 대기
            } else {
                spawnZombie();
                gameState.spawnRate = Math.max(800, 2500 - (gameState.wave * 100)); 
                gameState.lastSpawnTime = timestamp;
            }
        }

        const settings = DIFFICULTY_SETTINGS[gameState.difficulty];
        const baseSpeed = settings.speedBase + (gameState.wave * settings.speedInc);

        gameState.zombies.forEach((z, index) => {
            const currentSpeed = baseSpeed * z.speedMultiplier;
            z.progress += currentSpeed;

            const scale = 0.6 + (z.progress / 100) * 0.9;
            
            let baseY = 70 - (z.progress * 0.55);
            let finalBottom = baseY + z.yOffset;
            
            const wobble = Math.sin(timestamp / 500 + z.id) * 20;

            z.el.style.transform = `translateX(-50%) translate3d(${wobble}px, 0, 0) scale(${scale})`;
            z.el.style.bottom = `${finalBottom}%`;
            z.el.style.zIndex = Math.floor(z.progress);

            const remainingDist = 130 - z.progress;
            const framesLeft = remainingDist / currentSpeed;
            const secondsLeft = Math.ceil(framesLeft / 60);

            const countdownEl = z.el.querySelector('.danger-countdown');
            if(secondsLeft <= 5 && secondsLeft > 0) {
                countdownEl.style.display = 'block';
                countdownEl.innerText = `${secondsLeft}${TRANSLATIONS[currentLang].sec_left}`;
                
                if (z.lastWarningSec !== secondsLeft) {
                    sndWarning();
                    z.lastWarningSec = secondsLeft;
                }
            } else {
                countdownEl.style.display = 'none';
            }

            if(z.progress >= 130) {
                removeZombie(index);
                gameState.hearts--;
                sndHit(); 
                updateHeartUI();
                showFloatingText(window.innerWidth/2, window.innerHeight/2, TRANSLATIONS[currentLang].damaged, "red");
                document.body.style.boxShadow = "inset 0 0 100px red";
                setTimeout(() => document.body.style.boxShadow = "none", 200);

                if(gameState.hearts <= 0) endGame();
            }
        });

        loopId = requestAnimationFrame(gameLoop);
    }

    function getZombieTemplate(type) {
        const commonTorso = `
            <div class="torso">
                <div class="rip" style="top:20px; left:10px; width:20px; height:20px;"></div>
                <div class="rip" style="bottom:20px; right:15px; width:15px; height:15px;"></div>
            </div>`;
        const commonLimbs = `
            <div class="arm left"><div class="hand"></div></div>
            <div class="arm right"><div class="hand"></div></div>
            <div class="leg left"><div class="leg-skin"></div><div class="foot"></div></div>
            <div class="leg right"><div class="leg-skin"></div><div class="foot"></div></div>`;

        if (type === 'z1') {
            return `
                <div class="head">
                    <div class="hair-strand" style="left:20px; transform:rotate(-20deg);"></div>
                    <div class="hair-strand" style="left:40px; top:-15px;"></div>
                    <div class="hair-strand" style="left:60px; transform:rotate(20deg);"></div>
                    <div class="scar"></div>
                    <div class="ear left"></div><div class="ear right"></div>
                    <div class="eye-socket left"><div class="eye"><div class="pupil"></div></div></div>
                    <div class="eye-socket right"><div class="eye"><div class="pupil"></div></div></div>
                    <div class="nose"><div class="nostril left"></div><div class="nostril right"></div></div>
                    <div class="mouth">
                        <div class="tooth" style="left:5px;"></div>
                        <div class="tooth" style="left:15px; top:2px;"></div>
                        <div class="tooth" style="right:5px;"></div>
                        <div class="drool"></div>
                    </div>
                </div>
                ${commonTorso}
                ${commonLimbs}
            `;
        } else if (type === 'z2') {
            return `
                <div class="head">
                    <div class="brain"></div>
                    <div class="ear left"></div><div class="ear right"></div>
                    <div class="eye-socket left"><div class="eye left"><div class="pupil"></div></div></div>
                    <div class="eye-socket right"><div class="eye right"><div class="pupil"></div></div></div>
                    <div class="nose"><div class="nostril left"></div><div class="nostril right"></div></div>
                    <div class="mouth">
                        <div class="tooth" style="left:8px; height:4px;"></div>
                        <div class="tooth" style="left:20px; background:gold;"></div>
                    </div>
                </div>
                ${commonTorso}
                ${commonLimbs}
            `;
        } else {
            return `
                <div class="head">
                    <div class="ear left"></div><div class="ear right"></div>
                    <div class="eye-socket left"><div class="eye"><div class="pupil"></div></div></div>
                    <div class="eye-socket right"><div class="eye right"><div class="pupil"></div></div></div>
                    <div class="nose"><div class="nostril left"></div><div class="nostril right"></div></div>
                    <div class="mouth">
                        <div class="tooth" style="left:3px; transform:rotate(-10deg);"></div>
                        <div class="tooth" style="left:14px; top:3px;"></div>
                        <div class="tooth" style="right:5px; height:4px;"></div>
                        <div class="blood-stain"></div>
                    </div>
                    <div class="blood-stain" style="top:70px; left:10px; width:20px; height:30px; border-radius:30%;"></div>
                </div>
                ${commonTorso}
                ${commonLimbs}
            `;
        }
    }

    function spawnZombie() {
        const id = gameState.nextZombieId++;
        
        const prob = MATH_SETTINGS.generate(gameState.difficulty, gameState.wave);
        const stats = ZOMBIE_SPAWN_SETTINGS.getHpAndSpeed(gameState.difficulty, gameState.wave);
        
        const types = ['z1', 'z2', 'z3'];
        const randomType = types[Math.floor(Math.random() * types.length)];
        const palette = ZOMBIE_COLORS[Math.floor(Math.random() * ZOMBIE_COLORS.length)];

        const container = document.createElement('div');
        container.className = 'zombie-container';
        container.style.setProperty('--skin', palette.skin);
        container.style.setProperty('--clothes', palette.clothes);

        container.innerHTML = `
            <div class="zombie-ui">
                <div class="danger-countdown"></div>
                <div class="math-bubble">${prob.text}</div>
            </div>
            <div class="zombie ${randomType}">
                ${getZombieTemplate(randomType)}
            </div>
        `;
        
        const leftPos = 10 + Math.random() * 80;
        container.style.left = leftPos + '%';
        
        document.getElementById('game-scene').appendChild(container);

        const limbOrder = shuffle(['.arm.left', '.arm.right', '.leg.left', '.leg.right']);

        const zombieObj = {
            id: id,
            el: container,
            hp: stats.hp,
            maxHp: stats.hp, 
            answer: prob.ans,
            progress: 0,
            limbOrder: limbOrder, 
            yOffset: 0,
            lastWarningSec: 0,
            speedMultiplier: stats.speedMult
        };

        updateZombieAppearance(zombieObj);
        gameState.zombies.push(zombieObj);
    }

    function updateZombieAppearance(z) {
        const zombieEl = z.el.querySelector('.zombie');
        
        z.el.querySelectorAll('.arm, .leg, .torso').forEach(el => el.classList.remove('part-hidden'));
        zombieEl.classList.remove('crawling', 'rolling');
        z.el.classList.remove('low-pos', 'lowest-pos');

        const partsToHide = 6 - z.hp;

        for(let i=0; i < Math.min(partsToHide, 4); i++) {
            const selector = z.limbOrder[i];
            const part = z.el.querySelector(selector);
            if(part) part.classList.add('part-hidden');
        }

        if(partsToHide >= 5) {
            z.el.querySelector('.torso').classList.add('part-hidden');
        }

        let legsGoneCount = 0;
        if(z.el.querySelector('.leg.left').classList.contains('part-hidden')) legsGoneCount++;
        if(z.el.querySelector('.leg.right').classList.contains('part-hidden')) legsGoneCount++;

        z.yOffset = 0; 

        if (z.hp === 1) {
            zombieEl.classList.add('rolling');
            z.el.classList.add('lowest-pos');
            z.yOffset = -5; 
        } else if (z.hp === 2) {
            zombieEl.classList.add('crawling');
            z.el.classList.add('low-pos');
            z.yOffset = -6;
        } else {
            if (legsGoneCount === 2) {
                zombieEl.classList.add('crawling');
                z.el.classList.add('low-pos');
                z.yOffset = -6;
            }
        }
    }

    function removeZombie(index) {
        const z = gameState.zombies[index];
        z.el.remove();
        gameState.zombies.splice(index, 1);
    }

    // === 입력 및 정답 처리 ===
    function handleInput(playerId, value) {
        if(!gameState.active) return;
        const p = players[playerId-1];

        if(value === 'C') {
            p.input = "";
        } else if(value === 'E') {
            if(p.input !== "") {
                checkAnswer(p);
                p.input = "";
            }
        } else {
            if(p.input.length < 3) p.input += value;
        }
        updatePlayerUI(playerId);
    }

    function shootBullet(playerId, targetEl, callback) {
        const startEl = document.getElementById(`p${playerId}-pad`);
        const rectStart = startEl.getBoundingClientRect();
        
        const bullet = document.createElement('div');
        bullet.className = 'bullet';
        
        const startX = rectStart.left + (rectStart.width / 2);
        const startY = rectStart.top; 

        bullet.style.left = startX + 'px';
        bullet.style.top = startY + 'px';
        
        document.body.appendChild(bullet);

        requestAnimationFrame(() => {
            const headEl = targetEl.querySelector('.head');
            const targetRect = headEl ? headEl.getBoundingClientRect() : targetEl.getBoundingClientRect();

            const targetX = targetRect.left + targetRect.width/2;
            const targetY = targetRect.top + targetRect.height/2; 
            
            const distX = targetX - startX;
            const distY = targetY - startY;

            bullet.style.transform = `translate(${distX}px, ${distY}px)`;
        });

        setTimeout(() => {
            bullet.remove();
            if(callback) callback();
        }, 600);
    }

    function checkAnswer(player) {
        const ans = parseInt(player.input);
        
        // 1. 이벤트 아이템 먼저 확인
        const specialTarget = gameState.specials.find(s => s.answer === ans && s.active);
        
        if (specialTarget) {
            sndShoot();
            shootBullet(player.id, specialTarget.el, () => {
                if (!specialTarget.active) return;
                
                const rect = specialTarget.el.getBoundingClientRect();
                const textX = rect.left + rect.width / 2;
                const textY = rect.top;

                if (specialTarget.type === 'ambulance') {
                    applyHeal(textX, textY);
                } else if (specialTarget.type === 'bomb') {
                    applyNuke(textX, textY);
                }
                
                removeSpecial(specialTarget.id);
                player.score += 50;
                updatePlayerUI(player.id);
            });
            return;
        }

        // 2. 좀비 확인
        const targets = gameState.zombies.filter(z => z.answer === ans).sort((a,b) => b.progress - a.progress);

        if(targets.length > 0) {
            const z = targets[0];
            sndShoot(); 
            shootBullet(player.id, z.el, () => {
                const currentZombie = gameState.zombies.find(item => item.id === z.id);
                if (!currentZombie) return;

                z.hp--;
                sndHit(); 
                
                const zombieBody = z.el.querySelector('.zombie');
                zombieBody.classList.remove('hit-effect');
                void zombieBody.offsetWidth;
                zombieBody.classList.add('hit-effect');

                updateZombieAppearance(z);

                player.score += 10;
                
                const rect = z.el.getBoundingClientRect();
                const textX = (rect.left + rect.width / 2)-40 ;
                const textY = rect.top; 
                showFloatingText(textX, textY, "HIT!", players[player.id-1].color || '#fff');

                if(z.hp <= 0) {
                    player.score += (z.maxHp * 10); 
                    showFloatingText(textX, textY - 50, "KILL!", "red");
                    
                    const idx = gameState.zombies.findIndex(item => item.id === z.id);
                    if(idx !== -1) removeZombie(idx);
                } else {
                    const newProb = MATH_SETTINGS.generate(gameState.difficulty, gameState.wave);
                    z.answer = newProb.ans;
                    const bubble = z.el.querySelector('.math-bubble');
                    bubble.innerText = newProb.text;
                    
                    bubble.classList.add('changed');
                    setTimeout(()=> bubble.classList.remove('changed'), 200);
                }
                updatePlayerUI(player.id);
            }); 

        } else {
            sndWrong(); 
        }
    }

    function updatePlayerUI(id) {
        const p = players[id-1];
        document.getElementById(`p${id}-input`).innerText = p.input;
        document.getElementById(`p${id}-score`).innerText = p.score;
    }

    function updateHeartUI() {
        let h = "";
        for(let i=0; i<gameState.hearts; i++) h += "♥";
        document.getElementById('heart-display').innerText = h;
        document.getElementById('heart-display').style.color = gameState.hearts <= 1 ? "red" : "white";
    }
    
    function updateWaveUI() {
        const prefix = TRANSLATIONS[currentLang].wave_prefix;
        document.getElementById('wave-display').innerText = `${prefix}${gameState.wave}`;
    }

    function showFloatingText(x, y, text, color) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = (x) + 'px'; 
        el.style.top = (y) + 'px';
        el.style.transform = 'translate(-50%, -50%)'; 
        el.style.color = color;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function showLevelPopup(text) {
        sndLevelUp(); 

        const el = document.createElement('div');
        el.className = 'level-popup dynamic-text';
        el.innerText = text;
        document.body.appendChild(el);

        setTimeout(() => {
            el.remove();
        }, 2000);
    }

    function endGame() {
        sndGameOver();
        gameState.active = false;
        clearInterval(timerId);
        clearTimeout(eventTimerId);
        cancelAnimationFrame(loopId);
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-time').innerText = document.getElementById('timer-display').innerText;
    }

    // ★ 홈 이모지 전체 화면 지체 없이 첫화면 가는 소스 완벽 적용
    document.getElementById('btn-home').addEventListener('pointerdown', (e) => {
        // 1. 만약 전체 화면 모드라면
        if (document.fullscreenElement) {
            // 새로고침 대신 화면 초기화 로직 실행 (전체 화면 유지)
            gameState.active = false;
            clearInterval(timerId);
            clearTimeout(eventTimerId);
            cancelAnimationFrame(loopId);
            
            document.getElementById('langSelectorContainer').style.display = 'block'; // 언어 선택기 부활
            
            // 기존 오브젝트 삭제
            gameState.zombies.forEach(z => z.el.remove());
            gameState.specials.forEach(s => s.el.remove());
            gameState.zombies = [];
            gameState.specials = [];
            
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('timer-display').innerText = "00:00";
            
            if(window.playSound) window.playSound('click');
        } else {
            // 2. 전체 화면이 아니라면 그냥 새로고침
            location.reload();
        }
    });

    document.getElementById('btn-fullscreen').addEventListener('pointerdown', toggleFullScreen);

    initKeypads();

</script>
</body>
