    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Fredoka+One&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #fdfbf7;
            --primary-color: #ef4444;
            --deep-color: #b91c1c;
            --accent-color: #eab308;
            --text-color: #334155;
            
            --color-plastic: #eab308; 
            --color-paper: #3b82f6;   
            --color-glass: #22c55e;   
            --color-can: #a855f7;     
            --color-general: #ef4444; 
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; font-weight: normal !important; }
        i[class^="fa-"], .fa-solid, .fa-regular { font-family: "Font Awesome 6 Free" !important; font-weight: 900 !important; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Jua', 'Fredoka One', sans-serif;
            height: 100vh; height: 100dvh; 
            display: flex; justify-content: center;
            overflow: hidden; color: var(--text-color);
        }
        body.font-other { font-family: 'Noto Sans KR', sans-serif; }

        #game-container {
            width: 100%; max-width: 600px; height: 100%;
            background: var(--bg-color); position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
        }

        .hidden { display: none !important; }
        .center { text-align: center; }
        button { cursor: pointer; border: none; font-family: inherit; transition: transform 0.1s; outline: none;}
        button:active { transform: scale(0.95); }

        /* --- 1. 시작 화면 --- */
        #start-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            padding-top: 2vh; padding-bottom: 5vh;
            background: linear-gradient(180deg, #fefce8 0%, #fff 100%);
            overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 10; touch-action: pan-y; 
        }
        #start-screen::-webkit-scrollbar { width: 8px; }
        #start-screen::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        #top-nav {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 0 20px; margin-bottom: 1vh; flex-shrink: 0; z-index: 50;
        }
        #kingsmath-link-btn, #langTriggerBtn {
            font-size: 2.2vh; color: var(--deep-color); text-decoration: none;
            background: #fff; padding: 5px 15px; border: 2px dashed var(--primary-color);
            border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        #langTriggerBtn { display: flex; align-items: center; gap: 6px; }

        .main-title { 
            font-size: 7vh; color: var(--primary-color); margin: 1vh 0; 
            text-shadow: 3px 3px 0px #fca5a5; line-height: 1.1; text-align: center; flex-shrink: 0;
        }
        .title-mobile { font-size: 40%; vertical-align: middle; color: var(--deep-color); }
        
        #qr-area { margin: 2vh 0; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
        #qrcode { padding: 10px; background: white; border: 2px dashed var(--primary-color); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .qr-help { font-size: 1.8vh; margin-top: 5px; color: #94a3b8; }
        #qr-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; display: none; justify-content: center; align-items: center; }
        #qr-modal img { width: 90vw; height: 90vw; max-width: 500px; max-height: 500px; border: 10px solid #fff; object-fit: contain; background: #fff; }

        .input-guide { font-size: 2.5vh; color: #0369a1; margin-bottom: 1vh; animation: bounce 2s infinite; text-align: center; flex-shrink: 0; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-5px);} 60% {transform: translateY(-3px);} }

        input#nickname { width: 85%; padding: 2vh; font-size: 5.5vh; text-align: center; border: 4px dashed var(--primary-color); border-radius: 30px; font-family: inherit; margin-bottom: 2vh; color: var(--deep-color); background-color: #fff; flex-shrink: 0; }
        input#nickname:focus { outline: none; border-style: solid; }

        .btn-start { width: 85%; padding: 1.5vh; font-size: 4.5vh; background-color: var(--primary-color); color: white; border: 3px dashed rgba(255,255,255,0.5); border-radius: 30px; box-shadow: 0 0.6vh var(--deep-color); margin-bottom: 1.5vh; flex-shrink: 0; }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0.2vh var(--deep-color); }

        .btn-link { width: 85%; padding: 1.2vh; font-size: 3vh; background-color: #3b82f6; color: white; border: 2px dashed rgba(255,255,255,0.5); border-radius: 25px; box-shadow: 0 0.5vh #1d4ed8; margin-bottom: 2vh; text-decoration: none; display: inline-block; text-align: center; flex-shrink: 0; }
        .btn-link:active { transform: translateY(4px); box-shadow: 0 0.2vh #1d4ed8; }

        #ranking-board { margin-top: 1vh; width: 90%; background: #fff; border: 3px dashed #cbd5e1; border-radius: 15px; padding: 1vh; max-height: 30vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; flex-shrink: 0; margin-bottom: 2vh; }
        #ranking-board * { touch-action: pan-y; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8vh 0.5vh; border-bottom: 1px dashed #f1f5f9; font-size: 2.2vh; }

        /* --- 2. 게임 화면 --- */
        #game-screen { flex: 1; display: flex; flex-direction: column; background-color: #0f172a; position: relative; overflow: hidden; width: 100%; }
        #game-header { background-color: #1e293b; display: flex; flex-direction: column; padding: 10px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 20; gap: 8px; border-bottom: 2px solid #334155; }
        .header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .control-btn { font-size: 3vh; background: none; border: none; cursor: pointer; padding: 5px; color: white; }
        .stat-box { background: #334155; padding: 5px 12px; border-radius: 8px; display: flex; align-items: center; border: 2px solid #475569; width: 45%; justify-content: space-between; }
        .stat-label { font-size: 2.5vh; color: #94a3b8; margin-right: 5px; }
        .stat-val { font-size: 3.5vh; color: #fff; }
        #timer-box { background: #1e293b; }
        .timer-warning { color: #f87171 !important; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        #game-board { flex: 1; position: relative; overflow: hidden; width: 100%; display: flex; flex-direction: column; background: #0f172a; touch-action: none; }
        
        .spawn-zone { flex: 1; position: relative; width: 100%; }
        
        .bins-zone { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            width: 100%; height: 20vh; background: rgba(0,0,0,0.5); 
            border-top: 3px solid rgba(255,255,255,0.2); padding-bottom: 2vh;
            z-index: 10;
        }

        /* 💡 핵심 수정됨: min-width: 0 을 추가해 화면이 밀려나가는 현상을 완벽히 차단! */
        .bin-slot {
            flex: 1; /* 화면 너비를 정확히 5등분 */
            min-width: 0; /* 👈 이 코드가 없으면 통 크기 140px * 5개 때문에 화면 밖으로 밀려남 */
            display: flex; justify-content: center; align-items: flex-end;
            height: 100%;
        }

        #trash-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .trash-item {
            position: absolute; width: 80px; height: 80px; 
            border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; touch-action: none;
        }
        .trash-item .emoji { font-size: 70px; line-height: 1; }
        .dragging { transform: scale(1.3); opacity: 0.9; z-index: 200; }

        .feedback-text { position: absolute; font-size: 4vh; pointer-events: none; animation: floatUpText forwards; z-index: 300; text-shadow: 0 2px 5px rgba(0,0,0,0.8); text-align: center; font-weight: bold !important; }
        @keyframes floatUpText { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        #game-footer { height: 8vh; background: #1e293b; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #eee; border-top: 2px solid #334155; z-index: 20; gap: 2px; }
        #ingame-guide { font-size: 2.2vh; color: var(--accent-color); animation: bounce 2s infinite; font-weight: bold !important; }
        #ingame-nickname { font-size: 3vh; color: #bae6fd; font-weight: bold !important; }

        #countdown-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 500; display: flex; justify-content: center; align-items: center; }
        #countdown-text { font-size: 15vh; color: var(--accent-color); text-shadow: 0 0 20px #f87171; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-weight: bold !important; }
        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .bin-wrapper { 
            position: relative; display: flex; flex-direction: column; align-items: center; 
            width: 140px; height: 150px; 
            transform-origin: bottom center; 
            flex-shrink: 0; 
        }
        .trash-container { position: relative; width: 100%; height: 100%; }
        .trash-container::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 85%; height: 15px; background: rgba(0, 0, 0, 0.5); border-radius: 50%; filter: blur(4px); z-index: -1; }
        .back-lip { position: absolute; top: -10px; left: 4%; width: 92%; height: 25px; background: #1e293b; border-radius: 12px 12px 0 0; z-index: 1; }
        .front-body { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px 10px 30px 30px; border: 2px solid #475569; box-sizing: border-box; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), inset 5px 5px 10px rgba(255,255,255,0.3); z-index: 3; display: flex; flex-direction: column; align-items: center; }
        
        .face { margin-top: 35px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .eyes { display: flex; gap: 30px; }
        .eye { width: 14px; height: 14px; background: #1e293b; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; }
        .pupil { width: 5px; height: 5px; background: #fff; border-radius: 50%; position: absolute; transition: transform 0.05s linear; }
        .mouth { width: 22px; height: 10px; border: 3px solid #1e293b; border-top: none; border-radius: 0 0 15px 15px; transition: all 0.2s; }
        .mouth.open { height: 22px; border-top: 3px solid #1e293b; border-radius: 50%; background: #ef4444; }
        .lines { display: flex; gap: 20px; margin-top: 10px; }
        .lines span { width: 4px; height: 20px; background: rgba(0,0,0, 0.2); border-radius: 2px; }
        
        .bin-category-label { 
            position: absolute; bottom: -8px; 
            font-size: 38px; color: #ffffff; 
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; 
            padding: 6px 14px; border-radius: 10px; border: 4px solid white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); white-space: nowrap; z-index: 10; 
            font-family: 'Noto Sans KR', sans-serif; font-weight: 900 !important; 
        }
        
        .lid-wrapper { position: absolute; top: -14px; left: -3%; width: 106%; height: 24px; transform-origin: calc(100% - 4px) calc(100% - 2px); z-index: 4; transition: transform 0.15s ease-out; }
        .lid { width: 100%; height: 100%; border-radius: 12px 12px 4px 4px; border: 2px solid #475569; box-sizing: border-box; box-shadow: inset 0 2px 5px rgba(255,255,255,0.5), 0 4px 6px rgba(0,0,0,0.3); }
        .handle { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 50px; height: 12px; background: #cbd5e1; border: 2px solid #475569; border-bottom: none; border-radius: 6px 6px 0 0; box-sizing: border-box; }

        .bin-plastic .front-body { background: linear-gradient(135deg, #fef08a, var(--color-plastic)); } .bin-plastic .lid { background: #fef08a; }
        .bin-paper .front-body { background: linear-gradient(135deg, #bfdbfe, var(--color-paper)); } .bin-paper .lid { background: #bfdbfe; }
        .bin-glass .front-body { background: linear-gradient(135deg, #bbf7d0, var(--color-glass)); } .bin-glass .lid { background: #bbf7d0; }
        .bin-can .front-body { background: linear-gradient(135deg, #e9d5ff, var(--color-can)); } .bin-can .lid { background: #e9d5ff; }
        .bin-general .front-body { background: linear-gradient(135deg, #fecaca, var(--color-general)); } .bin-general .lid { background: #fecaca; }

        /* --- 3. 결과 화면 --- */
        #result-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(253, 251, 247, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; padding-bottom: 5vh; }
        .result-score { font-size: 8vh; color: var(--primary-color); margin: 1vh 0; text-shadow: 2px 2px 0 #fca5a5; }
        #result-ranking-board { margin-top: 2vh; width: 85%; background: #fff; border: 3px dashed var(--accent-color); border-radius: 15px; padding: 1vh; flex-shrink: 0; max-height: 25vh; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
        #result-ranking-board * { touch-action: pan-y; }

        /* --- 다국어 모달 UI --- */
        #langModal, #langModal * { box-sizing: border-box !important; font-family: 'Noto Sans KR', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(-10px); opacity: 0; transition: all 0.3s ease; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>

<div id="qr-modal" onclick="this.style.display='none'">
    <div id="qr-modal-content"></div>
</div>

<div id="game-container">

        <div id="top-nav">
            <a id="kingsmath-link-btn" href="https://kingsmath.com/" target="_self">KingsMath.com</a>
            <div id="langTriggerContainer" style="z-index: 99999;">
                <button id="langTriggerBtn">
                    <i class="fa-solid fa-globe"></i>

        <div class="main-title" id="main-title-el">
            <span data-i18n="title">분리배출킹</span>
            <span class="title-mobile" data-i18n="subtitle">모바일</span>
        </div>

        <div id="qr-area">
            <div id="qrcode" onclick="showBigQR()"></div>
            <div class="qr-help" data-i18n="qrHelp">QR을 눌러서 공유하세요!</div>
        </div>
        
        <div class="input-guide" data-i18n="guide">10개를 치우면 보너스 점수! ♻️</div>

        <input type="text" id="nickname" maxlength="8" placeholder="닉네임 입력" onfocus="this.select()" data-i18n-ph="placeholder">
        
        <button class="btn-start" onclick="checkNameAndStart()" data-i18n="startBtn">🚀 게임 시작!</button>
        <button class="btn-link" onclick="location.href='https://kingsmath.com/'" data-i18n="moreGames">🎮 다른 게임 고르기</button>
        
        <div id="ranking-board">

    <div id="game-screen" class="hidden">
        <div id="game-header">
            <div class="header-row">
                <button class="control-btn" onclick="goHome()">🏠</button>
                <button class="control-btn" onclick="restartGame()">🔄</button>

            <div class="header-row">
                <div class="stat-box" id="timer-box">
                    <span class="stat-label">TIME</span>

                <div class="stat-box">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-val" id="score-val">0</span>

            </div>

        <div id="game-board">

<script>
    // --- 설정 및 데이터 ---
    const GAME_DURATION = 60;

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration, vol=0.1) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    const sounds = {
        count: () => playTone(440, 'sine', 0.2, 0.2),
        go: () => playTone(880, 'sine', 0.4, 0.3),
        correct: () => { playTone(440, 'sine', 0.1, 0.1); setTimeout(()=>playTone(554, 'sine', 0.1, 0.1), 100); setTimeout(()=>playTone(659, 'sine', 0.2, 0.1), 200); },
        wrong: () => playTone(150, 'sawtooth', 0.3, 0.2),
        tick: () => playTone(1000, 'square', 0.05, 0.05)
    };

    // 💡 핵심 수정됨: JS에서 슬롯 너비의 95% 비율로 스케일을 맞춰 꽉 차게 렌더링
    function renderBins() {
        const binsZone = document.getElementById('bins-zone');
        binsZone.innerHTML = `
            ${createBinHTML('plastic', t('plastic'))}
            ${createBinHTML('paper', t('paper'))}

            document.querySelectorAll('.bin-wrapper').forEach(w => {

            });
        };
        
        updateScale();
        window.addEventListener('resize', updateScale);

        const screen = document.getElementById('countdown-screen');

        screen.classList.remove('hidden');

    function startTimer() {

        timerInterval = setInterval(() => {

            timeLeft--;
            const tVal = document.getElementById('timer-val');

    function spawnTrashBatch(count) {
        if(!isPlaying) return;
        const spawnZone = document.getElementById('spawn-zone');
        const trashLayer = document.getElementById('trash-layer');
        const rect = spawnZone.getBoundingClientRect();

        for(let i=0; i<count; i++) {
            const data = trashDB[Math.floor(Math.random() * trashDB.length)];
            const item = document.createElement('div');
            item.className = 'trash-item';
            item.dataset.type = data.type;
            item.innerHTML = `<div class="emoji">${data.char}</div>`;
            
            const posX = 10 + Math.random() * (rect.width - 90); 
            const posY = 10 + Math.random() * (rect.height * 0.8 - 90); 
            
            item.style.left = `${posX}px`;
            item.style.top = `${posY}px`;
            trashLayer.appendChild(item);
        }
    }

    // --- Drag and Drop Logic ---
    const activePointers = new Map();
    const trashLayer = document.getElementById('trash-layer');

    trashLayer.addEventListener('pointerdown', (e) => {
        if(!isPlaying) return;
        const item = e.target.closest('.trash-item');
        if(!item) return;

        item.classList.add('dragging');
        item.setPointerCapture(e.pointerId);

        activePointers.set(e.pointerId, {
            item: item, startX: e.clientX, startY: e.clientY,
            initLeft: parseFloat(item.style.left), initTop: parseFloat(item.style.top)
        });
        e.preventDefault();
    });

    document.addEventListener('pointermove', (e) => {
        if(!isPlaying || !activePointers.has(e.pointerId)) return;
        const p = activePointers.get(e.pointerId);
        
        const dx = e.clientX - p.startX;
        const dy = e.clientY - p.startY;
        p.item.style.left = `${p.initLeft + dx}px`;
        p.item.style.top = `${p.initTop + dy}px`;

        const globalX = e.clientX; const globalY = e.clientY;

        let closestBin = null;
        let minDist = 150; 

        document.querySelectorAll('.bin-wrapper').forEach(bin => {
            const bRect = bin.getBoundingClientRect();
            const centerX = bRect.left + bRect.width / 2;
            const centerY = bRect.top + bRect.height / 2;
            const dist = Math.hypot(globalX - centerX, globalY - centerY);

            if(dist < minDist) {
                minDist = dist;
                closestBin = bin;
            }
        });

        document.querySelectorAll('.bin-wrapper').forEach(bin => {
            const lid = bin.querySelector('.lid-wrapper');
            const mouth = bin.querySelector('.mouth');
            const pupils = bin.querySelectorAll('.pupil');

            if(bin === closestBin) {
                lid.style.transform = `rotate(85deg)`; 
                mouth.classList.add('open');
                
                const bRect = bin.getBoundingClientRect();
                const centerX = bRect.left + bRect.width / 2;
                const centerY = bRect.top + bRect.height / 2;
                const aMouse = Math.atan2(globalY - centerY, globalX - centerX);
                const pDist = Math.min(minDist / 20, 4);
                const px = Math.cos(aMouse) * pDist; 
                const py = Math.sin(aMouse) * pDist;
                pupils.forEach(pup => pup.style.transform = `translate(${px}px, ${py}px)`);
            } else {
                lid.style.transform = 'rotate(0deg)'; 
                mouth.classList.remove('open');
                pupils.forEach(pup => pup.style.transform = 'translate(0,0)');
            }
        });
    });

    document.addEventListener('pointerup', (e) => {
        if(!activePointers.has(e.pointerId)) return;
        const p = activePointers.get(e.pointerId);
        const item = p.item;
        
        item.classList.remove('dragging');
        item.releasePointerCapture(e.pointerId);
        activePointers.delete(e.pointerId);

        const rect = item.getBoundingClientRect();
        const centerX = rect.left + rect.width/2;
        const centerY = rect.top + rect.height/2;

        checkDropLogic(item, centerX, centerY, p.initLeft, p.initTop);
        
        if(activePointers.size === 0) {
            document.querySelectorAll('.bin-wrapper').forEach(bin => {
                bin.querySelector('.lid-wrapper').style.transform = 'rotate(0deg)';
                bin.querySelector('.mouth').classList.remove('open');
                bin.querySelectorAll('.pupil').forEach(pup => pup.style.transform = 'translate(0,0)');
            });
        }
    });

    function checkDropLogic(item, x, y, origLeft, origTop) {
        const bins = document.querySelectorAll('.bin-wrapper');
        let droppedBin = null;

        bins.forEach(bw => {
            const bRect = bw.getBoundingClientRect();
            if(x > bRect.left - 20 && x < bRect.right + 20 && y > bRect.top - 20 && y < bRect.bottom + 20) {
                droppedBin = bw;
            }
        });

        if(droppedBin) {
            const tType = item.dataset.type;
            const bType = droppedBin.dataset.type;
            const boardRect = document.getElementById('game-board').getBoundingClientRect();
            const localX = x - boardRect.left; const localY = y - boardRect.top;

            if(tType === bType) {
                score += 10; clearedCount++;
                if(clearedCount % 10 === 0) {
                    score += 100; sounds.correct();
                    showFloatingText(t('clear'), localX, localY, '#eab308', 2000);
                } else {
                    sounds.correct();
                    showFloatingText('+10', localX, localY, '#4ade80', 1000);
                }
            } else {
                score = Math.max(0, score - 5); sounds.wrong();
                showFloatingText('-5', localX, localY, '#ef4444', 1000);
            }
            
            document.getElementById('score-val').innerText = score;
            item.remove();

            const remaining = document.querySelectorAll('.trash-item').length;
            if(remaining < 3) spawnTrashBatch(5); 

        } else {
            item.style.transition = 'all 0.3s ease';
            item.style.left = `${origLeft}px`; item.style.top = `${origTop}px`;
            setTimeout(()=> item.style.transition = 'none', 300);
        }
    }

    function showFloatingText(txt, x, y, color, duration = 1000) {
        const el = document.createElement('div');
        el.className = 'feedback-text';
        el.innerText = txt; el.style.color = color;
        el.style.left = `${x - 40}px`; el.style.top = `${y - 40}px`;
        el.style.animationDuration = `${duration/1000}s`;
        document.getElementById('game-board').appendChild(el);
        setTimeout(()=>el.remove(), duration);
    }

    // --- Ranking System ---
    function submitScore(name, score) {
        const params = new URLSearchParams();
        params.append('nickname', name);
        params.append('score', score);

        fetch(API_URL + '?action=submit', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString() 
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = t('rankResult').replace('{rank}', data.rank);
                loadResultRanking();
            } else {
                document.getElementById("res-rank").innerText = t('rankingError');
            }
        }).catch(e => console.error(e));
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        list.innerHTML = `<div class="center">${t('rankingLoading')}</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) { list.innerHTML = `<div class="center" style="margin-top:20px;">${t('rankingEmpty')}</div>`; return; }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1);
                let style = (idx < 3) ? "font-size:1.5em;" : "color:#334155; font-weight:bold;";
                html += `<div class="rank-item">
                    <span style="width:15%; text-align:center; ${style}">${rankDisplay}</span>
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#94a3b8; font-weight:bold;">${item.score}</span>
                </div>`;
            });
            list.innerHTML = html;
        }).catch(e => { list.innerHTML = `<div class="center" style="color:var(--primary-color);">${t('rankingError')}</div>`; });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board");
        list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#94a3b8;">TOP 3 Loading...</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) { list.innerHTML = `<div class="center" style="font-size:1.8vh;">${t('rankingEmpty')}</div>`; return; }
            let html = ""; const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i]; let rankIcon = ["🥇","🥈","🥉"][i];
                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;">
                    <span style="width:15%; text-align:center;">${rankIcon}</span>
                    <span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; font-weight:bold; color:var(--deep-color);">${item.score}</span>
                </div>`;
            }
            list.innerHTML = html;
        }).catch(e => { list.style.display = 'none'; });
    }

    // --- 모달 로직 ---
    document.getElementById('langTriggerBtn').addEventListener('click', () => {
        document.getElementById('langModal').classList.add('active');
        document.body.style.overflow = 'hidden';
        const grid = document.getElementById('languageGrid');
        grid.innerHTML = '';
        languagesList.forEach(lang => {
            const isSelected = lang.code === currentLang;
            const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
            const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
            const btn = document.createElement('div');
            btn.className = `${baseClasses} ${stateClasses}`;
            btn.innerHTML = `
                <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                    <img src="https://flagcdn.com/w40/${lang.country}.png" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                </div>
                <div class="flex-1 min-w-0 flex flex-col items-start">
                    <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                    <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                </div>
                ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
            `;
            btn.addEventListener('click', () => changeLang(lang.code, lang));
            grid.appendChild(btn);
        });
    });
    document.getElementById('closeModalBtn').addEventListener('click', () => { document.getElementById('langModal').classList.remove('active'); document.body.style.overflow = ''; });

    // 방어코드
    document.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

    window.onload = function() {
        const savedName = localStorage.getItem("kingsmath_name");
        if(savedName) document.getElementById("nickname").value = savedName;
        changeLang(getInitialLang());
    };
</script>
</body>
</html>
