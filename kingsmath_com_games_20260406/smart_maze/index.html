    // --- 초기 언어 감지 및 모달 제어 로직 ---
    const triggerBtn = document.getElementById('langTriggerBtn');
    const modal = document.getElementById('langModal');
    const closeBtn = document.getElementById('closeModalBtn');
    const searchInput = document.getElementById('searchInput');
    const grid = document.getElementById('languageGrid');
    const noResult = document.getElementById('noResult');
    const currentFlagImg = document.getElementById('currentFlag');
    
    const toast = document.getElementById('toastNotification');
    const toastLangName = document.getElementById('toastLangName');
    let toastTimeout;

    function getInitialLang() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        if(langParam && i18n[langParam]) return langParam;

        const savedLang = localStorage.getItem('kingsmath_lang');
        if(savedLang && i18n[savedLang]) return savedLang;

        const browserLang = navigator.language.slice(0, 2);
        if(i18n[browserLang]) return browserLang;

        return 'en';
    }

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languagesList.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;
                btn.addEventListener('click', () => changeLang(lang.code, lang));
                grid.appendChild(btn);
            });
        }
    }

    function openModal() {
        modal.classList.add('active');
        renderLanguages(searchInput.value);
        document.body.style.overflow = 'hidden';
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, langCode) {
        const toastMsg = i18n[langCode].toast || "Language changed.";
        document.getElementById('ui-toast').textContent = toastMsg;
        toastLangName.textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function changeLang(langCode, langObj = null) {
        if(!i18n[langCode]) return;
        currentLang = langCode;
        const t = i18n[langCode];
        
        if (!langObj) langObj = languagesList.find(l => l.code === langCode);

        document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t[el.getAttribute('data-i18n')]; });
        document.getElementById("nickname").placeholder = t.placeholder;
        document.getElementById("nickname").setAttribute('data-i18n-ph', 'placeholder');
        
        currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;

        const linkBtn = document.getElementById("kingsmath-link-btn");
        if(langCode === 'ko') {
            linkBtn.innerText = "킹수학.com";
        } else {
            linkBtn.innerText = "KingsMath.com";
        }

        const mainTitle = document.getElementById('main-title-el');
        if(['ru', 'es', 'fr', 'pt-br', 'de', 'it', 'id', 'vi'].includes(langCode)) {
            mainTitle.style.fontSize = "5vh";
        } else if(['th'].includes(langCode)) {
            mainTitle.style.fontSize = "6vh";
        } else {
            mainTitle.style.fontSize = "7vh"; 
        }

        document.title = t.metaTitle;
        document.getElementById("meta-desc").setAttribute("content", t.metaDesc);

        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?lang=' + langCode;
        window.history.pushState({path:newUrl}, '', newUrl);
        localStorage.setItem("kingsmath_lang", langCode);

        initQR(); 
        loadRanking(); 

        closeModal();
        if (langObj) showToast(langObj.name, langCode); 
    }

    triggerBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    searchInput.addEventListener('input', (e) => { renderLanguages(e.target.value); });


    // --- QR Code ---
    let qrObject = null;
    function initQR() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; 
        const url = window.location.href;
        
        try {
            qrObject = new QRCode(qrContainer, {
                text: url, width: 128, height: 128, colorDark : "#5d4037", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
        } catch(e) { console.error("QR Code 생성 실패", e); }
    }

    function showBigQR() {
        const modal = document.getElementById("qr-modal");
        const modalContent = document.getElementById("qr-modal-content");
        modalContent.innerHTML = "";
        
        const qrCanvas = document.querySelector("#qrcode canvas");
        const qrImg = document.querySelector("#qrcode img");
        
        let src = "";
        if (qrCanvas) src = qrCanvas.toDataURL("image/png");
        else if (qrImg) src = qrImg.src;

        if (src) {
            const newImg = new Image();
            newImg.src = src;
            modalContent.appendChild(newImg);
            modal.style.display = "flex";
        }
    }

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'eat') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'levelup') {
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(1000, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'tick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now+0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'end') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(100, now+0.5);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'reveal') { 
            osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.linearRampToValueAtTime(800, now+0.5);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now+0.5);
            osc.start(now); osc.stop(now+0.5);
        }
    }

    // --- Maze Logic ---
    const COLS = 10;
    const ROWS = 10;
    const FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍑', '🍍', '🥝'];

    class Maze {
        constructor(cols, rows) {
            this.cols = cols; this.rows = rows;
            this.grid = []; this.fruits = [];
            this.goal = null;
            this.initGrid(); this.generateDFS(); this.populateItems();
        }
        initGrid() {
            for(let r=0; r<this.rows; r++) {
                let row = [];
                for(let c=0; c<this.cols; c++) row.push({c, r, visited:false, walls:{top:true,right:true,bottom:true,left:true}});
                this.grid.push(row);
            }
        }
        generateDFS() {
            let stack = [];
            let current = this.grid[0][0];
            current.visited = true;
            stack.push(current);
            while(stack.length > 0) {
                current = stack[stack.length - 1];
                let neighbors = this.getNeighbors(current);
                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    this.removeWalls(current, next);
                    next.visited = true;
                    stack.push(next);
                } else { stack.pop(); }
            }
            for(let r=0; r<this.rows; r++) for(let c=0; c<this.cols; c++) {
                if(Math.random() < 0.1) {
                     if(r>0) { this.grid[r][c].walls.top = false; this.grid[r-1][c].walls.bottom = false; }
                     else if(c<this.cols-1) { this.grid[r][c].walls.right = false; this.grid[r][c+1].walls.left = false; }
                }
            }
        }
        getNeighbors(cell) {
            let res = [];
            [[0,-1],[1,0],[0,1],[-1,0]].forEach(d => {
                let nc=cell.c+d[0], nr=cell.r+d[1];
                if(nc>=0 && nc<this.cols && nr>=0 && nr<this.rows && !this.grid[nr][nc].visited) res.push(this.grid[nr][nc]);
            });
            return res;
        }
        removeWalls(a, b) {
            let x=a.c-b.c, y=a.r-b.r;
            if(x===1) {a.walls.left=false; b.walls.right=false;} else if(x===-1) {a.walls.right=false; b.walls.left=false;}
            if(y===1) {a.walls.top=false; b.walls.bottom=false;} else if(y===-1) {a.walls.bottom=false; b.walls.top=false;}
        }
        populateItems() {
            let count = 0;
            while(count < FRUIT_COUNT) {
                let r = Math.floor(Math.random()*this.rows);
                let c = Math.floor(Math.random()*this.cols);
                if((r!==0 || c!==0) && (r!==this.rows-1 || c!==this.cols-1) && !this.fruits.find(f=>f.r===r && f.c===c)) {
                    this.fruits.push({r, c, type: FRUITS[Math.floor(Math.random()*FRUITS.length)], eaten:false});
                    count++;
                }
            }
            this.goal = { c: this.cols-1, r: this.rows-1, visible: false };
        }
    }

    let maze = null;
    let player = { x:0, y:0, radius:0.3, color:'#ff6b6b', emoji:'🐶' };

    // --- Game Logic ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let renderRect = {x:0, y:0, w:0, h:0};

    function initGame() {
        score = 0;
        timeLeft = GAME_DURATION;
        document.getElementById('score-val').innerText = score;
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('timer-val').classList.remove('timer-warning');
        document.getElementById('ingame-nickname').innerText = myNickname;
        
        createNewLevel();
        
        isPlaying = true;
        gameLoop();
        startTimer();
    }

    function createNewLevel() {
        maze = new Maze(COLS, ROWS);
        player.x = 0.5; 
        player.y = 0.5; 
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            timeLeft--;
            const tVal = document.getElementById('timer-val');
            tVal.innerText = timeLeft;
            
            if(timeLeft <= 10) tVal.classList.add('timer-warning');
            if(timeLeft <= 5 && timeLeft > 0) playSound('tick');

            if(timeLeft <= 0) endGame();
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        playSound('end');

        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('res-nickname').innerText = myNickname;
        document.getElementById('res-score').innerText = score;
        
        document.getElementById('result-ranking-board').innerHTML = "";
        submitScore(myNickname, score);
    }

    // --- Rendering & Update ---
    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        const shortSide = Math.min(wrapper.clientWidth, wrapper.clientHeight);
        const targetSize = shortSide * 0.98;

        canvas.width = targetSize;
        canvas.height = targetSize;
        
        renderRect = { x: 0, y: 0, w: canvas.width, h: canvas.height };
    }
    window.addEventListener('resize', resizeCanvas);

    function gameLoop() {
        if(!isPlaying) return;
        
        ctx.clearRect(0,0, canvas.width, canvas.height);
        if(canvas.width === 0) resizeCanvas();

        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(renderRect.x, renderRect.y, renderRect.w, renderRect.h);

        const cw = renderRect.w / COLS;
        const ch = renderRect.h / ROWS;

        ctx.translate(renderRect.x, renderRect.y);

        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = Math.max(2, cw * 0.1);
        ctx.lineCap = 'round'; 
        ctx.lineJoin = 'round'; 
        ctx.beginPath();
        for(let r=0; r<ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                let cell = maze.grid[r][c];
                let x = c*cw, y = r*ch;
                if(cell.walls.top) { ctx.moveTo(x,y); ctx.lineTo(x+cw,y); }
                if(cell.walls.bottom) { ctx.moveTo(x,y+ch); ctx.lineTo(x+cw,y+ch); }
                if(cell.walls.left) { ctx.moveTo(x,y); ctx.lineTo(x,y+ch); }
                if(cell.walls.right) { ctx.moveTo(x+cw,y); ctx.lineTo(x+cw,y+ch); }
            }
        }
        ctx.stroke();

        ctx.font = `${Math.min(cw,ch)*0.6}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        maze.fruits.forEach(f => {
            if(!f.eaten) ctx.fillText(f.type, (f.c+0.5)*cw, (f.r+0.5)*ch);
        });

        if(maze.goal.visible) {
            ctx.font = `${Math.min(cw,ch)*0.8}px serif`;
            ctx.fillText('🏰', (maze.goal.c+0.5)*cw, (maze.goal.r+0.5)*ch);
        }

        const px = player.x * cw;
        const py = player.y * ch;
        
        ctx.shadowBlur = 10; ctx.shadowColor = '#000';
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(px, py, Math.min(cw,ch)*0.35, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.font = `${Math.min(cw,ch)*0.5}px serif`;
        ctx.fillStyle = '#000';
        ctx.fillText(player.emoji, px, py+2);

        ctx.translate(-renderRect.x, -renderRect.y);

        requestAnimationFrame(gameLoop);
    }

    // --- Controls & Physics (개선된 부분) ---
    let activePointer = null;
    const TOUCH_OFFSET_Y = 40; // 손가락으로 말을 가리지 않게 터치 좌표를 위로 올리는 수치 (30~40 권장)
    
    canvas.addEventListener('pointerdown', e => {
        if(!isPlaying) return;
        e.preventDefault();
        activePointer = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        
        const rect = canvas.getBoundingClientRect();
        // 터치 환경에서만 Y좌표를 위로 올려줌 (마우스 클릭 시에는 보정 없음)
        const offsetY = (e.pointerType === 'touch') ? TOUCH_OFFSET_Y : 0;
        movePlayer(e.clientX - rect.left, e.clientY - rect.top - offsetY);
    });

    canvas.addEventListener('pointermove', e => {
        if(!isPlaying || activePointer !== e.pointerId) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const offsetY = (e.pointerType === 'touch') ? TOUCH_OFFSET_Y : 0;
        movePlayer(e.clientX - rect.left, e.clientY - rect.top - offsetY);
    });

    ['pointerup', 'pointercancel'].forEach(ev => {
        canvas.addEventListener(ev, e => {
            if(activePointer === e.pointerId) activePointer = null;
        });
    });

    function movePlayer(targetX, targetY) {
        const relX = targetX - renderRect.x;
        const relY = targetY - renderRect.y;
        
        const safeX = Math.max(0, Math.min(renderRect.w, relX));
        const safeY = Math.max(0, Math.min(renderRect.h, relY));

        const gridTx = (safeX / renderRect.w) * COLS;
        const gridTy = (safeY / renderRect.h) * ROWS;

        const dx = gridTx - player.x;
        const dy = gridTy - player.y;
        const dist = Math.hypot(dx, dy);
        
        const step = 0.1; 
        const steps = Math.ceil(dist / step);
        const dirX = dx/dist || 0;
        const dirY = dy/dist || 0;

        let currX = player.x;
        let currY = player.y;

        for(let i=0; i<steps; i++) {
            let nextX = currX + dirX * Math.min(step, dist - i*step);
            let nextY = currY + dirY * Math.min(step, dist - i*step);

            if (!checkWall(currX, currY, nextX, currY)) currX = nextX;
            if (!checkWall(currX, currY, currX, nextY)) currY = nextY;
        }
        player.x = currX;
        player.y = currY;

        checkItems();
    }

    function checkWall(oldX, oldY, newX, newY) {
        const r = player.radius;
        if (newX-r < 0 || newX+r > COLS || newY-r < 0 || newY+r > ROWS) return true;
        
        const minC = Math.floor(newX-r), maxC = Math.floor(newX+r);
        const minR = Math.floor(newY-r), maxR = Math.floor(newY+r);

        for (let rIter = minR; rIter <= maxR; rIter++) {
            for (let cIter = minC; cIter <= maxC; cIter++) {
                if (rIter<0 || rIter>=ROWS || cIter<0 || cIter>=COLS) continue;
                const cell = maze.grid[rIter][cIter];
                
                if (cell.walls.top && distSeg(newX, newY, cIter, rIter, cIter+1, rIter) < r) return true;
                if (cell.walls.bottom && distSeg(newX, newY, cIter, rIter+1, cIter+1, rIter+1) < r) return true;
                if (cell.walls.left && distSeg(newX, newY, cIter, rIter, cIter, rIter+1) < r) return true;
                if (cell.walls.right && distSeg(newX, newY, cIter+1, rIter, cIter+1, rIter+1) < r) return true;
            }
        }
        return false;
    }

    function distSeg(px, py, x1, y1, x2, y2) {
        const l2 = (x1-x2)**2 + (y1-y2)**2;
        if (l2===0) return Math.hypot(px-x1, py-y1);
        let t = ((px-x1)*(x2-x1) + (py-y1)*(y2-y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t*(x2-x1)), py - (y1 + t*(y2-y1)));
    }

    function checkItems() {
        maze.fruits.forEach(f => {
            if(!f.eaten && Math.hypot(player.x - (f.c+0.5), player.y - (f.r+0.5)) < 0.5) {
                f.eaten = true;
                score += FRUIT_SCORE;
                updateScoreUI();
                playSound('eat');
                
                const remaining = maze.fruits.filter(fruit => !fruit.eaten).length;
                if(remaining === 0) {
                    maze.goal.visible = true; 
                    playSound('reveal');
                }
            }
        });

        const g = maze.goal;
        if(maze.goal.visible && Math.hypot(player.x - (g.c+0.5), player.y - (g.r+0.5)) < 0.5) {
            score += MAZE_CLEAR_SCORE;
            updateScoreUI();
            playSound('levelup');
            showLevelUpEffect();
            createNewLevel();
            activePointer = null; 
        } 
    }

    function updateScoreUI() {
        document.getElementById('score-val').innerText = score;
    }

    function showLevelUpEffect() {
        const el = document.getElementById('levelup-overlay');
        const txt = document.getElementById('levelup-text');
        
        el.style.display = 'flex';
        txt.style.animation = 'none';
        el.offsetHeight; 
        txt.style.animation = 'floatUp 0.8s ease-out forwards';
        
        setTimeout(() => { el.style.display = 'none'; }, 800);
    }

    // --- UI & Utils ---
    function checkNameAndStart() {
        const input = document.getElementById('nickname');
        const val = input.value.trim();
        const t = i18n[currentLang];

        if(val.length < 1) { alert(t.alertName); return; }
        const badWords = ["시발", "씨발", "개새끼", "fuck", "shit"];
        if(badWords.some(w => val.includes(w))) { alert(t.alertBad); return; }

        myNickname = val;
        localStorage.setItem("kingsmaze_name", val);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        
        resizeCanvas();
        startCountdown();
    }

    function startCountdown() {
        const screen = document.getElementById('countdown-screen');
        const text = document.getElementById('countdown-text');
        screen.classList.remove('hidden');
        
        let cnt = 3;
        text.innerText = cnt;
        playSound('tick');
        
        const intv = setInterval(() => {
            cnt--;
            if(cnt > 0) {
                text.innerText = cnt;
                text.style.animation = 'none';
                text.offsetHeight; 
                text.style.animation = 'pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                playSound('tick');
            } else {
                clearInterval(intv);
                text.innerText = "GO!";
                playSound('start');
                setTimeout(() => {
                    screen.classList.add('hidden');
                    initGame();
                }, 500);
            }
        }, 1000);
    }

    function restartGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        startCountdown();
    }

    function goHome() {
        if (document.fullscreenElement) {
            isPlaying = false;
            clearInterval(timerInterval);
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            
            document.getElementById('langTriggerContainer').style.display = 'block'; 
            
            if(window.playSound) window.playSound('tick');
            loadRanking();
        } else {
            location.reload();
        }
    }

    // --- Ranking System ---
    function submitScore(name, score) {
        const t = i18n[currentLang];
        const formData = new FormData();
        formData.append('nickname', name);
        formData.append('score', score);

        fetch(API_URL + '?action=submit', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById("res-rank").innerText = t.rankResult.replace('{rank}', data.rank);
                loadResultRanking();
            } else {
                document.getElementById("res-rank").innerText = "Ranking Error";
            }
        })
        .catch(e => console.error(e));
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center">${t.rankingLoading}</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="margin-top:20px;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1);
                let style = (idx < 3) ? "font-size:1.5em;" : "color:#8d6e63; font-weight:bold;";
                
                html += `<div class="rank-item">
                    <span style="width:15%; text-align:center; ${style}">${rankDisplay}</span>
                    <span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; color:#888; font-weight:bold;">${item.score}</span>
                </div>`;
            });
            list.innerHTML = html;
        })
        .catch(e => {
            list.innerHTML = `<div class="center" style="color:red;">${t.rankingError}</div>`;
        });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board");
        const t = i18n[currentLang];
        list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#888;">TOP 3 Loading...</div>`;

        fetch(API_URL + '?action=list')
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                list.innerHTML = `<div class="center" style="font-size:1.8vh;">${t.rankingEmpty}</div>`;
                return;
            }
            let html = "";
            const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i];
                let rankIcon = ["🥇","🥈","🥉"][i];
                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;">
                    <span style="width:15%; text-align:center;">${rankIcon}</span>
                    <span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span>
                    <span style="width:35%; text-align:right; font-weight:bold; color:#5d4037;">${item.score}</span>
                </div>`;
            }
            list.innerHTML = html;
        })
        .catch(e => {
            list.style.display = 'none'; 
        });
    }

    // --- Init ---
    window.onload = function() {
        const savedName = localStorage.getItem("kingsmaze_name");
        if(savedName) document.getElementById("nickname").value = savedName;
        
        const initLang = getInitialLang();
        changeLang(initLang);
        renderLanguages(); 
    };
