<style>
        :root {
            --main-yellow: #FFD93D;
            --main-dark: #1e1e2e;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        /* 폰트 어썸 아이콘 깨짐 방지 예외 처리 */
        .fas, .far, .fab, .fa-solid, .fa-regular {
            font-family: "Font Awesome 6 Free" !important;
        }
        
        /* 다국어별 폰트 분리 */
        body.lang-ko #mobile-wrapper *:not(i):not(.timer-text) { font-family: 'Jua', sans-serif; }
        body:not(.lang-ko) #mobile-wrapper *:not(i):not(.timer-text) { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            letter-spacing: normal;
        }
        body:not(.lang-ko) .game-logo { font-weight: bold; }

        * { 
            box-sizing: border-box; 
            touch-action: none; 
            user-select: none; 
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0; padding: 0; 
            overflow: hidden;
            background-color: #111;
            height: 100vh; height: 100dvh; 
            display: flex; justify-content: center; align-items: center;
            color: white;
        }

        #mobile-wrapper {
            width: 100%; max-width: 480px; 
            height: 100%; height: 100dvh; 
            background-color: var(--main-dark);
            position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        header {
            position: absolute; top: 0; left: 0; width: 100%;
            height: calc(80px + var(--safe-top));
            padding-top: var(--safe-top);
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex; justify-content: center; align-items: flex-start;
            z-index: 20; pointer-events: none;
        }
        .nav-icon {
            position: absolute; top: calc(15px + var(--safe-top));
            font-size: 1.8rem; cursor: pointer; pointer-events: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.1s;
        }
        .nav-icon:active { transform: scale(0.9); }
        #btn-home-game { left: 20px; }
        #btn-restart-game { right: 20px; }

        #game-container {
            flex: 1; display: flex; flex-direction: column;
            position: relative; background: radial-gradient(circle at center, #2b3248 0%, #161821 100%);
            min-height: 0; align-items: center; justify-content: center;
        }

        .timer-text {
            font-family: 'Courier New', Courier, monospace !important;
            font-variant-numeric: tabular-nums;
            font-size: clamp(6rem, 20vw, 8rem);
            font-weight: bold;
            color: var(--main-yellow);
            text-shadow: 0 0 30px rgba(255, 217, 61, 0.4);
            letter-spacing: 0px;
            margin-bottom: 5px;
        }

        .timer-text.hidden-time {
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
        }

        #inline-status {
            font-size: 1.5rem;
            font-weight: bold;
            height: 35px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 15px; 
        }
        #inline-status.show {
            opacity: 1;
        }

        #action-area {
            background: #23242a; 
            height: 25dvh; 
            min-height: 150px; 
            max-height: 200px; 
            padding: 20px;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0; z-index: 10;
            border-top: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }

        .stop-btn {
            background: #ef5350; color: #fff; 
            font-size: 3rem;
            border: none; border-radius: 20px; 
            box-shadow: 0 10px 0 #c62828; 
            width: 100%; height: 100%;
            cursor: pointer; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        body.lang-ko .stop-btn { font-family: 'Jua', sans-serif; font-weight: normal; }
        body:not(.lang-ko) .stop-btn { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: bold; }
        
        .stop-btn:active { 
            transform: translateY(10px); 
            box-shadow: 0 0 0 #c62828; 
            background: #e53935; 
        }

        #post-game-controls {
            display: none;
            width: 80%;
            max-width: 320px;
            height: 80px;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 15px; 
        }
        .action-sub-btn {
            flex: 1;
            height: 100%;
            border-radius: 20px;
            font-size: 3rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-home-action {
            background: #4b5563; box-shadow: 0 10px 0 #374151;
        }
        .btn-home-action:active { transform: translateY(10px); box-shadow: 0 0 0 #374151; background: #374151; }
        .btn-restart-action {
            background: #3b82f6; box-shadow: 0 10px 0 #2563eb;
        }
        .btn-restart-action:active { transform: translateY(10px); box-shadow: 0 0 0 #2563eb; background: #2563eb; }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; 
            padding: 80px 20px 50px 20px; 
            background: linear-gradient(135deg, #1e1e2e, #2d2b42); 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y !important; 
        }
        
        .start-card {
            background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); padding: 25px 20px; border-radius: 30px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 100%; max-width: 400px; animation: floatUp 0.8s ease-out;
            display: flex; flex-direction: column; align-items: center;
            flex-shrink: 0; margin-bottom: 20px;
        }
        @keyframes floatUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            height: calc(60px + var(--safe-top));
            padding: var(--safe-top) 20px 0 20px; 
            display: flex; justify-content: space-between; align-items: center;
            z-index: 200; background: rgba(0,0,0,0.2);
        }
        
        .top-bar-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 6px 14px;
            color: #fff; text-decoration: none; font-size: 1.1rem; opacity: 0.95; font-weight: bold;
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .top-bar-btn:active { transform: scale(0.95); opacity: 1; background: rgba(255, 255, 255, 0.25); }

        .game-logo {
            font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 5px;
            background: linear-gradient(45deg, #FFD93D, #FF6B6B);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.2));
            word-break: keep-all; line-height: 1.2;
        }
        .desc-text { color: #d1d5db; font-size: 1.1rem; line-height: 1.4; margin-bottom: 15px; word-break: keep-all; }

        .nickname-input {
            width: 80%; padding: 10px; border-radius: 12px; border: 2px solid #555;
            background: rgba(0,0,0,0.3); color: white; font-size: 1.1rem; text-align: center;
            margin-bottom: 15px;
        }
        .nickname-input:focus { border-color: #FFD93D; outline: none; }

        .start-btn {
            background: linear-gradient(90deg, #FFD93D, #FF9F1C); color: #1a1a1a; border: none;
            padding: 12px 20px; font-size: clamp(1.2rem, 5vw, 1.8rem); border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 159, 28, 0.3); transition: transform 0.2s;
            width: 80%; font-weight: bold; word-break: keep-all; margin-bottom: 10px;
        }
        .start-btn:active { transform: scale(0.95); }

        .start-rank-container {
            width: 100%; max-width: 400px;
            background: rgba(0,0,0,0.4); border-radius: 15px;
            padding: 10px; margin-bottom: 20px;
            flex-grow: 1; display: flex; flex-direction: column;
            height: auto !important; max-height: none !important;
        }
        .rank-title { color: #FFD93D; font-size: 1.2rem; margin-bottom: 8px; text-align: center; font-weight: bold; }
        
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1rem; }
        .rank-item:last-child { border: none; }
        
        #countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200;
            display: none; justify-content: center; align-items: center;
        }
        #countdown-text {
            font-size: 10rem; color: #FFD93D; text-shadow: 0 0 30px #FFD93D; font-weight: bold;
        }

        .overlay-screen, .overlay-screen * { touch-action: pan-y !important; }
        @keyframes zoomPop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        #langModal, #langModal * { box-sizing: border-box !important; }
        
        #langModal *:not(i) {
            font-family: 'Helvetica Neue', Arial, sans-serif !important;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .modal-overlay {
            opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active {
            opacity: 1; visibility: visible;
        }
        .modal-content {
            transform: scale(0.95) translateY(-10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .toast {
            transform: translateY(100%); opacity: 0; transition: all 0.3s ease;
        }
        .toast.show {
            transform: translateY(0); opacity: 1;
        }

        #langTriggerBtnContainer {
            z-index: 99999;
        }

        .qr-wrapper {
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 15px;
        }
</style>

    function initLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        let langCode = urlParams.get('lang');
        
        if (!langCode || !languages.find(l => l.code === langCode)) {
            langCode = localStorage.getItem('kingsmath_lang');
        }
        
        if (!langCode || !languages.find(l => l.code === langCode)) {
            const browserLang = navigator.language.toLowerCase().split('-')[0];
            const isSupported = languages.some(l => l.code === browserLang || l.code.startsWith(browserLang));
            if (isSupported) {
                const exactMatch = languages.find(l => l.code === navigator.language.toLowerCase());
                const partialMatch = languages.find(l => l.code.startsWith(browserLang));
                langCode = exactMatch ? exactMatch.code : (partialMatch ? partialMatch.code : 'en');
            } else {
                langCode = 'en';
            }
        }

        applyLanguage(langCode, false);
        
        document.getElementById('langTriggerBtn').addEventListener('click', openLangModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeLangModal);
        document.getElementById('langModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('langModal')) closeLangModal();
        });
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderLanguages(e.target.value);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('langModal').classList.contains('active')) {
                closeLangModal();
            }
        });

        renderLanguages();
    }

        localStorage.setItem('kingsmath_lang', code);

        const t = translations[code] || translations['en'];
        const langObj = languages.find(l => l.code === code);

        document.getElementById('brand-link').textContent = t.brandName;
        document.getElementById('txt-title').textContent = t.title;
        document.getElementById('txt-platform').textContent = (code === 'ko') ? "모바일" : "Mobile";
        document.getElementById('txt-desc').innerHTML = `${t.desc}<br><span id="txt-desc-sub" style="color:#FF6B6B">${t.descSub}</span>`;
        document.getElementById('nickname').placeholder = t.nicknamePlaceholder;
        document.getElementById('btn-start').textContent = t.btnStart;
        document.getElementById('btn-other-games').textContent = t.btnOtherGames;
        document.getElementById('txt-rank-title').textContent = t.rankTitle;
        document.getElementById('txt-rank-note').textContent = t.rankNote;
        document.getElementById('btn-stop').textContent = t.btnStop;
        
        const loadingEl = document.getElementById('txt-loading');
        if (loadingEl) loadingEl.textContent = t.loading;

        document.title = t.metaTitle;
        document.getElementById('meta-title').textContent = t.metaTitle;
        document.getElementById('meta-desc').setAttribute('content', t.metaDesc);
        document.getElementById('meta-keywords').setAttribute('content', t.metaKeywords);
        document.getElementById('og-title').setAttribute('content', t.metaTitle);

        document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langObj.country}.png`;
        document.getElementById('currentLangName').textContent = langObj.name;

        if (code === 'ko') {
            document.body.classList.add('lang-ko');
        } else {
            document.body.classList.remove('lang-ko');
        }

        const currentUrl = encodeURIComponent(window.location.href);
        document.getElementById('qr-code-img').src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + currentUrl;

        if (showNotification) {
            showToast(langObj.name, t.toast);
        }
    }

    function renderLanguages(filterText = '') {
        const grid = document.getElementById('languageGrid');
        const noResult = document.getElementById('noResult');
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;

                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50 flex-shrink-0">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start" style="text-align:left;">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}" style="font-family:'Helvetica Neue', Arial, sans-serif !important;">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full" style="font-family:'Helvetica Neue', Arial, sans-serif !important;">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;

                btn.addEventListener('click', () => {
                    applyLanguage(lang.code, true);
                    closeLangModal();
                    renderLanguages(document.getElementById('searchInput').value);
                });
                grid.appendChild(btn);
            });
        }
    }

    function openLangModal() {
        const modal = document.getElementById('langModal');
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('searchInput').focus(), 100);
    }

    function closeLangModal() {
        const modal = document.getElementById('langModal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, msg) {
        const toast = document.getElementById('toastNotification');
        document.getElementById('ui-toast').textContent = msg;
        document.getElementById('toastLangName').textContent = langName;
        
        toast.classList.add('show');
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function attachHomeButtonEvents() {
        const homeBtns = [document.getElementById('btn-home-game')];
        homeBtns.forEach(btn => {
            if(!btn) return;
            btn.addEventListener('click', goHome);
        });
    }

    function goHome() {
        if (document.fullscreenElement) {
            isRunning = false;
            isProcessing = false;
            clearInterval(timerReq);
            cancelAnimationFrame(timerReq);
            
            document.getElementById('langTriggerBtnContainer').style.display = 'block';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('start-screen').style.display = 'flex';
            
            document.getElementById('btn-stop').style.visibility = 'visible';
            document.getElementById('post-game-controls').style.display = 'none';
            document.getElementById('header-info').style.display = 'flex'; // 상단 버튼 원상복구
            document.getElementById('inline-status').classList.remove('show');
            document.getElementById('timer-display').innerText = "00.00";
            document.getElementById('timer-display').style.color = "var(--main-yellow)";
            
            if(audioCtx) playSound('darang');
        } else {
            location.reload();
        }
    }

    function playSound(type) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        
        if (type === 'countdown') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'go') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(880, now);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'darang') { 
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
                
                const time = now + (i * 0.04);
                g.gain.setValueAtTime(0, time);
                g.gain.linearRampToValueAtTime(0.15, time + 0.02);
                g.gain.exponentialRampToValueAtTime(0.01, time + 0.6);
                
                o.start(time);
                o.stop(time + 0.6);
            });
        } else if (type === 'dingdong') {
            const playNote = (freq, startTime, dur) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(startTime); osc.stop(startTime + dur);
            };
            playNote(659.25, now, 0.4); 
            playNote(523.25, now + 0.2, 0.5); 
        } else if (type === 'boing') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.2); 
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    function restartGame() {
        document.getElementById('btn-stop').style.visibility = 'visible';
        document.getElementById('post-game-controls').style.display = 'none';
        document.getElementById('header-info').style.display = 'flex'; // 상단 버튼 원상복구
        document.getElementById('inline-status').classList.remove('show');
        document.getElementById('timer-display').style.color = "var(--main-yellow)";
        isRunning = false; isProcessing = false;
        cancelAnimationFrame(timerReq);
        readyGame();
    }

    function readyGame() {
        const nickInput = document.getElementById('nickname');
        if(!nickInput.value.trim()) { 
            alert("NickName?"); nickInput.focus(); return; 
        }
        nickname = nickInput.value.trim();

        // [추가됨] 닉네임 캐시(localStorage)에 저장
        localStorage.setItem('kingsmath_nickname', nickname);

        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        document.getElementById('langTriggerBtnContainer').style.display = 'none';
        document.getElementById('header-info').style.display = 'flex';
        
        document.getElementById('start-screen').style.display = 'none';
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'flex';
        
        document.getElementById('timer-display').innerText = "00.00";
        document.getElementById('timer-display').classList.remove('hidden-time');

        let count = 3;
        const text = document.getElementById('countdown-text');
        
        // 카운트다운 초기화
        text.innerText = count;
        text.style.animation = 'none';
        void text.offsetWidth; // 리플로우 발생
        text.style.animation = 'zoomPop 0.5s ease-out';
        playSound('countdown');

        const interval = setInterval(() => {
            count--;
            if(count > 0) {
                text.innerText = count;
                // 애니메이션 중복 겹침 해결 (매 초마다 새롭게 1회만 재생)
                text.style.animation = 'none'; 
                void text.offsetWidth; 
                text.style.animation = 'zoomPop 0.5s ease-out';
                playSound('countdown');
            } else {
                clearInterval(interval);
                text.innerText = "GO!";
                text.style.animation = 'none'; 
                void text.offsetWidth; 
                text.style.animation = 'zoomPop 0.5s ease-out';
                playSound('go');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    startGame();
                }, 600);
            }
        }, 1000);
    }

    function startGame() {
        isRunning = true;
        isProcessing = false;
        startTime = performance.now();
        updateTimer();
    }

    function updateTimer() {
        if (!isRunning) return;
        
        let elapsed = performance.now() - startTime;
        
        // 15.99초(15990ms) 초과시 강제 종료 (타임아웃)
        if (elapsed >= 15990) {
            stopTimer(true);
            return;
        }
        
        let formattedTime = (elapsed / 1000).toFixed(2).padStart(5, '0'); 
        const timerEl = document.getElementById('timer-display');

        // 초를 가리지 않고 계속 포맷팅된 시간 표시
        timerEl.innerText = formattedTime;
        timerEl.classList.remove('hidden-time');

        timerReq = requestAnimationFrame(updateTimer);
    }

    function stopTimer(isTimeout = false) {
        if (!isRunning || isProcessing) return;
        
        isRunning = false;
        isProcessing = true;
        cancelAnimationFrame(timerReq);
        
        let finalSeconds;
        
        // 타임아웃인지 직접 누른건지 판별
        if (isTimeout === true) {
            finalSeconds = "15.99";
            playSound('boing'); // 띠용 효과음
        } else {
            let elapsed = performance.now() - startTime;
            finalSeconds = (elapsed / 1000).toFixed(2).padStart(5, '0');
            playSound('dingdong'); // 띵동 효과음
        }
        
        const timerEl = document.getElementById('timer-display');
        timerEl.classList.remove('hidden-time');
        timerEl.innerText = finalSeconds;

        document.getElementById('btn-stop').style.visibility = 'hidden';
        document.getElementById('post-game-controls').style.display = 'flex';
        document.getElementById('header-info').style.display = 'none'; // 하단 버튼이 나오면 상단 버튼 숨김

        const statusEl = document.getElementById('inline-status');
        const t = translations[currentLang] || translations['en'];

        if (isTimeout === true) {
            timerEl.style.color = "#ff6b6b";
            statusEl.innerText = t.resultTimeout;
            statusEl.style.color = "#ff6b6b";
        } else if (finalSeconds === "10.00") {
            timerEl.style.color = "#FFD93D";
            statusEl.innerText = t.resultStatusPerfect;
            statusEl.style.color = "#FFD93D";
            setTimeout(() => playSound('darang'), 200); // 띵동 후 약간 딜레이 주고 축하 효과음
            submitRanking(nickname);
        } else {
            timerEl.style.color = "#ff6b6b";
            statusEl.innerText = t.resultStatusFail;
            statusEl.style.color = "#aaa";
        }
        
        statusEl.classList.add('show');
    }

    function loadRanking() {
        const listDiv = document.getElementById('start-rank-list');
        const t = translations[currentLang] || translations['en'];
        
        fetch('100.php?action=list')
        .then(res => res.json())
        .then(data => {
            listDiv.innerHTML = "";
            if(data.length === 0) {
                listDiv.innerHTML = `<div style="text-align:center;color:#888;padding:10px;">${t.noRecords}</div>`;
                return;
            }
            data.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'rank-item';
                
                row.innerHTML = `
                    <span style="flex:1; display:flex; align-items:center; font-weight:bold; color:white;">
                        <span style="margin-right:8px; font-size:1.1rem; opacity:0.8;">👤</span> ${item.nickname}
                    </span>
                    <span style="font-size:0.85rem; color:#888;">${item.date.substring(5, 16)}</span>
                `;
                listDiv.appendChild(row);
            });
        })
        .catch(err => {
            listDiv.innerHTML = `<div style="text-align:center;color:#red;">${t.error}</div>`;
        });
    }

    function submitRanking(nick) {
        const statusEl = document.getElementById('inline-status');
        const fd = new FormData();
        fd.append('nickname', nick);
        
        const t = translations[currentLang] || translations['en'];

        fetch('100.php?action=submit', { method: 'POST', body: fd })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                statusEl.innerText = t.resultSuccess;
                loadRanking(); 
            } else { 
                statusEl.innerText = t.resultFail; 
            }
        })
        .catch(err => { console.error(err); statusEl.innerText = "Error"; });
    }
</script>
