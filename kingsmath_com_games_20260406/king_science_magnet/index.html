    let currentLang = 'en';

    function getInitialLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        if (urlLang && translations[urlLang]) return urlLang;
        const storageLang = localStorage.getItem('kingsmath_lang');
        if (storageLang && translations[storageLang]) return storageLang;
        const navLang = navigator.language.split('-')[0].toLowerCase();
        if (translations[navLang]) return navLang;
        return 'en';
    }

    function applyLanguage(langCode) {
        currentLang = langCode;
        localStorage.setItem('kingsmath_lang', langCode);
        
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('lang', langCode);
        window.history.pushState({}, '', newUrl);

        document.body.className = '';
        document.body.classList.add(`lang-${langCode}`);

        const t = translations[langCode];
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerHTML = t[key];
        });

        document.getElementById('page-title').textContent = t.title;
        document.getElementById('og-title').content = t.title + " | KingsMath.com";
        document.getElementById('meta-desc').content = t.seoDesc;
        document.getElementById('og-desc').content = t.seoDesc;
        document.getElementById('meta-keywords').content = t.seoKeywords;

        if (!isPlaying) {
            document.getElementById('btn-start').textContent = (scores.p1 === 0 && scores.p2 === 0) ? t.btnStart : t.btnRestart;
        }

        const langData = languages.find(l => l.code === langCode);
        if(langData) {
            document.getElementById('currentFlag').src = `https://flagcdn.com/w40/${langData.country}.png`;
            document.getElementById('currentLangName').textContent = langData.name;
        }
    }

    // Modal UI Handlers
    const triggerBtn = document.getElementById('langTriggerBtn');
    const modal = document.getElementById('langModal');
    const closeBtn = document.getElementById('closeModalBtn');
    const searchInput = document.getElementById('searchInput');
    const grid = document.getElementById('languageGrid');
    const noResult = document.getElementById('noResult');
    const toast = document.getElementById('toastNotification');
    const toastLangName = document.getElementById('toastLangName');
    let toastTimeout;

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            grid.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            grid.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;
                const dirAttr = lang.dir === 'rtl' ? 'dir="rtl"' : '';

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start" ${dirAttr}>
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;

                btn.addEventListener('click', () => {
                    applyLanguage(lang.code);
                    closeModal();
                    showToast(lang.name, lang.code);
                    renderLanguages(searchInput.value);
                });
                grid.appendChild(btn);
            });
        }
    }

    function openModal() {
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName, langCode) {
        const toastMsg = toastTranslations[langCode] || toastTranslations['en'];
        document.getElementById('ui-toast').textContent = toastMsg;
        toastLangName.textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    triggerBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    searchInput.addEventListener('input', (e) => renderLanguages(e.target.value));

    // 3. 기존 게임 로직 
    // =========================================
    document.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('touchmove', e => { if (e.scale !== 1 || e.touches.length > 1) e.preventDefault(); }, { passive: false });
    
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, { passive: false });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const timerFill = document.getElementById('timer-fill');
    
    const magneticItems = ['📎', '📌', '🧲', '✂️', '🍳', '🔨', '🔧', '🧷', '🔪', '🔑', '🥄', '🍴', '🗡️'];
    const nonMagneticItems = ['✏️', '📚', '📦', '🧻', '🍎', '🧸', '👕', '🧶', '🎀', '👟', '⚽', '🎈', '🖍️', '🥛', '🍃', '🧽', '🧱', '🎒', '🧴'];

    const diffSettings = {
        easy: { speedMin: 1, speedMax: 2, spawnRate: 500, gravity: 0.06 },
        normal: { speedMin: 2, speedMax: 4, spawnRate: 400, gravity: 0.1 },
        hard: { speedMin: 3, speedMax: 6, spawnRate: 100, gravity: 0.15 }
    };

    const AudioEngine = {
        ctx: null,
        init: function() {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') this.ctx.resume();
        },
        playTone: function(freq, type, duration, vol=0.3) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + duration);
        },
        playCorrect: function() { this.playTone(800, 'square', 0.1, 0.2); setTimeout(()=>this.playTone(1200, 'sine', 0.2, 0.2), 100); },
        playWrong: function() { this.playTone(200, 'sawtooth', 0.3, 0.4); }
    };

    function initPlayers() {
        players.left = [];
        players.right = [];
        const hw = canvas.width / 2;
        const startY = canvas.height - 120;
        const radius = 60;
        
        if (gameMode === 1) {
            players.left.push({ x: hw * 0.5, y: startY, radius: radius, emoji: '🧲', pointerId: null });
            players.right.push({ x: hw + hw * 0.5, y: startY, radius: radius, emoji: '🧲', pointerId: null });
        } else {
            players.left.push({ x: hw * 0.3, y: startY, radius: radius, emoji: '🧲', pointerId: null });
            players.left.push({ x: hw * 0.7, y: startY, radius: radius, emoji: '🧲', pointerId: null });
            players.right.push({ x: hw + hw * 0.3, y: startY, radius: radius, emoji: '🧲', pointerId: null });
            players.right.push({ x: hw + hw * 0.7, y: startY, radius: radius, emoji: '🧲', pointerId: null });
        }
    }

    function resizeCanvas() {
        const area = document.getElementById('game-area');
        if (area) {
            canvas.width = area.clientWidth;
            canvas.height = area.clientHeight;
            if(!isPlaying) initPlayers();
        }
    }
    window.addEventListener('resize', resizeCanvas);

    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else if (document.exitFullscreen) document.exitFullscreen();
    }

    document.getElementById('home-btn').addEventListener('click', () => {
        if (document.fullscreenElement) {
            isPlaying = false;
            clearInterval(timerId);
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('intro-msg').style.display = 'block';
            document.getElementById('mode-selector').style.display = 'flex';
            document.getElementById('diff-selector').style.display = 'flex';
            document.getElementById('result-score').style.display = 'none';
            document.getElementById('btn-start').textContent = translations[currentLang].btnStart;
            document.getElementById('langBtnContainer').style.display = 'block';

            scores = { p1: 0, p2: 0 }; updateScores();
            items = []; particles = [];
            initPlayers();
            
            if(window.playSound) window.playSound('click'); 
        } else {
            location.reload();
        }
    });

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 15;
            this.vy = (Math.random() - 0.5) * 15;
            this.life = 1.0; this.color = color;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
        draw(ctx) {
            ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI*2); ctx.fill(); ctx.restore();
        }
    }

    class FlyingItem {
        constructor(x, y, vx, vy, emoji, isMagnetic, zone) {
            this.x = x; this.y = y; 
            this.vx = vx; this.vy = vy;
            this.emoji = emoji; this.isMagnetic = isMagnetic;
            this.zone = zone; this.radius = 40;
            this.markedForDeletion = false;
            this.gravity = diffSettings[difficulty].gravity; 
        }
        update() {
            this.vy += this.gravity; 
            this.x += this.vx;
            this.y += this.vy;
            if (this.y > canvas.height + 50) this.markedForDeletion = true;
            const hw = canvas.width / 2;
            if (this.zone === 'left' && this.x > hw + 50) this.markedForDeletion = true;
            if (this.zone === 'right' && this.x < hw - 50) this.markedForDeletion = true;
        }
        draw(ctx) {
            ctx.font = '50px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5;
            ctx.fillText(this.emoji, this.x, this.y);
            ctx.shadowColor = 'transparent';
        }
    }

    function spawnItems(timestamp) {
        const rate = diffSettings[difficulty].spawnRate;
        if (timestamp - lastSpawnTime > rate) {
            const isMagnetic = Math.random() > 0.5;
            const arrayToUse = isMagnetic ? magneticItems : nonMagneticItems;
            const emoji = arrayToUse[Math.floor(Math.random() * arrayToUse.length)];
            const speedBase = Math.random() * (diffSettings[difficulty].speedMax - diffSettings[difficulty].speedMin) + diffSettings[difficulty].speedMin;
            const hw = canvas.width / 2;
            const cw = canvas.width;
            const margin = 50;
            const patternType = Math.random(); 

            if (patternType < 0.3) {
                const relativeX = margin + Math.random() * (hw - margin * 2);
                items.push(new FlyingItem(relativeX, -50, 0, speedBase, emoji, isMagnetic, 'left'));
                items.push(new FlyingItem(hw + relativeX, -50, 0, speedBase, emoji, isMagnetic, 'right'));
            } else if (patternType < 0.65) { 
                const startY = 50 + Math.random() * (canvas.height * 0.3);
                const initialVx = speedBase * 1.2; 
                const initialVy = -speedBase * 0.8; 
                items.push(new FlyingItem(-margin, startY, initialVx, initialVy, emoji, isMagnetic, 'left'));
                items.push(new FlyingItem(cw + margin, startY, -initialVx, initialVy, emoji, isMagnetic, 'right'));
            } else { 
                const startY = 50 + Math.random() * (canvas.height * 0.3);
                const initialVx = speedBase * 1.2; 
                const initialVy = -speedBase * 0.8; 
                items.push(new FlyingItem(hw - margin, startY, -initialVx, initialVy, emoji, isMagnetic, 'left'));
                items.push(new FlyingItem(hw + margin, startY, initialVx, initialVy, emoji, isMagnetic, 'right'));
            }
            lastSpawnTime = timestamp;
        }
    }

    function drawMagnets() {
        ctx.font = '80px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        players.left.forEach(mag => {
            ctx.save(); ctx.translate(mag.x, mag.y); ctx.rotate(Math.PI); 
            ctx.filter = 'saturate(200%) drop-shadow(0 0 15px rgba(255, 77, 77, 0.9))';
            ctx.fillText(mag.emoji, 0, 0); ctx.restore();
        });

        players.right.forEach(mag => {
            ctx.save(); ctx.translate(mag.x, mag.y); ctx.rotate(Math.PI); 
            ctx.filter = 'hue-rotate(220deg) saturate(300%) drop-shadow(0 0 15px rgba(77, 136, 255, 0.9))';
            ctx.fillText(mag.emoji, 0, 0); ctx.restore();
        });
    }

    function gameLoop(timestamp) {
        if (!isPlaying) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        spawnItems(timestamp);
        drawMagnets();

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.update();
            item.draw(ctx);

            let magnetList = item.zone === 'left' ? players.left : players.right;
            let hit = false;

            for (let mag of magnetList) {
                let dist = Math.hypot(item.x - mag.x, item.y - mag.y);
                if (dist < mag.radius + item.radius) { hit = true; break; }
            }

            if (hit) {
                if (item.isMagnetic) {
                    AudioEngine.playCorrect();
                    if(item.zone === 'left') scores.p1 += 100; else scores.p2 += 100;
                    for(let k=0; k<10; k++) particles.push(new Particle(item.x, item.y, '#ffd700'));
                } else {
                    AudioEngine.playWrong();
                    if(item.zone === 'left') scores.p1 = Math.max(0, scores.p1 - 50); 
                    else scores.p2 = Math.max(0, scores.p2 - 50);
                    for(let k=0; k<10; k++) particles.push(new Particle(item.x, item.y, '#ff3333'));
                    
                    const bg = item.zone === 'left' ? document.querySelector('.left-table') : document.querySelector('.right-table');
                    bg.classList.add('error-anim');
                    setTimeout(() => bg.classList.remove('error-anim'), 200);
                }
                updateScores();
                item.markedForDeletion = true;
            }
            if (item.markedForDeletion) items.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(); particles[i].draw(ctx);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function updateScores() {
        document.getElementById('score-p1').textContent = scores.p1;
        document.getElementById('score-p2').textContent = scores.p2;
    }

    function handlePointerDown(e) {
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left; const y = e.clientY - rect.top;

        const checkHit = (mags, side) => {
            for (let mag of mags) {
                if (Math.hypot(x - mag.x, y - mag.y) < mag.radius * 2) { 
                    mag.pointerId = e.pointerId;
                    updateMagnetPos(mag, side, x, y);
                    return true;
                }
            }
            return false;
        };

        if (!checkHit(players.left, 'left')) checkHit(players.right, 'right');
    }

    function handlePointerMove(e) {
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left; const y = e.clientY - rect.top;
        const moveMag = (mags, side) => {
            for (let mag of mags) { if (mag.pointerId === e.pointerId) updateMagnetPos(mag, side, x, y); }
        };
        moveMag(players.left, 'left'); moveMag(players.right, 'right');
    }

    function handlePointerUp(e) {
        const clearMag = (mags) => { for (let mag of mags) { if (mag.pointerId === e.pointerId) mag.pointerId = null; } };
        clearMag(players.left); clearMag(players.right);
    }

    function updateMagnetPos(mag, side, x, y) {
        const hw = canvas.width / 2;
        let minX = side === 'left' ? mag.radius : hw + mag.radius;
        let maxX = side === 'left' ? hw - mag.radius : canvas.width - mag.radius;
        let minY = 100; let maxY = canvas.height - mag.radius;
        mag.x = Math.max(minX, Math.min(x, maxX));
        mag.y = Math.max(minY, Math.min(y, maxY));
    }

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            gameMode = parseInt(e.target.dataset.mode);
            initPlayers();
        });
    });

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            difficulty = e.target.dataset.level;
        });
    });

    function startGame() {
        AudioEngine.init();
        if(isPlaying) return;

        scores = { p1: 0, p2: 0 }; updateScores();
        items = []; particles = [];
        timeLeft = maxTime; isPlaying = true;
        lastSpawnTime = 0;
        
        resizeCanvas();

        document.getElementById('overlay').style.display = 'none';
        document.getElementById('langBtnContainer').style.display = 'none'; 
        
        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoopId = requestAnimationFrame(gameLoop);

        clearInterval(timerId);
        timerFill.style.width = '100%';
        
        timerId = setInterval(() => {
            timeLeft--;
            timerFill.style.width = (timeLeft / maxTime) * 100 + '%';
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerId);
        if (gameLoopId) cancelAnimationFrame(gameLoopId);

        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        
        document.getElementById('intro-msg').style.display = 'none';
        document.getElementById('mode-selector').style.display = 'none';
        document.getElementById('diff-selector').style.display = 'none';
        
        const t = translations[currentLang];
        document.getElementById('btn-start').textContent = t.btnRestart;
        document.getElementById('langBtnContainer').style.display = 'block'; 
        
        const resDiv = document.getElementById('result-score');
        resDiv.style.display = 'block';
        
        let msg = "";
        if (scores.p1 > scores.p2) msg = `<span style="color:#ff4d4d; font-size:clamp(24px, 4vw, 40px); font-weight:normal;">${t.winN}</span>`;
        else if (scores.p2 > scores.p1) msg = `<span style="color:#4d88ff; font-size:clamp(24px, 4vw, 40px); font-weight:normal;">${t.winS}</span>`;
        else msg = `<span style="color:#fff; font-size:clamp(24px, 4vw, 40px); font-weight:normal;">${t.draw}</span>`;

        resDiv.innerHTML = `
            <div class="use-custom-font" style="font-size:clamp(50px, 8vw, 80px); margin-bottom:20px; font-weight:normal;">
                <span style="color:#ff4d4d">${scores.p1}</span> : <span style="color:#4d88ff">${scores.p2}</span>
            </div>
            <div class="use-custom-font">${msg}</div>
        `;
    }

    // =========================================
    // 4. 스크립트 최종 초기화 실행 
    // =========================================
    // 변수들이 모두 선언된 안전한 상태에서 마지막으로 함수를 실행시킵니다.
    applyLanguage(getInitialLanguage());
    renderLanguages();
    resizeCanvas();
</script>
</body>
