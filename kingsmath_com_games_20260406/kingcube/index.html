    function detectLanguage() {
        const params = new URLSearchParams(window.location.search);
        const urlLang = params.get('lang');
        if (urlLang && translations[urlLang]) return urlLang;

        const storedLang = localStorage.getItem('kingsmath_lang');
        if (storedLang && translations[storedLang]) return storedLang;

        const browserLang = navigator.language.toLowerCase();
        if (translations[browserLang]) return browserLang; // pt-br 대응
        const shortLang = browserLang.slice(0, 2);
        if (translations[shortLang]) return shortLang;

        return 'en';

    function setLanguage(langCode) {
        if (!translations[langCode]) return;
        currentLang = langCode;
        localStorage.setItem('kingsmath_lang', langCode);

        const newUrl = new URL(window.location);
        newUrl.searchParams.set('lang', langCode);

        updateModalUI(langCode);

            { name: t.teams[0], class: "theme-0" },
            { name: t.teams[1], class: "theme-1" },
            { name: t.teams[2], class: "theme-2" },
            { name: t.teams[3], class: "theme-3" }
        ];

        // 게임 진행 중 언어 변경 시 화면 내 UI 업데이트
        if (document.querySelector('.player-panel')) {
            players.forEach(p => {
                const header = document.querySelector(`.theme-${p.id} .player-header span:first-child`);
                if(header) header.innerText = teamConfig[p.id].name;
                const scoreSpan = document.getElementById(`score-${p.id}`);
                if(scoreSpan) scoreSpan.innerText = `${players[p.id].score}${t.scoreUnit}`;
            });
        }
    }

    /* --- 모달 UI 제어 로직 --- */
    function updateModalUI(langCode) {
        const langData = languages.find(l => l.code === langCode);
        if(langData) {
            currentFlagImg.src = `https://flagcdn.com/w40/${langData.country}.png`;
            currentLangSpan.textContent = langData.name;
        }

        const tUi = translations[langCode].ui || translations['en'].ui;
        document.getElementById('ui-title').textContent = tUi.title;
        document.getElementById('ui-desc').textContent = tUi.desc;
        document.getElementById('searchInput').placeholder = tUi.search;
        document.getElementById('ui-empty').textContent = tUi.empty;
        document.getElementById('ui-toast').textContent = tUi.toast;
        
        renderLanguages(searchInput.value);
    }

    function renderLanguages(filterText = '') {
        gridEl.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        
        const filteredLangs = languages.filter(lang => 
            lang.name.toLowerCase().includes(lowerFilter) || 
            lang.enName.toLowerCase().includes(lowerFilter) ||
            lang.code.toLowerCase().includes(lowerFilter)
        );

        if (filteredLangs.length === 0) {
            gridEl.classList.add('hidden');
            noResult.classList.remove('hidden');
            noResult.classList.add('flex');
        } else {
            gridEl.classList.remove('hidden');
            noResult.classList.add('hidden');
            noResult.classList.remove('flex');

            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected 
                    ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" 
                    : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";

                const flagUrl = `https://flagcdn.com/w40/${lang.country}.png`;
                const btn = document.createElement('div');
                btn.className = `${baseClasses} ${stateClasses}`;

                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="${flagUrl}" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}
                `;

                btn.addEventListener('click', () => {
                    setLanguage(lang.code);
                    closeModal();
                    showToast(lang.name);
                });
                gridEl.appendChild(btn);
            });
        }
    }

    function openModal() {
        langModal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => searchInput.focus(), 100);
    }

    function closeModal() {
        langModal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(langName) {
        toastLangName.textContent = langName;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    /* --------------------------------------------------------------------------------
       Existing Game Logic
       -------------------------------------------------------------------------------- */
    const GAME_DURATION = 60;
    let playerCount = 1;
    let timerValue = GAME_DURATION;
    let timerInterval = null;
    let isGameRunning = false;
    let audioCtx = null;
    let commonGeometry, commonMaterial, commonEdgeMat, commonEdgesGeo;
    let players = [];
    let playerInstances = [];

    window.onload = function() {
        // 모달 및 UI 이벤트 리스너
        triggerBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        langModal.addEventListener('click', (e) => { if (e.target === langModal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && langModal.classList.contains('active')) closeModal(); });
        searchInput.addEventListener('input', (e) => renderLanguages(e.target.value));

        // Language Init
        const initialLang = detectLanguage();
        setLanguage(initialLang);

        commonGeometry = new THREE.BoxGeometry(0.99, 0.99, 0.99);
        commonMaterial = new THREE.MeshLambertMaterial({ color: 0xffb74d });
        commonEdgeMat = new THREE.LineBasicMaterial({ color: 0x5d4037 });
        commonEdgesGeo = new THREE.EdgesGeometry(commonGeometry);
        setupEvents();
    };

    function setupEvents() {
        document.querySelectorAll('.btn-option').forEach(btn => {
            btn.onpointerdown = (e) => {
                e.preventDefault();
                document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                playerCount = parseInt(btn.dataset.value);
                playTone(800, 'sine', 0.05);
            };
        });

        document.getElementById('btn-start').onclick = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startCountdown();
        };

        document.getElementById('home-btn').onpointerdown = () => window.location.reload();
        document.getElementById('restart-btn-text').onpointerdown = () => window.location.reload();
        document.getElementById('full-btn').onpointerdown = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
    }

    function playTone(freq, type, duration, vol=0.1) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function startCountdown() {
        // [게임 시작 시 언어 선택 모달 UI 숨김 처리]
        document.getElementById('lang-ui-container').style.display = 'none';
        document.getElementById('start-screen').style.display = 'none';
        
        initGameUI();
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'flex';
        let count = 3;
        overlay.innerText = count;
        
        const countInterval = setInterval(() => {
            count--;
            if(count > 0) {
                overlay.innerText = count;
                playTone(800, 'square', 0.1);
            } else if (count === 0) {
                overlay.innerText = "GO!";
                playTone(1200, 'square', 0.4);
            } else {
                clearInterval(countInterval);
                overlay.style.display = 'none';
                startGame();
            }
        }, 1000);
    }

    function initGameUI() {
        const t = translations[currentLang];
        const layout = document.getElementById('game-layout');
        layout.innerHTML = '';
        players = []; playerInstances = [];

        for(let i=0; i<playerCount; i++) {
            players.push({ id: i, score: 0 });
            const panel = document.createElement('div');
            panel.className = `player-panel ${teamConfig[i].class}`;
            panel.innerHTML = `
                <div class="player-header"><span>${teamConfig[i].name}</span><span id="score-${i}">0${t.scoreUnit}</span></div>
                <div class="player-view-area">
                    <div class="canvas-3d-wrapper" id="canvas-${i}"></div>
                    <div class="feedback-overlay" id="fb-${i}"></div>
                </div>
                <div class="button-grid" id="grid-${i}"></div>
                <div class="panel-footer-spacer"></div>
                <div class="rank-overlay" id="rank-${i}">
                    <div style="font-size:4rem" id="medal-${i}"></div>
                    <div style="font-size:2.5rem" id="ranktxt-${i}"></div>
                    <div style="font-size:1.5rem" id="rankscore-${i}"></div>
                </div>
            `;
            layout.appendChild(panel);

            const canvasWrapper = panel.querySelector(`#canvas-${i}`);
            const grid = panel.querySelector('.button-grid');
            for(let n=1; n<=20; n++) {
                const btn = document.createElement('div');
                btn.className = 'ans-btn';
                btn.textContent = n;
                btn.onpointerdown = (e) => { 
                    e.preventDefault(); 
                    e.stopPropagation();
                    handleAnswer(i, n, btn); 
                };
                grid.appendChild(btn);
            }
            init3D(i, canvasWrapper);
        }
        animate();
    }

    function init3D(pid, container) {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 100);
        camera.position.set(6, 7, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        renderer.domElement.style.touchAction = 'none';
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(5, 10, 5); scene.add(sun);
        scene.add(new THREE.GridHelper(8, 8, 0x444444, 0x333333));

        let isDragging = false;
        let previousTouch = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousTouch = { x: e.clientX, y: e.clientY };
            renderer.domElement.setPointerCapture(e.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousTouch.x;
                const deltaY = e.clientY - previousTouch.y;
                group.rotation.y += deltaX * 0.015;
                previousTouch = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            isDragging = false;
            renderer.domElement.releasePointerCapture(e.pointerId);
        });

        playerInstances.push({ scene, camera, renderer, group, container, currentAnswer: 0 });
    }

    function animate() {
        requestAnimationFrame(animate);
        playerInstances.forEach(inst => {
            inst.renderer.render(inst.scene, inst.camera);
        });
    }

    function startGame() {
        isGameRunning = true;
        playerInstances.forEach(inst => generateProblem(inst));
        timerInterval = setInterval(() => {
            timerValue--;
            document.getElementById('timer-display').innerText = timerValue;
            
            if(timerValue <= 5 && timerValue > 0) {
                playTone(1000, 'triangle', 0.1);
            }

            if(timerValue <= 0) endGame();
        }, 1000);
    }

    function handleAnswer(pid, val, btn) {
        if(!isGameRunning) return;
        const t = translations[currentLang];
        const inst = playerInstances[pid];
        if(val === inst.currentAnswer) {
            players[pid].score += 10;
            showFeedback(pid, "⭕", "#00e676");
            playTone(900, 'sine', 0.2);
            generateProblem(inst);
        } else {
            players[pid].score = Math.max(0, players[pid].score - 5);
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 300);
            showFeedback(pid, "❌", "#ff5252");
            playTone(200, 'sawtooth', 0.3);
            generateProblem(inst);
        }
        document.getElementById(`score-${pid}`).innerText = `${players[pid].score}${t.scoreUnit}`;
    }

    function showFeedback(pid, txt, col) {
        const fb = document.getElementById(`fb-${pid}`);
        fb.innerText = txt; fb.style.color = col; fb.style.display = 'flex';
        setTimeout(() => fb.style.display = 'none', 500);
    }

    function generateProblem(inst) {
        while(inst.group.children.length > 0) inst.group.remove(inst.group.children[0]);
        inst.group.rotation.set(0, 0, 0);
        
        let map = Array(3).fill().map(() => Array(3).fill().map(() => Array(3).fill(0)));
        let count = 0, target = Math.floor(Math.random() * 10) + 5;
        
        map[1][0][1] = 1; count = 1;
        while(count < target) {
            let x = Math.floor(Math.random()*3), y = Math.floor(Math.random()*3), z = Math.floor(Math.random()*3);
            if(map[x][y][z] === 0 && (y===0 || map[x][y-1][z]===1)) {
                map[x][y][z] = 1; count++;
            }
        }
        inst.currentAnswer = count;
        for(let x=0; x<3; x++) for(let y=0; y<3; y++) for(let z=0; z<3; z++) {
            if(map[x][y][z]) {
                const mesh = new THREE.Mesh(commonGeometry, commonMaterial);
                mesh.position.set(x-1, y+0.5, z-1);
                mesh.add(new THREE.LineSegments(commonEdgesGeo, commonEdgeMat));
                inst.group.add(mesh);
            }
        }
    }

    function endGame() {
        const t = translations[currentLang];
        isGameRunning = false;
        clearInterval(timerInterval);
        document.getElementById('restart-container').style.display = 'block';
        let sorted = [...players].sort((a,b) => b.score - a.score);
        players.forEach(p => {
            const rank = sorted.findIndex(s => s.score === p.score) + 1;
            document.getElementById(`rank-${p.id}`).style.display = 'flex';
            document.getElementById(`medal-${p.id}`).innerText = rank===1? t.medal1 :rank===2? t.medal2 : t.medal3;
            document.getElementById(`ranktxt-${p.id}`).innerText = `${rank}${t.rank}`;
            document.getElementById(`rankscore-${p.id}`).innerText = `${p.score}${t.scoreUnit}`;
        });
        playTone(600, 'sine', 0.5);
    }
</script>
