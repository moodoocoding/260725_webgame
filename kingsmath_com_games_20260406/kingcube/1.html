            min-height: 0; /* Flexbox 오버플로우 방지 */

        .player-view-area:active { cursor: grabbing; }

            display: none; justify-content: center; align-items: center;
            font-size: 5rem; z-index: 20; pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);

            gameTitle: "🧊 Roi des Cubes",
            inst1: "👆 <span style='color:#FFD93D'>Touche</span> pour tourner.",

            startBtn: "Jouer! 🚀",

            headerSlogan: "Стань Королем Математики! 👑",

            selectPlayers: "👥 Игроки",
            p1: "1", p2: "2", p3: "3", p4: "4",
            startBtn: "Старт! 🚀",
            otherGame: "🎮 Другие игры",
            restartBtn: "🔄 Заново",
            teams: ["🐶Щенок", "🐱Котенок", "🐰Зайчик", "🐹Хомяк"],
            scoreUnit: "очк",

            medal1: "🥇", medal2: "🥈", medal3: "🥉"
        }

    let currentLang = 'en'; // Default
    let teamConfig = []; // Will be populated dynamically

    function detectLanguage() {
        const params = new URLSearchParams(window.location.search);
        const urlLang = params.get('lang');
        if (urlLang && translations[urlLang]) return urlLang;

        const storedLang = localStorage.getItem('kingsmath_lang');
        if (storedLang && translations[storedLang]) return storedLang;

        const browserLang = navigator.language.slice(0, 2);
        if (translations[browserLang]) return browserLang;

        return 'en';
    }

    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        localStorage.setItem('kingsmath_lang', lang);

        // URL 업데이트 (페이지 리로드 없이)
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('lang', lang);
        window.history.pushState({}, '', newUrl);

        applyLanguage(lang);
    }

    function applyLanguage(lang) {
        const t = translations[lang];

        // SEO Meta Tags
        document.title = t.title;
        document.getElementById('meta-desc').setAttribute('content', t.desc);
        document.documentElement.setAttribute('lang', lang);

        // Text Content
        document.getElementById('txt-header-slogan').innerText = t.headerSlogan;
        
        const linkHeader = document.getElementById('link-header');
        linkHeader.innerText = t.brandName;
        linkHeader.href = t.brandLink;

        document.getElementById('txt-game-title').innerText = t.gameTitle;
        document.getElementById('txt-inst-1').innerHTML = t.inst1;
        document.getElementById('txt-inst-2').innerHTML = t.inst2;
        document.getElementById('txt-select-players').innerText = t.selectPlayers;
        
        document.getElementById('txt-p1').innerText = t.p1;
        document.getElementById('txt-p2').innerText = t.p2;
        document.getElementById('txt-p3').innerText = t.p3;
        document.getElementById('txt-p4').innerText = t.p4;
        
        document.getElementById('btn-start').innerText = t.startBtn;
        
        const linkOther = document.getElementById('link-other-game');
        linkOther.innerText = t.otherGame;
        linkOther.href = t.brandLink;

        document.getElementById('restart-btn-text').innerText = t.restartBtn;

        // Team Names Update (Global Variable)
        teamConfig = [
            { name: t.teams[0], class: "theme-0" },
            { name: t.teams[1], class: "theme-1" },
            { name: t.teams[2], class: "theme-2" },
            { name: t.teams[3], class: "theme-3" }
        ];

        // 만약 게임 도중에 언어를 바꾸면 기존 UI 업데이트 (게임 중 아닐 때는 initGameUI가 처리)
        if (document.querySelector('.player-panel')) {
            // 현재 화면에 렌더링된 팀 이름들 업데이트
            players.forEach(p => {
                const header = document.querySelector(`.theme-${p.id} .player-header span:first-child`);
                if(header) header.innerText = teamConfig[p.id].name;
                
                // 점수 단위 업데이트
                const scoreSpan = document.getElementById(`score-${p.id}`);
                if(scoreSpan) scoreSpan.innerText = `${players[p.id].score}${t.scoreUnit}`;
            });
        }
    }

    /* --------------------------------------------------------------------------------
       Existing Game Logic (with minor tweaks for i18n variables)
       -------------------------------------------------------------------------------- */
    const GAME_DURATION = 60;
    let playerCount = 1;
    let timerValue = GAME_DURATION;
    let timerInterval = null;
    let isGameRunning = false;
    let audioCtx = null;
    let commonGeometry, commonMaterial, commonEdgeMat, commonEdgesGeo;
    let players = [];
    let playerInstances = [];

    // teamConfig는 setLanguage 함수에서 초기화됨

    window.onload = function() {
        // Initialize Language First
        const initialLang = detectLanguage();
        setLanguage(initialLang);

        commonGeometry = new THREE.BoxGeometry(0.99, 0.99, 0.99);
        commonMaterial = new THREE.MeshLambertMaterial({ color: 0xffb74d });
        commonEdgeMat = new THREE.LineBasicMaterial({ color: 0x5d4037 });
        commonEdgesGeo = new THREE.EdgesGeometry(commonGeometry);
        setupEvents();
    };

    function setupEvents() {
        document.querySelectorAll('.btn-option').forEach(btn => {
            btn.onpointerdown = (e) => {
                e.preventDefault();
                document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                playerCount = parseInt(btn.dataset.value);
                playTone(800, 'sine', 0.05);
            };
        });

        document.getElementById('btn-start').onclick = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startCountdown();
        };

        document.getElementById('home-btn').onpointerdown = () => window.location.reload();
        document.getElementById('restart-btn-text').onpointerdown = () => window.location.reload();
        document.getElementById('full-btn').onpointerdown = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
    }

    function playTone(freq, type, duration, vol=0.1) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function startCountdown() {
        document.getElementById('start-screen').style.display = 'none';
        initGameUI();
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'flex';
        let count = 3;
        overlay.innerText = count;
        
        const countInterval = setInterval(() => {
            count--;
            if(count > 0) {
                overlay.innerText = count;
                playTone(800, 'square', 0.1);
            } else if (count === 0) {
                overlay.innerText = "GO!";
                playTone(1200, 'square', 0.4);
            } else {
                clearInterval(countInterval);
                overlay.style.display = 'none';
                startGame();
            }
        }, 1000);
    }

    function initGameUI() {
        const t = translations[currentLang];
        const layout = document.getElementById('game-layout');
        layout.innerHTML = '';
        players = []; playerInstances = [];

        for(let i=0; i<playerCount; i++) {
            players.push({ id: i, score: 0 });
            const panel = document.createElement('div');
            panel.className = `player-panel ${teamConfig[i].class}`;
            panel.innerHTML = `
                <div class="player-header"><span>${teamConfig[i].name}</span><span id="score-${i}">0${t.scoreUnit}</span></div>
                <div class="player-view-area">
                    <div class="canvas-3d-wrapper" id="canvas-${i}"></div>
                    <div class="feedback-overlay" id="fb-${i}"></div>
                </div>
                <div class="button-grid" id="grid-${i}"></div>
                <div class="panel-footer-spacer"></div>
                <div class="rank-overlay" id="rank-${i}">
                    <div style="font-size:4rem" id="medal-${i}"></div>
                    <div style="font-size:2.5rem" id="ranktxt-${i}"></div>
                    <div style="font-size:1.5rem" id="rankscore-${i}"></div>
                </div>
            `;
            layout.appendChild(panel);

            const canvasWrapper = panel.querySelector(`#canvas-${i}`);
            const grid = panel.querySelector('.button-grid');
            for(let n=1; n<=30; n++) {
                const btn = document.createElement('div');
                btn.className = 'ans-btn';
                btn.textContent = n;
                btn.onpointerdown = (e) => { 
                    e.preventDefault(); 
                    e.stopPropagation();
                    handleAnswer(i, n, btn); 
                };
                grid.appendChild(btn);
            }
            init3D(i, canvasWrapper);
        }
        animate();
    }

    function init3D(pid, container) {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 100);
        camera.position.set(6, 7, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        renderer.domElement.style.touchAction = 'none';
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(5, 10, 5); scene.add(sun);
   // [기존] scene.add(new THREE.GridHelper(8, 8, 0x444444, 0x333333));
// [변경] 바닥을 group에 추가하여 나무와 함께 회전하게 함
const grid = new THREE.GridHelper(8, 8, 0x444444, 0x333333);
group.add(grid);
        let isDragging = false;
        let previousTouch = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousTouch = { x: e.clientX, y: e.clientY };
            renderer.domElement.setPointerCapture(e.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousTouch.x;
                const deltaY = e.clientY - previousTouch.y;
                group.rotation.y += deltaX * 0.015;
// 상하 회전 (X축 기준 회전) 추가
                group.rotation.x += deltaY * 0.015;
// 상하 회전 각도 제한 (너무 뒤집히지 않게 -Math.PI/4 ~ Math.PI/4 정도)
                // 필요 없다면 아래 줄을 삭제하세요.


                previousTouch = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            isDragging = false;
            renderer.domElement.releasePointerCapture(e.pointerId);
        });

        playerInstances.push({ scene, camera, renderer, group, container, currentAnswer: 0 });
    }

    function animate() {
        requestAnimationFrame(animate);
        playerInstances.forEach(inst => {
            inst.renderer.render(inst.scene, inst.camera);
        });
    }

    function startGame() {
        isGameRunning = true;
        playerInstances.forEach(inst => generateProblem(inst));
        timerInterval = setInterval(() => {
            timerValue--;
            document.getElementById('timer-display').innerText = timerValue;
            
            if(timerValue <= 5 && timerValue > 0) {
                playTone(1000, 'triangle', 0.1);
            }

            if(timerValue <= 0) endGame();
        }, 1000);
    }

    function handleAnswer(pid, val, btn) {
        if(!isGameRunning) return;
        const t = translations[currentLang];
        const inst = playerInstances[pid];
        if(val === inst.currentAnswer) {
            players[pid].score += 10;
            showFeedback(pid, "⭕", "#00e676");
            playTone(900, 'sine', 0.2);
            generateProblem(inst);
        } else {
            players[pid].score = Math.max(0, players[pid].score - 5);
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 300);
            showFeedback(pid, "❌", "#ff5252");
            playTone(200, 'sawtooth', 0.3);
            generateProblem(inst);
        }
        document.getElementById(`score-${pid}`).innerText = `${players[pid].score}${t.scoreUnit}`;
    }

    function showFeedback(pid, txt, col) {
        const fb = document.getElementById(`fb-${pid}`);
        fb.innerText = txt; fb.style.color = col; fb.style.display = 'flex';
        setTimeout(() => fb.style.display = 'none', 500);
    }
function generateProblem(inst) {
        while(inst.group.children.length > 0) inst.group.remove(inst.group.children[0]);
        inst.group.rotation.set(0, 0, 0);
        
        // 1. 맵 크기를 3에서 4로 확장 (4x4x4 공간)
        let map = Array(4).fill().map(() => Array(4).fill().map(() => Array(4).fill(0)));
        
        // 2. 타겟 개수 상한선을 높임 (예: 8~18개 사이)
        let count = 0, target = Math.floor(Math.random() * 22) + 8; 
        
        // 초기 시작점 설정 (중앙 근처)
        map[1][0][1] = 1; count = 1;
        
        while(count < target) {
            // 3. 랜덤 좌표 범위를 3에서 4로 변경
            let x = Math.floor(Math.random()*4), 
                y = Math.floor(Math.random()*4), 
                z = Math.floor(Math.random()*4);
            
            if(map[x][y][z] === 0 && (y===0 || map[x][y-1][z]===1)) {
                map[x][y][z] = 1; count++;
            }
        }
        
        inst.currentAnswer = count;
        
        // 4. 렌더링 루프 범위 수정 및 위치 오프셋 조정
        for(let x=0; x<4; x++) for(let y=0; y<4; y++) for(let z=0; z<4; z++) {
            if(map[x][y][z]) {
                const mesh = new THREE.Mesh(commonGeometry, commonMaterial);
                // (x-1.5) 등을 사용하여 4x4 덩어리가 가운데 오도록 조정
                mesh.position.set(x-1.5, y+0.5, z-1.5);
                mesh.add(new THREE.LineSegments(commonEdgesGeo, commonEdgeMat));
                inst.group.add(mesh);
            }
        }
    }

    function endGame() {
        const t = translations[currentLang];
        isGameRunning = false;
        clearInterval(timerInterval);
        document.getElementById('restart-container').style.display = 'block';
        let sorted = [...players].sort((a,b) => b.score - a.score);
        players.forEach(p => {
            const rank = sorted.findIndex(s => s.score === p.score) + 1;
            document.getElementById(`rank-${p.id}`).style.display = 'flex';
            document.getElementById(`medal-${p.id}`).innerText = rank===1? t.medal1 :rank===2? t.medal2 : t.medal3;
            document.getElementById(`ranktxt-${p.id}`).innerText = `${rank}${t.rank}`;
            document.getElementById(`rankscore-${p.id}`).innerText = `${p.score}${t.scoreUnit}`;
        });
        playTone(600, 'sine', 0.5);
    }
</script>
