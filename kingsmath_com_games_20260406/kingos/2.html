<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한붓그리기 킹 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2b2b2b;
            --card-bg: #3a3a3a;
            --text-color: #f0f0f0;
            --accent-color: #FFD93D;
            --btn-active: #6c5ce7;
            --p1-color: #00cec9;
            --p2-color: #fdcb6e;
            --p3-color: #ff7675;
            --p4-color: #a29bfe;
            --p5-color: #55efc4;
            --p6-color: #fab1a0;
        }

        * { 
            box-sizing: border-box; 
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0; padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Jua', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 */
        header {
            background-color: #1e1e1e;
            padding: 0 20px;
            height: 70px; 
            display: flex;
            justify-content: center; 
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
            position: relative;
            flex-shrink: 0;
        }
        .header-title {
            position: absolute;
            left: 20px;
            font-size: 1.8rem;
            color: var(--accent-color);
            text-shadow: 1px 1px 0 #000;
        }
        #timer-display {
            font-size: 2.5rem;
            color: #fff;
            background: #444;
            padding: 2px 30px;
            border-radius: 15px;
            border: 5px solid #888; 
            min-width: 120px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #timer-display.urgent {
            color: #ff7675;
            border-color: #ff7675;
            animation: blink 0.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* 공통 버튼 디자인 */
        .option-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .btn-option {
            padding: 10px 20px;
            font-size: 1.2rem;   
            border: 2px solid #555;
            background: #222;
            color: #aaa;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-option.selected {
            background-color: var(--btn-active);
            color: white;
            border-color: var(--btn-active);
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--btn-active);
        }

        #btn-start {
            width: 100%;
            padding: 15px;
            font-size: 2rem;
            background-color: #d63031;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px 0 #b32525;
            font-family: inherit;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        #btn-start:active { transform: translateY(6px); box-shadow: none; }

        .footer-link {
            color: #888;
            text-decoration: none;
            font-size: 1.2rem;
            display: inline-block;
            border-bottom: 1px solid #555;
            transition: color 0.2s;
        }
        .footer-link:hover { color: #fff; border-color: #fff; }
        .top-banner-link { color: #FFD93D; text-decoration: none; font-size: 1rem; margin-bottom: 10px; display: block; font-weight: bold; }

        /* 시작 화면 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 90vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg-color); z-index: 200;
        }
        .start-card {
            background: var(--card-bg); padding: 30px; border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 3px solid #444;
            text-align: center; max-width: 90%; width: 600px;
        }
        .start-card h1 { font-size: 3rem; color: #fff; text-shadow: 3px 3px 0 #000; margin-bottom: 20px; font-weight: normal; }
        .instruction-box {
            background: #222; padding: 20px; border-radius: 15px; text-align: left; 
            color: #ccc; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px;
            border: 2px dashed #555;
        }

        /* 플로팅 버튼 */
        #floating-btns { display: none; }
        .floating-btn {
            position: absolute; top: 85px; width: 50px; height: 50px;
            background: rgba(0,0,0,0.6); border: 2px solid #666; border-radius: 50%;
            color: white; font-size: 1.5rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 200; transition: transform 0.2s;
        }
        .floating-btn:hover { transform: scale(1.1); background: rgba(0,0,0,0.8); }
        .floating-btn:active { transform: scale(0.95); }
        #btn-home { left: 15px; }
        #btn-fs { right: 15px; }

        /* 게임 화면 컨테이너 */
        #app-container {
            flex: 1; position: relative; display: flex; flex-direction: column; width: 100%;
        }
        #game-screen {
            display: none; width: 100%; flex: 1; padding: 10px; gap: 10px;
            grid-template-rows: 1fr;
        }

        /* 플레이어 영역 */
        .player-area {
            background: #222; border: 3px solid #444; border-radius: 20px;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            min-width: 0; 
/* 👇 여기에 높이 관련 속성을 추가하세요! */
    max-height: 80vh; /* 예: 화면 높이의 80%까지만 커지도록 제한 */
    /* 또는 height: 500px; 처럼 고정 픽셀을 주셔도 됩니다. */
        }
        .player-header {
            padding: 10px; text-align: center; background: rgba(0,0,0,0.4); border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .p-name { font-size: 1.5rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-status { font-size: 1.2rem; color: #fff; background: #555; padding: 2px 10px; border-radius: 10px; white-space: nowrap; }
        
        /* 도안 이름 표시 영역 */
        .pattern-name {
            text-align: center;
            background: #333;
            color: var(--accent-color);
            padding: 6px 10px;
            font-size: 1.2rem;
            border-bottom: 2px solid #444;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 캔버스 */
        .canvas-container {
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
            background: #2a2a2a; margin: 10% 10px 5px 10px; border-radius: 15px; overflow: hidden;
        }
        canvas {
            max-width: 100%; max-height: 90vh; object-fit: contain;
            cursor: crosshair; touch-action: none;
        }

        /* 다시 그리기 버튼 */
        .redraw-btn {
            background: #444; color: #fff; border: 2px solid #666; padding: 8px 15px;
            border-radius: 10px; font-family: inherit; font-size: 1.2rem; cursor: pointer;
            margin: 5px 10px 15px 10px; align-self: center; transition: background 0.2s;
            box-shadow: 0 4px 0 #222; width: calc(100% - 20px);
        }
        .redraw-btn:active { transform: translateY(4px); box-shadow: none; }

        /* 성공 텍스트 */
        .success-overlay {
            position: absolute; top: 30%; left: 0; width: 100%;
            display: none; justify-content: center; align-items: center; 
            z-index: 10; pointer-events: none;
        }
        .success-text {
            font-size: 4rem; color: #FFD93D; font-weight: bold;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 결과 오버레이 */
        .result-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            justify-content: flex-end; padding-bottom: 30%; align-items: center; 
            z-index: 50; text-align: center;
        }
        .rank-text { font-size: 6rem; line-height: 1; margin-bottom: 10px; }
        .info-text { font-size: 1.5rem; color: var(--accent-color); }

        #global-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 500;
        }
        #countdown-txt { font-size: 8rem; color: var(--accent-color); text-shadow: 4px 4px 0 #000; }
        
        .winner-banner { font-size: 3rem; color: #FFD93D; margin-bottom: 30px; font-weight: bold; text-shadow: 2px 2px 4px #000;}
        .restart-btn {
            padding: 15px 40px; font-size: 2rem; border-radius: 50px; border: none;
            background: var(--btn-active); color: white; cursor: pointer; font-family: inherit;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* 하단 랭킹 바 */
        .ranking-bar {
            width: 100%; height: 40px; background: #111; border-top: 2px solid #333;
            display: none; align-items: center; justify-content: center; gap: 20px;
            color: #fff; font-size: 1.2rem; flex-shrink: 0; overflow-x: auto; white-space: nowrap; padding: 0 10px;
        }

        /* 플레이어 테마 색상 */
        .theme-0 .p-name { color: var(--p1-color); } .theme-0 { border-color: var(--p1-color); }
        .theme-1 .p-name { color: var(--p2-color); } .theme-1 { border-color: var(--p2-color); }
        .theme-2 .p-name { color: var(--p3-color); } .theme-2 { border-color: var(--p3-color); }
        .theme-3 .p-name { color: var(--p4-color); } .theme-3 { border-color: var(--p4-color); }
        .theme-4 .p-name { color: var(--p5-color); } .theme-4 { border-color: var(--p5-color); }
        .theme-5 .p-name { color: var(--p6-color); } .theme-5 { border-color: var(--p6-color); }

        @keyframes popIn { 
            0% { transform: scale(0); opacity: 0; } 
            70% { transform: scale(1.2); opacity: 1; } 
            100% { transform: scale(1); opacity: 1; } 
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">한붓그리기 킹 👑</div>
        <div id="timer-display">60</div>
    </header>

    <div id="app-container">
        <div id="start-screen">
            <div class="start-card">
                <a href="/" class="top-banner-link" target="_self">선생님이 만든, 안전한 수학 놀이터 - 킹수학.com</a>
                <h1>한붓그리기 킹 👑</h1>
                
                <div class="instruction-box">
                    <b style="color:#fff; font-size:1.2rem;">📢 게임 설명 및 규칙</b><br><br>
                    ✨ 모든 플레이어는 <b>정확히 동일한 3개의 문제</b>를 받습니다.<br>
                    ✨ 화면에 나타난 <b>붓(🖌️) 위치</b>에서 드래그를 시작하세요.<br>
                    ✨ 막혔다면 아래 <b>[다시 그리기]</b> 버튼을 누르면 됩니다.<br>
                    ✨ <b>1분 이내</b>에 3개의 한붓그리기를 가장 먼저 완성한 사람이 우승합니다!
                </div>
                
                <p style="color:#aaa; margin-bottom:5px;">인원수 선택 (1~6인)</p>
                <div class="option-group" id="player-options">
                    <div class="btn-option selected" onclick="selectPlayer(1)">1인</div>
                    <div class="btn-option" onclick="selectPlayer(2)">2인</div>
                    <div class="btn-option" onclick="selectPlayer(3)">3인</div>
                    <div class="btn-option" onclick="selectPlayer(4)">4인</div>
                    <div class="btn-option" onclick="selectPlayer(5)">5인</div>
                    <div class="btn-option" onclick="selectPlayer(6)">6인</div>
                </div>

                <p style="color:#aaa; margin-bottom:5px;">난이도 선택</p>
                <div class="option-group" id="difficulty-options">
                    <div class="btn-option" onclick="selectDifficulty('easy')">쉬움</div>
                    <div class="btn-option" onclick="selectDifficulty('normal')">보통</div>
                    <div class="btn-option" onclick="selectDifficulty('hard')">어려움</div>
                    <div class="btn-option selected" onclick="selectDifficulty('random')">랜덤</div>
                </div>

                <button id="btn-start" onclick="initGame()">게임 시작! 🚀</button>
                <a href="/" class="footer-link" target="_self">🎮 다른 게임 고르기</a>
            </div>
        </div>
<div class="ranking-bar" id="ranking-bar"></div>
        <div id="game-screen"></div>

        

        <div id="global-overlay">
            <div id="countdown-txt">3</div>
        </div>

        <div id="floating-btns">
            <div id="btn-home" class="floating-btn" onclick="goHome()" title="처음으로">🏠</div>
            <div id="btn-fs" class="floating-btn" onclick="toggleFullScreen()" title="전체화면">⛶</div>
        </div>
    </div>

    <script>
        // 우클릭, 더블클릭 방지
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dblclick', e => e.preventDefault());

        // --- 오디오 시스템 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now); 
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'correct') { 
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.setValueAtTime(659.25, now + 0.1); 
                osc.frequency.setValueAtTime(783.99, now + 0.2); 
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(783.99, now + 0.1);
                osc.frequency.setValueAtTime(1046.50, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
            osc.connect(gain);
            gain.connect(audioCtx.destination);
        }

        // 전체화면 및 홈 버튼
        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }
        function goHome() {
            clearInterval(timerInterval);
            clearInterval(rankInterval);
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('ranking-bar').style.display = 'none';
            document.getElementById('global-overlay').style.display = 'none';
            document.getElementById('floating-btns').style.display = 'none';
        }
// --- 도안 생성 ---
        let easyLevels = [], normalLevels = [], hardLevels = [];
        
     function generateAllPatterns() {
            let patterns = [];
            let count = 1;

            // 🌟 1. [핵심 추가] 거리가 아주 가까운(겹치는) 점들을 하나의 점으로 합칩니다.
            function mergeNodesAndEdges(nodes, edges) {
                let uniqueNodes = [];
                let indexMap = {};
                const MIN_DIST = 0.15; // 약 30px 이상의 거리 확보 (정규화 좌표계 기준)
                
                for(let i = 0; i < nodes.length; i++) {
                    let found = -1;
                    for(let j = 0; j < uniqueNodes.length; j++) {
                        let dx = nodes[i].x - uniqueNodes[j].x;
                        let dy = nodes[i].y - uniqueNodes[j].y;
                        if(Math.sqrt(dx*dx + dy*dy) < MIN_DIST) {
                            found = j;
                            break;
                        }
                    }
                    if(found !== -1) {
                        indexMap[i] = found; 
                    } else {
                        indexMap[i] = uniqueNodes.length;
                        uniqueNodes.push(nodes[i]);
                    }
                }
                
                // 간선(선)도 합쳐진 새로운 점 번호에 맞게 업데이트 (자기 자신으로 가는 간선 제거)
                let mappedEdges = edges.map(e => [indexMap[e[0]], indexMap[e[1]]]).filter(e => e[0] !== e[1]);
                return { newNodes: uniqueNodes, newEdges: mappedEdges };
            }

            // 🌟 2. 겹치는 선 제거 (이전 유지)
            function removeDuplicateEdges(edges) {
                let unique = [];
                edges.forEach(e => {
                    let u = e[0], v = e[1];
                    let exists = unique.some(ext => 
                        (ext[0] === u && ext[1] === v) || 
                        (ext[0] === v && ext[1] === u)
                    );
                    if (!exists) unique.push(e);
                });
                return unique;
            }

            function add(fn, ...args) {
                let name = `도안 ${count}`;
                if(fn === poly) name = `${args[0]}각형`;
                if(fn === star) name = `${args[0]}각 별 (${args[1]}스텝)`;
                if(fn === polygonStar) name = `복합 ${args[0]}각 별`;
                if(fn === flower) name = `${args[0]}잎 ${args[1]}각 꽃`;
                if(fn === complete) name = `완전 그래프 K${args[0]}`;

                let p = fn(...args, name);
                
                // 🌟 3. 점과 선을 완벽하게 병합하고 정리합니다.
                let merged = mergeNodesAndEdges(p.nodes, p.edges);
                p.nodes = merged.newNodes;
                p.edges = removeDuplicateEdges(merged.newEdges);

                p.degrees = new Array(p.nodes.length).fill(0);
                p.edges.forEach(edge => { p.degrees[edge[0]]++; p.degrees[edge[1]]++; });
                p.oddCount = p.degrees.filter(d => d % 2 !== 0).length;
                p.totalEdges = p.edges.length;
                patterns.push(p);
                count++;
            }

            // --- 기존 생성 로직 동일 ---
            for(let i = 3; i <= 10; i++) add(poly, i);
            const starArgs = [[5,2], [7,2], [7,3], [8,3], [9,2], [9,4], [10,3], [11,3], [11,4], [12,5]];
            for(let arg of starArgs) add(star, arg[0], arg[1]);
            const polyStarArgs = [[5,2], [6,2], [7,2], [7,3], [8,2], [8,3], [9,2], [9,3], [9,4], [10,3]];
            for(let arg of polyStarArgs) add(polygonStar, arg[0], arg[1]);
            const flowerArgs = [[3,3], [4,3], [5,3], [6,3], [8,3], [10,3], [3,4], [4,4], [5,4], [6,4]];
            for(let arg of flowerArgs) add(flower, arg[0], arg[1]);
            add(complete, 5); add(complete, 7); add(complete, 9);

            function addCustom(obj) {
                let merged = mergeNodesAndEdges(obj.nodes, obj.edges);
                obj.nodes = merged.newNodes;
                obj.edges = removeDuplicateEdges(merged.newEdges);

                obj.degrees = new Array(obj.nodes.length).fill(0);
                obj.edges.forEach(edge => { obj.degrees[edge[0]]++; obj.degrees[edge[1]]++; });
                obj.oddCount = obj.degrees.filter(d => d % 2 !== 0).length;
                obj.totalEdges = obj.edges.length;
                patterns.push(obj);
            }
            
            addCustom({
                name: "클래식: 엑스 집",
                nodes: [{x:-0.6, y:0.4}, {x:0.6, y:0.4}, {x:0.6, y:-0.4}, {x:-0.6, y:-0.4}, {x:0, y:-0.9}],
                edges: [[0,1], [1,2], [2,3], [3,0], [0,2], [1,3], [3,4], [2,4]]
            });
            addCustom({
                name: "클래식: 편지봉투",
                nodes: [{x:-0.7, y:0.5}, {x:0.7, y:0.5}, {x:0.7, y:-0.3}, {x:-0.7, y:-0.3}, {x:0, y:-0.7}],
                edges: [[0,1], [1,2], [2,3], [3,0], [0,2], [1,3], [2,4], [3,4]]
            });

            // 필터 추가: 2. 교차하는 선은 최소한 각도가 20도 이상 되게 필터링
            patterns = patterns.filter(p => {
                const MIN_ANGLE_RAD = 20 * (Math.PI / 180);
                for(let i=0; i<p.edges.length; i++) {
                    for(let j=i+1; j<p.edges.length; j++) {
                        let e1 = p.edges[i], e2 = p.edges[j];
                        let n1 = p.nodes[e1[0]], n2 = p.nodes[e1[1]];
                        let n3 = p.nodes[e2[0]], n4 = p.nodes[e2[1]];

                        let dx1 = n2.x - n1.x, dy1 = n2.y - n1.y;
                        let dx2 = n4.x - n3.x, dy2 = n4.y - n3.y;
                        
                        let len1 = Math.sqrt(dx1*dx1 + dy1*dy1);
                        let len2 = Math.sqrt(dx2*dx2 + dy2*dy2);
                        if (len1 === 0 || len2 === 0) continue;
                        
                        let cosTheta = (dx1*dx2 + dy1*dy2) / (len1 * len2);
                        cosTheta = Math.max(-1, Math.min(1, cosTheta)); 
                        let angle = Math.acos(cosTheta);
                        if (angle > Math.PI / 2) angle = Math.PI - angle; 
                        
                        if (angle > 0.01 && angle < MIN_ANGLE_RAD) {
                            if (e1[0] === e2[0] || e1[0] === e2[1] || e1[1] === e2[0] || e1[1] === e2[1]) {
                                return false; 
                            } else {
                                let det = dx1 * dy2 - dy1 * dx2;
                                if (Math.abs(det) > 0.001) {
                                    let t = ((n3.x - n1.x) * dy2 - (n3.y - n1.y) * dx2) / det;
                                    let u = -((n1.x - n3.x) * dy1 - (n1.y - n3.y) * dx1) / det;
                                    if (t > 0.01 && t < 0.99 && u > 0.01 && u < 0.99) {
                                        return false;
                                    }
                                }
                            }
                        }
                    }
                }
                return true;
            });

            // 필터 및 정렬 (불가능한 도안은 여기서 전부 걸러집니다!)
            patterns = patterns.filter(p => p.oddCount === 0 || p.oddCount === 2);
            patterns.sort((a, b) => a.edges.length - b.edges.length);

            if (patterns.length > 0) patterns.shift();
            if (patterns.length > 0) patterns.pop();

            const third = Math.floor(patterns.length / 3);
            easyLevels = patterns.slice(0, third);
            normalLevels = patterns.slice(third, third * 2);
            hardLevels = patterns.slice(third * 2);
        }

        // --- 도형 생성 세부 함수들 ---
        function poly(n, title) {
            let nodes = [], edges = [];
            for(let i=0; i<n; i++) {
                let a = -Math.PI/2 + (Math.PI*2*i/n);
                nodes.push({x: Math.cos(a), y: Math.sin(a)});
                edges.push([i, (i+1)%n]);
            }
            if (n === 4) edges.push([0, 2]);
            else if (n === 5) { edges.push([0, 2]); edges.push([0, 3]); }
            else if (n === 6) { edges.push([0, 2]); edges.push([2, 4]); edges.push([4, 0]); }
            else if (n === 7) { edges.push([0, 2]); edges.push([2, 4]); edges.push([4, 6]); }
            else if (n === 8) { edges.push([0, 3]); edges.push([3, 6]); edges.push([6, 1]); edges.push([1, 4]); }
            else if (n > 8) { edges.push([0, 3]); edges.push([1, 4]); edges.push([2, 5]); }
            return {name: title, nodes, edges};
        }

        function star(n, step, title) {
            let nodes = [], edges = [];
            for(let i=0; i<n; i++) {
                let a = -Math.PI/2 + (Math.PI*2*i/n);
                nodes.push({x: Math.cos(a), y: Math.sin(a)});
                edges.push([i, (i+step)%n]);
            }
            return {name: title, nodes, edges};
        }

        function polygonStar(n, step, title) {
            let p = poly(n, title);
            for(let i=0; i<n; i++) p.edges.push([i, (i+step)%n]);
            return p;
        }

        function flower(petals, sides, title) {
            let nodes = [{x:0, y:0}];
            let edges = [];
            let r = 0.8;
            for(let p=0; p<petals; p++) {
                let angleOffset = (Math.PI*2*p/petals);
                let startIdx = nodes.length;
                for(let i=1; i<sides; i++) {
                    let localAngle = (Math.PI*2*i/sides);
                    let lx = r * Math.sin(localAngle);
                    let ly = r - r * Math.cos(localAngle);
                    let rx = lx * Math.cos(angleOffset) - ly * Math.sin(angleOffset);
                    let ry = lx * Math.sin(angleOffset) + ly * Math.cos(angleOffset);
                    nodes.push({x: rx, y: ry});
                }
                edges.push([0, startIdx]);
                for(let i=1; i<sides-1; i++) edges.push([startIdx + i - 1, startIdx + i]);
                edges.push([startIdx + sides - 2, 0]);
            }
            return {name: title, nodes, edges};
        }

        function complete(n, title) {
            let nodes = [], edges = [];
            for(let i=0; i<n; i++) {
                let a = -Math.PI/2 + (Math.PI*2*i/n);
                nodes.push({x: Math.cos(a), y: Math.sin(a)});
            }
            for(let i=0; i<n; i++) {
                for(let j=i+1; j<n; j++) edges.push([i, j]);
            }
            return {name: title, nodes, edges};
        }

        let playerCount = 1;
        let difficultyMode = 'random';
        let gameTime = 60;
        let timerInterval, rankInterval;
        let players = [];
        const themeColors = ['#00cec9', '#fdcb6e', '#ff7675', '#a29bfe', '#55efc4', '#fab1a0'];
        const animalIcons = ['🐶', '🐱', '🐰', '🐹', '🦊', '🐼'];
        const animalNames = ['강아지', '고양이', '토끼', '햄스터', '여우', '판다'];

        function selectPlayer(num) {
            playerCount = num;
            document.querySelectorAll('#player-options .btn-option').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            playSound('click');
        }
        function selectDifficulty(mode) {
            difficultyMode = mode;
            document.querySelectorAll('#difficulty-options .btn-option').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            playSound('click');
        }
        function getRandomLevel(pool) {
            return JSON.parse(JSON.stringify(pool[Math.floor(Math.random() * pool.length)]));
        }

        function initGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('floating-btns').style.display = 'block';
            generateAllPatterns();

            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.display = 'grid';
            gameScreen.innerHTML = '';
            gameScreen.style.gridTemplateColumns = `repeat(${Math.max(4, playerCount)}, 1fr)`;

            let commonStages = [];
            if(difficultyMode === 'random') {
                commonStages = [getRandomLevel(easyLevels), getRandomLevel(normalLevels), getRandomLevel(hardLevels)];
            } else if(difficultyMode === 'easy') {
                commonStages = [getRandomLevel(easyLevels), getRandomLevel(easyLevels), getRandomLevel(easyLevels)];
            } else if(difficultyMode === 'normal') {
                commonStages = [getRandomLevel(normalLevels), getRandomLevel(normalLevels), getRandomLevel(normalLevels)];
            } else if(difficultyMode === 'hard') {
                commonStages = [getRandomLevel(hardLevels), getRandomLevel(hardLevels), getRandomLevel(hardLevels)];
            }

            commonStages.forEach(stage => {
                let oddNodes = [];
                for(let i=0; i<stage.degrees.length; i++) {
                    if(stage.degrees[i] % 2 !== 0) oddNodes.push(i);
                }
                if(oddNodes.length === 2) stage.startNode = oddNodes[Math.floor(Math.random() * 2)];
                else stage.startNode = Math.floor(Math.random() * stage.nodes.length);
            });

            players = [];
            for(let i=0; i<playerCount; i++) {
                let pStages = JSON.parse(JSON.stringify(commonStages));
                players.push({
                    id: i,
                    stages: pStages,
                    currentStageIdx: 0,
                    totalLinesDrawn: 0,
                    finishTime: null,
                    isDone: false,
                    isPaused: false,
                    visitedEdges: [],
                    currentPath: [],
                    lastNodeIndex: -1,
                    isDrawing: false,
                    brushPos: {x:0, y:0}
                });
                createPlayerUI(i);
                setupCanvas(i);
                // 첫 도안 이름 업데이트
                document.getElementById(`pattern-name-${i}`).innerText = pStages[0].name;
            }

            document.getElementById('ranking-bar').style.display = 'flex';
            startCountdown();
        }

function createPlayerUI(idx) {
            const container = document.getElementById('game-screen');
            const div = document.createElement('div');
            div.className = `player-area theme-${idx}`;
            div.id = `player-${idx}`;

            div.innerHTML = `
                <div class="player-header">
                    <span class="p-name">${animalIcons[idx]} ${animalNames[idx]}</span>
                    <span class="p-status" id="status-${idx}">0 / 3 완료</span>
                </div>
                <div class="pattern-name" id="pattern-name-${idx}">도안 이름</div>
                
                <div class="success-overlay" id="success-${idx}">
                    <div class="success-text">성공! 🎉</div>
                </div>

                <div class="canvas-container">
                    <canvas id="canvas-${idx}"></canvas>
                </div>
                
                <button class="redraw-btn" onpointerdown="resetDrawing(${idx})">다시 그리기 🔄</button>

                <div class="result-overlay" id="result-${idx}">
                    <div class="rank-text" id="rank-${idx}"></div>
                    <div class="info-text" id="info-${idx}"></div>
                </div>
            `;
            container.appendChild(div);
        }

        function setupCanvas(idx) {
            const canvas = document.getElementById(`canvas-${idx}`);
            const container = canvas.parentElement;
            
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            canvas.addEventListener('pointerdown', (e) => handlePointerDown(e, idx));
            canvas.addEventListener('pointermove', (e) => handlePointerMove(e, idx));
            window.addEventListener('pointerup', (e) => handlePointerUp(e, idx));
            
            window.addEventListener('resize', () => {
                if(canvas.parentElement) {
                    canvas.width = canvas.parentElement.clientWidth;
                    canvas.height = canvas.parentElement.clientHeight;
                }
            });
        }

        function resetDrawing(idx) {
            const p = players[idx];
            if(p.isDone || p.isPaused || gameTime <= 0) return;
            
            p.visitedEdges = [];
            p.currentPath = [];
            p.lastNodeIndex = -1;
            p.isDrawing = false;
            playSound('click');
        }

        function startCountdown() {
            const overlay = document.getElementById('global-overlay');
            overlay.innerHTML = '<div id="countdown-txt">3</div>';
            overlay.style.display = 'flex';
            overlay.style.background = 'rgba(0,0,0,0.9)';
            
            let count = 3;
            playSound('tick'); 
            let iv = setInterval(() => {
                count--;
                if(count > 0) {
                    document.getElementById('countdown-txt').innerText = count;
                    playSound('tick');
                } else if(count === 0) {
                    document.getElementById('countdown-txt').innerText = "START!";
                    playSound('win');
                } else {
                    clearInterval(iv);
                    overlay.style.display = 'none';
                    startGameLoop();
                }
            }, 1000);
        }

        function startGameLoop() {
            gameTime = 60;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                gameTime--;
                updateTimerDisplay();
                if(gameTime <= 5 && gameTime > 0) playSound('tick');
                if(gameTime <= 0) endGame();
            }, 1000);

            rankInterval = setInterval(updateRankingBar, 1000);
            requestAnimationFrame(renderLoop);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = gameTime;
            if(gameTime <= 10) timerEl.classList.add('urgent');
            else timerEl.classList.remove('urgent');
        }

        function getTransform(canvas, pattern) {
            const pad = 30;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for(let n of pattern.nodes) {
                if(n.x < minX) minX = n.x; if(n.x > maxX) maxX = n.x;
                if(n.y < minY) minY = n.y; if(n.y > maxY) maxY = n.y;
            }
            let rangeX = maxX - minX || 1; let rangeY = maxY - minY || 1;
            let scale = Math.min((canvas.width - pad*2)/rangeX, (canvas.height - pad*2)/rangeY);
            let cx = (minX + maxX) / 2; let cy = (minY + maxY) / 2;
            
            return {
                tx: (x) => canvas.width/2 + (x - cx) * scale,
                ty: (y) => canvas.height/2 + (y - cy) * scale,
                nodeRadius: Math.max(4, Math.min(canvas.width, canvas.height) * 0.025)
            };
        }

        function handlePointerDown(e, idx) {
            if(gameTime <= 0) return;
            const p = players[idx];
            if(p.isDone || p.isPaused) return;

            const canvas = document.getElementById(`canvas-${idx}`);
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const stage = p.stages[p.currentStageIdx];
            const t = getTransform(canvas, stage);

            let clickedNode = -1;
            for(let i=0; i<stage.nodes.length; i++) {
                let nx = t.tx(stage.nodes[i].x);
                let ny = t.ty(stage.nodes[i].y);
                if(Math.sqrt((x-nx)**2 + (y-ny)**2) < t.nodeRadius * 2.5) {
                    clickedNode = i; break;
                }
            }

            if(clickedNode !== -1) {
                if(p.currentPath.length === 0) {
                    if(clickedNode === stage.startNode) {
                        p.isDrawing = true;
                        p.lastNodeIndex = clickedNode;
                        p.currentPath.push(clickedNode);
                        p.brushPos = {x, y};
                        canvas.setPointerCapture(e.pointerId);
                    }
                } else if(clickedNode === p.lastNodeIndex) {
                    p.isDrawing = true;
                    p.brushPos = {x, y};
                    canvas.setPointerCapture(e.pointerId);
                }
            }
        }

        function handlePointerMove(e, idx) {
            const p = players[idx];
            if(!p.isDrawing || p.isDone || p.isPaused) return;

            const canvas = document.getElementById(`canvas-${idx}`);
            const rect = canvas.getBoundingClientRect();
            p.brushPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

            const stage = p.stages[p.currentStageIdx];
            const t = getTransform(canvas, stage);

            let hoveredNode = -1;
            for(let i=0; i<stage.nodes.length; i++) {
                let nx = t.tx(stage.nodes[i].x);
                let ny = t.ty(stage.nodes[i].y);
                if(Math.sqrt((p.brushPos.x-nx)**2 + (p.brushPos.y-ny)**2) < t.nodeRadius * 2.5) {
                    hoveredNode = i; break;
                }
            }

            if(hoveredNode !== -1 && hoveredNode !== p.lastNodeIndex) {
                let edgeIdx = stage.edges.findIndex(edge => 
                    (edge[0] === p.lastNodeIndex && edge[1] === hoveredNode) ||
                    (edge[1] === p.lastNodeIndex && edge[0] === hoveredNode)
                );

                if(edgeIdx !== -1 && !p.visitedEdges.includes(edgeIdx)) {
                    p.visitedEdges.push(edgeIdx);
                    p.currentPath.push(hoveredNode);
                    p.lastNodeIndex = hoveredNode;
                    p.totalLinesDrawn++;

                    checkWin(idx);
                }
            }
        }

        function handlePointerUp(e, idx) {
            const p = players[idx];
            if(p && p.isDrawing) {
                p.isDrawing = false;
                const canvas = document.getElementById(`canvas-${idx}`);
                if(canvas.hasPointerCapture(e.pointerId)) {
                    canvas.releasePointerCapture(e.pointerId);
                }
            }
        }

        function checkWin(idx) {
            const p = players[idx];
            const stage = p.stages[p.currentStageIdx];
            
            if(p.visitedEdges.length === stage.totalEdges) {
                p.isDrawing = false;
                p.isPaused = true;
                playSound('correct'); 
                
                const successOverlay = document.getElementById(`success-${idx}`);
                successOverlay.style.display = 'flex';
                
                setTimeout(() => {
                    successOverlay.style.display = 'none';
                    if(gameTime <= 0) return; 

                    p.currentStageIdx++;
                    document.getElementById(`status-${idx}`).innerText = `${p.currentStageIdx} / 3 완료`;
                    
                    if(p.currentStageIdx >= 3) {
                        p.isDone = true;
                        p.finishTime = 60 - gameTime;
                        showPlayerDone(idx);
                        checkAllDone();
                    } else {
                        // 다음 도안 이름 업데이트
                        document.getElementById(`pattern-name-${idx}`).innerText = p.stages[p.currentStageIdx].name;
                        
                        p.visitedEdges = [];
                        p.currentPath = [];
                        p.lastNodeIndex = -1;
                        p.isPaused = false; 
                    }
                }, 3000);
            }
        }

        function showPlayerDone(idx) {
            const overlay = document.getElementById(`result-${idx}`);
            overlay.style.display = 'flex';
            document.getElementById(`rank-${idx}`).innerHTML = `<span style="font-size:3rem">CLEAR!</span>`;
            document.getElementById(`info-${idx}`).innerText = `기록: ${players[idx].finishTime}초`;
        }

        function checkAllDone() {
            if(players.every(p => p.isDone)) endGame();
        }

        function renderLoop() {
            if(gameTime < 0) return;

            for(let i=0; i<playerCount; i++) {
                const p = players[i];
                if(p.isDone) continue;

                const canvas = document.getElementById(`canvas-${i}`);
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const stage = p.stages[p.currentStageIdx];
                if(!stage) continue;

                const t = getTransform(canvas, stage);

                ctx.lineWidth = 4.8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                stage.edges.forEach((edge, eIdx) => {
                    if(!p.visitedEdges.includes(eIdx)) {
                        ctx.beginPath();
                        ctx.moveTo(t.tx(stage.nodes[edge[0]].x), t.ty(stage.nodes[edge[0]].y));
                        ctx.lineTo(t.tx(stage.nodes[edge[1]].x), t.ty(stage.nodes[edge[1]].y));
                        ctx.strokeStyle = '#555';
                        ctx.stroke();
                    }
                });

                for(let nIdx=0; nIdx<stage.nodes.length; nIdx++) {
                    const node = stage.nodes[nIdx];
                    const isStartNode = (nIdx === stage.startNode);
                    const isCurrent = (nIdx === p.lastNodeIndex);

                    ctx.beginPath();
                    if (isStartNode && p.currentPath.length === 0) {
                        ctx.arc(t.tx(node.x), t.ty(node.y), t.nodeRadius * 1.5, 0, Math.PI*2);
                        ctx.fillStyle = '#f59e0b';
                    } else if (isCurrent) {
                        ctx.arc(t.tx(node.x), t.ty(node.y), t.nodeRadius * 1.5, 0, Math.PI*2);
                        ctx.fillStyle = themeColors[i];
                    } else {
                        ctx.arc(t.tx(node.x), t.ty(node.y), t.nodeRadius, 0, Math.PI*2);
                        ctx.fillStyle = '#a29bfe';
                    }
                    ctx.fill();
                    ctx.lineWidth = 1.8;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }

                ctx.lineWidth = 4.8;
                stage.edges.forEach((edge, eIdx) => {
                    if(p.visitedEdges.includes(eIdx)) {
                        ctx.beginPath();
                        ctx.moveTo(t.tx(stage.nodes[edge[0]].x), t.ty(stage.nodes[edge[0]].y));
                        ctx.lineTo(t.tx(stage.nodes[edge[1]].x), t.ty(stage.nodes[edge[1]].y));
                        ctx.strokeStyle = themeColors[i];
                        ctx.stroke();
                    }
                });

                if(p.isDrawing && p.lastNodeIndex !== -1 && !p.isPaused) {
                    ctx.beginPath();
                    ctx.moveTo(t.tx(stage.nodes[p.lastNodeIndex].x), t.ty(stage.nodes[p.lastNodeIndex].y));
                    ctx.lineTo(p.brushPos.x, p.brushPos.y);
                    ctx.strokeStyle = themeColors[i] + '80';
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                if(!p.isPaused) {
                    let bx, by;
                    if(p.currentPath.length === 0) {
                        bx = t.tx(stage.nodes[stage.startNode].x);
                        by = t.ty(stage.nodes[stage.startNode].y);
                    } else if(p.lastNodeIndex !== -1) {
                        bx = p.isDrawing ? p.brushPos.x : t.tx(stage.nodes[p.lastNodeIndex].x);
                        by = p.isDrawing ? p.brushPos.y : t.ty(stage.nodes[p.lastNodeIndex].y);
                    }

                    if(bx !== undefined && by !== undefined) {
                        ctx.font = `${t.nodeRadius * 2.5}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🖌️', bx + 15, by - 15);
                    }
                }
            }
            requestAnimationFrame(renderLoop);
        }

        function updateRankingBar() {
            const bar = document.getElementById('ranking-bar');
            let sorted = [...players].sort((a, b) => {
                if(b.currentStageIdx !== a.currentStageIdx) return b.currentStageIdx - a.currentStageIdx;
                return b.totalLinesDrawn - a.totalLinesDrawn;
            });

            let html = '';
            for(let i=0; i<sorted.length; i++) {
                html += `<span>${i+1}위:</span> ${animalIcons[sorted[i].id]} (스테이지${sorted[i].currentStageIdx}/선${sorted[i].totalLinesDrawn}) `;
                if(i < sorted.length -1) html += ' &nbsp;|&nbsp; ';
            }
            bar.innerHTML = html;
        }

        function endGame() {
            clearInterval(timerInterval);
            clearInterval(rankInterval);
            playSound('win');

            let sorted = [...players].sort((a, b) => {
                if(a.isDone && b.isDone) return a.finishTime - b.finishTime; 
                if(a.isDone) return -1;
                if(b.isDone) return 1;
                if(b.currentStageIdx !== a.currentStageIdx) return b.currentStageIdx - a.currentStageIdx;
                return b.totalLinesDrawn - a.totalLinesDrawn;
            });

            players.forEach(p => {
                const rank = sorted.findIndex(s => s.id === p.id) + 1;
                const overlay = document.getElementById(`result-${p.id}`);
                const rankText = document.getElementById(`rank-${p.id}`);
                const infoText = document.getElementById(`info-${p.id}`);
                
                let rankHtml = '';
                if(rank === 1) rankHtml = '🥇';
                else if(rank === 2) rankHtml = '🥈';
                else if(rank === 3) rankHtml = '🥉';
                else if(rank === 4) rankHtml = '<span style="font-size:0.7em;">4️⃣</span>';
                else if(rank === 5) rankHtml = '<span style="font-size:0.7em;">5️⃣</span>';
                else if(rank === 6) rankHtml = '<span style="font-size:0.7em;">6️⃣</span>';

                overlay.style.display = 'flex';
                rankText.innerHTML = rankHtml;
                
                if(p.isDone) infoText.innerText = `기록: ${p.finishTime}초`;
                else infoText.innerText = `${p.currentStageIdx}스테이지 / 선 ${p.totalLinesDrawn}개`;
            });

            const globalOverlay = document.getElementById('global-overlay');
            globalOverlay.style.display = 'flex';
            globalOverlay.style.background = 'rgba(0,0,0,0.4)'; 
            globalOverlay.innerHTML = `
                <div style="position:absolute; top: 15%; background:var(--card-bg); padding:30px 50px; border-radius:30px; text-align:center; border:3px solid #555; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
                    <div class="winner-banner">👑 최종 우승: ${animalIcons[sorted[0].id]} ${animalNames[sorted[0].id]}</div>
                    <button class="restart-btn" onclick="goHome()">처음으로 돌아가기 🔄</button>
                </div>
            `;
        }
    </script>
</body>
