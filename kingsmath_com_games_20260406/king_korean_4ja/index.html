/* Feedback Overlay */

/* Final Status Pop */
.final-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; box-sizing: border-box; background: rgba(0,0,0,0.9); padding: 15px 10px; border-radius: 15px; text-align: center; z-index: 50; border: 2px solid var(--theme); display: none; animation: popIn 0.5s; word-break: keep-all; }
.final-status h3 { margin: 0; font-size: 1.2rem; color: #fff; }
.final-status p { margin: 5px 0 0 0; font-size: 1.8rem; color: var(--theme); }

/* Countdown */
#countdownLayer { position: fixed; inset: 0; background: #000000; z-index: 2000; display: none; align-items: center; justify-content: center; }
#countdownText { font-size: 25rem; color: var(--theme); text-shadow: 0 0 50px rgba(245, 159, 0, 0.5); opacity: 0; }
@keyframes countPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.0); opacity: 0; } }
.count-animate { animation: countPop 0.8s ease-in-out forwards; }
@keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

@media (min-width: 1600px) {
    #header { height: 140px; } .header-title { font-size: 3rem; left: 110px; } .timer-box { font-size: 6rem; padding: 10px 50px; } #mainQuestionBoard { min-height: 350px; }
    .char-btn { width: 45px; height: 45px; font-size: 1.5rem; }
    .slot-box { width: 50px; height: 50px; font-size: 0.9rem; }
    .undo-all-btn { font-size: 1.1rem; padding: 6px 15px; }

@media (max-width: 768px) {

}

.bg-dog { background: var(--dog-color); } .bg-cat { background: var(--cat-color); } .bg-rabbit { background: var(--rabbit-color); } .bg-hamster { background: var(--hamster-color); } .bg-panda { background: var(--panda-color); } .bg-monkey { background: var(--monkey-color); }
</style>

<script>
/* =========================================
   전역 변수 (오류 수정용)
   ========================================= */
let roundTimeout = null;
let isAborted = false;

/* =========================================
   Data Fetching (테스트용 더미 데이터 포함)
   ========================================= */
let idiomData = [];

async function loadData() {
    // 단일 파일 환경에서 data.json이 없을 때를 위한 기본 더미 데이터
    const fallbackData = [
        { word: "일취월장(日就月將)", chars: ["일", "취", "월", "장"], meaning: "나날이 다달이 자라거나 발전함.", level: 1 },
        { word: "동문서답(東問西答)", chars: ["동", "문", "서", "답"], meaning: "묻는 말에 대하여 아주 딴소리로 대답함.", level: 1 },
        { word: "다재다능(多才多能)", chars: ["다", "재", "다", "능"], meaning: "재주와 능력이 많음.", level: 1 },
        { word: "우왕좌왕(右往左往)", chars: ["우", "왕", "좌", "왕"], meaning: "이리저리 왔다 갔다 하며 일의 갈피를 잡지 못함.", level: 2 },
        { word: "금상첨화(錦上添花)", chars: ["금", "상", "첨", "화"], meaning: "좋은 일에 또 좋은 일이 더하여짐.", level: 2 },
        { word: "설상가상(雪上加霜)", chars: ["설", "상", "가", "상"], meaning: "눈이 내리는 위에 서리까지 친다는 뜻으로, 어려운 일이 겹침.", level: 3 },
        { word: "구사일생(九死一生)", chars: ["구", "사", "일", "생"], meaning: "아홉 번 죽을 뻔하다가 겨우 살아남.", level: 1 },
        { word: "이심전심(以心傳心)", chars: ["이", "심", "전", "심"], meaning: "마음과 마음으로 서로 뜻이 통함.", level: 2 },
        { word: "다기망양(多岐亡羊)", chars: ["다", "기", "망", "양"], meaning: "학문의 길이 여러 갈래라 진리를 찾기 어려움.", level: 3 },
        { word: "대기만성(大器晩成)", chars: ["대", "기", "만", "성"], meaning: "큰 사람이 되기 위해서는 많은 노력과 시간이 필요함.", level: 1 }
    ];

    try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('Network response was not ok');
        idiomData = await response.json();
    } catch (error) {
        console.warn('data.json을 찾을 수 없어 기본 내장 데이터를 사용합니다.', error);
        idiomData = fallbackData; // 에러 발생 시 더미 데이터로 대체
    } finally {
        const startBtn = document.getElementById('startBtn');
        startBtn.innerText = "게임 시작하기";
        startBtn.disabled = false;
    }
}

window.addEventListener('DOMContentLoaded', loadData);

/* =========================================
   Game Configuration
   ========================================= */
const TEAM_DATA = [
    { id: 'dog', icon: '🐶', color: 'bg-dog', name: '강아지' },
    { id: 'cat', icon: '🐱', color: 'bg-cat', name: '고양이' },
    { id: 'rabbit', icon: '🐰', color: 'bg-rabbit', name: '토끼' },
    { id: 'hamster', icon: '🐹', color: 'bg-hamster', name: '햄스터' },
    { id: 'panda', icon: '🐼', color: 'bg-panda', name: '판다' },
    { id: 'monkey', icon: '🐵', color: 'bg-monkey', name: '원숭이' }
];

const state = {
    players: [], mode: 'challenge', difficulty: 'normal',
    currentQ: 0, maxQ: 10, timer: 30, timerInterval: null,
    phase: 'setup', problem: null, availableIdioms: []
};

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(type) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const t = audioCtx.currentTime;
    if (type === 'start') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.linearRampToValueAtTime(880, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.5);
    } else if (type === 'count') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'undo') {
        osc.type = 'square'; osc.frequency.setValueAtTime(800, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.05);
    } else if (type === 'correct') {
        const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
        osc.frequency.setValueAtTime(523.25, t); osc2.frequency.setValueAtTime(659.25, t + 0.1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.4);
        gain2.gain.setValueAtTime(0, t); gain2.gain.linearRampToValueAtTime(0.3, t + 0.1); gain2.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination); osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4); osc2.start(t); osc2.stop(t + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);
    } else if (type === 'end') {
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(0.2, t + i*0.1); g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.5);
            o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
        });
    }
}

/* =========================================
   Game Logic
   ========================================= */
function buildPool() {
    let maxLevel = 1;
    if (state.difficulty === 'normal') maxLevel = 2;
    if (state.difficulty === 'hard') maxLevel = 3;

    state.availableIdioms = idiomData.filter(item => item.level <= maxLevel);
    
    // Fallback if pool is empty
    if(state.availableIdioms.length === 0) {
        state.availableIdioms = [...idiomData];
    }
}

function generateProblem() {
    if (state.availableIdioms.length === 0) buildPool();

    let randIdx = Math.floor(Math.random() * state.availableIdioms.length);
    let target = state.availableIdioms.splice(randIdx, 1)[0];
    
    return target;
}

function initGame() {
    isAborted = false; // 새로 게임을 시작할 때마다 중단 플래그 초기화
    if(idiomData.length === 0) return; // 데이터 미로딩 시 방지
    initAudio();
    
    const pCount = parseInt(document.getElementById('playerCount').value);
    state.difficulty = document.getElementById('difficulty').value;
    state.mode = document.getElementById('gameMode').value;
    
    // 챌린지 10문제, 서바이벌 30문제로 세팅
    state.maxQ = state.mode === 'challenge' ? 10 : 30;
    state.currentQ = 0;
    state.players = [];

    buildPool();

    const arena = document.getElementById('arena');
    arena.innerHTML = '';

    for(let i=0; i<pCount; i++) {
        let teamInfo = TEAM_DATA[i];
        state.players.push({ 
            id: teamInfo.id, icon: teamInfo.icon, color: teamInfo.color, name: teamInfo.name, 
            score: 0, survived: 0, alive: true, answered: false, 
            inputChars: [], isGoldenBellWinner: false, rank: 0 
        });
        
        const col = document.createElement('div');
        col.className = `player-col ${teamInfo.color}`;
        col.id = `p-${i}`;
        col.innerHTML = `
            <div class="p-header">
                <span class="p-emoji">${teamInfo.icon}</span>
                <span class="p-name">${teamInfo.name}</span>
            </div>
            <div class="scramble-grid" id="p-scrambled-${i}"></div>
            <div class="slot-container" id="p-slots-${i}">
                <div class="slot-box" data-idx="0"></div>
                <div class="slot-box" data-idx="1"></div>
                <div class="slot-box" data-idx="2"></div>
                <div class="slot-box" data-idx="3"></div>
            </div>
            <button class="undo-all-btn" onpointerdown="event.preventDefault(); handleClearAll(${i})">다시 선택</button>
            <div class="feedback-overlay" id="p-fb-${i}"></div>
            <div class="final-status" id="p-final-${i}"></div>
        `;
        arena.appendChild(col);
    }

    document.getElementById('overlay').style.display = 'none';
    document.getElementById('resultPopup').style.display = 'none';

    playSound('start');
    nextTurn();
}

async function nextTurn() {
    const aliveCount = state.players.filter(p=>p.alive).length;

    if (state.mode === 'survival' && aliveCount <= 1 && state.players.length > 1) { endGame(); return; }
    if (state.mode === 'survival' && aliveCount === 0) { endGame(); return; }
    
    if (state.currentQ >= 10 && state.mode === 'challenge') { endGame(); return; }
    if (state.currentQ >= 30 && state.mode === 'survival') { triggerGoldenBellWin(); return; }

    state.currentQ++;
    state.phase = 'counting';
    state.problem = generateProblem();
    
    // 정답 텍스트 가리기
    const revealEl = document.getElementById('revealAnswer');
    revealEl.style.display = 'none';
    revealEl.innerText = '';

    state.players.forEach((p, idx) => {
        if(p.alive) {
            p.answered = false; 
            p.inputChars = [];
            const fb = document.getElementById(`p-fb-${idx}`);
            fb.className = 'feedback-overlay'; fb.innerHTML = '';
            
            // Render scrambled buttons
            const scrambledGrid = document.getElementById(`p-scrambled-${idx}`);
            scrambledGrid.innerHTML = '';
            
            let scrambledChars = [...state.problem.chars].map((char, i) => ({ char, originalIndex: i }));
            scrambledChars.sort(() => Math.random() - 0.5);
            
            scrambledChars.forEach((item) => {
                const btn = document.createElement('div');
                btn.className = 'char-btn';
                btn.innerText = item.char;
                btn.dataset.char = item.char;
                btn.dataset.origIdx = item.originalIndex;
                btn.onpointerdown = (e) => { e.preventDefault(); handleCharSelect(idx, btn); };
                scrambledGrid.appendChild(btn);
            });

            // Initialize Slots
            const slots = document.getElementById(`p-slots-${idx}`).children;
            for(let i=0; i<4; i++) {
                slots[i].innerText = '';
                slots[i].className = 'slot-box';
                slots[i].dataset.sourceBtnIdx = '';
                // 폰트 크기 초기화 (오답 표시용으로 바뀐 스타일 리셋)
                slots[i].style.fontSize = '';
                slots[i].style.color = '';
                slots[i].style.borderColor = '';
                slots[i].onpointerdown = (e) => { e.preventDefault(); handleCharUndo(idx, i); };
            }
            slots[0].classList.add('active-cursor');
        }
    });

    document.getElementById('qNumber').innerText = `문제 ${state.currentQ} / ${state.maxQ}`;
    document.getElementById('bigQuestion').innerText = "준비...";
    
    await runCountdown();
    if (isAborted) return; // 카운트다운 도중 홈으로 돌아갔을 경우 즉시 중단 (수정됨)

    state.phase = 'playing';
    document.getElementById('bigQuestion').innerText = state.problem.meaning;

    startTimer();
}

async function runCountdown() {
    const layer = document.getElementById('countdownLayer');
    const txt = document.getElementById('countdownText');
    layer.style.display = 'flex';
    for(let i=3; i>0; i--) {
        if (isAborted) break; // 중간에 중단된 경우 카운트다운 루프 탈출
        txt.innerText = i; 
        txt.classList.remove('count-animate');
        void txt.offsetWidth; 
        txt.classList.add('count-animate');
        playSound('count'); 
        await new Promise(r => setTimeout(r, 1000));
    }
    layer.style.display = 'none';
}

function startTimer() {
    state.timer = 30;
    const tBox = document.getElementById('mainTimer');
    tBox.innerText = 30; tBox.classList.remove('timer-urgent');
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timer--; tBox.innerText = state.timer;
        if(state.timer <= 5) { tBox.classList.add('timer-urgent'); playSound('count'); }
        if(state.timer <= 0) finishRound();
    }, 1000);
}

function handleCharSelect(pIdx, btnElem) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive || btnElem.classList.contains('used')) return;

    if(p.inputChars.length >= 4) return;

    playSound('click');
    
    const charStr = btnElem.dataset.char;
    const btnDomIndex = Array.from(btnElem.parentNode.children).indexOf(btnElem);
    
    p.inputChars.push({ char: charStr, btnIdx: btnDomIndex });
    btnElem.classList.add('used');

    updateSlotsUI(pIdx);

    if(p.inputChars.length === 4) {
        submitAnswer(pIdx);
    }
}

function handleCharUndo(pIdx, slotIdx) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive) return;

    if(slotIdx >= p.inputChars.length) return;

    playSound('undo');

    const removedItems = p.inputChars.splice(slotIdx);
    
    const scrambledGrid = document.getElementById(`p-scrambled-${pIdx}`);
    removedItems.forEach(item => {
        scrambledGrid.children[item.btnIdx].classList.remove('used');
    });

    updateSlotsUI(pIdx);
}

function handleClearAll(pIdx) {
    if(state.phase !== 'playing') return;
    const p = state.players[pIdx];
    if(p.answered || !p.alive || p.inputChars.length === 0) return;

    playSound('undo');

    const scrambledGrid = document.getElementById(`p-scrambled-${pIdx}`);
    p.inputChars.forEach(item => {
        scrambledGrid.children[item.btnIdx].classList.remove('used');
    });

    p.inputChars = [];
    updateSlotsUI(pIdx);
}

function updateSlotsUI(pIdx) {
    const p = state.players[pIdx];
    const slots = document.getElementById(`p-slots-${pIdx}`).children;
    
    for(let i=0; i<4; i++) {
        slots[i].className = 'slot-box';
        if(i < p.inputChars.length) {
            slots[i].innerText = p.inputChars[i].char;
            slots[i].classList.add('filled');
        } else {
            slots[i].innerText = '';
        }
    }
    
    if(p.inputChars.length < 4) {
        slots[p.inputChars.length].classList.add('active-cursor');
    }
}

function submitAnswer(pIdx) {
    const p = state.players[pIdx];
    p.answered = true;
    
    const fb = document.getElementById(`p-fb-${pIdx}`);
    fb.innerHTML = `
        <div style="font-size:3rem; margin-bottom:10px;">🔒</div>
        <div class="submitted-text">제출 완료</div>
    `;
    fb.classList.add('secret'); 
    
    const living = state.players.filter(pl => pl.alive);
    if(living.every(pl => pl.answered)) finishRound();
}

function finishRound() {
    clearInterval(state.timerInterval);
    state.phase = 'result';
    
    const displayWord = state.problem.word; // 한자 포함 전체 문자열
    const correctWord = [...state.problem.chars].join(''); // 한글 4글자 추출 (배열 전개 구문으로 형식 오류 완벽 방지)
    let someoneWrong = false;
    
    // 중앙 화면에 정답 대문짝만하게 공개 (기존처럼 한자 포함)
    const revealEl = document.getElementById('revealAnswer');
    revealEl.innerText = displayWord;
    revealEl.style.display = 'block';

    state.players.forEach((p, idx) => {
        if(!p.alive) return;
        const fb = document.getElementById(`p-fb-${idx}`);
        
        fb.classList.remove('secret'); fb.innerHTML = '';
        
        let playerAnswer = p.inputChars.map(x => x.char).join('');

        if(playerAnswer === correctWord) {
            fb.innerHTML = '<span style="color:#69db7c">⭕</span>'; fb.classList.add('show-result');
            p.survived++;
            if(state.mode === 'challenge') p.score += 10;
        } else {
            someoneWrong = true;
            // 오답이거나 시간 초과인 경우 정답을 슬롯에 강제로 보여줌 (피드백)
            const slots = document.getElementById(`p-slots-${idx}`).children;
            for(let i=0; i<4; i++) {
                slots[i].innerText = state.problem.chars[i];
                slots[i].style.color = "#ff6b6b";
                slots[i].style.borderColor = "#ff6b6b";
                // 컨닝 방지용으로 글씨를 작게 했지만 정답 공개할 땐 알아볼 수 있도록 폰트를 키워줍니다
                slots[i].style.fontSize = "1.5rem"; 
            }
            
            fb.innerHTML = '<span style="color:#ff6b6b; margin-bottom: 20px;">❌</span>'; fb.classList.add('show-result');
            if(state.mode === 'survival') {
                p.alive = false;
                setTimeout(() => {
                    document.getElementById(`p-${idx}`).classList.add('eliminated');
                }, 2500);
            }
        }
    });

    if(!someoneWrong) playSound('correct'); else playSound('wrong');
    
    // 넉넉하게 다 같이 볼 수 있게 3.5초 대기하되 중단될 수 있도록 setTimeout을 변수에 할당 (수정됨)
    roundTimeout = setTimeout(() => {
        if (!isAborted) nextTurn();
    }, 3500); 
}

function assignRanks() {
    let ranked = [...state.players];
    if(state.mode === 'challenge') {
        ranked.sort((a,b) => b.score - a.score);
    } else {
        ranked.sort((a,b) => {
            if (a.alive && !b.alive) return -1;
            if (!a.alive && b.alive) return 1;
            return b.survived - a.survived;
        });
    }
    
    let currentRank = 1;
    ranked.forEach((p, i) => {
        if (i > 0) {
            const prev = ranked[i-1];
            let isTie = false;
            if (state.mode === 'challenge') {
                if (p.score === prev.score) isTie = true;
            } else {
                if (p.alive && prev.alive) isTie = true;
                else if (!p.alive && !prev.alive && p.survived === prev.survived) isTie = true;
            }
            if (!isTie) currentRank = i + 1;
        } else {
            currentRank = 1;
        }
        const originalPlayer = state.players.find(pl => pl.id === p.id);
        originalPlayer.rank = currentRank;
    });
}

function getRankEmojiHtml(rank) {
    let rankEmoji = '';
    if (rank === 1) rankEmoji = '🥇';
    else if (rank === 2) rankEmoji = '🥈';
    else if (rank === 3) rankEmoji = '🥉';
    else if (rank === 4) rankEmoji = '<span style="font-size: 70%;">4️⃣</span>';
    else if (rank === 5) rankEmoji = '<span style="font-size: 70%;">5️⃣</span>';
    else if (rank === 6) rankEmoji = '<span style="font-size: 70%;">6️⃣</span>';
    return `<div style="font-size: 3rem; margin-bottom: 5px;">${rankEmoji}</div>`;
}

function triggerGoldenBellWin() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');

    state.players.forEach(p => {
        if(p.alive) p.isGoldenBellWinner = true;
    });
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    const list = document.getElementById('finalResultList');
    
    document.getElementById('resultTitle').innerHTML = "🎉 골든벨 달성! 🎉<br><span style='font-size: 2rem; color: #f59f00;'>위대한 사자성어 킹 탄생!</span>";
    popup.style.display = 'flex'; list.innerHTML = '';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (p.isGoldenBellWinner) {
            finalDiv.innerHTML = `${rankHtml}<h3>영광의 우승</h3><p>🔔 골든벨 🔔</p>`;
            finalDiv.style.border = "4px solid #f59f00";
            finalDiv.style.background = "rgba(245, 159, 0, 0.2)";
        } else {
            finalDiv.innerHTML = `${rankHtml}<h3>기록</h3><p>${p.survived} 문제 통과</p>`;
        }
    });

    renderResultList(true);
}

function endGame() {
    clearInterval(state.timerInterval);
    state.phase = 'gameover';
    playSound('end');
    
    assignRanks();

    const popup = document.getElementById('resultPopup');
    document.getElementById('resultTitle').innerText = "결과 발표";
    popup.style.display = 'flex';
    
    state.players.forEach((p, idx) => {
        const finalDiv = document.getElementById(`p-final-${idx}`);
        finalDiv.style.display = 'block';
        const rankHtml = getRankEmojiHtml(p.rank);

        if (state.mode === 'challenge') { 
            finalDiv.innerHTML = `${rankHtml}<h3>최종 점수</h3><p>${p.score} 점</p>`; 
        } else { 
            finalDiv.innerHTML = p.alive ? `${rankHtml}<h3>기록</h3><p>최후의 생존자!</p>` : `${rankHtml}<h3>기록</h3><p>${p.survived} 문제 통과</p>`; 
            if(p.alive) finalDiv.style.border = "4px solid #f59f00"; 
        }
    });

    renderResultList(false);
}

function renderResultList(isGoldenBell) {
    const list = document.getElementById('finalResultList');
    list.innerHTML = '';

    let ranked = [...state.players].sort((a,b) => a.rank - b.rank);

    ranked.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = `result-item ${p.rank === 1 ? 'rank-1' : ''}`;
        
        let status;
        if (isGoldenBell && p.isGoldenBellWinner) status = "🔔 골든벨 우승!";
        else if (state.mode === 'challenge') status = `${p.score} 점`;
        else status = p.alive ? "최후의 생존자!" : `${p.survived} 문제 통과`;

        li.innerHTML = `<span>${p.rank}위 ${p.icon} ${p.name}</span><span>${status}</span>`;
        list.appendChild(li);
    });
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => { console.log(err.message); });
    } else { document.exitFullscreen(); }
});

document.getElementById('startBtn').addEventListener('click', initGame);

document.getElementById('restartBtn').addEventListener('click', () => { 
    document.getElementById('overlay').style.display = 'flex'; 
    document.getElementById('resultPopup').style.display = 'none'; 
});

document.getElementById('btn-home').addEventListener('click', () => {
    isAborted = true; // 대기 중인 비동기 작업 즉시 취소 플래그 발동 (수정됨)
    clearInterval(state.timerInterval);
    if (roundTimeout) clearTimeout(roundTimeout); // 3.5초 대기 중이었다면 강제 종료

    if (document.fullscreenElement) {
        state.phase = 'setup';
        document.getElementById('resultPopup').style.display = 'none';
        document.getElementById('countdownLayer').style.display = 'none';
        document.getElementById('arena').innerHTML = '';
        document.getElementById('mainTimer').innerText = '30';
        document.getElementById('mainTimer').classList.remove('timer-urgent');
        document.getElementById('bigQuestion').innerText = '준비...';
        document.getElementById('revealAnswer').style.display = 'none';
        document.getElementById('overlay').style.display = 'flex';
        if(window.playSound) window.playSound('click');
    } else {
        location.reload();
    }
});

document.addEventListener('contextmenu', event => event.preventDefault());
