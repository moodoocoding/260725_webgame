    <style>
        /* [기본 설정] */
        * { 
            box-sizing: border-box; 
            user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Jua', sans-serif;
            background-color: #1e1e2e;
            color: #ecf0f1;
            height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- 상단 헤더 --- */
        header {
            height: 18%; 
            display: flex;
            justify-content: center; /* 중앙 정렬 */
            align-items: center;
            padding: 0 20px;
            background: #2b2b3b;
            border-bottom: 3px solid #444;
            z-index: 10;
            position: relative;
        }

        /* 점수판 컨테이너: 플레이어 영역 위에 정렬되도록 */
        .score-board-container {
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: space-around; /* 균등 분할 */
            align-items: center;
            flex: 1;
        }

        .player-score {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 5px 10px;
            border-radius: 15px;
            background: #363646;
            border: 3px solid #555;
            min-width: 100px;
            width: 18%; /* 반응형 너비 */
            height: 85%;
            transition: transform 0.2s;
            position: relative;
        }
        
        /* 팀별 색상 테마 */
        .p1-board { border-color: #3b82f6; color: #60a5fa; } /* 강아지 (파랑) */
        .p2-board { border-color: #ef4444; color: #f87171; } /* 고양이 (빨강) */
        .p3-board { border-color: #d946ef; color: #e879f9; } /* 토끼 (분홍) */
        .p4-board { border-color: #22c55e; color: #4ade80; } /* 햄스터 (초록) */

        .player-label { font-size: 1.2rem; font-weight: bold; white-space: nowrap; margin-bottom: 5px; }
        .score-display { font-size: 2.8rem; font-weight: bold; font-family: 'Poppins', sans-serif; line-height: 1; color: white; }

        /* 타이머 (헤더 중앙 절대 위치) */
        .timer-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        .timer-container {
            text-align: center; background: #2d3436; padding: 5px 20px;
            border-radius: 40px; border: 4px solid #fbbf24;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            min-width: 120px;
        }
        .timer-container.urgent { animation: pulse 0.5s infinite alternate; border-color: #ff5252; background: #4a1c1c; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        
        .timer-label { font-size: 0.8rem; color: #b2bec3; display: block; }
        #timer { font-size: 2.5rem; font-weight: bold; color: #f1c40f; font-family: 'Poppins', sans-serif; line-height: 1; }
        .urgent #timer { color: #ff6b6b; }

        /* --- 메인 게임 영역 --- */
        #game-split-view {
            flex-grow: 1;
            display: flex;
            width: 100%;
            height: 62%;
            position: relative;
            background: #1e1e2e;
        }

        .player-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 10px;
            overflow: hidden;
            border-right: 2px solid #444;
        }
        .player-area:last-child { border-right: none; }

        /* 배경색 (팀별 미세 조정) */
        .area-p1 { background: linear-gradient(180deg, #172554 0%, #1e1e2e 100%); }
        .area-p2 { background: linear-gradient(180deg, #450a0a 0%, #1e1e2e 100%); }
        .area-p3 { background: linear-gradient(180deg, #4a044e 0%, #1e1e2e 100%); }
        .area-p4 { background: linear-gradient(180deg, #052e16 0%, #1e1e2e 100%); }

        /* 물고기 탱크 */
        .fish-tank {
            width: 100%; height: 60%;
            display: flex; justify-content: space-evenly; align-items: flex-end;
            padding-bottom: 10px; position: relative;
        }

        .fish-wrapper {
            position: relative; transition: transform 0.5s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 45%; max-width: 200px;
        }

        .vs-circle {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 50px; height: 50px;
            background: #2d3436; border: 3px solid #636e72; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; font-family: Arial, sans-serif; color: #f1c40f;
            z-index: 5; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .fish-body {
            font-size: 5rem; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
            z-index: 1; margin-bottom: 5px; line-height: 1; transition: all 0.3s;
        }
        
        .fish-number {
            font-size: 1.5rem; font-weight: bold; color: #ffffff;
            background: #374151; padding: 5px 10px; border-radius: 30px;
            z-index: 2; font-family: 'Poppins', sans-serif; min-width: 60px;
            text-align: center; white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #6b7280;
        }
        
        /* 분수 스타일 */
        .fraction { display: inline-block; vertical-align: middle; font-size: 0.8em; margin: 0 2px; }
        .fraction > span { display: block; text-align: center; line-height: 1; }
        .fraction span.top { border-bottom: 2px solid #fff; padding: 0 2px 2px 2px; }
        .fraction span.bottom { padding: 2px 2px 0 2px; }
        .mixed-int { font-size: 1.1em; margin-right: 4px; vertical-align: middle; }

        /* 낚시 바 */
        .hook-area {
            width: 90%; height: 70px; margin-top: auto; margin-bottom: 20px;
            position: relative; background: #1e293b; border-radius: 15px;
            border: 3px solid #475569; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .zone-container { display: flex; width: 100%; height: 100%; }
        .zone {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: white; font-family: Arial, sans-serif; font-weight: 300;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .zone:last-child { border-right: none; }
        .zone.gt { background-color: #0369a1; }
        .zone.eq { background-color: #1d4ed8; }
        .zone.lt { background-color: #0c4a6e; }

        .hook {
            position: absolute; top: -5px; left: 0; width: 40px; height: 80px;
            display: flex; flex-direction: column; align-items: center;
            transform: translateX(0); z-index: 5; pointer-events: none;
        }
        .hook i { font-size: 35px; color: #facc15; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        .hook::before {
            content: ''; width: 2px; height: 1000px; background: #94a3b8;
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
        }

        .feedback-msg {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 20; display: none; white-space: nowrap;
        }

        /* --- 하단 버튼 --- */
        footer {
            height: 20%; display: flex; padding: 0; background: #111827; border-top: 2px solid #374151;
        }
        .btn-container {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px;
            border-right: 1px solid #374151;
        }
        .btn-container:last-child { border-right: none; }

        .stop-btn {
            width: 90%; height: 70%; font-size: 1.5rem; font-weight: bold; font-family: 'Jua', sans-serif;
            border: none; border-radius: 20px; cursor: pointer; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; top: 0; transition: all 0.1s;
        }
        .stop-btn span { margin-top: 5px; }

        .btn-p1 { background: linear-gradient(to bottom, #3b82f6, #1d4ed8); box-shadow: 0 6px 0 #1e3a8a; }
        .btn-p1:active { top: 6px; box-shadow: 0 0 0 #1e3a8a; }

        .btn-p2 { background: linear-gradient(to bottom, #ef4444, #b91c1c); box-shadow: 0 6px 0 #7f1d1d; }
        .btn-p2:active { top: 6px; box-shadow: 0 0 0 #7f1d1d; }

        .btn-p3 { background: linear-gradient(to bottom, #d946ef, #a21caf); box-shadow: 0 6px 0 #701a75; }
        .btn-p3:active { top: 6px; box-shadow: 0 0 0 #701a75; }

        .btn-p4 { background: linear-gradient(to bottom, #22c55e, #15803d); box-shadow: 0 6px 0 #14532d; }
        .btn-p4:active { top: 6px; box-shadow: 0 0 0 #14532d; }

        /* --- 오버레이 (메뉴/결과) --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: white; padding: 20px; overflow-y: auto;
        }
        .hidden { display: none !important; }

        /* 메뉴 섹션 스타일 */
        .menu-section {
            background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 15px;
            margin-bottom: 15px; width: 100%; max-width: 900px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .section-title { font-size: 1.1rem; color: #94a3b8; margin-bottom: 8px; display: block; }
        
        .option-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        .option-btn {
            padding: 10px 20px; font-size: 1.1rem; background: transparent; color: #cbd5e1;
            border: 2px solid #475569; border-radius: 12px; cursor: pointer;
            font-family: 'Jua', sans-serif; transition: all 0.2s;
        }
        .option-btn:hover { background: rgba(255,255,255,0.05); }
        .option-btn.selected { 
            background: #3b82f6; color: white; border-color: #3b82f6; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .tab-menu { display: flex; gap: 10px; margin-bottom: 10px;  justify-content: center;}
        .tab-btn {
            padding: 10px 25px; font-size: 1.2rem; background: rgba(255,255,255,0.05); color: #94a3b8;
            border: 2px solid transparent; border-radius: 30px; cursor: pointer;
            font-family: 'Jua', sans-serif; transition: all 0.2s;   
        }
        .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); }

        .tab-content { display: none; width: 100%; justify-content: center; margin-bottom: 10px; }
        .tab-content.active { display: flex; flex-wrap: wrap; gap: 10px; }

        .level-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
        .level-btn {
            padding: 10px; background: #1e293b; border: 2px solid #334155; border-radius: 12px;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: #cbd5e1; transition: 0.2s; min-width: 100px;
        }
        .level-btn.selected { background: #0f172a; border-color: #facc15; color: white; transform: scale(1.05); }
        .lvl-icon { font-size: 1.4rem; }
        .lvl-text { font-size: 1rem; font-weight: bold; }
        .lvl-desc { font-size: 0.8rem; color: #64748b; }

        .start-btn-large {
            padding: 15px 80px; font-size: 2.2rem; background: #10b981; color: white;
            border: none; border-radius: 50px; cursor: pointer; font-family: 'Jua', sans-serif;
            box-shadow: 0 8px 0 #047857; margin-top: 15px; transition: transform 0.1s;
        }
        .start-btn-large:active { transform: scale(0.95); box-shadow: 0 4px 0 #047857; }
        .start-btn-large:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }

        .main-title-container { text-align: center; margin-bottom: 15px; }
        .main-title { font-size: 3.5rem; color: #facc15; text-shadow: 3px 3px 0 #b45309; margin: 0; line-height: 1.2; }

        /* 결과 화면 */
        .result-grid {
            display: flex; gap: 15px; width: 100%; max-width: 1000px; height: 50vh;
            justify-content: center; align-items: stretch; margin-bottom: 20px;
        }
        .result-card {
            flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; border: 2px solid #444;
            display: flex; flex-direction: column; align-items: center; padding: 15px;
            position: relative; overflow: hidden;
        }
        .result-rank { font-size: 2rem; position: absolute; top: 10px; left: 10px; text-shadow: 0 2px 2px rgba(0,0,0,0.5); }
        .result-score { font-size: 3rem; font-weight: bold; margin: 10px 0; color: white; }
        .result-count { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 10px; }
        .result-collection {
            flex: 1; width: 100%; background: rgba(255,255,255,0.05); border-radius: 10px;
            overflow-y: auto; padding: 5px; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 2px;
        }
        .mini-fish { font-size: 24px; }

        /* 언어 선택 */
        .lang-switcher { position: fixed; top: 18%; right: 15px; background: #aaaaaa52; padding: 5px 10px; border-radius: 30px; display: flex; gap: 8px; z-index: 9999; backdrop-filter: blur(4px); }
        .lang-btn { font-size: 20px; cursor: pointer; border: none; background: none; padding: 0; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); transition: 0.2s; }
        .lang-btn:hover { transform: scale(1.2); }

        .floating-btn { position: fixed; bottom: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; cursor: pointer; z-index: 9000; border: 1px solid rgba(255,255,255,0.2); }
        .floating-home { left: 20px; }
        .floating-full { right: 20px; }

        /* 4인용일 때 글씨 크기 조정 */
        .small-text .fish-number { font-size: 1.2rem; min-width: 50px; padding: 5px 8px; }
        .small-text .fish-body { font-size: 5rem; }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn" onclick="changeLanguage('ko')" title="Korean">🇰🇷</button>
        <button class="lang-btn" onclick="changeLanguage('en')" title="English">🇺🇸</button>
        <button class="lang-btn" onclick="changeLanguage('zh')" title="Chinese">🇨🇳</button>
        <button class="lang-btn" onclick="changeLanguage('ja')" title="Japanese">🇯🇵</button>
        <button class="lang-btn" onclick="changeLanguage('es')" title="Spanish">🇪🇸</button>
        <button class="lang-btn" onclick="changeLanguage('fr')" title="French">🇫🇷</button>
        <button class="lang-btn" onclick="changeLanguage('ru')" title="Russian">🇷🇺</button>
    </div>

    <header id="game-header" class="hidden">
        <div id="score-board" class="score-board-container">
            </div>
        <div class="timer-wrapper">
            <div class="timer-container" id="timer-box">
                <span class="timer-label" data-i18n="time_label">TIME</span>
                <span id="timer">60</span>
            </div>
        </div>
    </header>

    <div id="game-split-view" class="hidden">
        </div>

    <footer id="game-footer" class="hidden">
        </footer>

    <div class="floating-btn floating-home" onclick="goHome()" title="Home"><i class="fa-solid fa-house"></i></div>
    <div class="floating-btn floating-full" onclick="toggleFullScreen()" title="Full"><i class="fa-solid fa-expand"></i></div>

    <div id="start-screen" class="overlay">
        <div class="main-title-container">
            <div style="color:#94a3b8; font-size:1.2rem; margin-bottom:5px;">
                게임으로 수학의 킹이 되어라. <a href="http://킹수학.com" target="_blank" id="brand-link" style="color:#facc15; text-decoration:none;">킹수학.com</a>
            </div>
            <h1 class="main-title" data-i18n="game_title">🎣 낚시킹 비교킹</h1>
        </div>

        <div class="menu-section">
            <span class="section-title" data-i18n="sec_players">1. 참가 인원</span>
            <div class="option-row">
                <button class="option-btn selected" onclick="setPlayers(2)">2 Player</button>
                <button class="option-btn" onclick="setPlayers(3)">3 Player</button>
                <button class="option-btn" onclick="setPlayers(4)">4 Player</button>
            </div>
        </div>

        <div class="menu-section">
            <span class="section-title" data-i18n="sec_category">2. 문제 유형</span>
            <div class="tab-menu">
                <button class="tab-btn active" onclick="setCategory('natural')" data-i18n="tab_natural">🌱 자연수</button>
                <button class="tab-btn" onclick="setCategory('decimal')" data-i18n="tab_decimal">💧 소수</button>
                <button class="tab-btn" onclick="setCategory('fraction')" data-i18n="tab_fraction">🍰 분수 & 혼합</button>
            </div>
        </div>

        <div class="menu-section">
            <span class="section-title" data-i18n="sec_level">3. 단계 선택</span>
            <div class="level-grid" id="level-grid">
                </div>
        </div>

        <div class="menu-section">
            <span class="section-title" data-i18n="sec_diff">4. 난이도</span>
            <div class="option-row">
                <button class="option-btn selected" onclick="setDifficulty('easy')">
                    <i class="fa-solid fa-anchor"></i> <span data-i18n="diff_easy">쉬움 (고정)</span>
                </button>
                <button class="option-btn" onclick="setDifficulty('hard')">
                    <i class="fa-solid fa-shuffle"></i> <span data-i18n="diff_hard">어려움 (랜덤)</span>
                </button>
            </div>
        </div>

        <button class="start-btn-large" id="btn-start" onclick="startGame()" disabled data-i18n="btn_start">게임 시작</button>
        <div style="margin-top:20px;">
            <a href="http://킹수학.com" class="other-game-link" id="link-other-game" data-i18n="link_other">🎮 다른 게임 고르기</a>
        </div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <h1 style="font-size:3rem; color:#facc15; margin-bottom:20px;" data-i18n="game_over">GAME OVER</h1>
        <div class="result-grid" id="result-grid">
            </div>
        <button class="start-btn-large" onclick="goHome()" data-i18n="btn_restart">처음으로</button>
    </div>

    <script>
        // --- 설정 및 상태 ---
        const CONFIG = {

        let curLang = 'ko';

        function changeLanguage(lang) {
            curLang = lang;
            const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerText = t[key];
            });
            
            // Domain Update
            const brandLink = document.getElementById('brand-link');
            const otherLink = document.getElementById('link-other-game');
            if(lang === 'ko') {
                brandLink.href = "https://킹수학.com"; brandLink.innerText = "킹수학.com";
                otherLink.href = "https://킹수학.com";
            } else {
                brandLink.href = "http://www.kingsmath.com"; brandLink.innerText = "KingsMath.com";
                otherLink.href = "http://www.kingsmath.com";
            }
            
            renderLevelGrid(); 
        }

        window.onload = () => {
            renderLevelGrid();
            
            // Auto-detect language
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            const browserLang = navigator.language.slice(0, 2);
            let targetLang = 'en';

            if(langParam && TRANSLATIONS[langParam]) targetLang = langParam;
            else if(TRANSLATIONS[browserLang]) targetLang = browserLang;
            
            changeLanguage(targetLang);
        };

        function setPlayers(n) {
            CONFIG.playerCount = n;
            updateBtnState('.menu-section:nth-child(2) .option-btn', n === 2 ? 0 : n === 3 ? 1 : 2);
        }
        function setCategory(cat) {
            CONFIG.category = cat;
            CONFIG.level = 0; 
            document.getElementById('btn-start').disabled = true;
            
            // Tab Style Update
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            const idx = cat === 'natural' ? 0 : cat === 'decimal' ? 1 : 2;
            tabs[idx].classList.add('active');
            
            renderLevelGrid();
        }
        function setDifficulty(diff) {
            CONFIG.difficulty = diff;
            updateBtnState('.menu-section:nth-child(5) .option-btn', diff === 'easy' ? 0 : 1);
        }
        function updateBtnState(selector, activeIdx) {
            const btns = document.querySelectorAll(selector);
            btns.forEach((b, i) => b.classList.toggle('selected', i === activeIdx));
        }

        function renderLevelGrid() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';
            const data = LEVEL_DATA[CONFIG.category];
            const t = TRANSLATIONS[curLang] || TRANSLATIONS.en;

            data.forEach(item => {
                const desc = t[item.desc] || item.desc;
                const el = document.createElement('div');
                el.className = `level-btn ${CONFIG.level === item.lv ? 'selected' : ''}`;
                el.innerHTML = `<div class="lvl-icon">${item.icon}</div><div class="lvl-text">Lv.${item.lv}</div><div class="lvl-desc">${desc}</div>`;
                el.onpointerdown = () => {
                    CONFIG.level = item.lv;
                    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
                    el.classList.add('selected');
                    document.getElementById('btn-start').disabled = false;
                };
                grid.appendChild(el);
            });
        }

        // --- 게임 시작 및 생성 ---
        function startGame() {
            if (CONFIG.level === 0) return;
            initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            
            // 헤더 생성
            const scoreBoard = document.getElementById('score-board');
            scoreBoard.innerHTML = '';
            for(let i=1; i<=CONFIG.playerCount; i++) {
                const team = TEAMS[i];
                const tmpl = `
                    <div class="player-score" style="border-color:${team.color}; color:${team.color}">
                        <div class="player-label">${team.emoji}</div>
                        <div id="score-p${i}" class="score-display">0</div>
                    </div>
                `;
                scoreBoard.innerHTML += tmpl;
            }

            // 게임 영역 생성
            const splitView = document.getElementById('game-split-view');
            splitView.innerHTML = '';
            splitView.classList.remove('hidden');
            document.getElementById('game-header').classList.remove('hidden');
            document.getElementById('game-footer').classList.remove('hidden');
            
            if(CONFIG.playerCount >= 3) splitView.classList.add('small-text');
            else splitView.classList.remove('small-text');

            for(let i=1; i<=CONFIG.playerCount; i++) {
                createPlayerArea(i, splitView);
            }

            // 푸터 버튼 생성
            const footer = document.getElementById('game-footer');
            footer.innerHTML = '';
            for(let i=1; i<=CONFIG.playerCount; i++) {
                const team = TEAMS[i];
                const btn = document.createElement('div');
                btn.className = 'btn-container';
                btn.innerHTML = `
                    <button class="stop-btn" style="background:${team.color}; box-shadow:0 6px 0 rgba(0,0,0,0.3);" onpointerdown="handleStop(${i})">
                        <i class="fa-solid fa-hand-pointer"></i> <span>STOP</span>
                    </button>
                `;
                footer.appendChild(btn);
            }

            // 상태 초기화
            gameState.active = true;
            gameState.timer = 60;
            gameState.players = {};
            for(let i=1; i<=CONFIG.playerCount; i++) {
                gameState.players[i] = {
                    score: 0, count: 0, 
                    hookPos: Math.random()*90, hookDir: 1, hookSpeed: 0.5,
                    locked: false, answer: '', zones: [], history: []
                };
                nextProblem(i);
            }

            startTimer();
            loop();
        }

        function createPlayerArea(id, container) {
            const team = TEAMS[id];
            const div = document.createElement('div');
            div.className = `player-area ${team.bg}`;
            div.innerHTML = `
                <div class="fish-tank">
                    <div class="fish-wrapper" id="fish-l-${id}">
                        <div class="fish-body">🐟</div>
                        <div class="fish-number" id="num-l-${id}">?</div>
                    </div>
                    <div class="vs-circle" id="circle-${id}"></div>
                    <div class="fish-wrapper" id="fish-r-${id}">
                        <div class="fish-body" style="transform: scaleX(-1);">🐠</div>
                        <div class="fish-number" id="num-r-${id}">?</div>
                    </div>
                </div>
                <div class="feedback-msg" id="msg-${id}"></div>
                <div class="hook-area">
                    <div class="zone-container" id="zones-${id}"></div>
                    <div class="hook" id="hook-${id}"><i class="fa-solid fa-anchor"></i></div>
                </div>
            `;
            container.appendChild(div);
        }

        // --- 게임 로직 ---
        function startTimer() {
            document.getElementById('timer').innerText = 60;
            document.getElementById('timer-box').classList.remove('urgent');
            
            if(gameState.interval) clearInterval(gameState.interval);
            gameState.interval = setInterval(() => {
                gameState.timer--;
                document.getElementById('timer').innerText = gameState.timer;
                if(gameState.timer <= 5) {
                    document.getElementById('timer-box').classList.add('urgent');
                    playSound('tick');
                }
                if(gameState.timer <= 0) endGame();
            }, 1000);
        }

        function loop() {
            if(!gameState.active) return;
            for(let i=1; i<=CONFIG.playerCount; i++) {
                const p = gameState.players[i];
                if(p.locked) continue;
                
                p.hookPos += p.hookSpeed * p.hookDir;
                if(p.hookPos >= 92 || p.hookPos <= 0) p.hookDir *= -1;
                
                const el = document.getElementById(`hook-${i}`);
                if(el) el.style.left = p.hookPos + '%';
            }
            gameState.animFrame = requestAnimationFrame(loop);
        }

        function nextProblem(id) {
            const p = gameState.players[id];
            p.hookSpeed = Math.min(4, 0.5 + (p.count * 0.1));
            p.locked = false;

            let v1, v2, d1, d2;
            const lv = CONFIG.level;
            
            if(lv <= 4) { // 자연수
                const max = Math.pow(10, lv) - 1;
                v1 = rand(1, max); v2 = rand(1, max);
                d1 = v1; d2 = v2;
            } else if (lv <= 7) { // 소수
                const digit = lv - 4; 
                const base = Math.pow(10, digit);
                v1 = rand(1, base*10)/base; v2 = rand(1, base*10)/base;
                d1 = v1.toFixed(digit); d2 = v2.toFixed(digit);
            } else { // 분수 (간단 구현)
                let den = rand(2, 10);
                v1 = rand(1, den*2)/den; v2 = rand(1, den*2)/den;
                d1 = makeFrac(Math.round(v1*den), den); d2 = makeFrac(Math.round(v2*den), den);
            }

            document.getElementById(`num-l-${id}`).innerHTML = d1;
            document.getElementById(`num-r-${id}`).innerHTML = d2;
            document.getElementById(`circle-${id}`).innerText = '';

            const diff = v1 - v2;
            if(Math.abs(diff) < 0.000001) p.answer = 'eq';
            else if(diff > 0) p.answer = 'gt';
            else p.answer = 'lt';

            // 난이도에 따른 존 설정
            const zones = ['gt', 'eq', 'lt'];
            if(CONFIG.difficulty === 'hard') shuffle(zones);
            
            p.zones = zones;
            const zoneContainer = document.getElementById(`zones-${id}`);
            zoneContainer.innerHTML = '';
            zones.forEach(z => {
                const div = document.createElement('div');
                div.className = `zone ${z}`;
                div.innerText = z === 'gt' ? '>' : z === 'lt' ? '<' : '=';
                zoneContainer.appendChild(div);
            });

            document.querySelector(`#fish-l-${id} .fish-body`).innerText = randItem(FISH_EMOJIS);
            document.querySelector(`#fish-r-${id} .fish-body`).innerText = randItem(FISH_EMOJIS);
        }

        function handleStop(id) {
            const p = gameState.players[id];
            if(p.locked || !gameState.active) return;
            p.locked = true;

            let idx = 0;
            const pos = p.hookPos + 4; 
            if(pos > 33.33) idx = 1;
            if(pos > 66.66) idx = 2;

            const selected = p.zones[idx];
            const isCorrect = selected === p.answer;
            const sym = selected === 'gt' ? '>' : selected === 'lt' ? '<' : '=';
            
            document.getElementById(`circle-${id}`).innerText = sym;

            const msgEl = document.getElementById(`msg-${id}`);
            const t = TRANSLATIONS[curLang] || TRANSLATIONS.en;

            if(isCorrect) {
                p.score += 200; p.count++;
                playSound('success');
                msgEl.innerText = t.msg_correct;
                msgEl.style.color = '#4ade80';
            } else {
                p.score = Math.max(0, p.score - 50);
                playSound('fail');
                msgEl.innerText = t.msg_wrong;
                msgEl.style.color = '#f87171';
            }

            document.getElementById(`score-p${id}`).innerText = p.score;
            msgEl.style.display = 'block';

            setTimeout(() => {
                msgEl.style.display = 'none';
                if(gameState.active) nextProblem(id);
            }, 1000);
        }

        function endGame() {
            gameState.active = false;
            clearInterval(gameState.interval);
            cancelAnimationFrame(gameState.animFrame);
            playSound('end');

            document.getElementById('end-screen').classList.remove('hidden');
            const grid = document.getElementById('result-grid');
            grid.innerHTML = '';
            
            const results = [];
            for(let i=1; i<=CONFIG.playerCount; i++) results.push({ id: i, ...gameState.players[i] });
            results.sort((a,b) => b.score - a.score);

            const t = TRANSLATIONS[curLang];

            results.forEach((p, idx) => {
                const team = TEAMS[p.id];
                let rankText = t[`rank_${idx+1}`];
                if(idx > 0 && p.score === results[idx-1].score) rankText = t[`rank_${idx}`]; 

                let fishHTML = '';
                for(let k=0; k<p.count; k++) fishHTML += `<span class="mini-fish">${randItem(FISH_EMOJIS)}</span>`;

                const card = document.createElement('div');
                card.className = 'result-card';
                card.style.borderColor = team.color;
                card.innerHTML = `
                    <div class="result-rank" style="color:${team.color}">${rankText}</div>
                    <div style="font-size:1.5rem; margin-top:20px;">${team.emoji} ${t[team.labelKey]}</div>
                    <div class="result-score">${p.score}</div>
                    <div class="result-count">${p.count} ${t.unit_count}</div>
                    <div class="result-collection">${fishHTML}</div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 유틸 ---
        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function makeFrac(n, d) { return `<div class="fraction"><span class="top">${n}</span><span class="bottom">${d}</span></div>`; }
        function shuffle(a) { for(let i=a.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        }
        function playSound(type) {
            if(!audioCtx) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if(type === 'tick') {
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now+0.1);
                osc.start(now); osc.stop(now+0.1);
            } else if(type === 'success') {
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now+0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now+0.3);
                osc.start(now); osc.stop(now+0.3);
            } else if(type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now+0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now+0.3);
                osc.start(now); osc.stop(now+0.3);
            } else if(type === 'end') {
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now+1.5);
                osc.start(now); osc.stop(now+1.5);
            }
        }
        function goHome() { location.reload(); }
        function toggleFullScreen() {
            if(!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if(document.exitFullscreen) document.exitFullscreen();
        }
    </script>
