<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YW0T2C109"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>킹타자 디펜스 (DOS Style)</title>
    <!-- 레트로 도스 스타일 한글 폰트 로드 -->
    <style>
        @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

        :root {
            --dos-bg: #000000;
            --dos-green: #55FF55;
            --dos-cyan: #55FFFF;
            --dos-red: #FF5555;
            --dos-white: #FFFFFF;
            --dos-yellow: #FFFF55;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Galmuri11', 'Courier New', monospace;
            overflow: hidden; /* 스케일링 시 생길 수 있는 스크롤바 방지 */
            color: var(--dos-white);
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: var(--dos-bg);
            box-shadow: 0 0 20px rgba(85, 255, 85, 0.2);
            overflow: hidden;
            image-rendering: pixelated;
            transform-origin: center center;
        }

        /* CRT 모니터 스캔라인 효과 */
        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        canvas {
            display: block;
        }

        /* 하단 모서리 고정 버튼 (홈, 전체화면) */
        .corner-btn {
            position: fixed;
            bottom: 20px;
            width: 50px;
            height: 50px;
            font-size: 28px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--dos-cyan);
            color: var(--dos-white);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s all;
            user-select: none;
        }
        .corner-btn:hover {
            background: var(--dos-cyan);
            color: #000;
            transform: scale(1.1);
        }
        #home-btn { left: 20px; }
        #fullscreen-btn { right: 20px; }

        /* UI 공통 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: var(--dos-yellow);
            font-size: 48px;
            text-shadow: 4px 4px 0px var(--dos-red);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        h2 {
            color: var(--dos-green);
            margin-bottom: 20px;
        }

        button.main-btn {
            background-color: var(--dos-bg);
            color: var(--dos-green);
            border: 4px solid var(--dos-green);
            padding: 15px 30px;
            font-family: inherit;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button.main-btn:hover {
            background-color: var(--dos-green);
            color: var(--dos-bg);
        }

        /* 다른 게임 고르기 링크 */
        .other-link {
            color: var(--dos-cyan);
            font-size: 16px;
            margin-top: 15px;
            text-decoration: none;
            border-bottom: 1px dashed var(--dos-cyan);
            z-index: 11;
        }
        .other-link:hover {
            color: var(--dos-white);
            border-bottom: 1px dashed var(--dos-white);
        }

        /* 닉네임 입력란 */
        #nickname-input {
            background: #000;
            color: var(--dos-yellow);
            border: 2px solid var(--dos-white);
            padding: 10px;
            font-family: inherit;
            font-size: 20px;
            text-align: center;
            outline: none;
            text-transform: uppercase;
            margin-bottom: 15px;
            width: 250px;
            z-index: 11;
        }
        
        #nickname-input:focus {
            border-color: var(--dos-green);
        }

        /* 세로 스크롤 랭킹 게시판 */
        .ranking-board-vertical {
            width: 80%;
            max-width: 450px;
            height: 180px;
            overflow-y: auto;
            background-color: rgba(0, 30, 0, 0.7);
            border: 2px solid var(--dos-cyan);
            margin-top: 25px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 11;
        }

        /* 레트로 스크롤바 스타일링 */
        .ranking-board-vertical::-webkit-scrollbar { width: 12px; }
        .ranking-board-vertical::-webkit-scrollbar-track { background: #000; border-left: 1px solid var(--dos-cyan); }
        .ranking-board-vertical::-webkit-scrollbar-thumb { background: var(--dos-cyan); border: 1px solid #000; }
        .ranking-board-vertical::-webkit-scrollbar-thumb:hover { background: var(--dos-white); }

        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(85, 255, 255, 0.3);
            padding: 5px 0;
            font-size: 18px;
        }
        .rank-row:last-child { border-bottom: none; }
        
        .t-rank { width: 60px; color: var(--dos-cyan); font-weight: bold; }
        .t-name { flex-grow: 1; color: var(--dos-yellow); text-align: center; }
        .t-score { width: 100px; color: var(--dos-green); text-align: right; }

        #submit-msg {
            height: 20px;
            font-size: 18px;
            color: var(--dos-yellow);
            margin-bottom: 15px;
            z-index: 11;
        }

        /* 인게임 HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
            border-bottom: 2px solid var(--dos-green);
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 20px;
        }

        .hud-right {
            text-align: right;
        }

        .hp-bar-container {
            width: 200px;
            height: 20px;
            border: 2px solid var(--dos-white);
            background-color: #333;
            margin-top: 5px;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background-color: var(--dos-green);
            transition: width 0.3s, background-color 0.3s;
        }

        #level-text {
            color: var(--dos-yellow);
        }

    </style>
</head>
<body>

<!-- 화면 외곽 고정 버튼 (홈, 전체화면) -->
<a href="/" class="corner-btn" id="home-btn" title="다른 게임 고르기">🏠</a>
<div class="corner-btn" id="fullscreen-btn" title="전체화면 토글">⛶</div>

<div id="game-container">
    <!-- 인게임 정보 (HUD) -->
    <div id="hud" class="hidden">
        <div class="hud-left">
            <div id="level-text">1단계 (기본)</div>
            <div style="color: var(--dos-cyan)">SCORE: <span id="score">0</span></div>
        </div>
        <div class="hud-right">
            <div>BASE ENERGY</div>
            <div class="hp-bar-container">

            </div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- 시작 화면 -->
    <div id="start-screen" class="screen">
        <h1>킹타자 디펜스</h1>
        <h2>지구를 지키는 타자 용사여, 키보드를 잡아라!</h2>
        
        <!-- 닉네임 입력 (게임 시작 전 설정) -->
        <input type="text" id="nickname-input" placeholder="닉네임 (최대 8자)" maxlength="8" autocomplete="off">
        <button id="start-btn" class="main-btn">GAME START</button>
        <a href="/" class="other-link">다른 게임 고르기</a>
        
        <!-- 세로 스크롤 랭킹판 -->
        <div class="ranking-board-vertical ranking-container">
            <div style="text-align:center; margin-top: 20px;">서버에서 랭킹을 불러오는 중입니다...</div>
        </div>

        <p style="margin-top:20px; font-size:14px; color:#55FFFF;">* 1인용 키보드 전용 / 한·영 키 무관하게 자리 인식</p>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: var(--dos-red);">GAME OVER</h1>
        <h2 id="final-score">SCORE: 0</h2>
        
        <div id="submit-msg">점수 등록 준비 중...</div>

        <div id="game-over-actions" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
            <!-- 메인으로(다시하기) 버튼 -->
            <button id="to-main-btn" class="main-btn">메인으로 (다시하기)</button>
            <a href="/" class="other-link">다른 게임 고르기</a>
        </div>

        <!-- 세로 스크롤 랭킹판 (게임 오버 화면용) -->
        <div class="ranking-board-vertical ranking-container">
            <div style="text-align:center; margin-top: 20px;">서버에서 랭킹을 불러오는 중입니다...</div>
        </div>
    </div>
</div>

<script>
/**
 * 화면 비율 유지 반응형 스케일링 로직
 */
function resizeGame() {
    const container = document.getElementById('game-container');
    // 창 크기와 800x600 비율을 계산하여 가장 최적화된 스케일 배율을 찾음
    const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600);
    container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resizeGame);
window.addEventListener('load', resizeGame);
resizeGame();

/**
 * 전체화면 토글 로직
 */
const fullscreenBtn = document.getElementById('fullscreen-btn');
fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
});
document.addEventListener('fullscreenchange', () => {
    // 전체화면 상태에 따라 아이콘 변경 (⛶: 전체화면, 🗗: 창모드)
    fullscreenBtn.innerText = document.fullscreenElement ? '🗗' : '⛶';
});

/**
 * 킹타자 디펜스 게임 로직 및 랭킹 연동
 */

// HTML 엘리먼트
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const levelTextEl = document.getElementById('level-text');
const hpBarEl = document.getElementById('hp-bar');
const finalScoreEl = document.getElementById('final-score');

// 랭킹 & UI 관련 엘리먼트
const nicknameInput = document.getElementById('nickname-input');
const submitMsg = document.getElementById('submit-msg');
const gameOverActions = document.getElementById('game-over-actions');
const rankingContainers = document.querySelectorAll('.ranking-container');

// 현재 플레이어 닉네임 저장용
let currentNickname = "익명";

// 랭킹 목록 불러오기 (ranking.php)
async function fetchRankings() {
    try {
        const response = await fetch('ranking.php?action=list');
        const data = await response.json();
        
        let htmlContent = "";
        if (data && data.length > 0) {
            data.forEach((item, index) => {
                // 1위~3위는 특별한 색상 처리
                let rankColor = 'var(--dos-cyan)';
                if (index === 0) rankColor = '#FFD700'; // 1등 금색
                else if (index === 1) rankColor = '#C0C0C0'; // 2등 은색
                else if (index === 2) rankColor = '#CD7F32'; // 3등 동색
                
                htmlContent += `
                    <div class="rank-row">
                        <span class="t-rank" style="color:${rankColor};">${index + 1}위</span>
                        <span class="t-name">${item.nickname}</span>
                        <span class="t-score">${item.score.toLocaleString()}점</span>
                    </div>`;
            });
        } else {
            htmlContent = "<div style='text-align:center; margin-top: 20px; color: var(--dos-white);'>등록된 랭킹이 없습니다. 첫 랭커가 되어보세요!</div>";
        }
        
        rankingContainers.forEach(container => {
            container.innerHTML = htmlContent;
        });
    } catch (e) {
        console.warn("랭킹 로드 실패:", e);
        rankingContainers.forEach(container => {
            container.innerHTML = "<div style='text-align:center; margin-top: 20px; color: var(--dos-red);'>랭킹 서버에 연결할 수 없습니다.</div>";
        });
    }
}

// 점수 자동 등록 (ranking.php)
async function autoSubmitScore() {
    if (score <= 0) {
        submitMsg.style.color = 'var(--dos-yellow)';
        submitMsg.innerText = "점수가 0점이므로 등록되지 않았습니다.";
        gameOverActions.classList.remove('hidden');
        return;
    }

    submitMsg.style.color = 'var(--dos-yellow)';
    submitMsg.innerText = "서버에 점수를 등록 중입니다...";

    try {
        const formData = new URLSearchParams();
        formData.append('action', 'submit');
        formData.append('nickname', currentNickname);
        formData.append('score', score);

        const response = await fetch('ranking.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        });
        
        const result = await response.json();

        if (result.status === 'success') {
            submitMsg.style.color = 'var(--dos-green)';
            submitMsg.innerText = `축하합니다! [${currentNickname}]님, ${result.rank}위로 등록 완료!`;
        } else if (result.status === 'error') {
            submitMsg.style.color = 'var(--dos-red)';
            if (result.message === 'bad_word') {
                submitMsg.innerText = "사용할 수 없는 닉네임으로 인해 등록이 거절되었습니다.";
            } else if (result.message === 'busy') {
                submitMsg.innerText = "서버가 바쁩니다. 등록에 실패했습니다.";
            } else {
                submitMsg.innerText = "점수 등록에 실패했습니다.";
            }
        }
    } catch (e) {
        console.error("점수 등록 오류:", e);
        submitMsg.style.color = 'var(--dos-red)';
        submitMsg.innerText = "서버 통신 오류가 발생했습니다.";
    } finally {
        // 등록 성공여부와 상관없이 메인으로 돌아가는 액션 버튼 표시
        gameOverActions.classList.remove('hidden');
        fetchRankings(); // 랭킹 최신화
    }
}

// 영문-한글 양방향 매핑 (한/영 전환 스트레스 방지 및 영어 단계 지원)
const enToKr = {
    'a':'ㅁ', 's':'ㄴ', 'd':'ㅇ', 'f':'ㄹ', 'g':'ㅎ', 'h':'ㅗ', 'j':'ㅓ', 'k':'ㅏ', 'l':'ㅣ',
    'q':'ㅂ', 'w':'ㅈ', 'e':'ㄷ', 'r':'ㄱ', 't':'ㅅ', 
    'z':'ㅋ', 'x':'ㅌ', 'c':'ㅊ', 'v':'ㅍ',
    'y':'ㅛ', 'u':'ㅕ', 'i':'ㅑ', 'o':'ㅐ', 'p':'ㅔ',
    'b':'ㅠ', 'n':'ㅜ', 'm':'ㅡ',
    'A':'ㅁ', 'S':'ㄴ', 'D':'ㅇ', 'F':'ㄹ', 'G':'ㅎ', 'H':'ㅗ', 'J':'ㅓ', 'K':'ㅏ', 'L':'ㅣ',
    'Q':'ㅃ', 'W':'ㅉ', 'E':'ㄸ', 'R':'ㄲ', 'T':'ㅆ', 'O':'ㅒ', 'P':'ㅖ'
};

const krToEn = {};
for (const [en, kr] of Object.entries(enToKr)) {
    krToEn[kr] = en.toLowerCase();
}
// 쌍자음 예외 처리
krToEn['ㅃ'] = 'q'; krToEn['ㅉ'] = 'w'; krToEn['ㄸ'] = 'e'; krToEn['ㄲ'] = 'r'; krToEn['ㅆ'] = 't'; krToEn['ㅒ'] = 'o'; krToEn['ㅖ'] = 'p';

// 레벨 정의 (1~20단계 확장)
const L1 = ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'];
const L2 = [...L1, 'ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'];
const L3 = [...L2, 'ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ'];
const L4 = [...L3, 'ㅃ','ㅉ','ㄸ','ㄲ','ㅒ','ㅖ'];
const L5 = [...L4, 'a','s','d','f','g','h','j','k','l'];
const L6 = [...L5, 'q','w','e','r','t','y','u','i','o','p'];
const L7 = [...L6, 'z','x','c','v','b','n','m'];
const L8 = [...L7, '1','2','3','4','5','6','7','8','9','0'];
const L9 = [...L8, '-','=','\\','[',']',';','\'',',','.','/'];

const LEVELS = [
    // 1~9단계: 자판 익히기 (느리고 일정한 속도/물량)
    { name: "1단계 (기본)", shortName: "1단계", reqScore: 0, speed: 0.3, spawnRate: 70, chars: L1 },
    { name: "2단계 (윗자리)", shortName: "2단계", reqScore: 300, speed: 0.3, spawnRate: 70, chars: L2 },
    { name: "3단계 (아랫자리)", shortName: "3단계", reqScore: 600, speed: 0.3, spawnRate: 70, chars: L3 },
    { name: "4단계 (쌍자음)", shortName: "4단계", reqScore: 900, speed: 0.3, spawnRate: 70, chars: L4 },
    { name: "5단계 (영어 중단)", shortName: "5단계", reqScore: 1200, speed: 0.3, spawnRate: 70, chars: L5 },
    { name: "6단계 (영어 상단)", shortName: "6단계", reqScore: 1500, speed: 0.3, spawnRate: 70, chars: L6 },
    { name: "7단계 (영어 하단)", shortName: "7단계", reqScore: 1800, speed: 0.3, spawnRate: 70, chars: L7 },
    { name: "8단계 (숫자)", shortName: "8단계", reqScore: 2100, speed: 0.3, spawnRate: 70, chars: L8 },
    { name: "9단계 (기호)", shortName: "9단계", reqScore: 2500, speed: 0.3, spawnRate: 70, chars: L9 },
    // 10~20단계: 물량과 속도가 본격적으로 오르는 구간
    { name: "10단계 (가속 시작)", shortName: "10단계", reqScore: 3000, speed: 0.4, spawnRate: 65, chars: L9 },
    { name: "11단계", shortName: "11단계", reqScore: 3500, speed: 0.5, spawnRate: 60, chars: L9 },
    { name: "12단계", shortName: "12단계", reqScore: 4000, speed: 0.6, spawnRate: 55, chars: L9 },
    { name: "13단계", shortName: "13단계", reqScore: 4600, speed: 0.7, spawnRate: 50, chars: L9 },
    { name: "14단계", shortName: "14단계", reqScore: 5200, speed: 0.8, spawnRate: 45, chars: L9 },
    { name: "15단계", shortName: "15단계", reqScore: 5900, speed: 0.9, spawnRate: 40, chars: L9 },
    { name: "16단계", shortName: "16단계", reqScore: 6600, speed: 1.0, spawnRate: 35, chars: L9 },
    { name: "17단계", shortName: "17단계", reqScore: 7400, speed: 1.1, spawnRate: 30, chars: L9 },
    { name: "18단계", shortName: "18단계", reqScore: 8200, speed: 1.2, spawnRate: 25, chars: L9 },
    { name: "19단계", shortName: "19단계", reqScore: 9000, speed: 1.3, spawnRate: 20, chars: L9 },
    { name: "20단계 (초고속 지옥)", shortName: "20단계", reqScore: 10000, speed: 1.5, spawnRate: 15, chars: L9 }
];

// 아이템 적 정의
const ITEMS = [
    { id: 'TIME_STOP', icon: '⏳', name: '시간정지', color: '#55FFFF' },
    { id: 'BOMB', icon: '💣', name: '폭탄', color: '#FF5555' },
    { id: 'CLOUD', icon: '☁️', name: '구름', color: '#AAAAAA' },
    { id: 'FAST', icon: '⏩', name: '빠르게', color: '#FF5555' },
    { id: 'SLOW', icon: '🐢', name: '느리게', color: '#55FF55' },
    { id: 'SWARM', icon: '☠️', name: '적총공격', color: '#FF00FF' },
    // 추가된 강력한 아이템들
    { id: 'HEAL', icon: '💙', name: '에너지회복', color: '#55FF55' },
    { id: 'ONE_PLUS_ONE', icon: '🚀', name: '1+1 미사일', color: '#FFFF55' },
    { id: 'INVINCIBLE', icon: '🛡️', name: '무적', color: '#5555FF' },
    { id: 'O_VIRUS', icon: '🦠', name: 'ㅇ 바이러스', color: '#55FF55' }
];

// 게임 상태 변수
let gameState = 'START'; 
let score = 0;
let currentLevel = 0;
let baseHp = 100;
let frameCount = 0;
let animationId;

// 카운트다운 변수
let countdownValue = 3;
let countdownTimer = 0;

// 특수 효과 상태 변수
let effectTimer = 0;
let currentEffect = null;
let isClouded = false;
let globalSpeedMult = 1.0;
let isInvincible = false;
let isOnePlusOne = false;

// 화면 메시지 변수
let centerMsg = "";
let centerMsgTimer = 0;
let centerMsgColor = "#FFF";
let centerMsgSize = 40;

// 페널티 상태 변수
let firePenaltyTimer = 0;

// 오디오 컨텍스트
let audioCtx;

function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
        gainNode.gain.setValueAtTime(0.05, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.2);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'item') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(660, now + 0.1);
        osc.frequency.setValueAtTime(880, now + 0.2);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'levelup') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(261.63, now);
        osc.frequency.setValueAtTime(329.63, now + 0.1);
        osc.frequency.setValueAtTime(392.00, now + 0.2);
        osc.frequency.setValueAtTime(523.25, now + 0.3);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
    } else if (type === 'beep') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(660, now);
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    }
}

// 엔티티 배열
let enemies = [];
let missiles = [];
let particles = [];
let stars = []; 

// 별 생성 초기화
for (let i = 0; i < 100; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        speed: Math.random() * 0.5 + 0.1,
        size: Math.random() * 2
    });
}

// 게임 시작
function startGame() {
    // 닉네임 설정
    const inputVal = nicknameInput.value.trim();
    currentNickname = inputVal ? inputVal : "익명";

    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();

    gameState = 'COUNTDOWN';
    countdownValue = 3;
    countdownTimer = 60;
    playSound('beep');

    score = 0;
    currentLevel = 0;
    baseHp = 100;
    enemies = [];
    missiles = [];
    particles = [];
    frameCount = 0;
    effectTimer = 0;
    currentEffect = null;
    isClouded = false;
    globalSpeedMult = 1.0;
    isInvincible = false;
    isOnePlusOne = false;
    centerMsgTimer = 0;
    firePenaltyTimer = 0;
    
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    
    updateHUD();
    levelTextEl.innerText = LEVELS[currentLevel].name;
    
    if(animationId) cancelAnimationFrame(animationId);
    gameLoop();
}

// 게임 종료
function gameOver() {
    gameState = 'GAMEOVER';
    hud.classList.add('hidden');
    gameOverScreen.classList.remove('hidden');
    finalScoreEl.innerText = `SCORE: ${score}`;
    
    // 종료 화면 초기 세팅
    gameOverActions.classList.add('hidden');
    
    // 점수 자동 등록 시작
    autoSubmitScore();
}

// 메인 화면(Start Screen)으로 복귀
function showMainScreen() {
    gameState = 'START';
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    fetchRankings(); // 랭킹 갱신
}

// HUD 업데이트
function updateHUD() {
    scoreEl.innerText = score;
    hpBarEl.style.width = `${Math.max(0, baseHp)}%`;
    
    if (baseHp > 60) hpBarEl.style.backgroundColor = 'var(--dos-green)';
    else if (baseHp > 30) hpBarEl.style.backgroundColor = 'var(--dos-yellow)';
    else hpBarEl.style.backgroundColor = 'var(--dos-red)';
}

// 레벨 체크 및 업데이트
function updateLevel() {
    let newLevel = 0;
    for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (score >= LEVELS[i].reqScore) {
            newLevel = i;
            break;
        }
    }
    
    if (newLevel !== currentLevel) {
        currentLevel = newLevel;
        createExplosion(canvas.width/2, canvas.height/2, '#FFFF55', 50);
        
        playSound('levelup');
        showMessage(`${LEVELS[currentLevel].shortName}`, '#FFFF55', 120, 80);
    }
    levelTextEl.innerText = LEVELS[currentLevel].name;
}

// 중앙 화면 텍스트 메시지 표시 함수
function showMessage(msg, color, time, size = 40) {
    centerMsg = msg;
    centerMsgColor = color;
    centerMsgTimer = time;
    centerMsgSize = size;
}

// 입력 처리
window.addEventListener('keydown', (e) => {
    // 닉네임 입력 중일 때는 게임 입력 방지
    if (document.activeElement === nicknameInput) return;
    
    if (gameState !== 'PLAYING') return;
    if (firePenaltyTimer > 0) return;
    if (e.key.length > 1) return;
    
    const key = e.key;
    const lowerKey = key.toLowerCase();
    const mappedKr = enToKr[key];
    const mappedEn = krToEn[key];
    
    const possibleChars = [key, lowerKey, mappedKr, mappedEn].filter(Boolean);
    
    let targetEnemy = null;
    let minDist = Infinity;
    
    const baseX = canvas.width / 2;
    const baseY = canvas.height - 90;
    
    let isHitAny = false;

    for (let enemy of enemies) {
        if (!enemy.targeted && possibleChars.includes(enemy.char)) {
            isHitAny = true;
            let dist = Math.sqrt(Math.pow(baseX - enemy.x, 2) + Math.pow(baseY - enemy.y, 2));
            if (dist < minDist) {
                minDist = dist;
                targetEnemy = enemy;
            }
        }
    }
    
    if (targetEnemy) {
        targetEnemy.targeted = true; 
        fireMissile(targetEnemy);
    } else if (!isHitAny) {
        firePenaltyTimer = 120;
        playSound('error');
        showMessage("❌ 오타 페널티: 2초 정지!", "#FF5555", 120, 40);
    }
});

function fireMissile(target, isExtra = false) {
    playSound('shoot');
    missiles.push({
        x: canvas.width / 2,
        y: canvas.height - 80, 
        target: target,
        speed: 15,
        color: isExtra ? '#55FFFF' : '#FFFF55', // 1+1 추가 미사일은 하늘색
        isExtra: isExtra
    });
}

function spawnEnemy(canBeItem = true) {
    const lvlData = LEVELS[currentLevel];
    const chars = lvlData.chars;
    const char = chars[Math.floor(Math.random() * chars.length)];
    
    let side = Math.floor(Math.random() * 3); 
    let x, y;
    
    if (side === 0) {
        x = Math.random() * (canvas.width - 60) + 30;
        y = -30;
    } else if (side === 1) {
        x = -30;
        y = Math.random() * (canvas.height / 2);
    } else {
        x = canvas.width + 30;
        y = Math.random() * (canvas.height / 2);
    }

    let isItem = canBeItem && Math.random() < 0.05; 
    let itemData = isItem ? ITEMS[Math.floor(Math.random() * ITEMS.length)] : null;
    
    let speed = lvlData.speed + (Math.random() * 0.4);
    if (isItem) speed *= 1.8;

    enemies.push({
        x: x,
        y: y,
        char: char,
        speed: speed,
        targeted: false,
        item: itemData,
        width: 40,
        height: 30
    });
}

function triggerItem(item) {
    playSound('item');
    showMessage(`${item.icon} ${item.name} 발동!`, item.color, 120, 35);
    
    if (item.id === 'BOMB') {
        enemies.forEach(e => createExplosion(e.x, e.y, '#FF5555'));
        score += enemies.length * 10;
        enemies = [];
        updateLevel();
        updateHUD();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else if (item.id === 'SWARM') {
        for(let i=0; i < 8; i++) spawnEnemy(false); 
    } else if (item.id === 'HEAL') {
        baseHp = Math.min(100, baseHp + 30); // 체력 30 회복 (최대 100)
        updateHUD();
    } else if (item.id === 'O_VIRUS') {
        enemies.forEach(e => e.char = 'ㅇ'); // 모든 글자를 'ㅇ'으로 변환
    } else {
        // 지속형 효과 처리 (ONE_PLUS_ONE과 INVINCIBLE은 10초(600프레임) 유지)
        if (item.id === 'ONE_PLUS_ONE' || item.id === 'INVINCIBLE') {
            effectTimer = 600;
        } else {
            effectTimer = 180; // 다른 효과들은 3초 유지
        }
        currentEffect = item.id;
    }
}

function createExplosion(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1.0,
            decay: Math.random() * 0.05 + 0.02,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function gameLoop() {
    if (gameState === 'START' || gameState === 'GAMEOVER') return;
    
    if (gameState === 'PLAYING') {
        if (firePenaltyTimer > 0) {
            firePenaltyTimer--;
        }

        globalSpeedMult = 1.0;
        isClouded = false;
        isInvincible = false;
        isOnePlusOne = false;
        
        if (effectTimer > 0) {
            effectTimer--;
            if (currentEffect === 'TIME_STOP') globalSpeedMult = 0;
            else if (currentEffect === 'SLOW') globalSpeedMult = 0.5;
            else if (currentEffect === 'FAST') globalSpeedMult = 2.0;
            else if (currentEffect === 'CLOUD') isClouded = true;
            else if (currentEffect === 'INVINCIBLE') isInvincible = true;
            else if (currentEffect === 'ONE_PLUS_ONE') isOnePlusOne = true;
            
            if (effectTimer <= 0) {
                currentEffect = null;
            }
        }
    }

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#FFFFFF';
    stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }
        ctx.globalAlpha = Math.random() * 0.5 + 0.3;
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });
    ctx.globalAlpha = 1.0;

    if (gameState === 'PLAYING') {
        frameCount++;

        const currentLvl = LEVELS[currentLevel];
        const scoreProgress = Math.max(0, score - currentLvl.reqScore);
        const currentSpawnRate = Math.max(10, currentLvl.spawnRate - Math.floor(scoreProgress / 150));
        
        if (frameCount % currentSpawnRate === 0) {
            spawnEnemy();
        }

        const baseX = canvas.width / 2;
        const baseY = canvas.height - 90;

        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            
            let dx = baseX - enemy.x;
            let dy = baseY - enemy.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 0) {
                enemy.x += (dx / dist) * enemy.speed * globalSpeedMult;
                enemy.y += (dy / dist) * enemy.speed * globalSpeedMult;
            }

        // 글자 타입에 따른 우주선 기본 색상 판별
            let baseColor = '#55FFFF'; // 기본 (기호 등)
            if (/[a-zA-Z]/.test(enemy.char)) {
                baseColor = '#FF55FF'; // 영어: 분홍색(마젠타)
            } else if (/[0-9]/.test(enemy.char)) {
                baseColor = '#55FF55'; // 숫자: 초록색
            } else if (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(enemy.char)) {
                baseColor = '#55FFFF'; // 한글: 청록색(시안)
            }

            ctx.fillStyle = enemy.targeted ? '#FF5555' : (enemy.item ? enemy.item.color : baseColor);
            
            ctx.fillRect(enemy.x - 15, enemy.y - 10, 30, 10);
            ctx.fillRect(enemy.x - 5, enemy.y - 20, 10, 10);
            ctx.fillRect(enemy.x - 20, enemy.y, 10, 10);
            ctx.fillRect(enemy.x + 10, enemy.y, 10, 10);
            
            ctx.fillStyle = '#FF5555';
            ctx.fillRect(enemy.x - 3, enemy.y - 15, 6, 4);

            if (enemy.item) {
                ctx.font = '16px Galmuri11';
                ctx.fillStyle = '#FFFF55';
                ctx.fillText('❓', enemy.x, enemy.y - 30);
            }

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '20px Galmuri11, Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(enemy.x - 12, enemy.y + 12, 24, 24);
            
            ctx.fillStyle = isClouded ? '#AAAAAA' : '#FFFF55';
            ctx.fillText(isClouded ? '?' : enemy.char, enemy.x, enemy.y + 25);

            if (dist < 40) {
                // 무적 아이템 적용 로직
                if (!isInvincible) {
                    baseHp -= 10;
                    playSound('explosion');
                    canvas.style.transform = `translate(${(Math.random()-0.5)*10}px, ${(Math.random()-0.5)*10}px)`;
                    setTimeout(() => { canvas.style.transform = 'translate(0, 0)'; }, 50);
                } else {
                    playSound('explosion'); // 에너지는 안 깎이고 터지는 소리만 남
                }

                createExplosion(enemy.x, enemy.y, '#FF5555');
                enemies.splice(i, 1);
                updateHUD();
                
                if (baseHp <= 0) {
                    gameOver();
                    return;
                }
            }
        }

        for (let i = missiles.length - 1; i >= 0; i--) {
            let m = missiles[i];
            
            let dx = m.target.x - m.x;
            let dy = m.target.y - m.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < m.speed || !enemies.includes(m.target)) { 
                const enemyIndex = enemies.indexOf(m.target);
                if (enemyIndex > -1) {
                    let hitEnemy = enemies[enemyIndex];
                    enemies.splice(enemyIndex, 1);
                    playSound('explosion');
                    createExplosion(hitEnemy.x, hitEnemy.y, '#55FF55');
                    score += 10;
                    updateLevel();
                    updateHUD();
                    
                    if (hitEnemy.item) {
                        triggerItem(hitEnemy.item);
                    }

                    // 1+1 추가 미사일 발사 처리
                    if (isOnePlusOne && !m.isExtra) {
                        let validEnemies = enemies.filter(e => !e.targeted);
                        if (validEnemies.length > 0) {
                            let randomTarget = validEnemies[Math.floor(Math.random() * validEnemies.length)];
                            randomTarget.targeted = true;
                            fireMissile(randomTarget, true); // true를 주어 연쇄발사 방지 및 색상 변경
                        }
                    }
                }
                missiles.splice(i, 1);
                continue;
            }

            m.x += (dx / dist) * m.speed;
            m.y += (dy / dist) * m.speed;

            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.arc(m.x, m.y, 6, 0, Math.PI * 2);
            ctx.fill();
            
            if (Math.random() > 0.5) {
                particles.push({
                    x: m.x, y: m.y,
                    vx: 0, vy: 2,
                    life: 1.0, decay: 0.1,
                    color: '#FF5555', size: 2
                });
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.globalAlpha = 1.0;
        }
    }

    if (gameState === 'PLAYING' && isClouded) {
        ctx.fillStyle = 'rgba(170, 170, 170, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = '#0055AA'; 
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height + 150, 250, Math.PI, 0);
    ctx.fill();
    
    ctx.fillStyle = '#55FF55';
    ctx.fillRect(canvas.width/2 - 100, canvas.height - 50, 40, 20);
    ctx.fillRect(canvas.width/2 - 80, canvas.height - 70, 60, 20);
    ctx.fillRect(canvas.width/2 + 40, canvas.height - 60, 50, 30);
    ctx.fillRect(canvas.width/2 + 10, canvas.height - 30, 100, 20);

    const turretX = canvas.width / 2;
    const turretY = canvas.height - 90;
    
    // 무적 효과 방어막 그리기
    if (isInvincible) {
        ctx.strokeStyle = `rgba(85, 85, 255, ${0.5 + Math.sin(frameCount * 0.1) * 0.3})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height + 150, 260, Math.PI, 0);
        ctx.stroke();
    }

    ctx.fillStyle = '#AAAAAA'; 
    ctx.fillRect(turretX - 20, turretY, 40, 20);
    
    ctx.fillStyle = (gameState === 'PLAYING' && firePenaltyTimer > 0) ? '#FF5555' : '#FFFFFF'; 
    ctx.fillRect(turretX - 5, turretY - 20, 10, 20);
    ctx.fillStyle = '#FF5555';
    ctx.fillRect(turretX - 8, turretY - 25, 16, 5);

    if (gameState === 'PLAYING' && firePenaltyTimer > 0) {
        ctx.fillStyle = '#FF5555';
        ctx.font = 'bold 16px Galmuri11';
        ctx.textAlign = 'center';
        ctx.fillText('LOCKED', turretX, turretY - 40);
    }

    if (gameState === 'COUNTDOWN') {
        countdownTimer--;
        
        if (countdownTimer <= 0) {
            countdownValue--;
            if (countdownValue > 0) {
                countdownTimer = 60;
                playSound('beep');
            } else {
                gameState = 'PLAYING';
                playSound('levelup');
                showMessage(`${LEVELS[currentLevel].shortName}`, '#FFFF55', 120, 80);
            }
        }
        
        if (countdownValue > 0) {
            ctx.fillStyle = `rgba(0, 0, 0, 0.5)`;
            ctx.fillRect(0, canvas.height/2 - 60, canvas.width, 120);
            
            ctx.font = 'bold 80px Galmuri11';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.shadowColor = '#FF0000';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
            
            ctx.fillStyle = '#FFFF55';
            ctx.fillText(countdownValue, canvas.width / 2, canvas.height / 2);
            
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }
    }

    if (centerMsgTimer > 0) {
        centerMsgTimer--;
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(0.7, centerMsgTimer/30)})`;
        ctx.fillRect(0, canvas.height/2 - centerMsgSize, canvas.width, centerMsgSize * 2);
        
        ctx.font = `bold ${centerMsgSize}px Galmuri11`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        if (centerMsgSize > 40) {
            ctx.shadowColor = '#FF0000';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
        } else {
            ctx.shadowColor = '#000000';
            ctx.shadowBlur = 5;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        ctx.fillStyle = centerMsgColor;
        ctx.globalAlpha = Math.min(1.0, centerMsgTimer / 30);
        ctx.fillText(centerMsg, canvas.width / 2, canvas.height / 2);
        
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
    }

    animationId = requestAnimationFrame(gameLoop);
}

// 이벤트 초기화
document.getElementById('start-btn').addEventListener('click', startGame);
// 종료 화면에서 메인(시작 화면)으로 돌아가는 버튼
document.getElementById('to-main-btn').addEventListener('click', showMainScreen);

// Enter 키로도 게임을 바로 시작할 수 있도록 편의성 추가
nicknameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        startGame();
    }
});

// 페이지 로드 시 랭킹 불러오기
window.addEventListener('load', fetchRankings);

</script>
