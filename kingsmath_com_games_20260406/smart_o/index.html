    // --- 초기 언어 세팅 ---

    function getInitialLang() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        if(langParam && i18n[langParam]) return langParam;
        const savedLang = localStorage.getItem('kingsmath_lang');
        if(savedLang && i18n[savedLang]) return savedLang;
        const browserLang = navigator.language.slice(0, 2);
        if(i18n[browserLang]) return browserLang;
        return 'en';
    }

    function renderLanguages(filterText = '') {
        grid.innerHTML = '';
        const lowerFilter = filterText.toLowerCase();
        const filteredLangs = languagesList.filter(lang => lang.name.toLowerCase().includes(lowerFilter) || lang.enName.toLowerCase().includes(lowerFilter) || lang.code.toLowerCase().includes(lowerFilter));
        if (filteredLangs.length === 0) { grid.classList.add('hidden'); noResult.classList.remove('hidden'); noResult.classList.add('flex'); } 
        else {
            grid.classList.remove('hidden'); noResult.classList.add('hidden'); noResult.classList.remove('flex');
            filteredLangs.forEach(lang => {
                const isSelected = lang.code === currentLang;
                const baseClasses = "flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-all duration-200 group relative overflow-hidden";
                const stateClasses = isSelected ? "bg-gray-800 border-yellow-500 ring-1 ring-yellow-500/50" : "bg-gray-800/40 border-gray-700 hover:bg-gray-700 hover:border-gray-500";
                const btn = document.createElement('div'); btn.className = `${baseClasses} ${stateClasses}`;
                btn.innerHTML = `
                    <div class="shrink-0 w-8 h-6 rounded overflow-hidden shadow-sm border border-gray-700/50">
                        <img src="https://flagcdn.com/w40/${lang.country}.png" alt="${lang.country}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col items-start">
                        <span class="text-sm font-medium text-white truncate w-full ${isSelected ? 'text-yellow-400' : ''}">${lang.name}</span>
                        <span class="text-xs text-gray-400 truncate w-full">${lang.enName}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-yellow-500 text-lg ml-2"></i>' : ''}`;
                btn.addEventListener('click', () => changeLang(lang.code, lang));
                grid.appendChild(btn);
            });
        }
    }

    function openModal() { modal.classList.add('active'); renderLanguages(searchInput.value); document.body.style.overflow = 'hidden'; setTimeout(() => searchInput.focus(), 100); }
    function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }
    function showToast(langName, langCode) {
        document.getElementById('ui-toast').textContent = i18n[langCode].toast || "Language changed.";
        toastLangName.textContent = langName; toast.classList.add('show');

    }

    function changeLang(langCode, langObj = null) {
        if(!i18n[langCode]) return;
        currentLang = langCode; const t = i18n[langCode];
        if (!langObj) langObj = languagesList.find(l => l.code === langCode);
        document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t[el.getAttribute('data-i18n')]; });
        document.getElementById("nickname").placeholder = t.placeholder; document.getElementById("nickname").setAttribute('data-i18n-ph', 'placeholder');
        currentFlagImg.src = `https://flagcdn.com/w40/${langObj.country}.png`;
        const linkBtn = document.getElementById("kingsmath-link-btn"); linkBtn.innerText = langCode === 'ko' ? "킹수학.com" : "KingsMath.com";
        const mainTitle = document.getElementById('main-title-el');
        if(['ru', 'es', 'fr', 'pt-br', 'de', 'it', 'id', 'vi'].includes(langCode)) mainTitle.style.fontSize = "5vh";
        else if(['th'].includes(langCode)) mainTitle.style.fontSize = "6vh";
        else mainTitle.style.fontSize = "7vh";

        initQR(); loadRanking(); closeModal(); if (langObj) showToast(langObj.name, langCode);

    function initQR() {

    function showBigQR() {
        const modal = document.getElementById("qr-modal"); const modalContent = document.getElementById("qr-modal-content"); modalContent.innerHTML = "";
        const qrCanvas = document.querySelector("#qrcode canvas"); const qrImg = document.querySelector("#qrcode img");

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'tick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now+0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'end') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(100, now+0.5);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'success') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'draw') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(300 + Math.random()*200, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }
    }

    // --- Circle King Game Logic ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let cx = 0, cy = 0, targetRadius = 0, startAngle = 0, playerPath = [], isDrawing = false;

    function initGame() {
        finalScore = 0.0;
        timeLeft = GAME_DURATION;
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('timer-val').classList.remove('timer-warning');

        resizeCanvas();
        playerPath = [];
        cx = canvas.width / 2; cy = canvas.height / 2;
        targetRadius = Math.min(canvas.width, canvas.height) * 0.35; 
        startAngle = Math.random() * Math.PI * 2;
        
        drawScene();
        isPlaying = true;
        startTimer();
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            timeLeft--;
            const tVal = document.getElementById('timer-val');
            tVal.innerText = timeLeft;
            if(timeLeft <= 3 && timeLeft > 0) tVal.classList.add('timer-warning');
            if(timeLeft <= 3 && timeLeft > 0) playSound('tick');

            if(timeLeft <= 0) evaluateCircle(); // 시간 초과 시 강제 채점
        }, 1000);
    }

    // --- Rendering ---
    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight;
        cx = canvas.width / 2; cy = canvas.height / 2; targetRadius = Math.min(canvas.width, canvas.height) * 0.35;
        if(isPlaying) drawScene();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 힌트 선 (1/4 아크)
        ctx.beginPath();
        const endAngle = startAngle + 0.5 * Math.PI;
        ctx.arc(cx, cy, targetRadius, startAngle, endAngle);
        ctx.strokeStyle = "rgba(187, 173, 160, 0.4)"; 
        ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.stroke();

        // 중심점
        ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fillStyle = "#bbada0"; ctx.fill();

        // 힌트 끝점
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(cx + targetRadius * Math.cos(startAngle), cy + targetRadius * Math.sin(startAngle), 7, 0, Math.PI*2); ctx.fill(); 
        ctx.beginPath(); ctx.arc(cx + targetRadius * Math.cos(endAngle), cy + targetRadius * Math.sin(endAngle), 7, 0, Math.PI*2); ctx.fill(); 

        // 사용자 선
        if (playerPath.length > 0) {
            ctx.beginPath(); ctx.moveTo(playerPath[0].x, playerPath[0].y);
            for (let i = 1; i < playerPath.length - 2; i++) {
                const xc = (playerPath[i].x + playerPath[i+1].x) / 2, yc = (playerPath[i].y + playerPath[i+1].y) / 2;
                ctx.quadraticCurveTo(playerPath[i].x, playerPath[i].y, xc, yc);
            }
            if(playerPath.length > 2) ctx.lineTo(playerPath[playerPath.length-1].x, playerPath[playerPath.length-1].y);
            ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
        }
    }

    // --- Controls ---
    let activePointer = null;

    canvas.addEventListener('pointerdown', e => {
        if(!isPlaying) return; e.preventDefault();
        activePointer = e.pointerId; canvas.setPointerCapture(e.pointerId);
        isDrawing = true; playerPath = [];
        const rect = canvas.getBoundingClientRect(); playerPath.push({x: e.clientX - rect.left, y: e.clientY - rect.top});
        drawScene();
    });

    canvas.addEventListener('pointermove', e => {
        if(!isPlaying || !isDrawing || activePointer !== e.pointerId) return; e.preventDefault();
        const rect = canvas.getBoundingClientRect(); playerPath.push({x: e.clientX - rect.left, y: e.clientY - rect.top});
        drawScene();
    });

    ['pointerup', 'pointercancel'].forEach(ev => {
        canvas.addEventListener(ev, e => {
            if(activePointer === e.pointerId) {
                activePointer = null;
                if(isDrawing) {
                    isDrawing = false;
                    // 아주 짧은 터치(실수)는 무시
                    if(playerPath.length < 5 && timeLeft > 0) {
                        playerPath = []; drawScene(); return;
                    }
                    evaluateCircle(); // 손가락을 떼면 즉시 단판 채점
                }
            }
        });
    });

    // --- 채점 로직 (단판 승부) ---
    function evaluateCircle() {
        if(!isPlaying) return;
        isPlaying = false; // 게임 종료
        clearInterval(timerInterval);

        if (playerPath.length < 10) {
            finalizeRound(0.0); return;
        }

        let totalError = 0, pathLength = 0;
        for (let i = 0; i < playerPath.length; i++) {
            const pt = playerPath[i];
            totalError += Math.abs(Math.hypot(pt.x - cx, pt.y - cy) - targetRadius);
            if (i > 0) pathLength += Math.hypot(pt.x - playerPath[i-1].x, pt.y - playerPath[i-1].y);
        }

        let accuracy = 100 - ((totalError / playerPath.length) / targetRadius * 100);
        const targetLength = 1.5 * Math.PI * targetRadius; 
        let lengthPenalty = (pathLength < targetLength * 0.7) ? ((targetLength * 0.7 - pathLength) / targetLength) * 200 : 0;

        const endAngle = startAngle + 0.5 * Math.PI;
        const end1 = {x: cx + targetRadius * Math.cos(startAngle), y: cy + targetRadius * Math.sin(startAngle)};
        const end2 = {x: cx + targetRadius * Math.cos(endAngle), y: cy + targetRadius * Math.sin(endAngle)};
        const firstPt = playerPath[0], lastPt = playerPath[playerPath.length - 1];

        const gapDist = Math.min(
            Math.hypot(firstPt.x - end1.x, firstPt.y - end1.y) + Math.hypot(lastPt.x - end2.x, lastPt.y - end2.y),
            Math.hypot(firstPt.x - end2.x, firstPt.y - end2.y) + Math.hypot(lastPt.x - end1.x, lastPt.y - end1.y)
        );
        let gapPenalty = (gapDist > targetRadius * 0.4) ? (gapDist - targetRadius * 0.4) / targetRadius * 50 : 0;

        let calcScore = accuracy - lengthPenalty - gapPenalty;
        calcScore = Math.max(0, Math.min(100, calcScore));
        finalizeRound(calcScore);
    }

    function finalizeRound(rawScore) {
        finalScore = parseFloat(rawScore.toFixed(1));

        // 결과 화면을 캔버스 위에 바로 드로잉
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. 완벽한 원 (초록색 가이드)
        ctx.beginPath(); ctx.arc(cx, cy, targetRadius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(76, 175, 80, 0.5)"; ctx.lineWidth = 12; ctx.stroke();

        // 2. 유저가 그린 원
        if (playerPath.length > 0) {
            ctx.beginPath(); ctx.moveTo(playerPath[0].x, playerPath[0].y);
            for (let i = 1; i < playerPath.length - 2; i++) {
                const xc = (playerPath[i].x + playerPath[i+1].x) / 2, yc = (playerPath[i].y + playerPath[i+1].y) / 2;
                ctx.quadraticCurveTo(playerPath[i].x, playerPath[i].y, xc, yc);
            }
            if(playerPath.length > 2) ctx.lineTo(playerPath[playerPath.length-1].x, playerPath[playerPath.length-1].y);
            ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
        }

        // 3. 원래 힌트 (회색)
        ctx.beginPath();
        const endAngle = startAngle + 0.5 * Math.PI;
        ctx.arc(cx, cy, targetRadius, startAngle, endAngle);
        ctx.strokeStyle = "rgba(187, 173, 160, 0.9)"; ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.stroke();

        // 4. 한가운데 점수 표시
        ctx.font = "bold 8vh 'Jua'";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = finalScore > 80 ? "#FFD93D" : "#ff6b6b"; 
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 10;
        ctx.fillText(finalScore.toFixed(1) + "%", cx, cy);
        ctx.shadowBlur = 0; // 초기화

        if(finalScore >= 80) playSound('success'); else playSound('end');

        // 2.5초 대기 후 결과화면 전환
        setTimeout(() => { showResultScreen(); }, 2500);
    }

    function showResultScreen() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('res-nickname').innerText = myNickname;
        document.getElementById('res-score').innerText = finalScore.toFixed(1);
        document.getElementById('result-ranking-board').innerHTML = "";
        submitScore(myNickname, finalScore);
    }

    // --- UI & Utils ---
    function checkNameAndStart() {
        const input = document.getElementById('nickname'); const val = input.value.trim(); const t = i18n[currentLang];
        if(val.length < 1) { alert(t.alertName); return; }
        if(["시발", "씨발", "개새끼", "fuck", "shit"].some(w => val.includes(w))) { alert(t.alertBad); return; }
        myNickname = val; localStorage.setItem("kingsmaze_name", val);
        document.getElementById('start-screen').classList.add('hidden'); document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; 
        resizeCanvas(); startCountdown();
    }

    function startCountdown() {
        const screen = document.getElementById('countdown-screen'); const text = document.getElementById('countdown-text');
        screen.classList.remove('hidden'); let cnt = 3; text.innerText = cnt; playSound('tick');
        const intv = setInterval(() => {
            cnt--;
            if(cnt > 0) { text.innerText = cnt; text.style.animation = 'none'; text.offsetHeight; text.style.animation = 'pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; playSound('tick'); } 
            else { clearInterval(intv); text.innerText = "GO!"; playSound('start'); setTimeout(() => { screen.classList.add('hidden'); initGame(); }, 500); }
        }, 1000);
    }

    function restartGame() {
        isPlaying = false; clearInterval(timerInterval);
        document.getElementById('result-screen').classList.add('hidden'); document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('langTriggerContainer').style.display = 'none'; startCountdown();
    }

    function goHome() {
        if (document.fullscreenElement) {
            isPlaying = false; clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden'); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('langTriggerContainer').style.display = 'block'; 
            if(window.playSound) window.playSound('tick'); loadRanking();
        } else { location.reload(); }
    }

    // --- Ranking System ---
    function submitScore(name, score) {
        const t = i18n[currentLang]; const formData = new FormData(); formData.append('nickname', name); formData.append('score', score);
        fetch(API_URL + '?action=submit', { method: 'POST', body: formData }).then(res => res.json()).then(data => {
            if(data.status === 'success') { document.getElementById("res-rank").innerText = t.rankResult.replace('{rank}', data.rank); loadResultRanking(); } 
            else { document.getElementById("res-rank").innerText = "Ranking Error"; }
        }).catch(e => console.error(e));
    }

    function loadRanking() {
        const list = document.getElementById("ranking-board"); const t = i18n[currentLang]; list.innerHTML = `<div class="center">${t.rankingLoading}</div>`;
        fetch(API_URL + '?action=list').then(res => res.json()).then(data => {
            if(data.length === 0) { list.innerHTML = `<div class="center" style="margin-top:20px;">${t.rankingEmpty}</div>`; return; }
            let html = "";
            data.forEach((item, idx) => {
                let rankDisplay = (idx < 3) ? ["🥇","🥈","🥉"][idx] : (idx+1); let style = (idx < 3) ? "font-size:1.5em;" : "color:#8d6e63; font-weight:bold;";
                html += `<div class="rank-item"><span style="width:15%; text-align:center; ${style}">${rankDisplay}</span><span style="width:50%; padding-left:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span><span style="width:35%; text-align:right; color:#888; font-weight:bold;">${parseFloat(item.score).toFixed(1)}</span></div>`;
            });
            list.innerHTML = html;
        }).catch(e => { list.innerHTML = `<div class="center" style="color:red;">${t.rankingError}</div>`; });
    }

    function loadResultRanking() {
        const list = document.getElementById("result-ranking-board"); const t = i18n[currentLang]; list.innerHTML = `<div class="center" style="font-size:1.8vh; color:#888;">TOP 3 Loading...</div>`;
        fetch(API_URL + '?action=list').then(res => res.json()).then(data => {
            if(data.length === 0) { list.innerHTML = `<div class="center" style="font-size:1.8vh;">${t.rankingEmpty}</div>`; return; }
            let html = ""; const limit = Math.min(data.length, 3);
            for(let i=0; i<limit; i++) {
                let item = data[i]; let rankIcon = ["🥇","🥈","🥉"][i];
                html += `<div class="rank-item" style="font-size:2vh; padding:0.5vh;"><span style="width:15%; text-align:center;">${rankIcon}</span><span style="width:50%; padding-left:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.nickname}</span><span style="width:35%; text-align:right; font-weight:bold; color:#5d4037;">${parseFloat(item.score).toFixed(1)}</span></div>`;
            }
            list.innerHTML = html;
        }).catch(e => { list.style.display = 'none'; });
    }

    // --- Init ---
    window.onload = function() {
        const savedName = localStorage.getItem("kingsmaze_name"); if(savedName) document.getElementById("nickname").value = savedName;
        changeLang(getInitialLang()); renderLanguages(); 
    };

</script>
